// Подгрузить активные сертификаты в выпадающий список модалки оплаты
function loadPayCerts_() {
  var sel = document.getElementById('pay-cert-select'); if (!sel) return;
  sel.innerHTML = '<option value="">— загрузка… —</option>';
  google.script.run
    .withSuccessHandler(function(resp){
      var list = (resp && resp.ok) ? (resp.data || []) : [];
      var unreg = '<option value="__unreg__">🎁 Сертификат не зарегистрирован (списать без реестра)</option>';
      sel.innerHTML = list.map(function(c){
        return '<option value="' + c.id + '" data-rem="' + c.remaining + '">' + c.id +
          ' · остаток ' + (Number(c.remaining)||0).toLocaleString('ru') + ' ' + CUR +
          (c.buyer ? ' · ' + c.buyer : '') + '</option>';
      }).join('') + unreg;
      onPayCertChange_();
    })
    .withFailureHandler(function(){ sel.innerHTML = '<option value="__unreg__">🎁 Сертификат не зарегистрирован (списать без реестра)</option>'; onPayCertChange_(); })
    .getCertificates(true);
}
function onPayCertChange_() {
  var sel = document.getElementById('pay-cert-select'); if (!sel) return;
  var remaining = Math.max(0, (App._payOrderPrice||0) - (App._payOrderPaid||0));
  var amtEl = document.getElementById('pay-amount');
  var hint = document.getElementById('pay-cert-hint');
  if (sel.value === '__unreg__') {
    if (amtEl && remaining > 0) amtEl.value = remaining;
    if (hint) hint.textContent = 'Сертификат не в реестре — спишется без контроля остатка. В кассу не идёт.';
    return;
  }
  var opt = sel.options[sel.selectedIndex];
  var rem = opt ? Number(opt.getAttribute('data-rem')) || 0 : 0;
  var suggest = Math.min(rem, remaining);
  if (amtEl && suggest > 0) amtEl.value = suggest;      // предложить списать минимум из (остаток сертификата, долг)
  if (hint) hint.textContent = 'Остаток сертификата: ' + rem.toLocaleString('ru') + ' ' + CUR + '. Списывается с него, в кассу не идёт.';
}

function openPayOrderModal(orderId, clientName, price, currentDueDate) {
  document.getElementById('pay-order-id').value = orderId;
  App._payOrderPrice = Number(price) || 0;
  App._payTypeSelected = 'Нал';

  // Сброс
  var amtEl  = document.getElementById('pay-amount');
  var cmmEl  = document.getElementById('pay-comment');
  var nextEl = document.getElementById('pay-next-date');
  if (amtEl)  amtEl.value = '';
  if (cmmEl)  cmmEl.value = '';
  // Предзаполняем текущий срок если был передан
  if (nextEl) {
    var m = currentDueDate ? String(currentDueDate).match(/^(\d{2})\.(\d{2})\.(\d{4})/) : null;
    nextEl.value = m ? m[3] + '-' + m[2] + '-' + m[1] : '';
  }
  document.querySelectorAll('#modal-pay-order .ctype-btn').forEach(function(b){ b.classList.remove('active'); });
  var nalBtn = document.getElementById('pay-type-nal');
  if (nalBtn) nalBtn.classList.add('active');
  var certRow = document.getElementById('pay-cert-row'); if (certRow) certRow.style.display = 'none';   // сброс выбора сертификата

  // Загружаем историю платежей и остаток
  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) return;
      var d = resp.data;
      App._payOrderPaid = d.totalPaid || 0;
      var remaining = Math.max(0, App._payOrderPrice - App._payOrderPaid);

      var desc = document.getElementById('pay-order-desc');
      if (desc) desc.innerHTML =
        '<div style="font-weight:600;margin-bottom:4px">' + (clientName||'') + '</div>' +
        '<div style="display:flex;gap:16px;font-size:12px">' +
          '<span>Сумма заказа: <b>' + App._payOrderPrice.toLocaleString('ru') + ' ' + CUR + '</b></span>' +
          '<span style="color:var(--success)">Оплачено: <b>' + d.totalPaid.toLocaleString('ru') + ' ' + CUR + '</b></span>' +
          '<span style="color:' + (remaining>0?'var(--danger)':'var(--success)') + '">Остаток: <b>' + remaining.toLocaleString('ru') + ' ' + CUR + '</b></span>' +
        '</div>';

      var hint = document.getElementById('pay-remaining-hint');
      if (hint) hint.textContent = 'Остаток к оплате: ' + remaining.toLocaleString('ru') + ' ' + CUR;
      if (amtEl) amtEl.value = remaining > 0 ? remaining : '';

      // История
      var hist = document.getElementById('pay-history');
      var histList = document.getElementById('pay-history-list');
      if (d.payments && d.payments.length > 0 && hist && histList) {
        hist.style.display = 'block';
        histList.innerHTML = d.payments.map(function(p) {
          return '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)">' +
            '<span style="color:var(--text3)">' + (p['Дата']||'') + ' — ' + (p['Способ оплаты']||'') + '</span>' +
            '<span style="font-weight:600;color:var(--success)">' + (Number(p['Сумма'])||0).toLocaleString('ru') + ' ' + CUR + '</span>' +
          '</div>';
        }).join('');
      } else if (hist) {
        hist.style.display = 'none';
      }
    })
    .withFailureHandler(function(){})
    .getOrderPaymentSummary(orderId);

  openModal('modal-pay-order');
}

function confirmPayOrder() {
  var id       = (document.getElementById('pay-order-id')||{}).value;
  var amount   = Number((document.getElementById('pay-amount')||{}).value||0);
  var payType  = App._payTypeSelected || 'Нал';
  var comment  = ((document.getElementById('pay-comment')||{}).value||'').trim();
  var nextDate = ((document.getElementById('pay-next-date')||{}).value||'').trim();

  if (!id)     { toast('Ошибка: нет ID заказа','error'); return; }
  if (!amount) { toast('Укажите сумму','error'); return; }

  var btn = document.getElementById('pay-submit-btn');

  // Оплата СЕРТИФИКАТОМ — списываем с остатка сертификата, в кассу не идёт
  if (payType === 'Сертификат') {
    var certId = (document.getElementById('pay-cert-select')||{}).value || '';
    if (!certId) { toast('Выберите сертификат', 'error'); return; }
    if (btn) { btn.disabled = true; btn.textContent = 'Списываем...'; }
    var onOk = function(resp){
      if (btn) { btn.disabled = false; btn.textContent = 'Принять платёж'; }
      if (!resp||!resp.ok) { toast('Ошибка: '+(resp?resp.error:''),'error'); return; }
      if (nextDate) google.script.run.setOrderDueDate(id, nextDate);
      toast('Оплачено сертификатом (в кассу не идёт)', 'success');
      closeModal('modal-pay-order');
      App.orders = []; App._cardCache = {}; App._dashCache = null; App._kassaCache = null;
      if (App.currentPage === 'orders') loadOrders(true);
      if (App.currentPage === 'order-card' && App._currentOrderId === id) reopenCard(id);
    };
    var onErr = function(e){ if (btn) { btn.disabled = false; btn.textContent = 'Принять платёж'; } toast('Ошибка: '+e.message,'error'); };
    if (certId === '__unreg__') {
      // Незарегистрированный сертификат — просто платёж способом «Сертификат» (не касса), без реестра
      google.script.run.withSuccessHandler(onOk).withFailureHandler(onErr)
        .addOrderPayment(id, { amount: amount, payType: 'Сертификат', comment: comment || 'Сертификат (не зарегистрирован)' });
    } else {
      google.script.run.withSuccessHandler(onOk).withFailureHandler(onErr)
        .redeemCertificateForOrder(id, certId, amount, comment);
    }
    return;
  }

  if (btn) { btn.disabled = true; btn.textContent = 'Сохраняем...'; }

  google.script.run
    .withSuccessHandler(function(resp) {
      if (btn) { btn.disabled = false; btn.textContent = 'Принять платёж'; }
      if (!resp||!resp.ok) { toast('Ошибка: '+(resp?resp.error:''),'error'); return; }

      // Если задан следующий срок — сохраняем его (даже если оплата полная,
      // бэкенд updateOrderPaymentStatus_ сам сбросит срок при полном закрытии)
      if (nextDate) {
        google.script.run.setOrderDueDate(id, nextDate);
      }

      toast(payType==='Безнал' ? 'Безнал → р/счёт зафиксирован' : 'Нал → касса зафиксирован', 'success');
      closeModal('modal-pay-order');
      // Оптимистично помечаем заказ оплаченным/частичным локально — строка обновляется сразу
      for (var i=0;i<App.orders.length;i++){
        var o=App.orders[i]; if (o['ID']!==id) continue;
        var price=Number(o['Стоимость заказа'])||0;
        o._paid=(Number(o._paid)||0)+amount;
        o['Статус оплаты']=(o._paid>=price-0.01)?'Оплачен':'Частично';
        break;
      }
      App._dashCache = null; App._debtCache = null; App._kassaCache = null;   // оплата меняет дашборд/дебиторку/кассу
      if (App.currentPage==='orders')     { filterOrders(); loadOrdersKpi(); refreshOrdersSilent_(); }
      if (App.currentPage==='dds')        loadDDS();
      if (App.currentPage==='debt')       loadDebt();
      // Карточка: обновляем МГНОВЕННО из локального объекта, синхронизация с сервером — в фоне
      if (App.currentPage==='order-card' && App._currentOrder && String(App._currentOrder['ID'])===String(id)) {
        var oc = App._currentOrder;
        oc.payments = oc.payments || [];
        oc.payments.push({ 'ID':'', 'Дата': (new Date()).toLocaleDateString('ru'), 'Сумма': amount, 'Способ оплаты': payType });
        var pr = Number(oc['Стоимость заказа'])||0;
        var pd = oc.payments.reduce(function(s,p){ return s + (Number(p['Сумма'])||0); }, 0);
        oc._paid = Math.round(pd*100)/100; oc._remaining = Math.max(0, pr - oc._paid);
        oc['Статус оплаты'] = oc._paid<=0 ? 'Не оплачен' : (oc._paid>=pr-0.01 ? 'Оплачен' : 'Частично');
        renderOrderCard(oc);   // мгновенная перерисовка без ожидания
      }
      if (App.currentPage==='order-card') reopenCard(id);   // фоновая синхронизация (реальные ID, финитог, авто-статус «Выдан»)
    })
    .withFailureHandler(function(e){ if(btn){btn.disabled=false;btn.textContent='Принять платёж';} toast('Ошибка: '+e.message,'error'); })
    .addOrderPayment(id, { amount: amount, payType: payType, comment: comment });
}

/* ===== РАСЧЁТ ЗП ===== */

App._salaryData = null;

// Заполнить выпадающий список сотрудников (работающие); вызывается при заходе на страницу
function fillSalaryEmployees() {
  var sel = document.getElementById('sal-employee');
  if (!sel) return;
  var cur = sel.value;
  var emps = (App.employees || []).filter(function(e){ return (e['Статус'] || '') === 'Работает'; });
  sel.innerHTML = '<option value="">Все сотрудники</option>' + emps.map(function(e){
    var n = (e['ФИО'] || e['Имя'] || '').replace(/"/g,'&quot;');
    return '<option value="' + n + '">' + n + '</option>';
  }).join('');
  if (cur) sel.value = cur;
}

// Заполнить даты по умолчанию (текущий месяц), если ещё пусто
function ensureSalDates_() {
  var f = document.getElementById('sal-from');
  if (f && !f.value) onSalPeriodChange();   // пресет 'month' стоит по умолчанию
}

// Диапазон для расчёта ЗП = то, что в полях «с — по» (единый источник истины)
function getSalaryRange() {
  var f = (document.getElementById('sal-from') || {}).value;
  var t = (document.getElementById('sal-to')   || {}).value;
  return {
    from:  f ? new Date(f).toISOString() : null,
    to:    t ? new Date(t + 'T23:59:59').toISOString() : null,
    label: (f ? isoToDdmmyyyy_(f) : '…') + ' — ' + (t ? isoToDdmmyyyy_(t) : '…'),
  };
}

function calcSalary() {
  savePeriod_('sal');
  var range = getSalaryRange();
  var res    = document.getElementById('salary-result');
  if (res) res.innerHTML = '<div style="text-align:center;padding:32px;color:var(--text3)">Считаем...</div>';

  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp||!resp.ok) { toast('Ошибка: '+(resp?resp.error:''),'error'); return; }
      App._salaryData = resp.data;
      App._salaryLabel = range.label || '';
      renderSalaryFiltered();
    })
    .withFailureHandler(function(e){ toast('Ошибка: '+e.message,'error'); })
    .calcSalaryForPeriod(range.from||null, range.to||null);
}

// Применить фильтр по выбранному сотруднику и перерисовать (без обращения к серверу)
function renderSalaryFiltered() {
  if (!App._salaryData) return;
  var sel = (document.getElementById('sal-employee') || {}).value || '';
  var emps = App._salaryData.employees || [];
  var filtered = sel ? emps.filter(function(e){ return e.name === sel; }) : emps;
  var grand = filtered.reduce(function(s, r){ return s + (Number(r.total)||0); }, 0);
  renderSalary({ employees: filtered, grandTotal: grand }, App._salaryLabel);
}

function renderSalary(data, periodLabel) {
  var res = document.getElementById('salary-result');
  if (!res) return;
  var fmt = function(n){ return (Number(n)||0).toLocaleString('ru') + ' ' + CUR; };

  if (!data.employees.length) {
    res.innerHTML = '<div style="text-align:center;padding:48px;color:var(--text3)">' +
      '<div style="font-size:36px;margin-bottom:12px">🔍</div>' +
      '<div>Нет данных за выбранный период' + (periodLabel ? ' (' + periodLabel + ')' : '') + '</div></div>';
    return;
  }

  // Начислять ли оклад: галочка на странице ЗП (по умолчанию выкл — только бонусы).
  // ЗП платится 2 раза в месяц → каждое начисление добавляет ПОЛОВИНУ оклада.
  var inclOklad = !!((document.getElementById('sal-include-salary') || {}).checked);
  var okladOf = function(e){ return (Number(e.baseSalary) || 0) / 2; };           // ½ ставки за начисление
  // Сервер отдаёт total = ставка(полная) + бонусы − выданное; берём «бонусы−выданное» и добавляем ½ оклада
  var etot = function(e){ return (Number(e.total || 0) - (Number(e.baseSalary) || 0)) + (inclOklad ? okladOf(e) : 0); };
  var grandTotal = data.employees.reduce(function(s, e){ return s + etot(e); }, 0);

  var cards = data.employees.map(function(e) {
    var ini = e.name.split(' ').slice(0,2).map(function(s){ return s[0]||''; }).join('');
    var orderRows = e.orders.slice(0,5).map(function(o){
      return '<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0;border-bottom:1px solid var(--border)">' +
        '<span style="color:var(--text3)">' + (o.date||'') + ' ' + (o.contract||'') + ' — ' + (o.client||'') + '</span>' +
        '<span>' + (Number(o.gross)||0).toFixed(0) + ' ' + CUR + '</span>' +
      '</div>';
    }).join('');

    return '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;break-inside:avoid">' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">' +
        '<div style="width:44px;height:44px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);font-size:15px;flex-shrink:0">' + ini + '</div>' +
        '<div><div style="font-weight:700;font-size:14px">' + e.name + '</div><div style="font-size:11px;color:var(--text3)">' + e.position + ' · ' + e.orderCount + ' заказов</div></div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:12px;margin-bottom:10px">' +
        '<div><span style="color:var(--text3)">Оклад ½ (' + fmt(e.baseSalary) + '/2): </span><b style="color:' + (inclOklad ? 'var(--accent)' : 'var(--text3)') + '">' + (inclOklad ? fmt(okladOf(e)) : 'не начислен') + '</b></div>' +
        '<div><span style="color:var(--text3)">Бонус менеджер: </span><b style="color:var(--accent)">' + fmt(e.managerBonus) + '</b></div>' +
        '<div><span style="color:var(--text3)">Бонус мастер: </span><b style="color:var(--accent)">' + fmt(e.masterBonus) + '</b></div>' +
        (Number(e.adminBonus) > 0 ? '<div><span style="color:var(--text3)">Бонус админ.: </span><b style="color:var(--accent)">' + fmt(e.adminBonus) + '</b></div>' : '') +
        (Number(e.salaryPaid) > 0 ? '<div><span style="color:var(--text3)">Выдано (ЗП): </span><b style="color:var(--danger)">−' + fmt(e.salaryPaid) + '</b></div>' : '') +
        '<div><span style="color:var(--text3)">' + (etot(e) < 0 ? 'Переплата: ' : 'Итого: ') + '</span><b style="font-size:15px;color:' + (etot(e) < 0 ? 'var(--danger)' : 'var(--success)') + '">' + fmt(etot(e)) + '</b></div>' +
      '</div>' +
      (orderRows ? '<div style="font-size:11px;color:var(--text3);margin-bottom:4px">Участвовал в заказах:</div>' + orderRows : '') +
      '<button onclick="openSalarySlip_(\'' + String(e.id).replace(/'/g,"\\'") + '\')" style="width:100%;margin-top:12px;padding:8px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);border:1px solid var(--border-h);border-radius:8px;cursor:pointer">📄 Расчётный лист</button>' +
    '</div>';
  }).join('');

  res.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;padding:12px 16px;background:var(--bg-card);border-radius:10px;border:1px solid var(--border);flex-wrap:wrap">' +
      '<span style="font-size:13px;color:var(--text2)">Итого к выплате' +
        (periodLabel ? ' · <b style="color:var(--text)">' + periodLabel + '</b>' : '') +
        ' · ' + data.employees.length + ' чел.</span>' +
      '<div style="display:flex;align-items:center;gap:12px">' +
        '<button onclick="runBonusAudit()" title="Найти заказы, где бонус мастера/тонировщика не начислен из-за пустых полей" style="padding:6px 12px;font-size:12px;font-weight:600;background:rgba(243,156,18,.12);color:var(--warning);border:1px solid rgba(243,156,18,.35);border-radius:8px;cursor:pointer">⚠ Проверить бонусы заказов</button>' +
        '<span style="font-size:20px;font-weight:700;color:var(--success)">' + fmt(grandTotal) + '</span>' +
      '</div>' +
    '</div>' +
    '<div id="salary-audit"></div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px">' + cards + '</div>';
}

// Аудит бонусов: найти заказы с «утечкой» бонуса из-за пустых мастеров/тонировщика
function runBonusAudit() {
  var range = getSalaryRange();
  var box = document.getElementById('salary-audit');
  if (box) box.innerHTML = '<div style="padding:12px 16px;color:var(--text3);font-size:13px">Проверяем заказы…</div>';
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) { if (box) box.innerHTML = ''; toast('Ошибка: ' + (resp?resp.error:''), 'error'); return; }
      renderBonusAudit_(resp.data);
    })
    .withFailureHandler(function(e){ if (box) box.innerHTML = ''; toast('Ошибка: ' + e.message, 'error'); })
    .auditBonusGaps(range.from||null, range.to||null);
}

function renderBonusAudit_(data) {
  var box = document.getElementById('salary-audit'); if (!box) return;
  var fmt = function(n){ return (Number(n)||0).toLocaleString('ru') + ' ' + CUR; };
  if (!data.count) {
    box.innerHTML = '<div style="margin-bottom:12px;padding:12px 16px;background:var(--green-soft);border:1px solid rgba(46,204,113,.35);border-radius:10px;color:var(--success);font-size:13px">✓ Проблем не найдено — во всех заказах периода мастера и тонировщики заполнены, бонусы начисляются корректно.</div>';
    return;
  }
  var rows = data.issues.map(function(i){
    return '<div style="padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer" onclick="openOrderCard(\'' + String(i.id).replace(/'/g,"\\'") + '\')">' +
      '<div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">' +
        '<div style="font-weight:600;font-size:13px">' + (i.contract||i.id) + ' · ' + (i.client||'') + '</div>' +
        (i.lost > 0 ? '<div style="color:var(--danger);font-weight:700;white-space:nowrap">−' + fmt(i.lost) + '</div>' : '') +
      '</div>' +
      '<div style="font-size:11px;color:var(--text3);margin:2px 0">' + (i.service||'') + ' · ' + fmt(i.price) +
        (i.tintPrice>0 ? ' · тонировка ' + fmt(i.tintPrice) : '') +
        ' · оклейщики: ' + (i.masters||'—') + ' · тонировщики: ' + (i.tintMasters||'—') + '</div>' +
      i.problems.map(function(p){ return '<div style="font-size:12px;color:var(--warning)">⚠ ' + p + '</div>'; }).join('') +
    '</div>';
  }).join('');
  box.innerHTML =
    '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px">' +
      '<div style="padding:12px 16px;background:rgba(243,156,18,.12);border-bottom:1px solid var(--border);font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">' +
        '<span>⚠ Заказы с проблемой начисления бонуса: ' + data.count + '</span>' +
        (data.totalLost > 0 ? '<span style="color:var(--danger)">Не начислено ~' + fmt(data.totalLost) + '</span>' : '') +
      '</div>' +
      rows +
      '<div style="padding:8px 14px;font-size:11px;color:var(--text3)">Нажмите на заказ, чтобы открыть карточку и заполнить мастера/тонировщика и «Стоимость тонировки». После правки бонусы пересчитаются автоматически.</div>' +
    '</div>';
}

// Имя для обращения (ФИО → Имя, второе слово)
function getFirstName_(fullName) {
  var parts = String(fullName || '').trim().split(/\s+/);
  return parts.length >= 2 ? parts[1] : (parts[0] || 'коллега');
}

// Печатный расчётный лист сотрудника: разбивка ЗП, все заказы с затратами, водяной знак, благодарность
function openSalarySlip_(empId) {
  var data = App._salaryData;

    '@page{size:A4 landscape;margin:10mm}' +
    'body{font-family:Arial,sans-serif;color:#1a2233;margin:0;padding:16px 20px;position:relative}' +

function printSalary() {
  if (!App._salaryData) { toast('Сначала рассчитайте ЗП','error'); return; }
  // печатаем то же, что показано: с учётом фильтра по сотруднику
  var selName = (document.getElementById('sal-employee') || {}).value || '';
  var all = App._salaryData.employees || [];
  var emps = selName ? all.filter(function(e){ return e.name === selName; }) : all;
  var inclOklad = !!((document.getElementById('sal-include-salary') || {}).checked);
  var okladOf = function(e){ return inclOklad ? (Number(e.baseSalary)||0)/2 : 0; };  // ½ ставки
  var etot = function(e){ return (Number(e.total||0) - (Number(e.baseSalary)||0)) + okladOf(e); };
  var grand = emps.reduce(function(s, e){ return s + etot(e); }, 0);
  var lbl = App._salaryLabel || '';
  var fmt = function(n){ return (Number(n)||0).toFixed(2); };
  var rows = emps.map(function(e){
    return '<tr><td>' + e.name + '</td><td>' + e.position + '</td><td>' + e.orderCount + '</td>' +
      '<td style="text-align:right">' + fmt(okladOf(e)) + '</td>' +
      '<td style="text-align:right">' + fmt(e.managerBonus) + '</td>' +
      '<td style="text-align:right">' + fmt(e.masterBonus) + '</td>' +
      '<td style="text-align:right">' + fmt(e.adminBonus || 0) + '</td>' +
      '<td style="text-align:right;font-weight:bold">' + fmt(etot(e)) + '</td></tr>';
  }).join('');
  var html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Расчёт ЗП</title>' +
    '<style>body{font-family:Arial;font-size:11px;margin:15mm}h2{text-align:center;font-size:13px;margin-bottom:2px}' +
    '.period{text-align:center;color:#555;font-size:11px;margin-bottom:10px}' +
    'table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:3px 5px}th{background:#f0f0f0}' +
    '@media print{.no-print{display:none}}</style></head><body>' +
    '<div class="no-print"><button onclick="window.print()">Печать</button></div>' +
    '<h2>РАСЧЁТ ЗАРАБОТНОЙ ПЛАТЫ</h2>' +
    (lbl ? '<div class="period">Период: ' + lbl + '</div>' : '') +
    '<table><thead><tr><th>Сотрудник</th><th>Должность</th><th>Заказов</th><th>Оклад ½</th><th>Бонус (мен.)</th><th>Бонус (мастер)</th><th>Бонус (админ.)</th><th>ИТОГО</th></tr></thead>' +
    '<tbody>' + rows + '</tbody>' +
    '<tfoot><tr><td colspan="7" style="text-align:right;font-weight:bold">Итого к выплате:</td>' +
    '<td style="font-weight:bold;text-align:right">' + fmt(grand) + ' ' + CUR + '</td></tr></tfoot>' +
    '</table></body></html>';
  var w = window.open('','_blank'); if(w){ w.document.write(html); w.document.close(); }
}

/* ===== КАРТОЧКА ЗАКАЗА ===== */

App._currentOrderId = null;

App._cardCache = {};   // кэш карточек по orderId (мгновенное повторное открытие)

// перерисовать карточку после правки: сбросить кэш этого заказа и открыть заново
// Мягкое обновление ОТКРЫТОЙ карточки: НЕ стираем кэш и НЕ показываем пустой
// скелетон (из-за него была «пропажа» карточки на 1–2 сек). Текущая карточка
// остаётся на экране, свежие данные тихо подгружаются в фоне и заменяют её.
function reopenCard(id) {
  if (!id) return;
  google.script.run
    .withSuccessHandler(function(resp){
      if (resp && resp.ok && resp.data) {
        App._cardCache[id] = resp.data;
        if (App._currentOrderId === id && App.currentPage === 'order-card') renderOrderCard(resp.data);
      }
    })
    .withFailureHandler(function(){})
    .getOrderFull(id);
}

function cardSkeleton_() {
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
    '<div class="kpi-skeleton" style="min-height:120px"></div><div class="kpi-skeleton" style="min-height:120px"></div>' +
    '<div class="kpi-skeleton" style="min-height:160px"></div><div class="kpi-skeleton" style="min-height:160px"></div>' +
    '</div>';
}

function openOrderCard(orderId) {
  if (typeof flushCard_ === 'function') flushCard_();   // досохранить правки прошлой карточки (до смены id)
  App._currentOrderId = orderId;
  goPage('order-card');
  var content = document.getElementById('order-card-content');

  // 1) Мгновенно из кэша, если карточка уже открывалась
  var cached = App._cardCache[orderId];
  if (cached) { renderOrderCard(cached); }
  else if (content) { content.innerHTML = cardSkeleton_(); }

  // 2) Справочник плёнок грузим ПАРАЛЛЕЛЬНО (не блокирует карточку);
  //    когда придёт — обновим выпадающие списки плёнки, если карточка открыта
  if (!App._materials || !App._materials.length) {
    google.script.run
      .withSuccessHandler(function(resp) {
        App._materials = (resp && resp.ok) ? (resp.data || []) : [];
        if (App.currentPage === 'order-card' && App._currentOrderId === orderId && App._currentOrder) {
          if (document.getElementById('card-mat-tbody')) refreshCardMats();
          refreshTintFilmLists_();   // наполнить подсказки плёнок из справочника (тонировочные)
        }
      })
      .withFailureHandler(function(){})
      .getMaterials(null);
  }

  // 3) Полные данные заказа — один запрос; кэшируем и перерисовываем
  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) { if (!cached) toast('Ошибка загрузки заказа', 'error'); return; }
      App._cardCache[orderId] = resp.data;
      if (App._currentOrderId === orderId) renderOrderCard(resp.data);
    })
    .withFailureHandler(function(e){ if (!cached) toast('Ошибка: ' + e.message, 'error'); })
    .getOrderFull(orderId);
}

// Удалить платёж из карточки заказа (бэкенд пересчитает статус оплаты и остаток)
function deletePaymentFromCard(paymentId) {
  if (!paymentId) return;
  uiConfirm('Удалить этот платёж? Сумма оплаты и статус заказа пересчитаются автоматически.', function(){
    var o = App._currentOrder;
    var deleted = null;
    // ── Оптимистично: убираем платёж локально и пересчитываем — мгновенно, без запроса ──
    if (o && o.payments && o.payments.length) {
      for (var i = 0; i < o.payments.length; i++) {
        if (String(o.payments[i]['ID']) === String(paymentId)) { deleted = o.payments[i]; o.payments.splice(i, 1); break; }
      }
      if (deleted) {
        var price = Number(o['Стоимость заказа']) || 0;
        var paid  = o.payments.reduce(function(s, p){ return s + (Number(p['Сумма']) || 0); }, 0);
        o._paid = Math.round(paid * 100) / 100;
        o._remaining = Math.max(0, price - o._paid);
        o['Статус оплаты'] = paid <= 0 ? 'Не оплачен' : (paid >= price ? 'Оплачен' : 'Частично');
        if (App._cardCache && App._currentOrderId) App._cardCache[App._currentOrderId] = o;
        renderOrderCard(o);   // перерисовка из локального объекта — без обращения к серверу
      }
    }
    // Списки/дашборд/дебиторка/касса пересоберутся при следующем заходе
    App.orders = []; App._dashCache = null; App._debtCache = null; App._kassaCache = null;
    // ── Удаление на сервере — в фоне (UI уже обновлён) ──
    var official = deleted && (deleted['Способ оплаты'] === 'Безнал' || deleted['Способ оплаты'] === 'Нал с чеком');
    google.script.run
      .withSuccessHandler(function(resp){
        if (!resp || !resp.ok) { toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); if (App._currentOrderId) reopenCard(App._currentOrderId); return; }
        toast('Платёж удалён', 'success');
        // Официальный платёж влияет на −15%/бонусы → тихо подтянуть свежий финитог
        if (official && App._currentOrderId) reopenCard(App._currentOrderId);
      })
      .withFailureHandler(function(e){ toast('Ошибка: ' + e.message, 'error'); if (App._currentOrderId) reopenCard(App._currentOrderId); })
      .deleteOrderPayment(paymentId);
  }, { okText: 'Удалить платёж' });
}

// Сменить способ оплаты платежа → авто-пересчёт (касса/счёт + −15% ЗП с официальных денег)
function updatePaymentMethodCard(paymentId, method) {
  if (!paymentId) return;
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) { toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); return; }
      toast('Способ оплаты обновлён, пересчитано', 'success');
      App.orders = []; App._cardCache = {}; App._dashCache = null; App._debtCache = null;
      if (App._currentOrderId) reopenCard(App._currentOrderId);
    })
    .withFailureHandler(function(e){ toast('Ошибка: ' + e.message, 'error'); })
    .updatePaymentMethod(paymentId, method);
}

function renderOrderCard(order) {
  var content = document.getElementById('order-card-content');
  if (!content) return;
  var fmt = function(n){ return (Number(n)||0).toLocaleString('ru') + ' ' + CUR; };

  var materials = order.materials || [];
  var expenses  = order.expenses  || [];

  var statusColor  = orderStatusColor(order['Статус']);

  App._currentOrder = order;
  normalizeCardMatPrices_();   // цена/м² строк расхода — из справочника (чиним устаревшие)

  var oid       = order['ID'];
  var price     = Number(order['Стоимость заказа']) || 0;
  var paid      = Number(order._paid) || 0;
  var remaining = (order._remaining !== undefined) ? Number(order._remaining) : Math.max(0, price - paid);
  var payType   = String(order['Тип оплаты'] || '').trim();
  var payStatus = String(order['Статус оплаты'] || '').trim() || 'Не оплачен';
  var isPaid    = payStatus === 'Оплачен';
  var isLegal   = order._clientType === 'юр';
  var verified  = String(order['Проверено'] || '') === 'Да';

  var payStatusColor = isPaid ? 'var(--success)' : (payStatus === 'Частично' ? 'var(--blue)' : 'var(--danger)');

  var matRows = renderCardMatRows();

  var expRows = expenses.map(function(e) {
    return '<tr><td>' + (e['Название']||'—') + '</td><td style="text-align:right;font-weight:600">' + fmt(e['Сумма']) + '</td></tr>';
  }).join('') || '<tr><td colspan="2" style="text-align:center;color:var(--text3);padding:8px">Нет расходов</td></tr>';

  // История платежей: способ оплаты меняется прямо здесь → авто-пересчёт (касса/счёт + −15% ЗП)
  var payMethodOpts_ = function(cur){
    return ['Нал','Нал с чеком','Безнал'].map(function(m){
      return '<option value="' + m + '"' + (String(cur||'') === m ? ' selected' : '') + '>' + m + '</option>';
    }).join('');
  };
  var payHistory = (order.payments && order.payments.length)
    ? order.payments.map(function(p){
        var pid = p['ID'] || '';
        return '<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)">' +
          '<span style="display:flex;align-items:center;gap:6px;color:var(--text3)">' + (p['Дата']||'') +
            (pid ? ' <select onchange="updatePaymentMethodCard(\'' + pid + '\', this.value)" style="font-size:11px;padding:2px 4px;border:1px solid var(--border);border-radius:6px;background:var(--inp);color:var(--text)">' + payMethodOpts_(p['Способ оплаты']) + '</select>'
                 : ' · ' + (p['Способ оплаты']||'')) +
          '</span>' +
          '<span style="display:flex;align-items:center;gap:8px">' +
            '<span style="font-weight:600;color:var(--success)">' + fmt(p['Сумма']) + '</span>' +
            (pid ? '<button class="pay-del" title="Удалить платёж" onclick="deletePaymentFromCard(\'' + pid + '\')">✕</button>' : '') +
          '</span></div>';
      }).join('')
    : '<div style="font-size:12px;color:var(--text3);padding:4px 0">Платежей пока нет</div>';

  // Опции типа оплаты
  var payTypeOpts = ['','Нал','Нал с чеком','Безнал','Смешанная','Отсрочка','Рассрочка'].map(function(t){
    var label = t === '' ? '— не указано —' : t;
    return '<option value="' + t + '"' + (t===payType?' selected':'') + '>' + label + '</option>';
  }).join('');
  // История платежей + график + срок — только для рассрочки/отсрочки/смешанной (иначе не нужны)
  var showPaySchedule = ['Рассрочка','Отсрочка','Смешанная'].indexOf(payType) >= 0;

  // Срок оплаты в формате для input[type=date]
  var dueIso = '';
  var dm = String(order['Срок оплаты']||'').match(/^(\d{2})\.(\d{2})\.(\d{4})/);
  if (dm) dueIso = dm[3] + '-' + dm[2] + '-' + dm[1];

  // ── График рассрочки ── (суммы и даты редактируемые; оплаченные взносы заблокированы)
  var sched = order.schedule || [];
  var inpS = 'font-size:12px;padding:5px 7px;border:1px solid var(--border);border-radius:7px;background:var(--inp);color:var(--text)';
  var schedRows = sched.map(function(s, idx){
    var paidS = s['Оплачен'] === 'Да';
    var dISO  = ruToIso_(s['Дата']);
    // Все взносы редактируемые (в т.ч. уже оплаченные — план можно корректировать вручную).
    // После сохранения статус «оплачен» пересчитается по фактическим платежам.
    return '<div class="sched-row" data-paid="' + (paidS?'1':'0') + '" style="display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--border)">' +
      '<span style="width:18px;text-align:center;color:' + (paidS?'var(--success)':'var(--text3)') + '" title="' + (paidS?'оплачен':'не оплачен') + '">' + (paidS?'✓':'○') + '</span>' +
      '<span style="width:22px;font-size:12px;color:var(--text3)">№' + (s['№']||(idx+1)) + '</span>' +
      '<input type="date" class="sched-date" value="' + dISO + '" style="' + inpS + ';flex:1;min-width:0" onchange="schedEdit_()">' +
      '<input type="number" class="sched-amt" min="0" step="0.01" value="' + (Number(s['Сумма'])||0) + '" style="' + inpS + ';width:92px;text-align:right" oninput="schedEdit_()">' +
    '</div>';
  }).join('');

// Загрузка файлов: сжимаем на клиенте (быстрее и легче для Drive), затем шлём
function handlePhotoFiles(input, kind) {
  var files = Array.prototype.slice.call(input.files || []);
  input.value = '';
  if (!files.length) return;
  var oid = App._currentOrderId;
  if (!oid) { toast('Сначала откройте заказ', 'error'); return; }

  var galId = kind === 'После' ? 'gallery-after' : 'gallery-before';
  var gal = document.getElementById(galId);
  var queued = files.length, done = 0;
  toast('Загрузка фото: ' + queued + ' шт…', 'info');

  files.forEach(function(file) {
    if (!/^image\//.test(file.type)) { queued--; return; }
    resizeImage_(file, 1600, 0.82, function(dataUrl) {
      google.script.run
        .withSuccessHandler(function(resp) {
          done++;
          if (resp && resp.ok) {
            if (done >= queued) { loadOrderPhotos(oid); toast('Фото загружены', 'success'); }
          } else {
            toast('Ошибка загрузки: ' + (resp ? resp.error : ''), 'error');
            if (done >= queued) loadOrderPhotos(oid);
          }
        })
        .withFailureHandler(function(e) {
          done++;
          toast('Ошибка: ' + e.message, 'error');
          if (done >= queued) loadOrderPhotos(oid);
        })
        .uploadOrderPhoto({ orderId: oid, kind: kind, dataUrl: dataUrl, filename: file.name });
    });
  });
}

// Сжатие картинки через canvas: ограничиваем макс. сторону, отдаём JPEG dataURL
function resizeImage_(file, maxDim, quality, cb) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var w = img.width, h = img.height;
      var scale = Math.min(1, maxDim / Math.max(w, h));
      var cw = Math.round(w * scale), ch = Math.round(h * scale);
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
      try { cb(canvas.toDataURL('image/jpeg', quality)); }
      catch (err) { cb(e.target.result); }   // на всякий случай — оригинал
    };
    img.onerror = function(){ cb(e.target.result); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* --- Карточка заказа: редактор расхода плёнки --- */

// Себестоимость за м² материала из справочника (если пусто — из себест. пог.м ÷ ширина)
function matSebestM2_(m) {
  var s = Number(m['Себестоимость м²']);
  if (isFinite(s) && s > 0) return s;
  var roll = Number(m['Ширина рулона']) || 1.52;
  var pm   = Number(m['Цена']) || 0;
  return roll ? Math.round(pm / roll * 100) / 100 : 0;
}

// Опции <select> материала из справочника (App._materials). Цена — ЗА М².
function cardMatOptions_(selectedId) {
  var opts = '<option value="">— выбрать материал —</option>';
  (App._materials || []).forEach(function(m) {
    opts += '<option value="' + (m['ID']||'') + '"' +
      ' data-unit="'  + (m['Единица']||'пм') + '"' +
      ' data-price="' + matSebestM2_(m) + '"' +
      ' data-roll="'  + (m['Ширина рулона']||1.52) + '"' +
      (String(m['ID']) === String(selectedId) ? ' selected' : '') + '>' +
      (m['Название']||'') + '</option>';
  });
  return opts;
}

// Обновить цену/м² строк расхода из справочника (при открытии карточки) — чинит устаревшие цены.
function normalizeCardMatPrices_() {
  var o = App._currentOrder; if (!o || !o.materials) return;
  o.materials.forEach(function(m) {
    var id = m['Материал ID']; if (!id) return;
    var ref = (App._materials || []).find(function(x){ return String(x['ID']) === String(id); });
    if (!ref) return;
    m['Цена за м²']    = matSebestM2_(ref);              // цена — за м², из справочника
    m['Ширина рулона'] = Number(ref['Ширина рулона']) || Number(m['Ширина рулона']) || 1.52;
  });
}

// ─── ТОНИРОВКА: блок «Тонировочные плёнки» (вместо m²-таблицы материалов) ─────
// Тонировка отличается от оклейки: у КАЖДОГО стекла своя плёнка и свой процент
// светопропускаемости — это идёт в договор/акт. Комплексы, элементы и расход в
// м² тут не нужны. Каждая плёнка = строка материалов (модель «1 × стоимость»),
// с полями Зона и Светопропускаемость, чтобы документы и финансы работали.

// Пустая строка тонировочной плёнки: кол-во=1, единица=м² → «Стоимость = Цена».
function blankTintRow_() {
  return { 'Материал ID':'', 'Название':'', 'Единица':'м²', 'Кол-во':1,
    'Ширина рулона':1.52, 'Цена за м²':0, 'Тип':'расход', 'Кол-во м²':1, 'Стоимость':0,
    'Зона':'', 'Светопропускаемость':'' };
}

// Список названий тонировочных плёнок для подсказки (datalist).
// Обновить <datalist> подсказок плёнок (в карточке) значениями из справочника
function refreshTintFilmLists_() {
  var opts = tintFilmNames_().map(function(n){ return '<option value="' + String(n).replace(/"/g,'&quot;') + '">'; }).join('');
  ['tint-film-list', 'card-tint-film-list'].forEach(function(id){
    var dl = document.getElementById(id); if (dl) dl.innerHTML = opts;
  });
}

function tintFilmNames_() {
  var set = {};
  // Предлагаем только материалы категории «Тонировочная плёнка» из справочника.
  (App._materials || []).forEach(function(m){
    if (!/тонир/i.test(String(m['Категория'] || ''))) return;
    var n = (m['Название'] || '').trim(); if (n) set[n] = true;
  });
  ['Nano Ceramic', 'Carbon', 'Dipal', 'Спектрол'].forEach(function(n){ if (!set[n]) set[n] = true; });
  return Object.keys(set);
}
// Типовые зоны/стёкла для подсказки.
var TINT_ZONES = ['Задняя полусфера', 'Лобовое стекло', 'Полоса на лобовое', 'Передние боковые', 'Задние боковые', 'Передняя полусфера', 'Заднее стекло', 'Люк', 'Панорамная крыша'];

// HTML блока «Тонировочные плёнки» (для карточки заказа при услуге «Тонировка»).
function tintFilmSectionHtml_(order) {
  var o = App._currentOrder;
  if (!o.materials) o.materials = [];
  if (!o.materials.length) o.materials = [ blankTintRow_() ];
  // Бэкофилл для старых заказов: если у первой плёнки нет %, но задан общий по

  var first = o.materials[0];
  if (first && !String(first['Светопропускаемость']==null?'':first['Светопропускаемость']).trim()
            && String(order['Светопропускаемость']==null?'':order['Светопропускаемость']).trim()) {
    first['Светопропускаемость'] = order['Светопропускаемость'];
  }
  var films = tintFilmNames_().map(function(n){ return '<option value="' + String(n).replace(/"/g,'&quot;') + '">'; }).join('');

  return '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)">' +
      '<span style="font-weight:600">Тонировочные плёнки</span>' +
      '<div style="display:flex;gap:10px;align-items:center">' +
        '<span id="card-mat-status" style="font-size:11px;color:var(--text3)"></span>' +
        '<button class="btn" onclick="addTintFilmLine()" style="padding:4px 10px;font-size:12px;font-weight:600;background:var(--bg-card2);color:var(--text);border:1px solid var(--border);border-radius:7px">+ Плёнка</button>' +
      '</div>' +
    '</div>' +
    '<table class="data-table" style="border:none">' +
      '<thead><tr><th>Стекло / зона</th><th>Плёнка (тип)</th><th style="text-align:center">Светопроп., %</th><th style="text-align:center">Стоимость</th><th></th></tr></thead>' +
      '<tbody id="card-mat-tbody">' + renderTintRows() + '</tbody>' +
    '</table>' +
    '<datalist id="tint-film-list">' + films + '</datalist>' +
    '<datalist id="tint-zone-list">' + zones + '</datalist>' +
    '<div style="padding:6px 14px 10px;font-size:11px;color:var(--text3)">Добавьте по строке на каждое стекло с разной плёнкой/процентом — всё попадёт в договор и акт.</div>' +
  '</div>';
}

// Строки редактора тонировочных плёнок.
function renderTintRows() {
  var o = App._currentOrder;
  var mats = (o && o.materials) || [];
  var inp = 'padding:4px 7px;border:1px solid var(--border);border-radius:6px;background:var(--inp);color:var(--text);font-size:12px';
  var esc = function(s){ return String(s==null?'':s).replace(/"/g,'&quot;'); };
  return mats.map(function(m, i){
    var cost = Number(m['Цена за м²']) || 0;
    return '<tr>' +
      '<td><input class="cardmat-zone" data-i="' + i + '" list="tint-zone-list" value="' + esc(m['Зона']) + '" placeholder="напр. Лобовое" oninput="tintRowEdit(' + i + ')" style="' + inp + ';min-width:140px"></td>' +
      '<td><input class="cardmat-name" data-i="' + i + '" list="tint-film-list" value="' + esc(m['Название']) + '" placeholder="напр. Nano Ceramic" oninput="tintRowEdit(' + i + ')" style="' + inp + ';min-width:150px"></td>' +
      '<td style="text-align:center;white-space:nowrap"><input class="cardmat-light" data-i="' + i + '" value="' + esc(m['Светопропускаемость']) + '" placeholder="%" oninput="tintRowEdit(' + i + ')" style="' + inp + ';width:60px;text-align:center"></td>' +
      '<td style="text-align:center;white-space:nowrap"><input class="cardmat-price" data-i="' + i + '" type="number" step="0.01" min="0" value="' + cost + '" oninput="tintRowEdit(' + i + ')" style="' + inp + ';width:78px"> ' + CUR + '</td>' +
      '<td><button onclick="removeTintFilmLine(' + i + ')" title="Удалить плёнку" style="border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 4px">✕</button></td>' +
    '</tr>';
  }).join('');
}

// Правка строки тонировочной плёнки → в модель материалов + автосохранение.
function tintRowEdit(i) {
  var o = App._currentOrder; if (!o || !o.materials || !o.materials[i]) return;
  var m  = o.materials[i];
  var z  = document.querySelector('.cardmat-zone[data-i="'  + i + '"]');
  var nm = document.querySelector('.cardmat-name[data-i="'  + i + '"]');
  var lt = document.querySelector('.cardmat-light[data-i="' + i + '"]');
  var pr = document.querySelector('.cardmat-price[data-i="' + i + '"]');
  if (z)  m['Зона']                = z.value;
  if (nm) m['Название']            = nm.value;
  if (lt) m['Светопропускаемость'] = lt.value;
  if (pr) m['Цена за м²']          = Number(pr.value) || 0;
  m['Единица'] = 'м²'; m['Кол-во'] = 1;             // держим модель «1 × стоимость»
  matAutoSave();
}

function addTintFilmLine() {
  var o = App._currentOrder; if (!o) return;
  if (!o.materials) o.materials = [];
  o.materials.push(blankTintRow_());
  var tb = document.getElementById('card-mat-tbody');
  if (tb) tb.innerHTML = renderTintRows();
}

function removeTintFilmLine(i) {
  var o = App._currentOrder; if (!o || !o.materials) return;
  o.materials.splice(i, 1);
  if (!o.materials.length) o.materials = [ blankTintRow_() ];
  var tb = document.getElementById('card-mat-tbody');
  if (tb) tb.innerHTML = renderTintRows();
  matAutoSave();
}

// Последний выбранный материал (обычно используется один и тот же) — запоминаем и подставляем в новые строки
function lastMatId_(){ try { return localStorage.getItem('spr-last-mat') || ''; } catch(e){ return ''; } }
function setLastMatId_(id){ try { if (id) localStorage.setItem('spr-last-mat', String(id)); } catch(e){} }
function matById_(id){ return (App._materials || []).find(function(m){ return String(m['ID']) === String(id); }); }

function blankMatRow_() {
  var row = { 'Материал ID':'', 'Название':'', 'Единица':'пм', 'Кол-во':0,
    'Ширина рулона':1.52, 'Цена за м²':0, 'Тип':'расход', 'Кол-во м²':0, 'Стоимость':0,
    'Длина куска':0, 'Ширина куска':0 };
  var lm = matById_(lastMatId_());   // подставляем ранее выбранный материал (меняют его редко)
  if (lm) {
    row['Материал ID']   = lm['ID'] || '';
    row['Название']      = lm['Название'] || '';
    row['Единица']       = lm['Единица'] || 'пм';
    row['Ширина рулона'] = Number(lm['Ширина рулона']) || 1.52;
    row['Цена за м²']    = matSebestM2_(lm);
  }
  return row;
}

// Построить строки таблицы материалов карточки из App._currentOrder.materials
function renderCardMatRows() {
  // если плёнок нет — сразу показываем одну пустую строку для заполнения (пустые не сохранятся)
  if (App._currentOrder && (!App._currentOrder.materials || !App._currentOrder.materials.length)) {
    App._currentOrder.materials = [ blankMatRow_() ];
  }
  var mats = (App._currentOrder && App._currentOrder.materials) || [];
  var inp = 'padding:3px 6px;border:1px solid var(--border);border-radius:5px;background:var(--inp);color:var(--text);font-size:12px';
  return mats.map(function(m, i) {
    var isOst = m['Тип'] === 'остаток';
    // Цена — ЗА М². Стоимость = м² × цена_м². (пог.м → м²: qty × ширина рулона)
    var unitM = m['Единица'] || 'пм';
    var rollM = Number(m['Ширина рулона']) || 1.52;
    var priceM = Number(m['Цена за м²']) || 0;
    var qtyM = Number(m['Кол-во']) || 0;
    var sqm   = (unitM === 'пм') ? Math.round(qtyM * rollM * 100) / 100 : qtyM;
    var cost  = Math.round(sqm * priceM * 100) / 100 * (isOst ? -1 : 1);
    m['Кол-во м²'] = sqm; m['Стоимость'] = cost;   // держим модель в синхроне для сохранения
    var hasRef = (App._materials || []).length > 0;
    var matCell = hasRef
      ? '<select class="cardmat-mat" data-i="' + i + '" onchange="onCardMatSelect(' + i + ')" style="' + inp + ';min-width:150px">' + cardMatOptions_(m['Материал ID']) + '</select>'
      : '<input class="cardmat-name" data-i="' + i + '" value="' + String(m['Название']||'').replace(/"/g,'&quot;') + '" placeholder="название плёнки" onchange="onCardMatEdit(' + i + ')" style="' + inp + ';min-width:150px">';
    var unitSel = '<select class="cardmat-unit" data-i="' + i + '" onchange="onCardMatEdit(' + i + ')" style="' + inp + '">' +
        '<option value="пм"' + ((m['Единица']||'пм')==='пм'?' selected':'') + '>пм</option>' +
        '<option value="м²"' + (m['Единица']==='м²'?' selected':'') + '>м²</option>' +
      '</select>';
    var qtyInner;
    if (unitM === 'м²') {
      // Мастера подают расход/остаток куском: длина × ширина → итого м² (можно ввести итого напрямую)
      var Lp = Number(m['Длина куска']) || 0, Wp = Number(m['Ширина куска']) || 0;
      qtyInner =
        '<input class="cardmat-len" data-i="' + i + '" type="number" step="0.01" min="0" placeholder="длина" value="' + (Lp||'') + '" onchange="onCardMatEdit(' + i + ')" style="' + inp + ';width:82px;text-align:left"> × ' +
        '<input class="cardmat-wid" data-i="' + i + '" type="number" step="0.01" min="0" placeholder="ширина" value="' + (Wp||'') + '" onchange="onCardMatEdit(' + i + ')" style="' + inp + ';width:82px;text-align:left"> = ' +
        '<input class="cardmat-total" data-i="' + i + '" type="number" step="0.01" min="0" title="итого м²" value="' + qtyM + '" onchange="onCardMatEdit(' + i + ')" style="' + inp + ';width:96px;text-align:left"> ' + unitSel;
    } else {
      qtyInner =
        '<input class="cardmat-qty" data-i="' + i + '" type="number" step="0.01" min="0" value="' + qtyM + '" onchange="onCardMatEdit(' + i + ')" style="' + inp + ';width:70px;text-align:left"> ' + unitSel;
    }
    return '<tr>' +
      '<td>' + matCell + '</td>' +
      '<td style="text-align:center;white-space:nowrap">' + qtyInner + '</td>' +
      '<td style="text-align:center">' + sqm.toFixed(2) + ' м²</td>' +
      '<td style="text-align:center;white-space:nowrap">' +
        '<input class="cardmat-price" data-i="' + i + '" type="number" step="0.01" min="0" value="' + (Number(m['Цена за м²'])||0) + '" onchange="onCardMatEdit(' + i + ')" style="' + inp + ';width:72px;text-align:left"> ' + CUR + '/м²' +
      '</td>' +
      '<td><select class="cardmat-type" data-i="' + i + '" onchange="onCardMatEdit(' + i + ')" style="' + inp + '">' +
          '<option value="расход"' + (!isOst?' selected':'') + '>расход</option>' +
          '<option value="остаток"' + (isOst?' selected':'') + '>остаток</option>' +
        '</select></td>' +
      '<td style="text-align:right;white-space:nowrap"><span style="font-weight:600;color:' + (isOst ? 'var(--danger)' : 'inherit') + '">' + (isOst ? ('− ' + Math.abs(cost).toLocaleString('ru') + ' ' + CUR) : (cost.toLocaleString('ru') + ' ' + CUR)) + '</span> ' +
        '<button onclick="removeCardMatLine(' + i + ')" title="Удалить" style="border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 4px">✕</button></td>' +
    '</tr>';
  }).join('');
}

// Пересчитать производные поля всех материалов и перерисовать таблицу
function refreshCardMats() {
  (App._currentOrder.materials || []).forEach(function(m) {
    var unit  = m['Единица'] || 'пм';
    var roll  = Number(m['Ширина рулона']) || 1.52;
    var price = Number(m['Цена за м²']) || 0;
    var qty   = Number(m['Кол-во']) || 0;
    var sqm   = (unit === 'пм') ? Math.round(qty * roll * 100) / 100 : qty;
    m['Кол-во м²']  = sqm;
    // Цена — ЗА М². Стоимость = м² × цена_м².
    m['Стоимость']  = Math.round(sqm * price * 100) / 100 * (m['Тип'] === 'остаток' ? -1 : 1);
  });
  var tb = document.getElementById('card-mat-tbody');
  if (tb) tb.innerHTML = renderCardMatRows();
}

// Изменение кол-ва / единицы / типа / названия в строке
function onCardMatEdit(i) {
  var m = App._currentOrder && App._currentOrder.materials[i];
  if (!m) return;
  var q  = document.querySelector('.cardmat-qty[data-i="'   + i + '"]');
  var u  = document.querySelector('.cardmat-unit[data-i="'  + i + '"]');
  var t  = document.querySelector('.cardmat-type[data-i="'  + i + '"]');
  var nm = document.querySelector('.cardmat-name[data-i="'  + i + '"]');
  var pr = document.querySelector('.cardmat-price[data-i="' + i + '"]');
  var len = document.querySelector('.cardmat-len[data-i="'   + i + '"]');
  var wid = document.querySelector('.cardmat-wid[data-i="'   + i + '"]');
  var tot = document.querySelector('.cardmat-total[data-i="' + i + '"]');
  if (u)  m['Единица']   = u.value;
  if (t)  m['Тип']       = t.value;
  if (nm) m['Название']  = nm.value;
  if (pr) m['Цена за м²'] = Number(pr.value) || 0;
  if (m['Единица'] === 'м²') {
    // длина × ширина куска → итого м²; если размеры не заданы — берём введённое «итого»
    if (len) m['Длина куска']  = Number(len.value) || 0;
    if (wid) m['Ширина куска'] = Number(wid.value) || 0;
    var L = Number(m['Длина куска']) || 0, W = Number(m['Ширина куска']) || 0;
    if (L > 0 && W > 0)      m['Кол-во'] = Math.round(L * W * 100) / 100;
    else if (tot)            m['Кол-во'] = Number(tot.value) || 0;
  } else {
    if (q) m['Кол-во'] = Number(q.value) || 0;
  }
  refreshCardMats();
  matAutoSave();
}

// Выбор материала из справочника
function onCardMatSelect(i) {
  var m = App._currentOrder && App._currentOrder.materials[i];
  if (!m) return;
  var sel = document.querySelector('.cardmat-mat[data-i="' + i + '"]');
  if (!sel) return;
  var opt = sel.options[sel.selectedIndex];
  m['Материал ID']   = opt.value || '';
  m['Название']      = opt.value ? opt.textContent : '';
  m['Единица']       = (opt.dataset.unit) || 'пм';
  m['Цена за м²']    = Number(opt.dataset.price) || 0;
  m['Ширина рулона'] = Number(opt.dataset.roll) || 1.52;
  setLastMatId_(m['Материал ID']);   // запоминаем для будущих заказов
  // подхватываем введённое кол-во (поле «кол-во» для пм или «итого» для м²)
  var q = document.querySelector('.cardmat-qty[data-i="' + i + '"]') || document.querySelector('.cardmat-total[data-i="' + i + '"]');
  if (q) m['Кол-во'] = Number(q.value) || 0;
  refreshCardMats();
  matAutoSave();
}

function addCardMatLine() {
  if (!App._currentOrder) return;
  if (!App._currentOrder.materials) App._currentOrder.materials = [];
  App._currentOrder.materials.push(blankMatRow_());
  refreshCardMats();
}

function removeCardMatLine(i) {
  if (!App._currentOrder || !App._currentOrder.materials) return;
  App._currentOrder.materials.splice(i, 1);
  refreshCardMats();
  matAutoSave();
}

function saveCardMaterials() {
  var o = App._currentOrder;
  if (!o) return;
  var lines = (o.materials || []).filter(function(m) {
    // не сохраняем полностью пустые строки
    return (m['Материал ID'] || String(m['Название'] || '').trim() || Number(m['Кол-во']) > 0);
  }).map(function(m) {
    return {
      materialId:  m['Материал ID'] || '',
      name:        m['Название']     || '',
      unit:        m['Единица']      || 'пм',
      qty:         Number(m['Кол-во']) || 0,
      rollWidth:   Number(m['Ширина рулона']) || 1.52,
      pricePerSqm: Number(m['Цена за м²']) || 0,
      type:        m['Тип'] === 'остаток' ? 'остаток' : 'расход',
      zone:        m['Зона'] || '',                    // тонировка
      light:       m['Светопропускаемость'] || '',     // тонировка
    };
  });

  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) { toast('Ошибка сохранения: ' + (resp?resp.error:''), 'error'); return; }
      // Пересчитываем финансы заказа и обновляем карточку
      google.script.run
        .withSuccessHandler(function(){ toast('Расход плёнки обновлён, финансы пересчитаны', 'success'); reopenCard(o['ID']); })
        .withFailureHandler(function(e){ toast('Ошибка пересчёта: ' + e.message, 'error'); })
        .recalcOrderFinance(o['ID']);
    })
    .withFailureHandler(function(e){ toast('Ошибка: ' + e.message, 'error'); })
    .saveOrderMaterials(o['ID'], lines);
}

/* --- Карточка заказа: редактор персонала (кто клеил) --- */
function renderCardPersonnel() {

  var mgrOpts = managerOptionsHtml_(mgr, '— менеджер —');

  var masterChecks = emps.length

  // Отдельная стоимость + тонировщик — только для СМЕШАННОГО заказа (оклейка + тонировка).
  var svc          = String(o['Услуга'] || '');
  var isTintOrder  = svcHasTint_(svc);
  var isMixedOrder = svcHasTint_(svc) && svcHasOkl_(svc);
  var tintList     = String(o['Тонировщики'] || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  var tintPriceVal = (Number(o['Стоимость тонировки']) || '') === '' ? '' : Number(o['Стоимость тонировки']);
  // Стоимость оклейки = хранимая или (общая − тонировка)
  var _tot = Number(o['Стоимость заказа']) || 0, _tnt = Number(o['Стоимость тонировки']) || 0;
  var wrapPriceVal = (o['Стоимость оклейки'] !== '' && o['Стоимость оклейки'] != null) ? (Number(o['Стоимость оклейки']) || 0) : Math.max(0, _tot - _tnt);
  var TINT_ACCENT = '#e0559a';   // розовый акцент тонировки (для визуального разделения)
  var tintSection  = '';
  if (isTintOrder) {
    var filmVal  = String(o['Пленка'] || '').replace(/"/g,'&quot;');
    var lightVal = String(o['Светопропускаемость'] == null ? '' : o['Светопропускаемость']).replace(/"/g,'&quot;');
    var mixedPart = '';
    if (isMixedOrder) {
      // Тонировщики (по роли) — первыми, затем остальные
      var isTinterRole = function(e){ return /тонировщик/i.test((e['Основная должность'] || '') + ',' + (e['Доп. роли'] || '')); };
      var tintersFirst = emps.slice().sort(function(a, b){ return (isTinterRole(b)?1:0) - (isTinterRole(a)?1:0); });
      var tinterChecks = tintersFirst.map(function(e){
        var n = e['ФИО'] || e['Имя'] || ''; if (!n) return '';
        var isTinter = isTinterRole(e);
        var on = tintList.length ? (tintList.indexOf(n) >= 0) : isTinter;
        return '<label style="display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 0;cursor:pointer">' +
          '<input type="checkbox" class="card-tinter-cb" value="' + n.replace(/"/g,'&quot;') + '"' + (on ? ' checked' : '') + ' onchange="persAutoSave()"> ' + n + (isTinter ? ' 🎨' : '') + '</label>';
      }).join('');
      // Менеджер/админ тонировки — по умолчанию как в оклейке
      var tintMgrOpts = managerOptionsHtml_(String(o['Менеджер тонировки'] || o['Менеджер'] || ''), '— менеджер —');
      var tintAdmOpts = managerOptionsHtml_(String(o['Администратор тонировки'] || o['Администратор'] || ''), '— администратор —');
      mixedPart =
        '<label style="' + lbl + '">Менеджер</label>' +
        '<select id="card-tint-mgr" style="' + inp + ';margin:2px 0 8px" onchange="persAutoSave()">' + tintMgrOpts + '</select>' +
        '<label style="' + lbl + '">Администратор</label>' +
        '<select id="card-tint-admin" style="' + inp + ';margin:2px 0 8px" onchange="persAutoSave()">' + tintAdmOpts + '</select>' +
        '<label style="' + lbl + '">Стоимость тонировки, руб</label>' +
        '<input id="card-tint-price" type="number" min="0" value="' + tintPriceVal + '" style="' + inp + ';margin:2px 0 8px" onchange="onTintPriceChange_()" title="Добавляется к общей стоимости заказа">' +
        '<div style="font-size:10px;color:var(--text3);margin-bottom:4px">Добавляется к общей сумме заказа</div>' +
        '<div style="' + lbl + '">Тонировщики (бонус — с части тонировки)</div>' +
        '<div style="max-height:100px;overflow:auto">' + tinterChecks + '</div>';
    }
    tintSection =
      '<div style="border:1px solid ' + TINT_ACCENT + '55;border-left:3px solid ' + TINT_ACCENT + ';border-radius:8px;background:' + TINT_ACCENT + '0d;margin-top:10px;padding:8px 10px">' +
        '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:' + TINT_ACCENT + ';margin-bottom:6px">🎨 Тонировка</div>' +
        '<div style="display:grid;grid-template-columns:1fr 88px;gap:8px">' +
          '<div><label style="' + lbl + '">Плёнка (для документов)</label>' +
            '<input id="card-tint-film" list="card-tint-film-list" value="' + filmVal + '" placeholder="напр. Nano Ceramic" style="' + inp + ';margin:2px 0 8px" oninput="persAutoSave()">' +
            '<datalist id="card-tint-film-list">' + tintFilmNames_().map(function(n){ return '<option value="' + String(n).replace(/"/g,'&quot;') + '">'; }).join('') + '</datalist></div>' +
          '<div><label style="' + lbl + '">Светопр., %</label>' +
            '<input id="card-tint-light" type="number" min="0" max="100" value="' + lightVal + '" style="' + inp + ';margin:2px 0 8px" oninput="persAutoSave()"></div>' +
        '</div>' + mixedPart +
      '</div>';
  }

  return '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:12px">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
      '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2)">Персонал · кто клеил</div>' +
      '<span id="card-pers-status" style="font-size:11px;color:var(--text3)"></span>' +
    '</div>' +
    (isMixedOrder ? '<div style="border:1px solid var(--border-h);border-left:3px solid var(--accent);border-radius:8px;padding:8px 10px;margin-bottom:2px">' +
      '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:6px">🛡 Оклейка</div>' +
      '<label style="' + lbl + '">Стоимость оклейки, руб</label>' +
      '<input id="card-wrap-price" type="number" min="0" value="' + wrapPriceVal + '" style="' + inp + ';margin:2px 0 8px" onchange="onWrapPriceChange_()" title="Итого заказа = оклейка + тонировка"> ' : '') +
    '<label style="' + lbl + '">Менеджер</label>' +
    '<select id="card-mgr" style="' + inp + ';margin:2px 0 8px" onchange="persAutoSave()">' + mgrOpts + '</select>' +
    '<label style="' + lbl + '">Администратор</label>' +
    '<select id="card-admin" style="' + inp + ';margin:2px 0 8px" onchange="persAutoSave()">' + adminOpts + '</select>' +
    '<div style="' + lbl + '">' + (isMixedOrder ? 'Оклейщики (бонус — с части оклейки)' : 'Мастера') + '</div>' +
    '<div id="card-masters-summary" style="font-size:12px;font-weight:600;color:var(--accent);margin-bottom:5px;min-height:16px">' +
      (mastersList.length ? '✔ ' + mastersList.join(', ') : '<span style="color:var(--text3);font-weight:400">не выбрано</span>') + '</div>' +
    '<div style="max-height:118px;overflow:auto">' + masterChecks + '</div>' +
    (isMixedOrder ? '</div>' : '') +
    tintSection +

// Стоимость оклейки/тонировки изменилась → сохраняем и перерисовываем (общая сумма = оклейка + тонировка)
function onTintPriceChange_() {
  App._persDirty = true;
  persFlush_(function(){ if (App._currentOrderId) reopenCard(App._currentOrderId); });
}
function onWrapPriceChange_() {
  App._persDirty = true;
  persFlush_(function(){ if (App._currentOrderId) reopenCard(App._currentOrderId); });
}

function persAutoSave() {
  App._persDirty = true;
  updateMastersSummary_();   // сразу показать выбранных оклейщиков строкой
  var el = document.getElementById('card-pers-status'); if (el) { el.textContent = '● не сохранено'; el.style.color = 'var(--warning)'; }
  clearTimeout(App._persTimer);
  App._persTimer = setTimeout(function(){ persFlush_(); }, 700);
}

// Строка выбранных оклейщиков (над списком галочек) — обновляется при каждом клике
function updateMastersSummary_() {
  var box = document.getElementById('card-masters-summary'); if (!box) return;
  var names = [];
  document.querySelectorAll('.card-master-cb:checked').forEach(function(cb){ names.push(cb.value); });
  box.innerHTML = names.length ? '✔ ' + names.join(', ') : '<span style="color:var(--text3);font-weight:400">не выбрано</span>';
}
function persFlush_(cb) {
  clearTimeout(App._persTimer);
  if (!App._persDirty) { if (cb) cb(); return; }
  App._persDirty = false;
  var o = App._currentOrder; if (!o || !o['ID']) { if (cb) cb(); return; }
  var id = o['ID'];
  var mgr = (document.getElementById('card-mgr') || {}).value || '';
  var admin = (document.getElementById('card-admin') || {}).value || '';
  var masters = [];
  document.querySelectorAll('.card-master-cb:checked').forEach(function(cb2){ masters.push(cb2.value); });
  // Тонировка (если блок присутствует)
  // Плёнка/светопропускание — при любой тонировке; стоимость+тонировщики — только для смешанного
  var filmEl  = document.getElementById('card-tint-film');
  var priceEl = document.getElementById('card-tint-price');
  var hasFilm  = !!filmEl;
  var hasMixed = !!priceEl;
  var tintFilm  = hasFilm ? (filmEl.value || '') : null;
  var tintLight = hasFilm ? ((document.getElementById('card-tint-light') || {}).value || '') : null;
  var tintPrice = hasMixed ? (Number(priceEl.value) || 0) : null;
  var tintMasters = null, tintMgr = null, tintAdm = null;
  if (hasMixed) {
    var tm = [];
    document.querySelectorAll('.card-tinter-cb:checked').forEach(function(cb2){ tm.push(cb2.value); });
    tintMasters = tm.join(', ');
    tintMgr = (document.getElementById('card-tint-mgr')   || {}).value || '';
    tintAdm = (document.getElementById('card-tint-admin') || {}).value || '';
  }
  var st = function(t,c){ var e=document.getElementById('card-pers-status'); if(e){e.textContent=t; e.style.color=c||'var(--text3)';} };
  st('сохранение…');
  // обновим модель сразу (для документов/перерисовки)
  o['Менеджер'] = mgr; o['Оклейщики'] = masters.join(', '); o['Администратор'] = admin;
  if (hasFilm)  { o['Пленка'] = tintFilm; o['Светопропускаемость'] = tintLight; }
  if (hasMixed) { o['Стоимость тонировки'] = tintPrice; o['Тонировщики'] = tintMasters; o['Менеджер тонировки'] = tintMgr; o['Администратор тонировки'] = tintAdm; }
  var payload = { manager: mgr, masters: masters.join(', '), admin: admin };
  if (hasFilm)  { payload.film = tintFilm; payload.lightTransmission = tintLight; }
  if (hasMixed) { payload.tintPrice = tintPrice; payload.tintMasters = tintMasters; payload.tintManager = tintMgr; payload.tintAdmin = tintAdm; }
  var wrapEl = document.getElementById('card-wrap-price');
  if (wrapEl) payload.wrapPrice = Number(wrapEl.value) || 0;
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) { st('ошибка сохранения', 'var(--danger)'); if (cb) cb(); return; }
      var f = resp.data && resp.data.finance;
      if (f) {
        o['Валовая прибыль']=f.grossProfit; o['Бонус менеджера']=f.managerBonus;
        o['Бонус оклейщика']=f.masterBonus; o['Бонус администратора']=f.adminBonus; o['Маржинальная прибыль']=f.marginalProfit;
        if (f.tintMasterBonus  !== undefined) o['Бонус тонировщика']=f.tintMasterBonus;
        if (f.tintManagerBonus !== undefined) o['Бонус менеджера тонировки']=f.tintManagerBonus;
        if (f.tintAdminBonus   !== undefined) o['Бонус администратора тонировки']=f.tintAdminBonus;
        var box=document.getElementById('card-fin-box'); if(box) box.innerHTML=renderCardFinance_(o);
      }
      // Назначили оклейщиков из «Нового» → заказ ушёл в «В работе» (обновим статус в шапке сразу)
      try {
        if (masters.length && orderStatusNames()[0] && String(o['Статус']||'') === orderStatusNames()[0]) {
          var names = orderStatusNames();
          var inWork = names.indexOf('В работе') >= 0 ? 'В работе' : (names[1] || '');
          if (inWork) {
            o['Статус'] = inWork;
            var selHdr = document.getElementById('card-hdr-status'); if (selHdr) selHdr.value = inWork;
          }
        }
      } catch (e) {}
      App.orders = []; App._dashCache = null; if (App._cardCache) delete App._cardCache[id];
      st('✓ сохранено', 'var(--success)'); if (cb) cb();
    })
    .withFailureHandler(function(e){ st('ошибка: ' + e.message, 'var(--danger)'); if (cb) cb(); })
    .updateOrder(id, payload);
}

/* --- Карточка заказа: редактор расходов (такси, арматура) --- */
function renderCardExpRows() {
  var exps = (App._currentOrder && App._currentOrder.expenses) || [];

  }

function onCardExpEdit(i) {
  var e = App._currentOrder && App._currentOrder.expenses[i];

function addCardExpLine() {

/* --- Арматура: список мастеров + штатный арматурщик по умолчанию --- */
function empAllNames_(){ return (App.employees || []).map(function(e){ return e['ФИО'] || e['Имя'] || ''; }).filter(Boolean); }
// Штатный арматурщик: сначала по должности/специализации «арматур…», иначе по имени «Никит…»
function defaultArmWho_(){
  var emps = App.employees || [];
  var byRole = emps.find(function(e){ return /арматур/i.test(String(e['Должность']||'') + ' ' + String(e['Специализация']||'') + ' ' + String(e['Роль']||'')); });
  if (byRole) return byRole['ФИО'] || byRole['Имя'] || '';
  var byName = emps.find(function(e){ return /никит/i.test(String(e['ФИО']||e['Имя']||'')); });
  return byName ? (byName['ФИО'] || byName['Имя'] || '') : '';
}
// <option>-ы мастеров для поля «Кто» (сохранённое имя, которого нет в списке, тоже показываем)
function armWhoOptions_(selected){
  var sel = selected || '';
  var opts = '<option value="">— выбрать —</option>';
  var found = false;
  empAllNames_().forEach(function(n){ if (n === sel) found = true; opts += '<option value="' + escapeHtml_(n) + '"' + (n === sel ? ' selected' : '') + '>' + escapeHtml_(n) + '</option>'; });
  if (sel && !found) opts += '<option value="' + escapeHtml_(sel) + '" selected>' + escapeHtml_(sel) + '</option>';
  return opts;
}

/* --- Карточка заказа: редактор арматурных работ (хранится в JSON «Проверки» заказа) --- */
function cardArmInit_(){
  var o = App._currentOrder; if (!o) return;
  if (!o.arm){ try { o.arm = (JSON.parse(o['Проверки'] || '{}') || {}).armItems || []; } catch(e){ o.arm = []; } }
}
function renderCardArmRows() {
  var o = App._currentOrder; if (!o) return '';
  cardArmInit_();
  if (!o.arm.length) return '<tr><td colspan="4" style="text-align:center;color:var(--text3);padding:12px">Арматурные работы не добавлены — «+ Добавить»</td></tr>';
  var inp = 'padding:3px 7px;border:1px solid var(--border);border-radius:5px;background:var(--inp);color:var(--text);font-size:12px';
  return o.arm.map(function(r, i) {
    return '<tr>' +
      '<td><input class="cardarm-work" data-i="' + i + '" value="' + escapeHtml_(r.work||'') + '" placeholder="напр. снятие бампера" oninput="onCardArmEdit(' + i + ')" style="' + inp + ';width:100%"></td>' +
      '<td><select class="cardarm-who" data-i="' + i + '" onchange="onCardArmEdit(' + i + ')" style="' + inp + ';width:150px">' + armWhoOptions_(r.who) + '</select></td>' +
      '<td style="text-align:right;white-space:nowrap"><input class="cardarm-sum" data-i="' + i + '" type="number" step="0.01" min="0" value="' + (Number(r.sum)||0) + '" oninput="onCardArmEdit(' + i + ')" style="' + inp + ';width:88px;text-align:left"> ' + CUR + '</td>' +
      '<td style="text-align:right"><button onclick="removeCardArmLine(' + i + ')" title="Удалить" style="border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 4px">✕</button></td>' +
    '</tr>';
  }).join('');
}
function onCardArmEdit(i) {
  var o = App._currentOrder; if (!o || !o.arm || !o.arm[i]) return;
  var w  = document.querySelector('.cardarm-work[data-i="' + i + '"]');
  var wh = document.querySelector('.cardarm-who[data-i="'  + i + '"]');
  var s  = document.querySelector('.cardarm-sum[data-i="'  + i + '"]');
  if (w)  o.arm[i].work = w.value;
  if (wh) o.arm[i].who  = wh.value;
  if (s)  o.arm[i].sum  = Number(s.value) || 0;
  armAutoSave();
}
function addCardArmLine() {
  var o = App._currentOrder; if (!o) return;
  cardArmInit_();

function verifyOrderCard(orderId) {
  var o = App._currentOrder;
  var wrap = document.getElementById('card-verify-banner');
  var prev = (o && String(o['Проверено']) === 'Да');
  var next = !prev;

  // 1) Мгновенно меняем баннер и кэш (оптимистично)
  if (o) o['Проверено'] = next ? 'Да' : 'Нет';
  if (wrap) wrap.innerHTML = verifyBannerHtml_(orderId, next);

  // 2) Синхронизируем с сервером в фоне (каскад на все 4 категории), при ошибке откатываем
  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) {
        if (o) o['Проверено'] = prev ? 'Да' : 'Нет';
        if (wrap) wrap.innerHTML = verifyBannerHtml_(orderId, prev);
        toast('Ошибка: ' + (resp ? resp.error : ''), 'error');
        return;
      }
      var v = !!resp.data.verified;
      if (o) { o['Проверено'] = v ? 'Да' : 'Нет'; o['Проверки'] = resp.data.checksJson; }
      // обновляем кэш списка заказов (и общий статус, и чипы категорий)
      for (var i = 0; i < (App.orders || []).length; i++) {
        if (String(App.orders[i]['ID']) === String(orderId)) {
          App.orders[i]['Проверено'] = v ? 'Да' : 'Нет';
          App.orders[i]['Проверки']  = resp.data.checksJson;
          break;
        }
      }
      toast(v ? 'Заказ и все пункты отмечены проверенными' : 'Проверка снята со всех пунктов', 'success');
    })
    .withFailureHandler(function(e){
      if (o) o['Проверено'] = prev ? 'Да' : 'Нет';
      if (wrap) wrap.innerHTML = verifyBannerHtml_(orderId, prev);
      toast('Ошибка: ' + e.message, 'error');
    })
    .setOrderVerifiedAll(orderId, next);
}

// dd.MM.yyyy → yyyy-MM-dd (для input[type=date])
function ruToIso_(s){ var m = String(s || '').match(/^(\d{2})\.(\d{2})\.(\d{4})/); return m ? m[3] + '-' + m[2] + '-' + m[1] : ''; }

// Живой итог по графику рассрочки (сумма взносов vs стоимость заказа)
function updateSchedSum_() {
  var box = document.getElementById('card-schedule'); if (!box) return;
  var hint = document.getElementById('sched-sum-hint'); if (!hint) return;
  var sum = 0;
  box.querySelectorAll('.sched-amt').forEach(function(a){ sum += Number(a.value) || 0; });

  hint.textContent = 'Сумма взносов: ' + fmt(sum) + ' (заказ ' + fmt(price) + ')';
  hint.style.color = Math.abs(sum - price) < 0.5 ? 'var(--success)' : 'var(--text3)';
}

// Сохранить суммы/даты графика. silent=true — тихо (автосохранение, без перерисовки карточки)
function saveScheduleCard(orderId, silent) {
  var box = document.getElementById('card-schedule'); if (!box) return;
  var rows = [];
  box.querySelectorAll('.sched-row').forEach(function(r){

    var amt = a ? (Number(a.value) || 0) : 0;

  });

  var st = document.getElementById('sched-save-status'); if (st) { st.textContent = 'сохранение…'; st.style.color = 'var(--text3)'; }
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) { if (st) { st.textContent = 'ошибка'; st.style.color = 'var(--danger)'; } if (!silent) toast('Ошибка: ' + (resp?resp.error:''), 'error'); return; }
      App._dashCache = null; App._debtCache = null;
      if (st) { st.textContent = '✓ сохранено'; st.style.color = 'var(--success)'; }
      if (!silent) reopenCard(orderId);
    })
    .withFailureHandler(function(e){ if (st) { st.textContent = 'ошибка'; st.style.color = 'var(--danger)'; } if (!silent) toast('Ошибка: ' + e.message, 'error'); })
    .saveInstallmentSchedule(orderId, rows);
}

// Прибавить n месяцев к ISO-дате (yyyy-MM-dd) → ISO
function addMonthsIso_(iso, n) {
  var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return '';
  var d = new Date(+m[1], +m[2] - 1, +m[3]);
  d.setMonth(d.getMonth() + Number(n || 0));
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}

// Разметка одной строки взноса (для клиентской генерации графика)
var SCHED_INP_ = 'font-size:12px;padding:5px 7px;border:1px solid var(--border);border-radius:7px;background:var(--inp);color:var(--text)';
function schedRowHtml_(num, dISO, amount) {
  return '<div class="sched-row" data-paid="0" style="display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--border)">' +
    '<span style="width:18px;text-align:center;color:var(--text3)" title="не оплачен">○</span>' +
    '<span style="width:22px;font-size:12px;color:var(--text3)">№' + num + '</span>' +
    '<input type="date" class="sched-date" value="' + (dISO || '') + '" style="' + SCHED_INP_ + ';flex:1;min-width:0" onchange="schedEdit_()">' +
    '<input type="number" class="sched-amt" min="0" step="0.01" value="' + (amount !== '' && amount != null ? amount : '') + '" placeholder="сумма" style="' + SCHED_INP_ + ';width:92px;text-align:right" oninput="schedEdit_()">' +
    '<button class="btn btn-ghost" onclick="this.closest(\'.sched-row\').remove();schedEdit_()" title="Удалить взнос" style="padding:2px 7px;font-size:12px;color:var(--danger)">✕</button>' +
  '</div>';
}

// Перестроить строки графика по числу месяцев и дате первого взноса (даты — по месяцам,
// уже введённые суммы/даты сохраняются по позициям). Суммы не заполняются автоматически —
// их можно вписать вручную или нажать «Разбить поровну».
function rebuildSchedRows_() {
  var box = document.getElementById('card-schedule'); if (!box) return;
  var months = Math.max(1, Math.min(36, Number((document.getElementById('sched-months')||{}).value) || 1));
  var start  = (document.getElementById('sched-start')||{}).value || '';
  var prev = [];
  box.querySelectorAll('.sched-row').forEach(function(r){
    var d = r.querySelector('.sched-date'), a = r.querySelector('.sched-amt');
    prev.push({ date: d ? d.value : '', amount: a ? a.value : '' });
  });
  var html = '';
  for (var i = 0; i < months; i++) {
    var dISO = start ? addMonthsIso_(start, i) : (prev[i] ? prev[i].date : '');
    var amt  = prev[i] ? prev[i].amount : '';
    html += schedRowHtml_(i + 1, dISO, amt);
  }
  box.innerHTML = html;
  updateSchedSum_();
  var st = document.getElementById('sched-save-status'); if (st) { st.textContent = '● не сохранено — заполните суммы'; st.style.color = 'var(--warning)'; }
}

// Добавить одну пустую строку взноса вручную
function addSchedRow_() {
  var box = document.getElementById('card-schedule'); if (!box) return;
  var n = box.querySelectorAll('.sched-row').length + 1;
  var last = box.querySelector('.sched-row:last-child .sched-date');
  var dISO = last && last.value ? addMonthsIso_(last.value, 1) : '';
  box.insertAdjacentHTML('beforeend', schedRowHtml_(n, dISO, ''));
  updateSchedSum_();
}

// «Разбить поровну»: раскидать ОСТАТОК (стоимость − уже оплачено) равными взносами
// по строкам графика (по числу месяцев), проставить помесячные даты и сохранить.
function splitEqualCard_() {
  var box = document.getElementById('card-schedule'); if (!box) return;
  var start = (document.getElementById('sched-start')||{}).value || '';
  if (!start) { toast('Укажите дату первого взноса', 'error'); return; }
  rebuildSchedRows_();   // гарантируем нужное число строк с датами
  var rows = box.querySelectorAll('.sched-row');
  var n = rows.length; if (!n) return;
  var remaining = Number(box.getAttribute('data-remaining'));
  if (!(remaining > 0)) remaining = Number((App._currentOrder || {})['Стоимость заказа']) || 0;
  var per = Math.floor((remaining / n) * 100) / 100;
  var acc = 0;
  rows.forEach(function(r, i){
    var a = r.querySelector('.sched-amt');
    var val = (i === n - 1) ? Math.round((remaining - acc) * 100) / 100 : per;
    acc += per;
    if (a) a.value = val;
  });
  updateSchedSum_();
  saveScheduleCard(App._currentOrderId, false);   // сохранить и перерисовать (подтянет статусы/срок)
}
