<script>
console.log('=== Scripts.html начал загружаться ===');

var App = {
  currentPage: 'dashboard',
  brand: null,
  config: null,
  employees: [],
  clients: [],
  settings: {},
  pendingLogoDataUrl: null,
  _theme: localStorage.getItem('sprauto-theme') || 'dark',
  _toastTimer: null,
  _editingId: null,
  _editingIdx: null,
  _clientFilter: 'all',
  _currentClientId: null,
  _clientSort: { key: null, dir: 1 },
  _clientView: localStorage.getItem('sprauto-clients-view') || 'table',
  _modalStack: [],
  _nextZIndex: 9999
};

console.log('App object created:', App);
document.body.setAttribute('data-theme', App._theme);
console.log('Theme set:', App._theme);

/* ===== ТЕМА ===== */
function toggleTheme() {
  App._theme = App._theme === 'dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', App._theme);
  localStorage.setItem('sprauto-theme', App._theme);
  var lbl = document.getElementById('theme-label');
  if (lbl) lbl.textContent = App._theme === 'dark' ? 'Светлая тема' : 'Тёмная тема';
}

/* ===== НАВИГАЦИЯ ===== */
var PAGE_TITLES = {
  dashboard:'Дашборд', orders:'Заказы', clients:'Клиенты',
  'client-card':'Карточка клиента', 'order-card':'Карточка заказа',
  finance:'Финансы', dds:'ДДС — Движение денег', expenses:'Расходы',
  debt:'Дебиторка', salary:'Расчёт заработной платы',
  team:'Сотрудники', services:'Услуги', inventory:'Склад',
  appointments:'Записи — календарь',
  materials:'Справочник материалов', settings:'Настройки'
};

function goPage(name) {
  // Досохраняем несохранённые правки карточки и инлайн-редакторов перед уходом
  if (typeof flushCard_ === 'function') flushCard_();
  if (typeof flushAllInline_ === 'function') flushAllInline_();
  // Закрываем все открытые модальные окна при смене страницы
  closeAllModals();

  App.currentPage = name;
  document.querySelectorAll('.page').forEach(function(el){ el.classList.remove('active'); });
  var t = document.getElementById('page-' + name);
  if (t) t.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(el){
    el.classList.toggle('active', el.dataset.page === name || (name === 'client-card' && el.dataset.page === 'clients'));
  });
  var h = document.getElementById('topbar-title');
  if (h) h.textContent = PAGE_TITLES[name] || name;

  var actionBtn = document.getElementById('topbar-action-btn');
  if (actionBtn) {
    if (name === 'clients') {
      actionBtn.style.display = 'inline-flex';
      actionBtn.textContent = '+ Новый клиент';
      actionBtn.onclick = function(){ openModal('modal-new-client'); };
    } else if (name === 'expenses') {
      actionBtn.style.display = 'inline-flex';
      actionBtn.textContent = '+ Добавить расход';
      actionBtn.onclick = function(){ openModal('modal-new-expense'); };
    } else if (name === 'materials') {
      actionBtn.style.display = 'inline-flex';
      actionBtn.textContent = '+ Добавить материал';
      actionBtn.onclick = function(){ openModal('modal-new-material'); };
    } else if (name === 'team') {
      actionBtn.style.display = 'inline-flex';
      actionBtn.textContent = '+ Добавить сотрудника';
      actionBtn.onclick = function(){ openModal('modal-new-employee'); };
    } else if (name === 'salary') {
      actionBtn.style.display = 'inline-flex';
      actionBtn.textContent = 'Рассчитать ЗП';
      actionBtn.onclick = function(){ calcSalary(); };
    } else if (name === 'appointments') {
      actionBtn.style.display = 'inline-flex';
      actionBtn.textContent = '+ Новая запись';
      actionBtn.onclick = function(){ openNewAppointment(); };
    } else {
      actionBtn.style.display = 'none';
    }
  }

  window.scrollTo(0,0);
  loadCurrentPage();
}

document.querySelectorAll('.nav-item').forEach(function(el){
  el.addEventListener('click', function(e){ e.preventDefault(); goPage(el.dataset.page); });
});

function topbarAction() {}

/* ===== СИНХРОНИЗАЦИЯ ===== */
function refreshSync() {
  var n = new Date();
  var p = function(x){ return String(x).padStart(2,'0'); };
  var el = document.getElementById('sync-time');
  if (el) el.textContent = 'Обновлено: '+p(n.getDate())+'.'+p(n.getMonth()+1)+' '+p(n.getHours())+':'+p(n.getMinutes());
}

/* ===== КРАСИВОЕ ПОДТВЕРЖДЕНИЕ (вместо нативного confirm) ===== */
function uiConfirm(message, onConfirm, opts) {
  opts = opts || {};
  var title  = opts.title  || 'Подтвердите действие';
  var okText = opts.okText || 'Удалить';
  var danger = (opts.danger !== false); // по умолчанию опасное (красная кнопка)
  var html   = String(message || '').replace(/\n/g, '<br>');

  var bg = document.createElement('div');
  bg.style.cssText = 'position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px';
  bg.innerHTML =
    '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:14px;max-width:400px;width:100%;box-shadow:var(--shadow);overflow:hidden;animation:li-fade .15s ease">' +
      '<div style="padding:18px 20px 6px;font-weight:700;font-size:16px;color:var(--text)">' + title + '</div>' +
      '<div style="padding:0 20px 18px;font-size:14px;color:var(--text2);line-height:1.5">' + html + '</div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);background:var(--bg-card2)">' +
        '<button class="btn btn-ghost" data-act="cancel" style="padding:8px 16px">Отмена</button>' +
        '<button class="btn" data-act="ok" style="padding:8px 16px;font-weight:600;color:#fff;background:' + (danger ? 'var(--danger)' : 'var(--accent)') + '">' + okText + '</button>' +
      '</div>' +
    '</div>';

  function close() { if (bg.parentNode) bg.parentNode.removeChild(bg); document.removeEventListener('keydown', onKey); }
  function onKey(e) { if (e.key === 'Escape') close(); }
  bg.addEventListener('click', function(e) {
    if (e.target === bg) { close(); return; }
    var act = e.target.getAttribute('data-act');
    if (act === 'cancel') close();
    if (act === 'ok') { close(); if (onConfirm) onConfirm(); }
  });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(bg);
}

/* ===== ТОСТ ===== */
function toast(msg, type) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(App._toastTimer);
  App._toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3500);
}

/* ===== МОДАЛКИ ===== */
function closeAllModals() {
  document.querySelectorAll('.modal-dialog-bg').forEach(function(modal) {
    modal.classList.remove('open');
    modal.style.cssText = 'display:none';
  });
  App._modalStack = [];
  App._nextZIndex = 9999;
  document.body.style.overflow = '';
}

function closeModal(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('open');
  el.style.cssText = 'display:none';

  // Убираем из стека
  var idx = App._modalStack.indexOf(id);
  if (idx !== -1) App._modalStack.splice(idx, 1);

  // Если стек пустой, разблокируем скролл
  if (App._modalStack.length === 0) {
    document.body.style.overflow = '';
  }
}

function openModal(id) {
  var el = document.getElementById(id);
  if (!el) { toast('Модал не найден: ' + id, 'error'); return; }

  // Перемещаем в конец body чтобы гарантировать отрисовку поверх всего
  document.body.appendChild(el);

  // Выставляем все стили явно через JS — обходим любые CSS-блокировки
  el.style.cssText = [
    'position:fixed',
    'top:0', 'left:0',
    'width:100vw', 'height:100vh',
    'background:rgba(0,0,0,0.75)',
    'z-index:2147483647',
    'display:flex',
    'align-items:center',
    'justify-content:center',
    'padding:20px',
    'box-sizing:border-box'
  ].join(';');

  el.classList.add('open');
  App._modalStack.push(id);
  document.body.style.overflow = 'hidden';

  if (id === 'modal-new-order') {
    App._aptPendingLink = null;  // сброс возможной висящей привязки записи (выставится заново в orderFromAppointment)
    if (!App.employees || App.employees.length === 0) {
      google.script.run
        .withSuccessHandler(function(resp) {
          App.employees = (resp && resp.ok && resp.data) ? resp.data : [];
          fillOrderEmployees(); initOrderForm();
        })
        .withFailureHandler(function(){ fillOrderEmployees(); initOrderForm(); })
        .getEmployees(true);
    } else {
      fillOrderEmployees(); initOrderForm();
    }
  }

  if (id === 'modal-new-expense') {
    var dateEl = document.getElementById('exp-date');
    if (dateEl && !dateEl.value) {
      dateEl.value = new Date().toISOString().slice(0, 10);
    }
  }

  if (id === 'modal-new-employee') {
    if (App.config && App.config.positions) fillPositions(App.config.positions);
  }
}

function fillOrderEmployees() {
  var employees = App.employees || [];

  // Менеджер — select
  var selMgr = document.getElementById('ord-manager');
  if (selMgr) {
    selMgr.innerHTML = '<option value="">— выбрать —</option>';
    employees.forEach(function(e) {
      var roles = (e['Основная должность'] || '') + ',' + (e['Доп. роли'] || '');
      if (!/менеджер|администратор|директор/i.test(roles)) return;
      var opt = document.createElement('option');
      opt.value = e['ФИО'] || e['Имя'] || '';
      opt.textContent = e['ФИО'] || e['Имя'] || '';
      selMgr.appendChild(opt);
    });
    // Если фильтр дал 0 результатов — показать всех
    if (selMgr.options.length <= 1) {
      employees.forEach(function(e) {
        var opt = document.createElement('option');
        opt.value = e['ФИО'] || e['Имя'] || '';
        opt.textContent = e['ФИО'] || e['Имя'] || '';
        selMgr.appendChild(opt);
      });
    }
  }

  // Мастера — заменяем текстовое поле на select с множественным выбором
  var masterWrap = document.getElementById('ord-masters-wrap');
  if (masterWrap) {
    masterWrap.innerHTML = '';
    employees.forEach(function(e) {
      var name = e['ФИО'] || e['Имя'] || '';
      if (!name) return;
      var label = document.createElement('label');
      label.className = 'master-checkbox';
      label.innerHTML =
        '<input type="checkbox" value="' + name + '" onchange="updateMastersField()"> ' + name;
      masterWrap.appendChild(label);
    });
  }

  // Загружаем справочник материалов — через initOrderForm
}

function toggleMastersDropdown(e) {
  e.stopPropagation();
  var dd = document.getElementById('masters-dropdown');
  if (!dd) return;
  var isOpen = dd.style.display !== 'none';
  if (isOpen) {
    dd.style.display = 'none';
    document.removeEventListener('click', closeMastersOnOutside);
  } else {
    dd.style.display = 'block';
    // Небольшая задержка чтобы этот же клик не закрыл сразу
    setTimeout(function() {
      document.addEventListener('click', closeMastersOnOutside);
    }, 100);
  }
}

function closeMastersOnOutside(e) {
  var dd = document.getElementById('masters-dropdown');
  if (!dd) return;
  // Если клик был внутри дропдауна — не закрываем
  if (dd.contains(e.target)) return;
  dd.style.display = 'none';
  document.removeEventListener('click', closeMastersOnOutside);
}

function updateMastersField() {
  var checked = [];
  document.querySelectorAll('#ord-masters-wrap input[type=checkbox]:checked').forEach(function(cb) {
    checked.push(cb.value);
  });
  var hidden = document.getElementById('ord-masters');
  if (hidden) hidden.value = checked.join(', ');
  // Обновляем метку кнопки
  var lbl = document.getElementById('ord-masters-label');
  if (lbl) lbl.textContent = checked.length ? checked.join(', ') : '— выбрать —';
  recalcOrderPreview();
}

function closeModalOnOverlay(e) {
  if (e.target === e.currentTarget) closeModal(e.currentTarget.id);
}

/* ===== СКЛАД (остатки материалов) ===== */
App._stock = [];

function loadInventory(force) {
  var tbody = document.getElementById('stock-tbody');
  if (!tbody) return;
  var hasCache = App._stock && App._stock.length;
  if (hasCache && !force) { renderStock(); }
  else if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="ct-loading"><div class="kpi-skeleton" style="min-height:40px;margin:4px 0"></div></td></tr>';

  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) {
        if (!hasCache) tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--danger)">' + (resp ? resp.error : 'Ошибка') + '</td></tr>';
        return;
      }
      App._stock = resp.data.items || [];
      var k = function(id, v){ var e = document.getElementById(id); if (e) e.textContent = v; };
      k('stock-kpi-count', resp.data.count);
      k('stock-kpi-low',   resp.data.lowCount);
      k('stock-kpi-value', money(resp.data.totalValue));
      renderStock();
    })
    .withFailureHandler(function(e) {
      if (!hasCache) tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--danger)">' + e.message + '</td></tr>';
    })
    .getStockList();
}

function renderStock() {
  var tbody  = document.getElementById('stock-tbody');
  var footer = document.getElementById('stock-footer');
  if (!tbody) return;
  var q       = (document.getElementById('stock-search') || {}).value || '';
  var lowOnly = (document.getElementById('stock-low-only') || {}).checked;
  q = q.toLowerCase();

  var list = (App._stock || []).filter(function(m) {
    if (lowOnly && !m.low) return false;
    if (q && !((m.name || '').toLowerCase().includes(q) || (m.category || '').toLowerCase().includes(q))) return false;
    return true;
  });

  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text2)">Ничего не найдено</td></tr>';
    if (footer) footer.textContent = '';
    return;
  }

  tbody.innerHTML = list.map(function(m) {
    var stockColor = m.low ? 'var(--danger)' : 'var(--text)';
    var lowBadge = m.low ? ' <span style="font-size:10px;background:var(--red-soft);color:var(--danger);padding:1px 6px;border-radius:8px">мало</span>' : '';
    var btn = function(label, type, color) {
      return '<button class="btn" onclick="openStockOp(\'' + m.id + '\',\'' + type + '\')" style="padding:3px 9px;font-size:11px;font-weight:600;background:' + color + ';border:1px solid var(--border);border-radius:6px;margin:0 2px">' + label + '</button>';
    };
    return '<tr>' +
      '<td style="font-weight:500">' + m.name + lowBadge + '</td>' +
      '<td style="font-size:12px;color:var(--text2)">' + m.category + '</td>' +
      '<td style="text-align:center;font-size:12px;color:var(--text2)">' + m.unit + '</td>' +
      '<td style="text-align:right;font-weight:700;color:' + stockColor + '">' + m.stock + '</td>' +
      '<td style="text-align:right;color:var(--text3)">' + (m.min || '—') + '</td>' +
      '<td style="text-align:right">' + money(m.value) + '</td>' +
      '<td style="text-align:center;white-space:nowrap">' +
        btn('+ Приход',   'receipt',  'var(--green-soft);color:var(--success)') +
        btn('− Списать',  'writeoff', 'var(--red-soft);color:var(--danger)') +
        btn('Коррекция',  'adjust',   'var(--bg-card2);color:var(--text)') +
      '</td>' +
    '</tr>';
  }).join('');
  if (footer) footer.textContent = 'Показано: ' + list.length + ' из ' + App._stock.length;
}

var STOCK_OP_META = {
  receipt:  { title: 'Приход на склад',     qtyLabel: 'Сколько добавить',          submit: 'Оприходовать' },
  writeoff: { title: 'Списание со склада',  qtyLabel: 'Сколько списать',           submit: 'Списать' },
  adjust:   { title: 'Коррекция остатка',   qtyLabel: 'Новый точный остаток',      submit: 'Установить' },
};

function openStockOp(matId, type) {
  var m = (App._stock || []).find(function(x){ return x.id === matId; });
  if (!m) return;
  var meta = STOCK_OP_META[type] || STOCK_OP_META.receipt;
  document.getElementById('stock-op-matid').value = matId;
  document.getElementById('stock-op-type').value  = type;
  document.getElementById('stock-op-title').textContent = meta.title;
  document.getElementById('stock-op-matname').textContent = m.name + ' · текущий остаток: ' + m.stock + ' ' + m.unit;
  document.getElementById('stock-op-qty-label').textContent = meta.qtyLabel + ' (' + m.unit + ')';
  document.getElementById('stock-op-qty').value = (type === 'adjust') ? m.stock : '';
  document.getElementById('stock-op-comment').value = '';
  document.getElementById('stock-op-submit').textContent = meta.submit;
  openModal('modal-stock-op');
}

function submitStockOp() {
  var matId   = document.getElementById('stock-op-matid').value;
  var type    = document.getElementById('stock-op-type').value;
  var qty     = Number(document.getElementById('stock-op-qty').value);
  var comment = document.getElementById('stock-op-comment').value.trim();
  var btn     = document.getElementById('stock-op-submit');
  if (isNaN(qty) || (type !== 'adjust' && qty <= 0)) { toast('Введите количество', 'error'); return; }
  if (btn) { btn.disabled = true; btn.textContent = '...'; }

  var done = function(resp) {
    if (btn) btn.disabled = false;
    if (!resp || !resp.ok) { toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); return; }
    toast('Готово: остаток ' + resp.data.stock, 'success');
    closeModal('modal-stock-op');
    loadInventory(true);
  };
  var fail = function(e){ if (btn) btn.disabled = false; toast('Ошибка: ' + e.message, 'error'); };

  var r = google.script.run.withSuccessHandler(done).withFailureHandler(fail);
  if (type === 'receipt')  r.stockReceipt(matId, qty, comment);
  else if (type === 'writeoff') r.stockWriteoff(matId, qty, comment, '');
  else r.stockAdjust(matId, qty, comment);
}

/* ===== КАЛЕНДАРЬ ЗАПИСЕЙ ===== */
App._apts = [];
App._aptDate = null;   // Date — выбранный день
App._aptView = 'day';  // 'day' | 'week'
App._aptPendingLink = null; // id записи, которую привязать к создаваемому заказу

var APT_WEEKDAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
var APT_STATUS_META = {
  'Запланирована': { cls: 'apt-st-plan', color: 'var(--accent)' },
  'Пришёл':        { cls: 'apt-st-came', color: 'var(--success)' },
  'Отменена':      { cls: 'apt-st-cancel', color: 'var(--text3)' },
};

function aptPad_(n){ return String(n).padStart(2,'0'); }
function aptFmtDmy(d){ return aptPad_(d.getDate())+'.'+aptPad_(d.getMonth()+1)+'.'+d.getFullYear(); }
function aptFmtIso(d){ return d.getFullYear()+'-'+aptPad_(d.getMonth()+1)+'-'+aptPad_(d.getDate()); }
function aptParseIso(s){ var m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }

// понедельник–воскресенье недели, содержащей d
function aptWeekRange(d) {
  var dow = (d.getDay() + 6) % 7; // 0 = понедельник
  var mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
  var sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
  return { mon: mon, sun: sun };
}

function loadAppointments(force) {
  if (!App._aptDate) App._aptDate = new Date();
  // переключаем контейнеры по виду
  var dayWrap  = document.getElementById('apt-day-wrap');
  var weekWrap = document.getElementById('apt-week');
  var isWeek = App._aptView === 'week';
  if (dayWrap)  dayWrap.style.display  = isWeek ? 'none' : '';
  if (weekWrap) weekWrap.style.display = isWeek ? '' : 'none';

  // синхронизируем поле даты и заголовок периода
  var dateInput = document.getElementById('apt-date');
  if (dateInput) dateInput.value = aptFmtIso(App._aptDate);
  var dt = document.getElementById('apt-daytitle');
  if (dt) {
    if (isWeek) { var r = aptWeekRange(App._aptDate); dt.textContent = aptFmtDmy(r.mon).slice(0,5) + ' – ' + aptFmtDmy(r.sun); }
    else dt.textContent = APT_WEEKDAYS[App._aptDate.getDay()];
  }

  // обеспечим список сотрудников для выпадашки мастеров
  if (!App.employees || !App.employees.length) {
    google.script.run.withSuccessHandler(function(resp){
      App.employees = (resp && resp.ok && resp.data) ? resp.data : [];
    }).getEmployees(true);
  }

  if (isWeek) {
    var rng = aptWeekRange(App._aptDate);
    if (weekWrap) weekWrap.innerHTML = '<div class="kpi-skeleton" style="min-height:120px"></div>';
    google.script.run
      .withSuccessHandler(function(resp){
        if (!resp || !resp.ok) { if (weekWrap) weekWrap.innerHTML = '<div style="text-align:center;padding:24px;color:var(--danger)">' + (resp ? resp.error : 'Ошибка') + '</div>'; return; }
        App._apts = resp.data || [];
        renderAptWeek(rng);
      })
      .withFailureHandler(function(e){ if (weekWrap) weekWrap.innerHTML = '<div style="text-align:center;padding:24px;color:var(--danger)">' + e.message + '</div>'; })
      .getAppointmentsRange(aptFmtDmy(rng.mon), aptFmtDmy(rng.sun));
    return;
  }

  var tbody = document.getElementById('apt-tbody');
  if (!tbody) return;
  tbody.innerHTML = '<tr><td colspan="7" class="ct-loading"><div class="kpi-skeleton" style="min-height:40px;margin:4px 0"></div></td></tr>';
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--danger)">' + (resp ? resp.error : 'Ошибка') + '</td></tr>';
        return;
      }
      App._apts = resp.data || [];
      renderAppointments();
    })
    .withFailureHandler(function(e){
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--danger)">' + e.message + '</td></tr>';
    })
    .getAppointments(aptFmtDmy(App._aptDate));
}

function setAptView(view) {
  if (App._aptView === view) return;
  App._aptView = view;
  var db = document.getElementById('apt-view-day');
  var wb = document.getElementById('apt-view-week');
  if (db) db.classList.toggle('active', view === 'day');
  if (wb) wb.classList.toggle('active', view === 'week');
  loadAppointments(true);
}

// Рендер недели: 7 колонок Пн–Вс, в каждой — чипы записей по времени
function renderAptWeek(rng) {
  var wrap = document.getElementById('apt-week');
  if (!wrap) return;
  var list = App._apts || [];
  var WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  var today = aptFmtDmy(new Date());

  // KPI (по всей неделе)
  var k = function(id, v){ var e = document.getElementById(id); if (e) e.textContent = v; };
  var active = list.filter(function(a){ return a.status !== 'Отменена'; });
  k('apt-kpi-count', list.length);
  k('apt-kpi-planned', list.filter(function(a){ return a.status === 'Запланирована'; }).length);
  k('apt-kpi-came', list.filter(function(a){ return a.status === 'Пришёл'; }).length);
  var mins = {}; active.forEach(function(a){ var m=a.master||'—'; mins[m]=(mins[m]||0)+(Number(a.duration)||0); });
  var mk = Object.keys(mins);
  k('apt-kpi-masters', mk.length ? mk.map(function(m){ return m+' · '+Math.round(mins[m]/60*10)/10+'ч'; }).join(', ') : '—');

  var html = '';
  for (var i = 0; i < 7; i++) {
    var day = new Date(rng.mon.getFullYear(), rng.mon.getMonth(), rng.mon.getDate() + i);
    var dmy = aptFmtDmy(day);
    var dayApts = list.filter(function(a){ return a.date === dmy; })
                      .sort(function(a,b){ return (a.time||'').localeCompare(b.time||''); });
    var isToday = dmy === today;
    var chips = dayApts.map(function(a){
      var meta = APT_STATUS_META[a.status] || APT_STATUS_META['Запланирована'];
      var cancelled = a.status === 'Отменена';
      return '<div class="apt-chip ' + meta.cls + (cancelled ? ' apt-chip-cancel' : '') + '" onclick="openEditAppointment(\'' + a.id + '\')" title="' + (a.service||'') + ' · ' + (a.master||'') + '">' +
        '<b>' + (a.time||'') + '</b> ' + (a.client||'—') +
        (a.master ? '<div class="apt-chip-sub">' + a.master + '</div>' : '') +
      '</div>';
    }).join('');
    html += '<div class="apt-week-day' + (isToday ? ' apt-week-today' : '') + '">' +
      '<div class="apt-week-head" onclick="aptOpenDay(\'' + aptFmtIso(day) + '\')" title="Открыть день">' +
        '<span>' + WD[i] + ' ' + dmy.slice(0,5) + '</span>' +
        (dayApts.length ? '<span class="apt-week-cnt">' + dayApts.length + '</span>' : '') +
      '</div>' +
      '<div class="apt-week-body">' + (chips || '<div class="apt-week-empty">—</div>') + '</div>' +
      '<button class="apt-week-add" onclick="aptAddOnDay(\'' + aptFmtIso(day) + '\')">+ запись</button>' +
    '</div>';
  }
  wrap.innerHTML = html;
}

// клик по заголовку дня в неделе → перейти в дневной вид этого дня
function aptOpenDay(iso) {
  var d = aptParseIso(iso); if (!d) return;
  App._aptDate = d;
  setAptView('day');
}
// «+ запись» в дне недели → открыть модал с этой датой
function aptAddOnDay(iso) {
  var d = aptParseIso(iso); if (d) App._aptDate = d;
  openNewAppointment();
}

function renderAppointments() {
  var tbody  = document.getElementById('apt-tbody');
  var footer = document.getElementById('apt-footer');
  if (!tbody) return;
  var list = App._apts || [];

  // KPI
  var k = function(id, v){ var e = document.getElementById(id); if (e) e.textContent = v; };
  var planned = list.filter(function(a){ return a.status === 'Запланирована'; }).length;
  var came    = list.filter(function(a){ return a.status === 'Пришёл'; }).length;
  k('apt-kpi-count', list.length);
  k('apt-kpi-planned', planned);
  k('apt-kpi-came', came);
  // занятость мастеров — сумма минут по активным (не отменённым) записям
  var byMaster = {};
  list.forEach(function(a){
    if (a.status === 'Отменена') return;
    var m = a.master || '—';
    byMaster[m] = (byMaster[m] || 0) + (Number(a.duration) || 0);
  });
  var masters = Object.keys(byMaster);
  k('apt-kpi-masters', masters.length
    ? masters.map(function(m){ return m + ' · ' + Math.round(byMaster[m]/60*10)/10 + 'ч'; }).join(', ')
    : '—');

  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:28px;color:var(--text2)">На этот день записей нет. <a href="#" onclick="openNewAppointment();return false" style="color:var(--accent)">Добавить запись</a></td></tr>';
    if (footer) footer.textContent = '';
    return;
  }

  tbody.innerHTML = list.map(function(a){
    var meta = APT_STATUS_META[a.status] || APT_STATUS_META['Запланирована'];
    var cancelled = a.status === 'Отменена';
    var badge = '<span class="apt-badge ' + meta.cls + '">' + a.status + '</span>';
    var orderLink = a.orderId ? ' <span style="font-size:10px;color:var(--text3)">→' + a.orderId + '</span>' : '';
    var acts = '';
    if (a.status === 'Запланирована') {
      acts += '<button class="apt-act" style="background:var(--green-soft);color:var(--success)" onclick="aptSetStatus(\'' + a.id + '\',\'Пришёл\')" title="Отметить приход">Пришёл</button>';
      acts += '<button class="apt-act" style="background:var(--bg-card2);color:var(--text2)" onclick="aptSetStatus(\'' + a.id + '\',\'Отменена\')" title="Отменить">✕</button>';
    } else {
      acts += '<button class="apt-act" style="background:var(--bg-card2);color:var(--text2)" onclick="aptSetStatus(\'' + a.id + '\',\'Запланирована\')" title="Вернуть в план">↩</button>';
    }
    if (!cancelled && !a.orderId) {
      acts += '<button class="apt-act" style="background:rgba(0,184,212,.14);color:var(--accent)" onclick="orderFromAppointment(\'' + a.id + '\')" title="Создать заказ из записи">→ Заказ</button>';
    }
    acts += '<button class="apt-act" style="background:var(--bg-card2);color:var(--text)" onclick="openEditAppointment(\'' + a.id + '\')" title="Редактировать">✎</button>';
    acts += '<button class="apt-act" style="background:var(--red-soft);color:var(--danger)" onclick="aptDelete(\'' + a.id + '\')" title="Удалить">🗑</button>';
    var rowStyle = cancelled ? 'opacity:.55;text-decoration:line-through' : '';
    return '<tr style="' + rowStyle + '">' +
      '<td style="font-weight:700">' + (a.time || '—') + '<div style="font-size:10px;color:var(--text3);font-weight:400">' + (a.duration || 60) + ' мин</div></td>' +
      '<td><div style="font-weight:500">' + (a.client || '—') + orderLink + '</div>' + (a.phone ? '<div style="font-size:11px;color:var(--text3)">' + a.phone + '</div>' : '') + '</td>' +
      '<td style="font-size:12px;color:var(--text2)">' + (a.car || '—') + '</td>' +
      '<td style="font-size:13px">' + (a.service || '—') + '</td>' +
      '<td style="font-size:13px">' + (a.master || '<span style="color:var(--text3)">не назначен</span>') + '</td>' +
      '<td style="text-align:center">' + badge + '</td>' +
      '<td style="text-align:center;white-space:nowrap">' + acts + '</td>' +
    '</tr>';
  }).join('');
  if (footer) footer.textContent = 'Всего записей: ' + list.length;
}

function aptShift(delta) {
  if (!App._aptDate) App._aptDate = new Date();
  var step = App._aptView === 'week' ? 7 : 1;
  App._aptDate = new Date(App._aptDate.getFullYear(), App._aptDate.getMonth(), App._aptDate.getDate() + delta * step);
  loadAppointments(true);
}
function aptGoToday() { App._aptDate = new Date(); loadAppointments(true); }
function aptOnDatePick() {
  var v = (document.getElementById('apt-date') || {}).value;
  var d = aptParseIso(v);
  if (d) { App._aptDate = d; loadAppointments(true); }
}

function aptFillFormLists() {
  // мастера — из сотрудников (приоритет оклейщик/тонировщик, иначе все)
  var sel = document.getElementById('apt-f-master');
  if (sel) {
    var emps = App.employees || [];
    var prev = sel.value;
    sel.innerHTML = '<option value="">— выбрать —</option>';
    var add = function(list){ list.forEach(function(e){
      var name = e['ФИО'] || e['Имя'] || '';
      if (!name) return;
      var o = document.createElement('option'); o.value = name; o.textContent = name; sel.appendChild(o);
    }); };
    var masters = emps.filter(function(e){
      var roles = (e['Основная должность'] || '') + ',' + (e['Доп. роли'] || '');
      return /оклейщик|тонировщик|мастер/i.test(roles);
    });
    add(masters.length ? masters : emps);
    sel.value = prev;
  }
  // клиенты — datalist
  var dl = document.getElementById('apt-clients-list');
  if (dl) {
    dl.innerHTML = '';
    (App.clients || []).forEach(function(c){
      var name = c['ФИО'] || c['Название организации'] || c['Имя'] || '';
      if (!name) return;
      var o = document.createElement('option'); o.value = name; dl.appendChild(o);
    });
  }
  // услуги — datalist из каталога (white-label)
  var sdl = document.getElementById('apt-services-list');
  if (sdl) {
    var svc = ((App.config && App.config.services) || []).filter(function(s){ return s.active !== false; });
    if (svc.length) sdl.innerHTML = svc.map(function(s){ return '<option value="' + s.name + '"></option>'; }).join('');
  }
}

// подставить телефон/авто, если ввели имя существующего клиента
function aptClientHint() {
  var name = (document.getElementById('apt-f-client') || {}).value || '';
  if (!name) return;
  var c = (App.clients || []).find(function(x){

function openNewAppointment() {
  document.getElementById('apt-modal-title').textContent = 'Новая запись';
  document.getElementById('apt-f-submit').textContent = 'Создать запись';
  document.getElementById('apt-id').value = '';
  document.getElementById('apt-f-date').value = aptFmtIso(App._aptDate || new Date());
  document.getElementById('apt-f-time').value = '';
  document.getElementById('apt-f-duration').value = 60;
  document.getElementById('apt-f-client').value = '';
  document.getElementById('apt-f-phone').value = '';
  document.getElementById('apt-f-car').value = '';
  document.getElementById('apt-f-service').value = '';
  document.getElementById('apt-f-comment').value = '';
  // подгрузим клиентов, если их ещё нет (для подсказок)
  if (!App.clients || !App.clients.length) {
    google.script.run.withSuccessHandler(function(resp){
      App.clients = (resp && resp.ok && resp.data) ? resp.data : [];
      aptFillFormLists();
    }).getClients({});
  }
  aptFillFormLists();
  document.getElementById('apt-f-master').value = '';
  openModal('modal-appointment');
}

function openEditAppointment(id) {
  var a = (App._apts || []).find(function(x){ return String(x.id) === String(id); });
  if (!a) return;
  document.getElementById('apt-modal-title').textContent = 'Редактирование записи';
  document.getElementById('apt-f-submit').textContent = 'Сохранить';
  document.getElementById('apt-id').value = a.id;
  var d = a.date ? a.date.split('.') : null;
  document.getElementById('apt-f-date').value = (d && d.length === 3) ? (d[2]+'-'+d[1]+'-'+d[0]) : aptFmtIso(App._aptDate || new Date());
  document.getElementById('apt-f-time').value = a.time || '';
  document.getElementById('apt-f-duration').value = a.duration || 60;
  document.getElementById('apt-f-client').value = a.client || '';
  document.getElementById('apt-f-phone').value = a.phone || '';
  document.getElementById('apt-f-car').value = a.car || '';
  document.getElementById('apt-f-service').value = a.service || '';
  document.getElementById('apt-f-comment').value = a.comment || '';
  aptFillFormLists();
  document.getElementById('apt-f-master').value = a.master || '';

}

function submitAppointment() {
  var id = document.getElementById('apt-id').value;
  var isoDate = document.getElementById('apt-f-date').value;
  var d = aptParseIso(isoDate);
  var payload = {
    date:     d ? aptFmtDmy(d) : '',
    time:     document.getElementById('apt-f-time').value.trim(),
    duration: Number(document.getElementById('apt-f-duration').value) || 60,
    client:   document.getElementById('apt-f-client').value.trim(),
    phone:    document.getElementById('apt-f-phone').value.trim(),
    car:      document.getElementById('apt-f-car').value.trim(),
    service:  document.getElementById('apt-f-service').value.trim(),
    master:   document.getElementById('apt-f-master').value,
    comment:  document.getElementById('apt-f-comment').value.trim(),
  };
  if (!payload.date) { toast('Укажите дату', 'error'); return; }
  if (!payload.time) { toast('Укажите время', 'error'); return; }
  if (!payload.client) { toast('Укажите клиента', 'error'); return; }

  var btn = document.getElementById('apt-f-submit');
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  var done = function(resp){
    if (btn) btn.disabled = false;
    if (!resp || !resp.ok) { toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); if (btn) btn.textContent = id ? 'Сохранить' : 'Создать запись'; return; }
    toast(id ? 'Запись обновлена' : 'Запись создана', 'success');
    closeModal('modal-appointment');
    // если сохранили на просматриваемый день — перезагрузим; иначе перейдём на день записи
    var savedDate = aptParseIso(isoDate);
    if (savedDate) App._aptDate = savedDate;
    loadAppointments(true);
  };
  var fail = function(e){ if (btn) { btn.disabled = false; btn.textContent = id ? 'Сохранить' : 'Создать запись'; } toast('Ошибка: ' + e.message, 'error'); };

  var r = google.script.run.withSuccessHandler(done).withFailureHandler(fail);
  if (id) r.updateAppointment(id, payload);
  else r.createAppointment(payload);
}

function aptSetStatus(id, status) {
  // оптимистично
  var a = (App._apts || []).find(function(x){ return String(x.id) === String(id); });
  var prev = a ? a.status : null;
  if (a) { a.status = status; renderAppointments(); }
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) { if (a) { a.status = prev; renderAppointments(); } toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); }
    })
    .withFailureHandler(function(e){ if (a) { a.status = prev; renderAppointments(); } toast('Ошибка: ' + e.message, 'error'); })
    .setAppointmentStatus(id, status);
}

function aptDelete(id) {
  var a = (App._apts || []).find(function(x){ return String(x.id) === String(id); });
  uiConfirm('Удалить запись' + (a ? ' «' + a.client + ' ' + a.time + '»' : '') + '?', function(){
    google.script.run
      .withSuccessHandler(function(resp){
        if (!resp || !resp.ok) { toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); return; }
        toast('Запись удалена', 'success');
        loadAppointments(true);
      })
      .withFailureHandler(function(e){ toast('Ошибка: ' + e.message, 'error'); })
      .deleteAppointment(id);
  });
}

// Создать заказ из записи: открыть форму заказа с предзаполнением; после создания
// запись привяжется к заказу (App._aptPendingLink обрабатывается в обработчике createOrder).
function orderFromAppointment(aptId) {
  var a = (App._apts || []).find(function(x){ return String(x.id) === String(aptId); });
  if (!a) return;
  App._aptPendingLink = a.id;
  openModal('modal-new-order');
  var setVal = function(id, v){ var e = document.getElementById(id); if (e) e.value = v || ''; };
  setVal('ord-client-name', a.client);
  setVal('ord-client-phone', a.phone);
  setVal('ord-car', a.car);
  setVal('ord-client-id', '');
  // попытка подобрать услугу в select
  var svc = document.getElementById('ord-service');
  if (svc && a.service) {
    var s = a.service.toLowerCase();
    for (var i = 0; i < svc.options.length; i++) {
      var t = (svc.options[i].textContent || '').toLowerCase();
      if (t && (t.indexOf(s) >= 0 || s.indexOf(t) >= 0)) { svc.selectedIndex = i; break; }
    }
  }
  toast('Запись подставлена. Укажите стоимость и сохраните — заказ привяжется к записи.', 'success');
}

function applyBrand(brand) {
  if (!brand) return;
  App.brand = brand;
  if (brand.currency && CURRENCY_SYMBOLS[brand.currency]) CUR = CURRENCY_SYMBOLS[brand.currency];
  // Статичные подписи валюты в формах (<span class="cur">) — под выбранную валюту
  document.querySelectorAll('.cur').forEach(function(el){ el.textContent = CUR; });
  var nm = document.getElementById('brand-name');
  if (nm) nm.textContent = brand.companyName || 'SPRauto';
  var sl = document.getElementById('brand-slogan');
  if (sl) sl.textContent = brand.companySlogan || 'ERP';
  if (brand.logoDataUrl) {
    var wrap = document.getElementById('brand-logo-wrap');
    if (wrap) wrap.innerHTML = '<img class="logo-img" src="'+brand.logoDataUrl+'" alt="Logo">';
  }
  if (brand.accentColor) {
    document.documentElement.style.setProperty('--accent', brand.accentColor);
    document.documentElement.style.setProperty('--accent-soft', brand.accentColor + '20');
    document.documentElement.style.setProperty('--accent-glow', brand.accentColor + '45');
  }
  document.title = (brand.companyName || 'SPRauto') + ' ERP';
}

/* ===== ЗАГРУЗКА СТРАНИЦ ===== */
function loadCurrentPage() {
  refreshSync();
  // force = принудительное обновление (кнопка «Обновить»); иначе кэш-аware загрузчики
  // рисуют из кэша мгновенно и обновляются в фоне
  var force = !!App._forceReload;
  App._forceReload = false;
  if (App.currentPage === 'dashboard') renderDashboard();
  if (App.currentPage === 'team')      loadTeam(force);
  if (App.currentPage === 'clients')   loadClients(force);
  if (App.currentPage === 'orders')    loadOrders(force);
  if (App.currentPage === 'materials') loadMaterials(force);
  if (App.currentPage === 'inventory') loadInventory(force);
  if (App.currentPage === 'appointments') loadAppointments(force);
  if (App.currentPage === 'settings')  loadSettings();
  if (App.currentPage === 'expenses')  loadExpenses();
  if (App.currentPage === 'finance')   loadFinance();
  if (App.currentPage === 'debt')      loadDebt();
  if (App.currentPage === 'services')  loadServices();

function loadClients(force) {
  var tbody = document.getElementById('clients-tbody');
  var err = document.getElementById('clients-error');
  if (!tbody) return;
  if (err) err.style.display = 'none';

  var hasCache = App.clients && App.clients.length;
  if (hasCache && !force) {
    renderClients(App.clients);
  } else {
    tbody.innerHTML = '<tr><td colspan="8" class="ct-loading">' +
      '<div class="kpi-skeleton" style="min-height:48px;margin:4px 0;"></div>'.repeat(4) +
      '</td></tr>';
  }

  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) {
        if (!hasCache) {
          tbody.innerHTML = '';
          if (err) { err.style.display = 'flex'; var t1 = document.getElementById('clients-error-text'); if (t1) t1.textContent = 'Ошибка: ' + (resp ? resp.error : 'нет данных'); }
        }
        return;
      }
      App.clients = resp.data || [];
      App._vehicleMap = {};
      renderClients(App.clients);
    })
    .withFailureHandler(function(e){
      if (!hasCache) {
        tbody.innerHTML = '';
        if (err) { err.style.display = 'flex'; var t2 = document.getElementById('clients-error-text'); if (t2) t2.textContent = 'Ошибка: ' + e.message; }
      }
    })
    .getClients({});
}

/* ===== КЛИЕНТЫ: ФИЛЬТР ===== */
function setClientFilter(type, btn) {
  App._clientFilter = type;
  document.querySelectorAll('.filter-tab').forEach(function(b){ b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  filterClients();
}

function filterClients() {
  var search = (document.getElementById('clients-search') || {}).value || '';
  var sourceFilter = (document.getElementById('clients-source-filter') || {}).value || '';
  var q = search.toLowerCase();

  var filtered = App.clients.filter(function(c) {
    if (App._clientFilter !== 'all' && c['Тип'] !== App._clientFilter) return false;
    if (sourceFilter && c['Источник лида'] !== sourceFilter) return false;
    if (q) {
      var name  = String(c['Имя'] || '').toLowerCase();
      var phone = String(c['Телефон'] || '').toLowerCase();
      var auto  = String(c['_autoLabel'] || '').toLowerCase();
      if (!name.includes(q) && !phone.includes(q) && !auto.includes(q)) return false;
    }
    return true;
  });

  var sort = App._clientSort;
  if (sort && sort.key) {
    filtered = filtered.slice().sort(function(a, b) {
      var av, bv;
      if (sort.key === 'name')   { av = String(a['Имя'] || ''); bv = String(b['Имя'] || ''); return sort.dir * av.localeCompare(bv, 'ru'); }
      if (sort.key === 'orders') { av = Number(a['Всего заказов'] || 0); bv = Number(b['Всего заказов'] || 0); return sort.dir * (av - bv); }
      if (sort.key === 'sum')    { av = Number(a['Сумма заказов'] || 0); bv = Number(b['Сумма заказов'] || 0); return sort.dir * (av - bv); }
      return 0;
    });
  }

  renderClientsTable(filtered);
}

/* ===== КЛИЕНТЫ: СОРТИРОВКА ===== */
function sortClients(key) {
  var sort = App._clientSort;
  if (sort.key === key) { sort.dir *= -1; } else { sort.key = key; sort.dir = 1; }

  ['name', 'orders', 'sum'].forEach(function(k) {
    var el = document.getElementById('sort-icon-' + k);
    if (!el) return;
    el.className = 'ct-sort-icon' + (k === key ? ' active' : '');
    el.textContent = k === key ? (sort.dir === 1 ? '↑' : '↓') : '↕';
  });

  filterClients();
}

/* ===== КЛИЕНТЫ: СТАТИСТИКА ===== */
function renderClientsKpi(clients) {
  var total = clients.length;
  var fiz   = clients.filter(function(c){ return c['Тип'] === 'физ'; }).length;
  var yur   = clients.filter(function(c){ return c['Тип'] === 'юр'; }).length;
  var sum   = clients.reduce(function(acc, c){ return acc + (Number(c['Сумма заказов']) || 0); }, 0);

  function set(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; }
  set('ckpi-total', total);
  set('ckpi-fiz',   fiz);
  set('ckpi-yur',   yur);
  set('ckpi-sum',   sum ? sum.toLocaleString('ru') + ' ' + CUR : '—');
}

/* ===== КЛИЕНТЫ: ФИЛЬТР ИСТОЧНИКОВ ===== */
function fillClientsSourceFilter(clients) {
  var sel = document.getElementById('clients-source-filter');
  if (!sel) return;
  var sources = {};
  clients.forEach(function(c){ if (c['Источник лида']) sources[c['Источник лида']] = 1; });
  var keys = Object.keys(sources).sort();
  sel.innerHTML = '<option value="">Все источники</option>';
  keys.forEach(function(s) {
    var o = document.createElement('option');
    o.value = s; o.textContent = s;
    sel.appendChild(o);
  });
}

function renderClientsTable(clients) {
  var tbody = document.getElementById('clients-tbody');
  var footer = document.getElementById('clients-table-footer');

  // Рендер карточек
  var cardsWrap = document.getElementById('clients-cards-wrap');

  if (!clients || clients.length === 0) {
    var emptyHtml =
      '<div class="ct-empty">' +
        '<div class="ct-empty-icon">👤</div>' +
        '<div class="ct-empty-title">Нет клиентов</div>' +
        '<div class="ct-empty-sub">Попробуйте изменить фильтр или добавьте первого клиента</div>' +
      '</div>';
    if (tbody) tbody.innerHTML = '<tr><td colspan="8">' + emptyHtml + '</td></tr>';
    if (cardsWrap) cardsWrap.innerHTML = emptyHtml;
    if (footer) footer.textContent = 'Нет записей';
    return;
  }

  clients.forEach(function(c) {
    var id        = c['ID'] || '';
    var name      = c['Имя'] || '—';
    var type      = c['Тип'] || 'физ';
    var phone     = c['Телефон'] || '';
    var source    = c['Источник лида'] || '—';
    var orders    = Number(c['Всего заказов']) || 0;
    var sum       = Number(c['Сумма заказов']) || 0;
    var autoLabel = c['_autoLabel'] || '—';
    var isYur     = type === 'юр';
    var sumStr    = sum ? sum.toLocaleString('ru') + ' ' + CUR : '—';

    var ini = name.split(' ').slice(0,2).map(function(s){
      return (s && s[0] ? s[0].toUpperCase() : '');
    }).join('');

    var avClass    = isYur ? 'ct-av-yur' : 'ct-av-fiz';
    var badgeClass = isYur ? 'badge badge-yur' : 'badge badge-fiz';
    var typeLabel  = isYur ? 'Юр.' : 'Физ.';

    c['_ini']       = ini;
    c['_avClass']   = avClass;
    c['_badge']     = badgeClass;
    c['_typeLabel'] = typeLabel;
    c['_sumStr']    = sumStr;
    c['_autoLabel'] = autoLabel;
    c['_phone']     = phone;
    c['_source']    = source;
    c['_orders']    = orders;
  });

  // ── ТАБЛИЦА ──
  if (tbody) {
    tbody.innerHTML = clients.map(function(c) {
      var id = c['ID'] || '';
      return '<tr onclick="openClientCard(\'' + id + '\')">' +
        '<td><div class="ct-name-cell">' +
          '<div class="ct-avatar ' + c['_avClass'] + '">' + c['_ini'] + '</div>' +
          '<span class="ct-client-name">' + (c['Имя'] || '—') + '</span>' +
        '</div></td>' +
        '<td><span class="' + c['_badge'] + '">' + c['_typeLabel'] + '</span></td>' +
        '<td style="color:var(--text2);font-size:12.5px;">' + c['_phone'] + '</td>' +
        '<td style="color:var(--text2);font-size:12px;">' + c['_autoLabel'] + '</td>' +
        '<td style="color:var(--text3);font-size:12px;">' + c['_source'] + '</td>' +
        '<td style="text-align:center;font-weight:600;">' + c['_orders'] + '</td>' +
        '<td style="font-weight:600;">' + c['_sumStr'] + '</td>' +
        '<td><div class="ct-actions">' +
          '<button class="ct-action-btn" title="Карточка" onclick="event.stopPropagation();openClientCard(\'' + id + '\')">👤</button>' +
          '<button class="ct-action-btn" title="Редактировать" onclick="event.stopPropagation();openClientCardAndEdit(\'' + id + '\')">✏️</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }

  // ── КАРТОЧКИ ──
  if (cardsWrap) {
    cardsWrap.innerHTML = clients.map(function(c) {
      var id = c['ID'] || '';
      return '<div class="client-row" onclick="openClientCard(\'' + id + '\')">' +
        '<div class="ct-avatar ' + c['_avClass'] + '" style="width:40px;height:40px;font-size:14px;flex-shrink:0;">' + c['_ini'] + '</div>' +
        '<div class="client-info">' +
          '<div class="client-name">' +
            (c['Имя'] || '—') +
            ' <span class="' + c['_badge'] + '">' + c['_typeLabel'] + '</span>' +
          '</div>' +
          '<div class="client-meta">' +
            (c['_phone'] ? '<span>📞 ' + c['_phone'] + '</span>' : '') +
            (c['_source'] !== '—' ? '<span>📍 ' + c['_source'] + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="client-stats">' +
          '<div class="client-stat"><div class="client-stat-val">' + c['_orders'] + '</div><div class="client-stat-lbl">заказов</div></div>' +
          '<div class="client-stat"><div class="client-stat-val">' + c['_sumStr'] + '</div><div class="client-stat-lbl">сумма</div></div>' +
        '</div>' +
        '<div class="client-arrow">›</div>' +
      '</div>';
    }).join('');
  }

  if (footer) {
    footer.textContent = 'Показано ' + clients.length + ' из ' + App.clients.length;
  }
}

function submitNewClient() {
  var type = App._newClientType || 'физ';
  var isLegal = type === 'юр';

  var name = isLegal
    ? document.getElementById('cl-org-name').value.trim()
    : document.getElementById('cl-fio').value.trim();

  if (!name) {
    toast(isLegal ? 'Укажи название организации' : 'Укажи ФИО', 'error');
    return;
  }

  var payload = {
    type: type,
    name: name,
    phone: isLegal ? document.getElementById('cl-legal-phone').value.trim() : document.getElementById('cl-phone').value.trim(),
    email: isLegal ? document.getElementById('cl-legal-email').value.trim() : document.getElementById('cl-email').value.trim(),
    leadSource: document.getElementById('cl-source').value,
    notes: document.getElementById('cl-notes').value.trim()
  };

  if (isLegal) {
    payload.unp = document.getElementById('cl-unp').value.trim();
    payload.director = document.getElementById('cl-director').value.trim();
    payload.contactPerson = document.getElementById('cl-contact').value.trim();
    payload.legalAddress = document.getElementById('cl-address').value.trim();
    payload.bankDetails = document.getElementById('cl-bank').value.trim();
  } else {
    payload.passport = document.getElementById('cl-passport').value.trim();
  }

  var btn = document.getElementById('cl-submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Сохраняем...'; }
  toast('Сохраняем клиента...', 'info');

  google.script.run
    .withSuccessHandler(function(resp){
      if (btn) { btn.disabled = false; btn.textContent = 'Сохранить клиента'; }
      if (!resp || !resp.ok) {
        toast('Ошибка: ' + (resp ? resp.error : 'нет ответа'), 'error');
        return;
      }

      var clientId = resp.data ? resp.data['ID'] : null;
      var clientName = resp.data ? resp.data['Имя'] : name;

      var carBrand = document.getElementById('cl-car-brand').value.trim();
      var carModel = document.getElementById('cl-car-model').value.trim();
      if (carBrand && clientId) {
        google.script.run
          .withSuccessHandler(function(){ toast('✅ Клиент и авто сохранены', 'success'); })
          .withFailureHandler(function(){ toast('✅ Клиент сохранён (авто не добавлено)', 'success'); })
          .createVehicle({
            clientId: clientId,
            brand: carBrand,
            model: carModel,
            plate: document.getElementById('cl-car-plate').value.trim(),
            vin: document.getElementById('cl-car-vin').value.trim()
          });
      } else {
        toast('✅ ' + clientName + ' добавлен', 'success');
      }

      closeModal('modal-new-client');
      ['cl-fio','cl-phone','cl-email','cl-passport','cl-org-name','cl-unp',
       'cl-legal-phone','cl-legal-email','cl-director','cl-contact','cl-address',
       'cl-bank','cl-car-brand','cl-car-model','cl-car-plate','cl-car-vin','cl-notes'].forEach(function(id){
        var el = document.getElementById(id);
        if (el) el.value = '';
      });
      document.getElementById('cl-source').value = '';
      App._newClientType = 'физ';
      document.getElementById('client-phys-fields').style.display = 'block';
      document.getElementById('client-legal-fields').style.display = 'none';

      if (App.currentPage === 'clients') loadClients();
    })
    .withFailureHandler(function(e){
      if (btn) { btn.disabled = false; btn.textContent = 'Сохранить клиента'; }
      toast('Ошибка: ' + e.message, 'error');
    })
    .createClient(payload);
}

function renderTeam(employees) {
  var grid = document.getElementById('team-grid');
  if (!grid) return;
  if (!employees || !employees.length) {
    grid.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text3);grid-column:1/-1;">' +
      '<div style="font-size:48px;margin-bottom:12px;">👥</div>' +
      '<div style="font-size:15px;font-weight:600;">Нет сотрудников</div>' +
      '</div>';
    return;
  }
  var cards = employees.map(function(e, idx) {
    var fio = e['ФИО'] || '—';
    var status = e['Статус'] || '—';
    var pos = e['Основная должность'] || '—';
    var salary = e['Базовая ставка'] || 0;
    var bonus = e['% бонуса'] || 0;
    var phone = e['Телефон'] || '';
    var ini = fio.split(' ').slice(0,2).map(function(s){ return (s&&s[0]?s[0].toUpperCase():''); }).join('');
    var isActive = (status === 'Работает');
    var sc = isActive ? 'status-work' : status === 'Отпуск' ? 'status-vacation' : 'status-off';
    return '<div class="team-card" data-team-idx="'+idx+'">' +
      '<div class="team-status '+sc+'">'+status+'</div>' +
      '<div class="team-head"><div class="team-avatar">'+ini+'</div>' +
      '<div><div class="team-name">'+fio+'</div><div class="team-role">'+pos+'</div>' +
      (phone?'<div class="team-role" style="margin-top:2px;">'+phone+'</div>':'') +
      '</div></div>' +
      '<div class="team-stats">' +
        '<div class="team-stat"><div class="team-stat-label">Ставка</div><div class="team-stat-value">'+Number(salary).toLocaleString('ru')+' ' + CUR + '</div></div>' +
        '<div class="team-stat"><div class="team-stat-label">% бонуса</div><div class="team-stat-value">'+bonus+'%</div></div>' +
      '</div>' +
      '<div style="display:flex;gap:6px;margin-top:10px;">' +
        '<button class="btn btn-secondary btn-sm" style="flex:1;" data-action="edit">✏️ Изменить</button>' +
        '<button class="btn btn-sm" style="flex:1;background:'+(isActive?'var(--red-soft)':'var(--green-soft)')+';color:'+(isActive?'var(--red)':'var(--green)')+';border:1px solid '+(isActive?'rgba(231,76,60,0.2)':'rgba(46,204,113,0.2)')+'" data-action="toggle">'+(isActive?'🔴 Отключить':'🟢 Восстановить')+'</button>' +
      '</div>' +
    '</div>';
  }).join('');

  grid.innerHTML = cards;

  // Делегирование событий: один обработчик на контейнер, навешивается ОДИН раз.
  // Так клики работают для любых перерисованных карточек и не зависят от
  // повторного навешивания слушателей на каждую кнопку (что ломалось в sandbox GAS).
  if (!grid._teamHandlerBound) {
    grid.addEventListener('click', function(ev) {
      // Ищем нажатую кнопку с data-action (клик мог прийти по тексту/эмодзи внутри неё)
      var btn = ev.target;
      while (btn && btn !== grid && !(btn.getAttribute && btn.getAttribute('data-action'))) {
        btn = btn.parentNode;
      }
      if (!btn || btn === grid) return;

      var action = btn.getAttribute('data-action');

      // Находим карточку и её индекс
      var card = btn;
      while (card && card !== grid && !(card.getAttribute && card.getAttribute('data-team-idx'))) {
        card = card.parentNode;
      }
      if (!card || card === grid) return;
      var idx = parseInt(card.getAttribute('data-team-idx'), 10);

      ev.stopPropagation();
      if (action === 'edit')   openEditEmployee(idx);
      if (action === 'toggle') toggleEmployeeStatus(idx);
    });
    grid._teamHandlerBound = true;
  }
}

function setupStatusHtml_(st) {
  if (!st) return '';
  var rows = (st.sheets || []).map(function(s) {
    var ok = s.exists && (!s.missing || s.missing.length === 0);
    var icon = ok ? '<span style="color:var(--success)">✓</span>' : (s.exists ? '<span style="color:var(--warning)">⚠</span>' : '<span style="color:var(--danger)">✗</span>');
    var note = !s.exists ? ' <span style="color:var(--danger)">— нет листа</span>'
             : (s.missing && s.missing.length ? ' <span style="color:var(--warning)">— нет колонок: ' + s.missing.join(', ') + '</span>'
             : ' <span style="color:var(--text3)">· строк: ' + (s.rows||0) + '</span>');
    return '<div style="padding:1px 0">' + icon + ' ' + s.name + note + '</div>';
  }).join('');
  var head = st.ready
    ? '<div style="color:var(--success);font-weight:600;margin-bottom:6px">✓ База готова к работе</div>'
    : '<div style="color:var(--warning);font-weight:600;margin-bottom:6px">⚠ Требуется настройка: проблемных листов ' + st.issuesCount + '</div>';
  return head + rows;
}

  var tbody = document.getElementById('orders-tbody');

function loadOrdersKpi() {
  // KPI считаем из уже загруженного App.orders — без отдельного round-trip к серверу.
  // Логика 1-в-1 повторяет бывший getOrdersStats (всего/выручка по ВСЕМ заказам,
  // включая отменённые; в работе = «В работе» или «Новый»).
  var list = App.orders || [];
  var totalCount = 0, totalRevenue = 0, inWork = 0;
  list.forEach(function(o) {
    if (!o['ID']) return;
    totalCount++;
    totalRevenue += Number(o['Стоимость заказа']) || 0;
    if (o['Статус'] === 'В работе' || o['Статус'] === 'Новый') inWork++;
  });
  var avg = totalCount > 0 ? totalRevenue / totalCount : 0;
  var fmt = function(n){ return Math.round(n).toLocaleString('ru') + ' ' + CUR; };
  var el = function(id, v){ var e = document.getElementById(id); if(e) e.textContent = v; };
  el('okpi-total',   totalCount);
  el('okpi-revenue', fmt(totalRevenue));
  el('okpi-avg',     fmt(avg));
  el('okpi-inwork',  inWork);
  updateOrderTabCounts();
}

// Счётчики на вкладках фильтра по статусам (всего по каждому статусу, без учёта поиска).
function updateOrderTabCounts() {
  var list = (App.orders || []).filter(function(o){ return o['ID']; });
  var counts = { all: list.length };
  list.forEach(function(o){ var s = o['Статус'] || ''; counts[s] = (counts[s] || 0) + 1; });
  document.querySelectorAll('#orders-status-tabs .tab-cnt').forEach(function(span){
    var key = span.getAttribute('data-cnt');
    var n = counts[key] || 0;
    span.textContent = n;
    span.style.display = (key === 'all' || n > 0) ? '' : 'none'; // прячем нулевые, кроме «Все»
    var tab = span.closest('.filter-tab');
    if (tab && key !== 'all') tab.style.opacity = n > 0 ? '' : '.5'; // пустые вкладки приглушены
  });
}

function setOrderStatusFilter(status, btn) {
  App._orderFilter = status;
  document.querySelectorAll('#orders-status-tabs .filter-tab').forEach(function(b){ b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  filterOrders();
}

function filterOrders() {
  var search  = (document.getElementById('orders-search')         || {}).value || '';
  var service = (document.getElementById('orders-service-filter') || {}).value || '';
  var filtered = App.orders.filter(function(o) {
    if (App._orderFilter !== 'all' && o['Статус'] !== App._orderFilter) return false;
    if (service && o['Услуга'] !== service) return false;
    if (search) {
      var q  = search.toLowerCase();
      var cl = String(o['Клиент']   || '').toLowerCase();
      var av = String(o['Авто']     || '').toLowerCase();
      var gn = String(o['Госномер'] || '').toLowerCase();
      var ph = String(o['Телефон']  || '').toLowerCase();
      if (!cl.includes(q) && !av.includes(q) && !gn.includes(q) && !ph.includes(q)) return false;
    }
    return true;
  });
  App._ordersFiltered = filtered;
  if (App._ordersView === 'kanban') renderOrdersKanban(filtered);
  else renderOrdersTable(filtered);
}

function renderOrders(orders) {
  renderOrdersTable(orders);
}

      '</td>' +
      '<td>' +
        '<div style="font-size:13px">' + (o['Авто'] || '—') + '</div>' +

      '</td>' +
      '<td style="font-size:13px">' + (o['Услуга'] || '') + '</td>' +
      '<td style="text-align:right;font-weight:600">' + price.toLocaleString('ru') + ' ' + CUR + '</td>' +
      '<td style="text-align:right;font-size:12px;color:var(--text2)">' + costCell + '</td>' +

          }).join('') +

  });

  tbody.innerHTML = html;

// Переключить «Проверено» прямо из таблицы (оптимистично, без захода в карточку)
function toggleOrderVer(id, btn) {
  if (!id) return;
  // оптимистичное обновление кэша и кнопки
  var o = (App.orders || []).find(function(x){ return String(x['ID']) === String(id); });
  var prev = o ? String(o['Проверено'] || '') : null;
  var willOn = prev !== 'Да';
  if (o) o['Проверено'] = willOn ? 'Да' : 'Нет';
  var tr = btn && btn.closest('tr');
  if (btn) {
    btn.className = 'ver-btn ' + (willOn ? 'ver-on' : 'ver-off');
    btn.textContent = willOn ? '✓' : 'проверено';
    btn.title = willOn ? 'Проверено — нажмите, чтобы снять' : 'Отметить проверенным';
  }
  if (tr) tr.classList.toggle('row-verified', willOn);   // затемнить/осветлить строку сразу
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) { // откат
        if (o) o['Проверено'] = prev;
        if (btn) { var on = prev === 'Да'; btn.className = 'ver-btn ' + (on?'ver-on':'ver-off'); btn.textContent = on?'✓':'проверено'; }
        if (tr) tr.classList.toggle('row-verified', prev === 'Да');
        toast('Ошибка: ' + (resp ? resp.error : ''), 'error');
      } else {
        toast(resp.data.verified ? 'Отмечено как проверенное' : 'Проверка снята', 'success');
      }
    })
    .withFailureHandler(function(e){
      if (o) o['Проверено'] = prev;
      if (btn) { var on = prev === 'Да'; btn.className = 'ver-btn ' + (on?'ver-on':'ver-off'); btn.textContent = on?'✓':'проверено'; }
      if (tr) tr.classList.toggle('row-verified', prev === 'Да');
      toast('Ошибка: ' + e.message, 'error');
    })
    .toggleOrderVerification(id);
}

// Ресайз столбцов перетаскиванием правой границы заголовка (один раз на таблицу).
// Ширина запоминается в localStorage по ключу таблицы и восстанавливается при загрузке.
function colWidthsKey_(table) { return 'colw_' + (table.id || 'table'); }

// Применить сохранённые ширины (если есть) + выставить общую ширину таблицы
function applyColWidths_(table) {
  var ths = table.querySelectorAll('thead th');
  var total = 0;
  var saved = null;
  try { var raw = localStorage.getItem(colWidthsKey_(table)); if (raw) saved = JSON.parse(raw); } catch (e) {}
  ths.forEach(function(th, i){
    var w = (saved && saved[i] > 20) ? saved[i] : (table._origW ? table._origW[i] : th.offsetWidth);
    th.style.width = w + 'px';
    total += w;
  });
  if (total) table.style.width = total + 'px';
}

function saveColWidths_(table) {
  try {
    var ths = table.querySelectorAll('thead th');
    var widths = Array.prototype.map.call(ths, function(th){ return th.offsetWidth; });
    localStorage.setItem(colWidthsKey_(table), JSON.stringify(widths));
  } catch (e) { /* localStorage недоступен — не критично */ }
}

// Сбросить ширины столбцов к исходным и забыть сохранённое
function resetTableColWidths_(table) {
  if (!table) return;
  try { localStorage.removeItem(colWidthsKey_(table)); } catch (e) {}
  var ths = table.querySelectorAll('thead th');
  var orig = table._origW || [];
  var total = 0;
  ths.forEach(function(th, i){ var w = orig[i] || th.offsetWidth; th.style.width = w + 'px'; total += w; });
  if (total) table.style.width = total + 'px';
}
function resetOrderColWidths() { resetTableColWidths_(document.getElementById('orders-table')); toast('Ширина столбцов сброшена', 'success'); }

function makeColumnsResizable(table) {
  if (!table) return;
  if (table._resizable) { applyColWidths_(table); return; }  // перерисовка тела — восстановить ширины
  table._resizable = true;
  var ths = Array.prototype.slice.call(table.querySelectorAll('thead th'));
  // снимок исходных ширин (defaults) ДО фиксации раскладки и применения сохранённых
  table._origW = ths.map(function(th){ return th.offsetWidth; });
  // фиксированная раскладка: тянется только нужный столбец, таблица растёт вправо (скролл)
  table.style.tableLayout = 'fixed';
  applyColWidths_(table);  // выставит ширины th и общую ширину таблицы
  ths.forEach(function(th, i){
    if (i === ths.length - 1) return; // последнюю колонку не тянем
    th.style.position = 'relative';
    var handle = document.createElement('span');
    handle.className = 'col-resizer';
    th.appendChild(handle);
    handle.addEventListener('mousedown', function(e){
      e.preventDefault(); e.stopPropagation();
      var startX = e.pageX, startW = th.offsetWidth, startTableW = table.offsetWidth;
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      function move(ev){
        var w = Math.max(40, startW + (ev.pageX - startX));
        th.style.width = w + 'px';
        table.style.width = (startTableW + (w - startW)) + 'px';  // двигается только правая граница
      }
      function up(){
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        document.body.style.cursor = ''; document.body.style.userSelect = '';
        saveColWidths_(table);  // сохранить после перетаскивания
      }
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  });
}

// ── Раскрытие РЕДАКТИРУЕМОЙ детализации (плёнка + расходы) прямо в таблице ──
App._inline = {};   // состояние редакторов по orderId

var _inlEsc = function(s){ return String(s == null ? '' : s).replace(/"/g, '&quot;'); };
var _inlFmt = function(n){ return (Math.round((Number(n)||0)*100)/100).toLocaleString('ru') + ' ' + CUR; };
function _matSqm(m){ return (m.unit === 'пм') ? Math.round((Number(m.qty)||0)*(Number(m.roll)||1.52)*100)/100 : (Number(m.qty)||0); }
function _matCost(m){ return Math.round(_matSqm(m)*(Number(m.price)||0)*100)/100 * (m.type === 'остаток' ? -1 : 1); }

function _inlineEnsureMaterials(cb) {
  if (App._materials && App._materials.length) { cb(); return; }
  google.script.run
    .withSuccessHandler(function(resp){ App._materials = (resp && resp.ok) ? (resp.data || []) : []; cb(); })
    .withFailureHandler(function(){ cb(); })

}

function _setInline(id, html){ var w = document.getElementById('inline-wrap-' + id); if (w) w.innerHTML = html; }
function inlineRender(id){ _setInline(id, buildInlineEditor(id)); }

function buildInlineEditor(id) {
  var st = App._inline[id]; if (!st) return '';
  var hasRef = (App._materials || []).length > 0;
  var inp = 'padding:3px 6px;border:1px solid var(--border);border-radius:5px;background:var(--inp);color:var(--text);font-size:12px';
  var matTot = 0, expTot = 0;

  var matRows = st.mats.map(function(m, i){
    var sqm = _matSqm(m), cost = _matCost(m), isOst = m.type === 'остаток'; matTot += cost;
    var matCell = hasRef
      ? '<select onchange="inlineMatSelect(\'' + id + '\',' + i + ',this)" style="' + inp + ';min-width:150px">' + cardMatOptions_(m.matId) + '</select>'
      : '<input value="' + _inlEsc(m.name) + '" oninput="inlineField(\'' + id + '\',' + i + ',\'name\',this.value)" placeholder="плёнка" style="' + inp + ';min-width:140px">';
    return '<tr>' +
      '<td>' + matCell + '</td>' +
      '<td style="white-space:nowrap"><input type="number" step="0.01" min="0" value="' + m.qty + '" oninput="inlineNum(\'' + id + '\',' + i + ',\'qty\',this.value)" style="' + inp + ';width:62px"> ' +
        '<select onchange="inlineField(\'' + id + '\',' + i + ',\'unit\',this.value)" style="' + inp + '"><option value="пм"' + (m.unit==='пм'?' selected':'') + '>пм</option><option value="м²"' + (m.unit==='м²'?' selected':'') + '>м²</option></select></td>' +
      '<td id="inline-sqm-' + id + '-' + i + '" style="text-align:right">' + sqm.toFixed(2) + ' м²</td>' +
      '<td style="white-space:nowrap"><input type="number" step="0.01" min="0" value="' + m.price + '" oninput="inlineNum(\'' + id + '\',' + i + ',\'price\',this.value)" style="' + inp + ';width:66px"> ' + CUR + '</td>' +
      '<td><select onchange="inlineField(\'' + id + '\',' + i + ',\'type\',this.value)" style="' + inp + '"><option value="расход"' + (!isOst?' selected':'') + '>расход</option><option value="остаток"' + (isOst?' selected':'') + '>остаток</option></select></td>' +
      '<td id="inline-cost-' + id + '-' + i + '" style="text-align:right;font-weight:600;color:' + (isOst?'var(--danger)':'inherit') + '">' + (isOst?'− '+_inlFmt(Math.abs(cost)):_inlFmt(cost)) + '</td>' +
      '<td><button class="pay-del" onclick="inlineDelMat(\'' + id + '\',' + i + ')" title="Удалить">✕</button></td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="7" style="color:var(--text3);padding:6px">Плёнка не внесена.</td></tr>';

  var expRows = st.exps.map(function(e, i){

  }).join('') || '<tr><td colspan="3" style="color:var(--text3);padding:6px">Расходов нет.</td></tr>';

  return '<div class="film-detail-title">🎞 Расход плёнки и расходы — сверьте с данными мастеров (остаток вычитается)</div>' +

        '<table class="film-table"><thead><tr><th>Плёнка</th><th>Кол-во</th><th style="text-align:right">Площадь</th><th style="text-align:right">Цена/м²</th><th>Тип</th><th style="text-align:right">Сумма</th><th></th></tr></thead>' +
        '<tbody>' + matRows + '</tbody></table>' +
        '<button class="btn btn-ghost" style="margin-top:4px;padding:3px 10px;font-size:11px" onclick="inlineAddMat(\'' + id + '\')">+ Плёнка</button>' +
      '</div>' +
      '<div>' +
        '<table class="film-table"><thead><tr><th>Расход (такси, арматура…)</th><th style="text-align:right">Сумма</th><th></th></tr></thead>' +
        '<tbody>' + expRows + '</tbody></table>' +
        '<button class="btn btn-ghost" style="margin-top:4px;padding:3px 10px;font-size:11px" onclick="inlineAddExp(\'' + id + '\')">+ Расход</button>' +
      '</div>' +
