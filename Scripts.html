function submitNewOrder() {
  var service = (document.getElementById('ord-service') || {}).value;
  var name    = ((document.getElementById('ord-client-name') || {}).value || '').trim();
  var price   = Number((document.getElementById('ord-price') || {}).value || 0);

  if (!service) { toast('Выберите услугу', 'error'); return; }
  if (!name)    { toast('Укажите имя клиента', 'error'); return; }
  if (!price)   { toast('Укажите стоимость заказа', 'error'); return; }

  // Предупреждаем о незаполненных строках (иначе они молча отбрасываются)
  var badMats = (App._orderMaterials || []).filter(function(m){ return m && !m.materialId && (Number(m.qty) > 0); }).length;
  var badExps = (App._orderExpenses  || []).filter(function(e){ return e && ((e.name && !(Number(e.amount) > 0)) || (!e.name && Number(e.amount) > 0)); }).length;
  if (badMats || badExps) {
    var msg = 'Не сохранятся незаполненные строки:';
    if (badMats) msg += '\n• материалов без выбранного материала: ' + badMats;
    if (badExps) msg += '\n• расходов без названия или суммы: ' + badExps;
    msg += '\n\nПродолжить создание заказа без них?';
    uiConfirm(msg, submitNewOrderProceed, { title: 'Незаполненные строки', okText: 'Продолжить', danger: false });
    return;
  }
  submitNewOrderProceed();
}

function submitNewOrderProceed() {
  var service = (document.getElementById('ord-service') || {}).value;
  var name    = ((document.getElementById('ord-client-name') || {}).value || '').trim();
  var price   = Number((document.getElementById('ord-price') || {}).value || 0);

  // Все услуги заказа: основная + отмеченные дополнительные (без повторов)
  var serviceCodes = [service];
  document.querySelectorAll('.ord-extra-svc:checked').forEach(function(cb){
    if (cb.value && serviceCodes.indexOf(cb.value) < 0) serviceCodes.push(cb.value);
  });

  var payType     = App._orderPayType || '';
  var duePay      = (document.getElementById('ord-duepay') || {}).value || '';
  var prepay      = Number((document.getElementById('ord-prepay') || {}).value || 0);
  var prepayMeth  = (document.getElementById('ord-prepay-method') || {}).value || 'Нал';
  var rassrMonths = Number((document.getElementById('ord-rassr-months') || {}).value || 0);
  // Полная оплата при создании (для уже оплаченных заказов) → статус «Выдан»
  var paidNow     = !!App._orderPaidNow && ['Нал','Нал с чеком','Безнал'].indexOf(payType) >= 0;

  var clientType = App._orderClientType || 'физ';

  var payload = {
    service:     service,          // основная услуга — для номера договора
    serviceCodes: serviceCodes,    // все услуги заказа (для поля «Услуга»)
    clientId:    (document.getElementById('ord-client-id')    || {}).value || '',
    clientName:  name,
    clientPhone: (document.getElementById('ord-client-phone') || {}).value || '',
    passport:    ((document.getElementById('ord-client-passport') || {}).value || '').trim(),
    clientType:  clientType,
    unp:          clientType === 'юр' ? ((document.getElementById('ord-cl-unp')      || {}).value || '').trim() : '',
    director:     clientType === 'юр' ? ((document.getElementById('ord-cl-director') || {}).value || '').trim() : '',
    legalAddress: clientType === 'юр' ? ((document.getElementById('ord-cl-address')  || {}).value || '').trim() : '',
    postalAddress:clientType === 'юр' ? ((document.getElementById('ord-cl-postal')   || {}).value || '').trim() : '',
    bankDetails:  clientType === 'юр' ? ((document.getElementById('ord-cl-bank')     || {}).value || '').trim() : '',
    car:         (document.getElementById('ord-car')          || {}).value || '',
    vin:         (document.getElementById('ord-vin')          || {}).value || '',
    orderDate:   (function(){ var v=(document.getElementById('ord-date')     || {}).value; return v ? isoToDdmmyyyy_(v) : ''; })(),
    dueDate:     (function(){ var v=(document.getElementById('ord-due-date') || {}).value; return v ? isoToDdmmyyyy_(v) : ''; })(),
    price:       price,
    payType:     payType,
    duePayDate:  duePay,
    manager:     (document.getElementById('ord-manager') || {}).value || '',
    admin:       (document.getElementById('ord-admin')   || {}).value || '',
    masters:     ((document.getElementById('ord-masters') || {}).value || '').trim(),
    tintPrice:   isMixedInForm_() ? Number((document.getElementById('ord-tint-price') || {}).value || 0) : 0,
    tintMasters: isMixedInForm_() ? (function(){ var a=[]; document.querySelectorAll('.ord-tinter-cb:checked').forEach(function(cb){ a.push(cb.value); }); return a.join(', '); })() : '',
    film:        isTintInForm_() ? ((document.getElementById('ord-tint-film')  || {}).value || '') : '',
    lightTransmission: isTintInForm_() ? ((document.getElementById('ord-tint-light') || {}).value || '') : '',
    notes:       ((document.getElementById('ord-notes')   || {}).value || '').trim(),
    complex:       (document.getElementById('ord-complex')        || {}).value || '',
    elements:      ((document.getElementById('ord-elements')      || {}).value || '').trim(),
    elementsCount: (document.getElementById('ord-elements-count') || {}).value || '',
    materials:   App._orderMaterials.filter(function(m){ return m && m.materialId; }),
    expenses:    App._orderExpenses.filter(function(e){ return e && e.name && e.amount > 0; }),
  };

  // Запоминаем менеджера/админа, чтобы подставлять в следующих заказах
  try { localStorage.setItem('spr_last_manager', payload.manager || ''); localStorage.setItem('spr_last_admin', payload.admin || ''); } catch (e) {}

  var btn = document.getElementById('ord-submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Сохраняем...'; }
  var resetBtn = function(){ if (btn) { btn.disabled = false; btn.textContent = 'Создать заказ'; } };

  var finalizeNewOrder = function() {
    closeModal('modal-new-order');
    ['ord-service','ord-client-phone','ord-client-name','ord-client-id','ord-client-passport',
     'ord-car','ord-vin','ord-price','ord-masters','ord-notes','ord-prepay',
     'ord-complex','ord-elements','ord-elements-count',
     'ord-cl-unp','ord-cl-director','ord-cl-address','ord-cl-postal','ord-cl-bank'].forEach(function(id){
      var el = document.getElementById(id); if (el) el.value = '';
    });
    document.querySelectorAll('.ord-extra-svc:checked').forEach(function(cb){ cb.checked = false; });
    setOrderClientType('физ', document.getElementById('ord-ctype-phys'));
    var found = document.getElementById('ord-client-found'); if (found) found.style.display = 'none';
    var preview = document.getElementById('ord-finance-preview'); if (preview) preview.style.display = 'none';
    App._orderPayType = '';
    App._orderDirty = false; App._orderResume = false;   // заказ создан — черновик завершён
    initOrderForm();
    var hid = document.getElementById('ord-paytype'); if (hid) hid.value = '';
    var duepayEl = document.getElementById('ord-duepay'); if (duepayEl) duepayEl.value = '';
    var dueRow = document.getElementById('ord-duepay-row'); if (dueRow) dueRow.style.display = 'none';
    document.querySelectorAll('#modal-new-order .ctype-btn').forEach(function(b){ b.classList.remove('active'); });
    App._foundClient = null;
    App.clients = [];        // мог появиться новый клиент — обновим список при заходе
    App._dashCache = null;   // дашборд пересчитается
    App._debtCache = null;
    if (App.currentPage === 'orders') loadOrders(true);  // принудительно — показать новый заказ сразу
  };

  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) { resetBtn(); toast('Ошибка: ' + (resp ? resp.error : 'нет ответа'), 'error'); return; }
      var orderId  = resp.data.id;
      var contract = resp.data.contractNumber || '';

      // Если заказ создавали из записи — привяжем запись к заказу и отметим «Пришёл»
      if (App._aptPendingLink) {
        var aptId = App._aptPendingLink; App._aptPendingLink = null;
        google.script.run
          .withSuccessHandler(function(){ if (App.currentPage === 'appointments') loadAppointments(true); })
          .withFailureHandler(function(){ toast('Заказ создан, но привязать к записи не удалось', 'error'); })
          .linkAppointmentOrder(aptId, orderId);
      }

      var done = function() {
        resetBtn();
        toast('✅ Заказ ' + contract + ' создан', 'success');
        finalizeNewOrder();
      };
      // Шаг 3: график рассрочки (на остаток после предоплаты)
      var buildPlan = function() {
        if (payType === 'Рассрочка' && rassrMonths >= 1) {
          google.script.run
            .withSuccessHandler(function(){ done(); })
            .withFailureHandler(function(e){ resetBtn(); toast('Заказ создан, но график не построен: ' + e.message, 'error'); finalizeNewOrder(); })
            .createInstallmentPlan(orderId, { months: rassrMonths, startDate: duePay });
        } else done();
      };
      // Шаг 2: оплата.
      if (paidNow) {
        // Полная оплата при создании → списываем всю сумму и ставим статус «Выдан»
        google.script.run
          .withSuccessHandler(function(){
            google.script.run
              .withSuccessHandler(function(){ done(); })
              .withFailureHandler(function(){ done(); })   // оплата прошла, статус не критичен
              .updateOrderStatus(orderId, 'Выдан');
          })
          .withFailureHandler(function(e){ resetBtn(); toast('Заказ создан, но оплата не внесена: ' + e.message, 'error'); finalizeNewOrder(); })
          .addOrderPayment(orderId, { amount: price, payType: payType, comment: 'Оплата при создании' });
      } else if (prepay > 0) {
        google.script.run
          .withSuccessHandler(function(){ buildPlan(); })
          .withFailureHandler(function(e){ resetBtn(); toast('Заказ создан, но предоплата не внесена: ' + e.message, 'error'); finalizeNewOrder(); })
          .addOrderPayment(orderId, { amount: prepay, payType: prepayMeth, comment: 'Предоплата при создании' });
      } else {
        buildPlan();
      }
    })
    .withFailureHandler(function(e) {
      resetBtn();
      toast('Ошибка: ' + e.message, 'error');
    })
    .createOrder(payload);
}

/* ===== СТРАНИЦА СПРАВОЧНИКА МАТЕРИАЛОВ ===== */

function loadMaterials(force) {
  var tbody = document.getElementById('materials-tbody');
  var err   = document.getElementById('materials-error');
  if (err)   err.style.display = 'none';

  var hasCache = App._materials && App._materials.length;
  if (hasCache && !force) {
    filterMaterials();
    if (cacheFresh_('materials')) return;   // свежий кэш — фоновую дозагрузку пропускаем
  } else if (tbody) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--text3)">Загрузка...</td></tr>';
  }

  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) {
        if (!hasCache && err) { err.textContent = resp ? resp.error : 'Нет ответа'; err.style.display = 'block'; }
        return;
      }
      App._materials = resp.data || [];
      markLoaded_('materials');
      filterMaterials();
    })
    .withFailureHandler(function(e) {
      if (!hasCache && err) { err.textContent = e.message; err.style.display = 'block'; }
    })
    .getMaterials(null);
}

// Поиск/фильтр в справочнике материалов (клиентская фильтрация App._materials)
function filterMaterials() {
  var q   = ((document.getElementById('mat-search')     || {}).value || '').toLowerCase().trim();
  var cat = (document.getElementById('mat-cat-filter')  || {}).value || '';
  var list = (App._materials || []).filter(function(m) {
    if (cat && String(m['Категория'] || '') !== cat) return false;
    if (q && String(m['Название'] || '').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  renderMaterialsTable(list);
}

// Справочники для инлайн-редактирования
var MAT_CATS  = ['PPF плёнка','Тонировочная плёнка','Антихром','Защита фар','Химия','Расходник','Инструмент'];
var MAT_SVCS  = [['Универсальная','Универсальная'],['PPF','Оклейка PPF'],['TINT','Тонировка'],['POLISH','Полировка'],['ANTICHR','Антихром']];
var MAT_UNITS = ['пм','м²','шт','л','кг'];
// Число из ячейки: пусто/0/дата(«00:00») → пустая строка (в инпуте — пусто)
function matNum_(v){ var n = parseFloat(v); return (isFinite(n) && n !== 0) ? n : ''; }

    return;
  }
  var esc = function(s){ return String(s == null ? '' : s).replace(/"/g,'&quot;'); };
  // инпут для инлайн-редактирования числового/текстового поля
  var inp = function(id, field, val, extra){
    return '<input class="mat-inp' + (extra || '') + '" data-field="' + field + '" data-orig="' + esc(val) + '" value="' + esc(val) + '"' +
      (extra && extra.indexOf('mat-num') >= 0 ? ' type="number" step="0.01"' : '') +
      ' oninput="matCellInput_(this)" onchange="matCellFlush_(this)">';
  };
  var sel = function(id, field, val, opts){

      var v = Array.isArray(op) ? op[0] : op, lbl = Array.isArray(op) ? op[1] : op;
      return '<option value="' + esc(v) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + lbl + '</option>';
    }).join('');
    return '<select class="mat-inp mat-sel" data-field="' + field + '" data-orig="' + esc(val) + '" onchange="matCellFlush_(this)">' + o + '</select>';
  };

      '<td>' + inp(id, 'name', m['Название'] || '', ' mat-name') + '</td>' +
      '<td>' + sel(id, 'category', m['Категория'] || '', [''].concat(MAT_CATS)) + '</td>' +
      '<td>' + sel(id, 'service',  m['Услуга']    || 'Универсальная', MAT_SVCS) + '</td>' +
      '<td>' + sel(id, 'unit',     m['Единица']   || 'пм', MAT_UNITS) + '</td>' +
      '<td>' + inp(id, 'rollWidth',   matNum_(m['Ширина рулона']), ' mat-num') + '</td>' +
      '<td>' + inp(id, 'rollLength',  matNum_(m['Длина рулона']),  ' mat-num') + '</td>' +
      '<td>' + inp(id, 'costSqm',     matNum_(m['Себестоимость м²']), ' mat-num mat-cost') + '</td>' +
      '<td>' + inp(id, 'price',       matNum_(m['Цена']),          ' mat-num mat-cost') + '</td>' +
      '<td>' + inp(id, 'sellPerMeter',matNum_(m['Цена за пог.м']),   ' mat-num') + '</td>' +
      '<td>' + inp(id, 'sellBeznal',  matNum_(m['Цена безнал']),     ' mat-num') + '</td>' +
      '<td>' + inp(id, 'sellRegular', matNum_(m['Цена постоянным']), ' mat-num') + '</td>' +
      '<td>' + inp(id, 'sellPerRoll', matNum_(m['Цена за рулон']),   ' mat-num') + '</td>' +
      '<td style="text-align:center"><span style="font-size:11px;padding:2px 8px;border-radius:20px;background:' +
        (active ? 'rgba(40,167,69,.15)' : 'var(--bg-hover)') + ';color:' +
        (active ? 'var(--success)' : 'var(--text3)') + '">' +
        (active ? 'Активен' : 'Архив') + '</span></td>' +
      '<td style="text-align:right;white-space:nowrap">' +
        (active
          ? '<button class="btn btn-ghost" style="padding:3px 9px;font-size:11px;color:var(--text3);margin-right:4px" onclick="deactivateMat(\'' + id + '\')">Архив</button>'
          : '<button class="btn btn-ghost" style="padding:3px 9px;font-size:11px;color:var(--success);margin-right:4px" onclick="restoreMat(\'' + id + '\')">Восст.</button>') +
        '<button class="btn btn-ghost" style="padding:3px 9px;font-size:11px;color:var(--danger)" title="Удалить навсегда" onclick="deleteMatRow(\'' + id + '\',\'' + String(m['Название']||'').replace(/'/g,"\\'") + '\')">Удалить</button>' +

// Названия колонок листа для локального обновления кэша
var MAT_FIELD_COL = {
  name:'Название', category:'Категория', service:'Услуга', unit:'Единица', price:'Цена', costSqm:'Себестоимость м²',
  rollWidth:'Ширина рулона', rollLength:'Длина рулона', sellPerMeter:'Цена за пог.м', sellPerRoll:'Цена за рулон',
  sellBeznal:'Цена безнал', sellRegular:'Цена постоянным'
};
var MAT_NUM_FIELDS = { rollWidth:1, rollLength:1, price:1, costSqm:1, sellPerMeter:1, sellPerRoll:1, sellBeznal:1, sellRegular:1 };

// Сохранить одно поле материала прямо из таблицы (без перезагрузки всей таблицы)
function inlineMatSave(id, field, value, el) {
  if (!id) {
    if (el) el.classList.add('mat-err');
    toast('Не удалось сохранить: у материала нет ID. Обновите справочник (кнопка «Обновить») — он присвоится автоматически.', 'error');
    return;
  }
  var isNum = MAT_NUM_FIELDS[field];
  var val   = isNum ? (String(value).trim() === '' ? '' : Number(value)) : value;
  var m = (App._materials || []).find(function(x){ return String(x['ID']) === String(id); });
  var payload = {}; payload[field] = val;

  // Связка себестоимости: м² ↔ пог.м через ширину рулона (заполнил одну — вторая считается сама).
  if (field === 'costSqm' || field === 'price') {
    var roll = Number(m && m['Ширина рулона']) || 1.52;
    var num  = (val === '' ? 0 : Number(val));
    var pField, pVal;
    if (field === 'costSqm') { pField = 'price';   pVal = Math.round(num * roll * 100) / 100; }        // пог.м = м² × ширина
    else                     { pField = 'costSqm'; pVal = roll ? Math.round(num / roll * 100) / 100 : 0; } // м² = пог.м ÷ ширина
    payload[pField] = pVal;
    if (m) m[MAT_FIELD_COL[pField]] = pVal;
    var tr  = el && el.closest ? el.closest('tr') : null;
    var pEl = tr ? tr.querySelector('.mat-inp[data-field="' + pField + '"]') : null;
    if (pEl) { pEl.value = pVal; pEl.dataset.orig = String(pVal); }
  }

  if (m) m[MAT_FIELD_COL[field]] = val;                 // оптимистично в кэш
  if (el) { el.classList.remove('mat-err'); el.classList.add('mat-saving'); el.dataset.orig = String(el.value); }  // помечаем как «в процессе сохранения» → повторно не досохраняем
  google.script.run
    .withSuccessHandler(function(resp){
      if (el) el.classList.remove('mat-saving');
      if (!resp || !resp.ok) { if (el) { el.classList.add('mat-err'); el.dataset.orig = '␀'; } toast('Ошибка сохранения: ' + (resp ? resp.error : ''), 'error'); return; }
      if (el) { el.classList.add('mat-ok'); setTimeout(function(){ el.classList.remove('mat-ok'); }, 900); }
    })
    .withFailureHandler(function(e){ if (el) { el.classList.remove('mat-saving'); el.classList.add('mat-err'); el.dataset.orig = ' '; } toast('Ошибка: ' + e.message, 'error'); })
    .updateMaterial(id, payload);
}

// Автосохранение ячейки справочника прямо при вводе (debounce) — не требует клика вне ячейки.
function matCellSave_(el){
  var tr = el.closest ? el.closest('tr') : null;
  var id = tr ? tr.getAttribute('data-mid') : '';
  if (!id) return;
  if (String(el.value) === String(el.dataset.orig == null ? '' : el.dataset.orig)) return;  // без изменений
  inlineMatSave(id, el.dataset.field, el.value, el);
}
function matCellInput_(el){
  clearTimeout(el._matTimer);
  el._matTimer = setTimeout(function(){ matCellSave_(el); }, 500);   // сохраняем через 0.5с после остановки ввода
}
function matCellFlush_(el){ clearTimeout(el._matTimer); matCellSave_(el); }  // потеря фокуса / выбор в списке — сразу

// Досохранение всех изменённых ячеек справочника при уходе со страницы:
// событие change может не успеть сработать, если сразу переключить раздел.
// Сверяем текущее значение каждой ячейки с исходным (data-orig) и сохраняем расхождения.
function flushMatEdits_() {
  var table = document.getElementById('materials-table');
  if (!table) return;
  var els = table.querySelectorAll('.mat-inp[data-field]');
  Array.prototype.forEach.call(els, function(el){
    var orig = (el.dataset.orig == null) ? '' : el.dataset.orig;
    if (String(el.value) === String(orig)) return;   // без изменений
    var tr = el.closest('tr');
    var id = tr ? tr.getAttribute('data-mid') : '';
    if (!id) return;
    inlineMatSave(id, el.dataset.field, el.value, el);
  });
}
// Backstop: перед перезагрузкой/закрытием вкладки досохраняем несохранённые правки справочника (best-effort)
try { window.addEventListener('beforeunload', function(){ try { flushMatEdits_(); } catch(e){} }); } catch(e){}

function loadSales(force){
  var tbody=document.getElementById('sales-tbody');
  var hasCache=App._sales&&App._sales.length;
  if(hasCache&&!force){ renderSalesTable(); if(cacheFresh_('sales')) return; }
  else if(tbody) tbody.innerHTML='<tr><td colspan="9" style="text-align:center;padding:28px;color:var(--text3)">Загрузка…</td></tr>';
  ensureClientsLoaded_(); ensureMaterialsLoaded_();
  google.script.run.withSuccessHandler(function(resp){
    if(!resp||!resp.ok){ if(tbody) tbody.innerHTML='<tr><td colspan="9" style="text-align:center;padding:20px;color:var(--danger)">Ошибка: '+(resp?resp.error:'нет ответа')+'.<br>Запустите Настройки → Мастер запуска (создаст листы продаж).</td></tr>'; return; }
    App._sales=resp.data||[]; markLoaded_('sales'); renderSalesTable();
  }).withFailureHandler(function(e){ if(tbody) tbody.innerHTML='<tr><td colspan="9" style="text-align:center;padding:20px;color:var(--danger)">Ошибка: '+e.message+'</td></tr>'; }).getSales(null);
}

function renderSalesTable(){
  var tbody=document.getElementById('sales-tbody'); if(!tbody) return;
  var q=((document.getElementById('sales-search')||{}).value||'').toLowerCase().trim();
  var list=(App._sales||[]).filter(function(s){ return !q || String(s['Клиент']||'').toLowerCase().indexOf(q)>=0 || String(s['Телефон']||'').indexOf(q)>=0; });
  var total=0,debt=0;
  list.forEach(function(s){ total+=Number(s._total)||0; debt+=Number(s._debt)||0; });
  var setT=function(id,v){var e=document.getElementById(id); if(e)e.textContent=v;};
  setT('sales-kpi-count',list.length); setT('sales-kpi-total',salesFmt_(total)); setT('sales-kpi-debt',salesFmt_(debt));
  if(!list.length){ tbody.innerHTML='<tr><td colspan="9" style="text-align:center;padding:28px;color:var(--text3)">Продаж пока нет. Нажмите «+ Продажа».</td></tr>'; return; }
  var ell='overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
  tbody.innerHTML=list.map(function(s){
    var st=s['Статус оплаты']||'Не оплачен';
    var color= st==='Оплачен'?'var(--success)':(st==='Частично'?'var(--blue)':'var(--danger)');
    var soft= st==='Оплачен'?'var(--green-soft)':(st==='Частично'?'var(--blue-soft)':'var(--red-soft)');
    var id=s['ID']||'';
    return '<tr style="cursor:pointer" onclick="openSaleCard(\''+id+'\')">'+
      '<td style="font-size:12px;color:var(--text2);white-space:nowrap">'+(s['Дата']||'')+'</td>'+
      '<td style="font-size:12px;font-weight:600;white-space:nowrap">'+id+'</td>'+
      '<td style="'+ell+'"><div style="font-weight:500">'+(s['Клиент']||'—')+'</div><div style="font-size:11px;color:var(--text3)">'+(s['Телефон']||'')+'</div></td>'+
      '<td style="text-align:center;font-size:12px">'+(s._items||0)+'</td>'+
      '<td style="text-align:right;font-weight:600;white-space:nowrap">'+salesFmt_(s._total)+'</td>'+
      '<td style="text-align:right;font-size:12px;white-space:nowrap">'+salesFmt_(s._paid)+'</td>'+
      '<td style="text-align:right;font-size:12px;white-space:nowrap;color:'+((s._debt>0)?'var(--danger)':'var(--text3)')+'">'+((s._debt>0)?salesFmt_(s._debt):'—')+'</td>'+
      '<td style="text-align:center"><span style="font-size:11px;padding:2px 8px;border-radius:10px;background:'+soft+';color:'+color+'">'+st+'</span><div style="font-size:10px;color:var(--text3);margin-top:2px">'+(s['Способ оплаты']||'')+'</div></td>'+
      '<td style="text-align:right;white-space:nowrap" onclick="event.stopPropagation()">'+
        ((s._debt>0)?'<button class="btn btn-ghost" style="padding:3px 9px;font-size:11px;color:var(--success)" onclick="openSaleCard(\''+id+'\')">Оплата</button> ':'')+
        '<button class="btn btn-ghost" style="padding:3px 9px;font-size:11px;color:var(--danger)" onclick="deleteSale(\''+id+'\')">Удалить</button>'+
      '</td>'+
    '</tr>';
  }).join('');
  makeColumnsResizable(document.getElementById('sales-table'));   // регулируемые + сохраняемые колонки
}

/* ── Форма новой продажи ── */
function blankSaleItem_(){ return { materialId:'', name:'', unit:'пог.м', qty:1, price:0 }; }

function openNewSale(){
  ensureClientsLoaded_(function(){ fillSaleClientsDatalist_(); });
  ensureMaterialsLoaded_(function(){ fillSaleMaterialsDatalist_(); });
  ensureEmployeesLoaded_(function(){ var m=document.getElementById('sale-manager'); if(m) m.innerHTML=managerOptionsHtml_(''); });
  var iso=new Date().toISOString().slice(0,10);
  var set=function(id,v){var e=document.getElementById(id); if(e)e.value=v;};
  set('sale-date',iso); set('sale-paytype','Нал'); set('sale-client-search',''); set('sale-client-id',''); set('sale-prepay',''); set('sale-bonus','5');
  var ch=document.getElementById('sale-client-chosen'); if(ch) ch.textContent='';
  App._saleItems=[ blankSaleItem_() ];
  renderSaleItems(); onSalePayTypeChange();
  openModal('modal-new-sale');
}
function fillSaleClientsDatalist_(){
  var dl=document.getElementById('sale-clients-list'); if(!dl) return;
  App._saleClientByLabel={};
  // В продажах — только оптовые клиенты (отдельная база)
  dl.innerHTML=(App.clients||[]).filter(function(c){ return String(c['Оптовик'])==='Да'; }).map(function(c){
    var label=(c['Имя']||'')+(c['Телефон']?' — '+c['Телефон']:'');
    App._saleClientByLabel[label]=c;
    return '<option value="'+saleEsc_(label)+'">';
  }).join('');
}
function fillSaleMaterialsDatalist_(){
  var dl=document.getElementById('sale-materials-list'); if(!dl) return;
  dl.innerHTML=(App._materials||[]).map(function(m){ return '<option value="'+saleEsc_(m['Название']||'')+'">'; }).join('');
}
function onSaleClientInput(){
  var v=(document.getElementById('sale-client-search')||{}).value||'';
  var c=App._saleClientByLabel[v];
  var chosen=document.getElementById('sale-client-chosen');
  if(c){ document.getElementById('sale-client-id').value=c['ID']||''; if(chosen){ chosen.textContent='✓ '+(c['Имя']||'')+(String(c['Оптовик'])==='Да'?' · оптовик':''); chosen.style.color='var(--success)'; } }
  else { document.getElementById('sale-client-id').value=''; if(chosen){ chosen.textContent=v?'Новый клиент «'+v+'» будет создан (оптовик)':''; chosen.style.color='var(--text3)'; } }
  repriceSaleItems_();   // постоянный клиент → тариф «постоянным»
}

function setWholesaleType(t, btn){
  App._wholesaleType=t;
  document.querySelectorAll('#modal-new-wholesale .ctype-btn').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');

function submitWholesaleClient(){
  var name=((document.getElementById('ws-name')||{}).value||'').trim();
  if(!name){ toast('Укажите имя или название','error'); return; }
  var payload={
    type: App._wholesaleType, name: name, wholesale: true,
    phone: ((document.getElementById('ws-phone')||{}).value||'').trim(),
    email: ((document.getElementById('ws-email')||{}).value||'').trim(),
    notes: ((document.getElementById('ws-notes')||{}).value||'').trim(),
  };
  if(App._wholesaleType==='юр'){
    payload.unp=((document.getElementById('ws-unp')||{}).value||'').trim();
    payload.director=((document.getElementById('ws-director')||{}).value||'').trim();
    payload.legalAddress=((document.getElementById('ws-legal-address')||{}).value||'').trim();
    payload.bankDetails=((document.getElementById('ws-bank')||{}).value||'').trim();
  }
  var btn=document.getElementById('ws-submit-btn'); if(btn){btn.disabled=true;btn.textContent='Сохраняем…';}
  google.script.run.withSuccessHandler(function(resp){
    if(btn){btn.disabled=false;btn.textContent='Сохранить клиента';}
    if(!resp||!resp.ok){ toast('Ошибка: '+(resp?resp.error:''),'error'); return; }
    var nc=resp.data||{};
    toast('Оптовый клиент создан','success');
    closeModal('modal-new-wholesale');
    // добавим в кэш и выберем в форме продажи
    App.clients=App.clients||[]; App.clients.push({ 'ID':nc['ID']||'', 'Имя':name, 'Телефон':payload.phone, 'Тип':payload.type, 'Оптовик':'Да' });
    fillSaleClientsDatalist_();
    var label=name+(payload.phone?' — '+payload.phone:'');
    var srch=document.getElementById('sale-client-search'); if(srch) srch.value=label;
    var cid=document.getElementById('sale-client-id'); if(cid) cid.value=nc['ID']||'';
    onSaleClientInput();
  }).withFailureHandler(function(e){ if(btn){btn.disabled=false;btn.textContent='Сохранить клиента';} toast('Ошибка: '+e.message,'error'); }).createClient(payload);
}

      '<td><input list="sale-materials-list" value="'+saleEsc_(it.name)+'" onchange="saleItemPick('+i+',\'name\',this.value)" placeholder="плёнка" style="'+inp+'"></td>'+
      '<td><select onchange="saleItemPick('+i+',\'unit\',this.value)" style="'+inp+'">'+
        ['пог.м','рулон','м²','шт'].map(function(u){return '<option'+(it.unit===u?' selected':'')+'>'+u+'</option>';}).join('')+'</select></td>'+
      '<td><input type="number" step="0.01" min="0" value="'+it.qty+'" oninput="saleItemNum('+i+',\'qty\',this.value)" style="'+inp+';text-align:right"></td>'+
      '<td><input type="number" step="0.01" min="0" value="'+it.price+'" oninput="saleItemNum('+i+',\'price\',this.value)" style="'+inp+';text-align:right"></td>'+
      '<td id="sale-sum-'+i+'" style="text-align:right;font-weight:600;white-space:nowrap">'+salesFmt_(sum)+'</td>'+
      '<td><button class="pay-del" onclick="removeSaleItem('+i+')" title="Удалить">✕</button></td>'+
    '</tr>';
  }).join('');
  recalcSaleTotal();
}
// Постоянный (оптовый) ли клиент выбран в форме продажи
function saleIsRegular_(){
  var v=(document.getElementById('sale-client-search')||{}).value||'';
  var c=App._saleClientByLabel[v];
  return !!(c && String(c['Оптовик'])==='Да');
}
// Цена за пог.м по нужному тарифу: постоянный → «постоянным», безнал → «безнал», иначе → «нал».
// Если у тарифа цена не задана — откатываемся к рознице (нал).
function saleTierMeterPrice_(m){
  var retail=Number(m['Цена за пог.м'])||0;
  var payType=(document.getElementById('sale-paytype')||{}).value||'Нал';
  if(saleIsRegular_()){ var r=Number(m['Цена постоянным'])||0; return r||retail; }
  if(payType==='Безнал'){ var b=Number(m['Цена безнал'])||0; return b||retail; }
  return retail;
}
function autoSalePrice_(it,m){
  var p=0;
  if(it.unit==='пог.м')      p=saleTierMeterPrice_(m);
  else if(it.unit==='рулон') p=Number(m['Цена за рулон'])||0;
  else if(it.unit==='м²')    p=Number(m['Цена'])||0;
  if(p) it.price=p;
}
// Пересчитать авто-цены всех позиций (кроме тех, где цену правили вручную) — при смене оплаты/клиента.
function repriceSaleItems_(){
  (App._saleItems||[]).forEach(function(it){
    if(it._manual) return;
    var m=(App._materials||[]).find(function(x){return (x['Название']||'')===it.name;});
    if(m) autoSalePrice_(it,m);
  });
  renderSaleItems();
}
function saleItemPick(i,field,val){
  var it=App._saleItems[i]; if(!it) return;
  if(field==='name'){ it.name=val; it._manual=false; var m=(App._materials||[]).find(function(x){return (x['Название']||'')===val;}); if(m){ it.materialId=m['ID']||''; autoSalePrice_(it,m); } }
  else if(field==='unit'){ it.unit=val; var m2=(App._materials||[]).find(function(x){return (x['Название']||'')===it.name;}); if(m2 && !it._manual) autoSalePrice_(it,m2); }
  renderSaleItems();
}
function saleItemNum(i,field,val){
  var it=App._saleItems[i]; if(!it) return;
  it[field]=Number(val)||0;
  if(field==='price') it._manual=true;   // цену задали вручную — авто-тариф её больше не трогает
  var cell=document.getElementById('sale-sum-'+i);
  if(cell) cell.textContent=salesFmt_((Number(it.qty)||0)*(Number(it.price)||0));
  recalcSaleTotal();
}
function recalcSaleTotal(){
  var t=0; (App._saleItems||[]).forEach(function(it){ t+=(Number(it.qty)||0)*(Number(it.price)||0); });
  var e=document.getElementById('sale-total'); if(e) e.innerHTML=(Math.round(t*100)/100).toLocaleString('ru')+' <span class="cur">'+CUR+'</span>';
}

function submitNewSale(){
  var items=(App._saleItems||[]).filter(function(it){ return String(it.name||'').trim() && Number(it.qty)>0; });
  if(!items.length){ toast('Добавьте хотя бы одну позицию с количеством','error'); return; }
  var clientId=(document.getElementById('sale-client-id')||{}).value||'';
  var clientLabel=(document.getElementById('sale-client-search')||{}).value||'';
  var payType=(document.getElementById('sale-paytype')||{}).value||'Нал';
  var dateIso=(document.getElementById('sale-date')||{}).value||'';
  var date=dateIso?isoToDdmmyyyy_(dateIso):'';
  var prepay=(document.getElementById('sale-prepay')||{}).value;
  var chosen=App._saleClientByLabel[clientLabel];
  var clientName = chosen ? (chosen['Имя']||'') : (clientLabel.split(' — ')[0]||'').trim();
  // Клиент необязателен: без него — розничная продажа
  var btn=document.getElementById('sale-submit-btn'); if(btn){btn.disabled=true;btn.textContent='Проводим…';}
  var restore=function(){ if(btn){btn.disabled=false;btn.textContent='Провести продажу';} };
  var manager=(document.getElementById('sale-manager')||{}).value||'';
  var bonusPct=(document.getElementById('sale-bonus')||{}).value;
  var doCreate=function(cid,cname,phone){
    var payload={ date:date, clientId:cid, clientName:cname, phone:phone||'', payType:payType, items:items, manager:manager, bonusPct:(bonusPct===''?5:Number(bonusPct)||0) };
    if((payType==='Отсрочка'||payType==='Рассрочка') && prepay!=='') payload.paid=Number(prepay)||0;
    google.script.run.withSuccessHandler(function(resp){
      restore();
      if(!resp||!resp.ok){ toast('Ошибка: '+(resp?resp.error:''),'error'); return; }
      toast('Продажа проведена','success'); closeModal('modal-new-sale');
      App._sales=[]; App._dashCache=null; App._debtCache=null; loadSales(true);
    }).withFailureHandler(function(e){ restore(); toast('Ошибка: '+e.message,'error'); }).createSale(payload);
  };
  if(clientId && chosen){ doCreate(clientId, clientName, chosen['Телефон']||''); }
  else if(clientName){
    // клиент не из списка → создаём нового оптовика (физлицо)
    google.script.run.withSuccessHandler(function(resp){
      if(!resp||!resp.ok){ restore(); toast('Ошибка создания клиента: '+(resp?resp.error:''),'error'); return; }
      var nc=resp.data||{}; App.clients=[]; doCreate(nc['ID']||'', clientName, '');
    }).withFailureHandler(function(e){ restore(); toast('Ошибка: '+e.message,'error'); }).createClient({ type:'физ', name:clientName, wholesale:true });
  }
  else {
    // без клиента — розничная продажа
    doCreate('', 'Розничный покупатель', '');
  }
}

  if (from || to) {
    return {
      from: from ? new Date(from).toISOString() : null,
      to:   to   ? new Date(to + 'T23:59:59').toISOString() : null,
    };
  }
  return getPeriodRange((document.getElementById('dash-period') || {}).value || 'month');
}

// Смена пресета периода → заполняем календари и пересчитываем
function onDashPeriodChange() {
  var r = getPeriodRange((document.getElementById('dash-period') || {}).value || 'month');
  var f = document.getElementById('dash-from');
  var t = document.getElementById('dash-to');
  if (f) f.value = r.from ? r.from.slice(0, 10) : '';
  if (t) t.value = r.to   ? r.to.slice(0, 10)   : '';
  savePeriod_('dash');
  broadcastDashPeriod_();
  renderDashboard();
}

// Ручная правка даты в календаре → сохраняем период и пересчитываем
function onDashDateEdit() { savePeriod_('dash'); broadcastDashPeriod_(); renderDashboard(); }

// Период с дашборда — мастер для всех разделов. Раскидываем его выбор в хранилище
// каждого раздела, чтобы при следующем заходе они подхватили тот же период.
// Локальное изменение периода внутри раздела никуда не распространяется (savePeriod_ пишет только свой ключ).
function broadcastDashPeriod_() {
  try {
    var g = function(id){ var e = document.getElementById(id); return e ? e.value : ''; };
    var cfg = JSON.stringify({ period: g('dash-period'), from: g('dash-from'), to: g('dash-to') });
    ['ord', 'kassa', 'exp', 'fin', 'dds', 'sal'].forEach(function(pre){
      try { localStorage.setItem('sprauto-period-' + pre, cfg); } catch (e) {}
    });
  } catch (e) {}
}

    kpiHead('За выбранный период') +

    kpiCard('В работе',       fmt(k.inWorkSum),    '#8b5cf6',       '🔧', "goPage('orders')") +

    kpiCard('Расходы',        fmt(k.expenses),     'var(--danger)',  '💸', "goPage('expenses')") +
    kpiHead('Деньги и долги') +

function renderDashboard(force) {
  var range = getDashRange();
  var key   = (range.from || '') + '_' + (range.to || '');
  var kpi   = document.getElementById('dash-kpi');

  // Мгновенно из кэша, если период тот же
  var cached = (App._dashCache && App._dashCache.key === key) ? App._dashCache.data : null;
  if (cached) {
    renderDashData_(cached);
    if (App._debtCache) renderDebtAlert_(App._debtCache);
    // Свежий кэш того же периода — фоновую дозагрузку пропускаем (мутации обнуляют _dashCache)
    if (!force && cacheFresh_('dash_' + key)) return;
  } else if (kpi) {
    kpi.innerHTML = '<div class="kpi-skeleton"></div><div class="kpi-skeleton"></div><div class="kpi-skeleton"></div><div class="kpi-skeleton"></div>';
  }
  if (App._debtCache) renderDebtAlert_(App._debtCache);   // дебиторку тоже мгновенно из кэша

  // Фоновое обновление — ОДНИМ вызовом (KPI + дебиторка), вместо двух round-trip
  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) return;
      var b = resp.data || {};
      if (b.dash) { App._dashCache = { key: key, data: b.dash }; markLoaded_('dash_' + key); renderDashData_(b.dash); }
      App._debtCache = b.debt || [];
      renderDebtAlert_(App._debtCache);
    })
    .withFailureHandler(function(){})
    .getDashboardBundle(range);
}

// Отрисовать баннер дебиторки из массива строк
function renderDebtAlert_(rows) {
  var el = document.getElementById('dash-debt-alert');
  if (!el) return;
  if (!rows || !rows.length) { el.innerHTML = ''; return; }
  var fmt  = function(n){ return (Math.round((Number(n)||0)*100)/100).toLocaleString('ru') + ' ' + CUR; };
  var overdue    = rows.filter(function(r){ return r.isOverdue; });
  var totalRem   = rows.reduce(function(s, r){ return s + (Number(r.remaining)||0); }, 0);
  var overdueSum = overdue.reduce(function(s, r){ return s + (Number(r.remaining)||0); }, 0);
  var alarm = overdue.length > 0;
  el.innerHTML =
    '<div onclick="goPage(\'debt\')" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:12px;border:1px solid ' +
      (alarm ? 'rgba(231,76,60,.35)' : 'var(--border)') + ';background:' + (alarm ? 'var(--red-soft)' : 'var(--bg-card)') + '">' +
      '<div style="font-weight:600;color:' + (alarm ? 'var(--danger)' : 'var(--text)') + '">' +
        (alarm ? ('⚠ Просрочено: ' + overdue.length + ' на ' + fmt(overdueSum)) : ('🧾 Дебиторка: ' + rows.length + ' заказов')) +
        ' <span style="color:var(--text3);font-weight:500;font-size:12px">· всего к получению ' + fmt(totalRem) + '</span>' +
      '</div>' +
      '<span style="font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap">Открыть дебиторку →</span>' +
    '</div>';
}

// Алерт по дебиторке вверху дашборда (кэш → мгновенно, обновление в фоне)
function loadDashDebtAlert() {
  var el = document.getElementById('dash-debt-alert');
  if (!el) return;
  if (App._debtCache) renderDebtAlert_(App._debtCache);   // мгновенно из кэша

    return '<tr class="' + (o.verified ? 'row-verified' : '') + '" style="cursor:pointer" onclick="openOrderCard(\'' + o.id + '\')">' +
      '<td style="font-size:12px;font-weight:600;white-space:nowrap"><button class="film-toggle" onclick="event.stopPropagation();toggleOrderFilms(\'' + o.id + '\',this)" title="Показать расход плёнки">▸</button>' + (o.contract || o.id) + '</td>' +

// Переключить «Проверено» из таблицы дашборда (оптимистично + сразу обновляет данные)
function toggleOrderVerDash(id, btn) {
  if (!id) return;
  var recent = (App._dashCache && App._dashCache.data && App._dashCache.data.recentOrders) || [];
  var o = recent.find(function(x){ return String(x.id) === String(id); });
  var prev = o ? !!o.verified : false;
  var willOn = !prev;
  if (o) o.verified = willOn;
  if (btn) { btn.className = 'ver-btn ' + (willOn ? 'ver-on' : 'ver-off'); btn.textContent = willOn ? '✓' : 'проверено'; }
  var trDash = btn ? btn.closest('tr') : null;
  if (trDash) trDash.classList.toggle('row-verified', willOn);   // подсветка строки сразу
  App.orders = []; App._cardCache = {};  // список заказов пересоберётся с новым статусом проверки
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) {
        if (o) o.verified = prev;
        if (btn) { btn.className = 'ver-btn ' + (prev ? 'ver-on' : 'ver-off'); btn.textContent = prev ? '✓' : 'проверено'; }
        if (trDash) trDash.classList.toggle('row-verified', prev);
        toast('Ошибка: ' + (resp ? resp.error : ''), 'error');
      } else {
        toast(resp.data.verified ? 'Отмечено как проверенное' : 'Проверка снята', 'success');
      }
    })
    .withFailureHandler(function(e){
      if (o) o.verified = prev;
      if (btn) { btn.className = 'ver-btn ' + (prev ? 'ver-on' : 'ver-off'); btn.textContent = prev ? '✓' : 'проверено'; }
      if (trDash) trDash.classList.toggle('row-verified', prev);
      toast('Ошибка: ' + e.message, 'error');
    })
    .setOrderVerifiedAll(id, willOn);
}

// Удаление заказа прямо с главной (дашборд) — мягкое, в Корзину (обратимо)
function deleteOrderFromDash(id) {
  if (!id) return;
  var recent = (App._dashCache && App._dashCache.data && App._dashCache.data.recentOrders) || [];
  var o = recent.find(function(x){ return String(x.id) === String(id); });
  var num = o ? (o.contract || id) : id;
  var sum = o ? (Number(o.price) || 0) : 0;
  uiConfirm('Удалить заказ ' + num + (sum ? (' на ' + sum.toLocaleString('ru') + ' ' + CUR) : '') + '?\n\nЗаказ скроется со всех списков и досок. Его можно вернуть из «Корзины».',
    function() {
      // Оптимистично: убираем из списка недавних сразу, сервер — в фоне, откат при ошибке
      var removedRecent = o;
      if (App._dashCache && App._dashCache.data && App._dashCache.data.recentOrders) {
        App._dashCache.data.recentOrders = App._dashCache.data.recentOrders.filter(function(x){ return String(x.id) !== String(id); });
      }
      App.orders = (App.orders || []).filter(function(x){ return String(x['ID']) !== String(id); });
      App._debtCache = null; App._cardCache = {};
      renderDashboard(false);   // из обновлённого кэша — без скелетона и без ожидания сервера
      toast('Заказ удалён (в Корзине)', 'success');
      var restore = function(msg){
        if (removedRecent && App._dashCache && App._dashCache.data && App._dashCache.data.recentOrders) {
          App._dashCache.data.recentOrders.unshift(removedRecent);
          renderDashboard(false);
        }
        toast(msg, 'error');
      };
      google.script.run
        .withSuccessHandler(function(resp){ if (!resp || !resp.ok) restore('Не удалось удалить — вернул заказ: ' + (resp ? resp.error : '')); })
        .withFailureHandler(function(e){ restore('Ошибка: ' + e.message + ' — вернул заказ'); })
        .softDeleteOrder(id);
    },
    { title: 'Удалить заказ', okText: 'Удалить', danger: true });
}

function getPeriodRange(period) {
  var now   = new Date();
  var year  = now.getFullYear();
  var month = now.getMonth();
  var day   = now.getDate();
  if (period === 'today')      return { from: new Date(year, month, day).toISOString(),            to: new Date(year, month, day, 23, 59, 59).toISOString() };
  if (period === 'week')       return { from: new Date(year, month, day - 6).toISOString(),         to: new Date(year, month, day, 23, 59, 59).toISOString() };
  if (period === 'month')      return { from: new Date(year, month, 1).toISOString(),               to: new Date(year, month+1, 0, 23, 59, 59).toISOString() };
  if (period === 'prev_month') return { from: new Date(year, month-1, 1).toISOString(),             to: new Date(year, month, 0, 23, 59, 59).toISOString() };
  if (period === 'quarter')    return { from: new Date(year, Math.floor(month/3)*3, 1).toISOString(),to: now.toISOString() };
  if (period === 'half')       return { from: new Date(year, month, 1).toISOString(),               to: now.toISOString() };
  if (period === 'year')       return { from: new Date(year, 0, 1).toISOString(),                   to: new Date(year, 11, 31, 23, 59, 59).toISOString() };
  if (period === 'all')        return {};
  return {};
}

// Читает диапазон дат из UI для страниц с prefix-from/to и prefix-period
// Запоминаем выбранный период страницы (пресет + даты), чтобы не сбрасывался при навигации
function savePeriod_(prefix) {
  try {
    var g = function(id){ var e = document.getElementById(id); return e ? e.value : ''; };
    localStorage.setItem('sprauto-period-' + prefix, JSON.stringify({
      period: g(prefix + '-period'), from: g(prefix + '-from'), to: g(prefix + '-to')
    }));
  } catch (e) {}
}
function restorePeriod_(prefix) {
  try {
    var raw = localStorage.getItem('sprauto-period-' + prefix);
    if (!raw) return;
    var s = JSON.parse(raw);
    var set = function(id, v){ var e = document.getElementById(id); if (e && v != null && v !== '') e.value = v; };
    set(prefix + '-period', s.period); set(prefix + '-from', s.from); set(prefix + '-to', s.to);
    var cw = document.getElementById(prefix + '-custom-range');
    if (cw && s.period) cw.style.display = (s.period === 'custom') ? 'flex' : 'none';
  } catch (e) {}
}

function getPeriodRangeFromUI(prefix) {
  savePeriod_(prefix);
  var period = (document.getElementById(prefix + '-period') || {}).value || 'month';
  if (period === 'custom') {
    var fromVal = (document.getElementById(prefix + '-from') || {}).value;
    var toVal   = (document.getElementById(prefix + '-to')   || {}).value;
    return {
      from: fromVal ? new Date(fromVal).toISOString() : null,
      to:   toVal   ? new Date(toVal + 'T23:59:59').toISOString() : null,
    };
  }
  return getPeriodRange(period);
}

// Показывает/скрывает поля дат при выборе "Произвольный…" в любом select
function _onPeriodChange(prefix, loadFn) {
  var period    = (document.getElementById(prefix + '-period') || {}).value;
  var customWrap = document.getElementById(prefix + '-custom-range');
  if (customWrap) customWrap.style.display = (period === 'custom') ? 'flex' : 'none';
  if (period !== 'custom') loadFn();
}

// ЗП: пресет периода заполняет поля дат «с — по» (которые всегда видны и редактируются вручную)
function onSalPeriodChange() {
  var p = (document.getElementById('sal-period') || {}).value;
  if (p === 'custom') return;   // даты задаёт пользователь вручную
  var n = new Date(), y = n.getFullYear(), m = n.getMonth();
  var from, to;
  if (p === 'prev_month')   { from = new Date(y,m-1,1); to = new Date(y,m,0); }
  else if (p === 'h1')      { from = new Date(y,m,1);   to = new Date(y,m,15); }
  else if (p === 'h2')      { from = new Date(y,m,16);  to = new Date(y,m+1,0); }
  else                      { from = new Date(y,m,1);   to = new Date(y,m+1,0); } // month
  var setd = function(id, d){
    var el = document.getElementById(id);
    if (el && d) el.value = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  };
  setd('sal-from', from); setd('sal-to', to);
  savePeriod_('sal');
}

// Включение/выключение режима сравнения
function toggleExpCompare() {
  App._expCompare = !App._expCompare;
  var btn  = document.getElementById('exp-compare-btn');
  var wrap = document.getElementById('exp-compare-range');
  if (btn)  btn.style.background  = App._expCompare ? 'var(--accent-soft)' : '';
  if (btn)  btn.style.color       = App._expCompare ? 'var(--accent)' : '';
  if (wrap) wrap.style.display    = App._expCompare ? 'flex' : 'none';

  // Подставляем "прошлый период" по умолчанию при включении сравнения
  if (App._expCompare) {
    var range = getPeriodRangeFromUI('exp');
    if (range.from && range.to) {
      var ms   = new Date(range.to) - new Date(range.from);
      var cmpTo   = new Date(new Date(range.from) - 1);
      var cmpFrom = new Date(cmpTo - ms);
      var toISO = function(d){ return d.toISOString().slice(0,10); };
      var cmpFromEl = document.getElementById('exp-cmp-from');
      var cmpToEl   = document.getElementById('exp-cmp-to');
      if (cmpFromEl && !cmpFromEl.value) cmpFromEl.value = toISO(cmpFrom);
      if (cmpToEl   && !cmpToEl.value)   cmpToEl.value   = toISO(cmpTo);
    }
  }
  loadExpenses();
}

function loadExpenses() {
  var tbody = document.getElementById('expenses-tbody');
  var range  = getPeriodRangeFromUI('exp');
  var filter = { from: range.from || null, to: range.to || null };
  var expKey = (filter.from || '') + '_' + (filter.to || '');

  // Простой режим: мгновенно из кэша того же периода, свежие данные — в фоне
  if (!App._expCompare && App._expCache && App._expCache.key === expKey) {
    App._expenses = App._expCache.data;
    renderExpensesTable(App._expenses); updateExpensesKpi(App._expenses, null);
  } else if (tbody) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text3)">Загрузка...</td></tr>';
  }

  if (App._expCompare) {
    // Два параллельных запроса
    var cmpFrom = (document.getElementById('exp-cmp-from') || {}).value;
    var cmpTo   = (document.getElementById('exp-cmp-to')   || {}).value;
    var filterB = {
      from: cmpFrom ? new Date(cmpFrom).toISOString()              : null,
      to:   cmpTo   ? new Date(cmpTo + 'T23:59:59').toISOString()  : null,
    };

    App._expLoading = 2;
    App._expDataA   = null;
    App._expDataB   = null;

    google.script.run
      .withSuccessHandler(function(resp) {
        App._expDataA = (resp && resp.ok) ? (resp.data || []) : [];
        if (--App._expLoading === 0) _renderExpensesWithCompare();
      })
      .withFailureHandler(function(e){ toast('Ошибка загрузки: ' + e.message, 'error'); })
      .getExpenses(filter);

    google.script.run
      .withSuccessHandler(function(resp) {
        App._expDataB = (resp && resp.ok) ? (resp.data || []) : [];
        if (--App._expLoading === 0) _renderExpensesWithCompare();
      })
      .withFailureHandler(function(e){ toast('Ошибка загрузки: ' + e.message, 'error'); })
      .getExpenses(filterB);

  } else {
    google.script.run
      .withSuccessHandler(function(resp) {
        if (!resp || !resp.ok) {
          toast('Ошибка расходов: ' + (resp ? resp.error : 'нет ответа'), 'error');
          if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--danger)">Ошибка загрузки</td></tr>';
          return;
        }
        App._expenses = resp.data || [];
        App._expCache = { key: expKey, data: App._expenses };
        renderExpensesTable(App._expenses);
        updateExpensesKpi(App._expenses, null);
      })
      .withFailureHandler(function(e) {
        toast('Ошибка: ' + e.message, 'error');
        if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--danger)">' + e.message + '</td></tr>';
      })
      .getExpenses(filter);
  }
}

function _renderExpensesWithCompare() {
  App._expenses = App._expDataA || [];
  renderExpensesTable(App._expenses);
  updateExpensesKpi(App._expenses, App._expDataB || []);
}

function filterExpenses() {
  var cat    = (document.getElementById('exp-cat-filter') || {}).value || '';
  var search = ((document.getElementById('exp-search') || {}).value || '').toLowerCase();
  var list   = App._expenses.filter(function(e) {
    if (cat    && e['Категория'] !== cat) return false;
    if (search && !String(e['Описание']||'').toLowerCase().includes(search) &&
                  !String(e['Категория']||'').toLowerCase().includes(search)) return false;
    return true;
  });
  renderExpensesTable(list);
}

function renderExpensesTable(list) {
  var tbody  = document.getElementById('expenses-tbody');
  var footer = document.getElementById('expenses-footer');
  if (!tbody) return;

  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text3)">Расходов за выбранный период нет</td></tr>';
    if (footer) footer.textContent = '';
    return;
  }

  // Новые расходы — сверху (по дате/времени создания, убыв.)
  list = list.slice().sort(function(a, b){ return expSortKey_(b) - expSortKey_(a); });

  var inp = 'padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:var(--inp);color:var(--text);font-size:12px;width:100%;box-sizing:border-box';
  var total = 0;
  tbody.innerHTML = list.map(function(e) {
    var sum = Number(e['Сумма']) || 0;
    total += sum;
    var id  = e['ID'];
    var cats = EXP_CATS_.map(function(c){ return '<option' + (String(e['Категория'])===c?' selected':'') + '>' + c + '</option>'; }).join('');
    var pm  = e['Способ оплаты'] || 'Нал';
    var pmOpts = ['Нал','Безнал'].map(function(m){ return '<option' + (pm===m?' selected':'') + '>' + m + '</option>'; }).join('');
    return '<tr>' +
      '<td style="white-space:nowrap"><input type="date" value="' + ddmmyyyyToIso_(e['Дата']) + '" onchange="saveExpField_(\'' + id + '\',\'date\',this.value)" style="' + inp + ';width:132px"></td>' +
      '<td style="min-width:150px"><select onchange="saveExpField_(\'' + id + '\',\'category\',this.value)" style="' + inp + '">' + cats + '</select></td>' +
      '<td><input value="' + String(e['Описание']||'').replace(/"/g,'&quot;') + '" placeholder="описание" onchange="saveExpField_(\'' + id + '\',\'description\',this.value)" style="' + inp + '"></td>' +
      '<td style="width:120px"><input type="number" step="0.01" value="' + sum + '" onchange="saveExpField_(\'' + id + '\',\'amount\',this.value)" style="' + inp + ';text-align:right"></td>' +
      '<td style="width:100px"><select onchange="saveExpField_(\'' + id + '\',\'payMethod\',this.value)" style="' + inp + '">' + pmOpts + '</select></td>' +
      '<td style="text-align:right"><button class="btn btn-ghost" style="padding:2px 8px;font-size:11px;color:var(--danger)" onclick="deleteExp(\'' + id + '\')">Удалить</button></td>' +
    '</tr>';
  }).join('');

  if (footer) footer.textContent = 'Записей: ' + list.length + ' · Итого: ' + total.toLocaleString('ru') + ' ' + CUR;
}

var EXP_CATS_ = ['Материалы','Аренда','Коммунальные','Зарплата','Бонусы','Маркетинг','Налоги','Транспорт','Инструмент','Закупка товаров','Изъятие владельца','Прочее'];

// Ключ сортировки расхода: дата+время создания (убыв. = новые сверху)
function expSortKey_(e) {
  var s = String(e['Создан'] || e['Дата'] || '');
  var m = s.match(/^(\d{2})\.(\d{2})\.(\d{4})(?:\s+(\d{2}):(\d{2}))?/);
  if (!m) return 0;
  return new Date(+m[3], +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0)).getTime();
}

// Правка поля расхода прямо в таблице (автосохранение)
function saveExpField_(id, field, value) {
  var payload = {};
  if (field === 'date')        payload.date = isoToDdmmyyyy_(value);
  else if (field === 'amount') payload.amount = Number(value) || 0;
  else if (field === 'category')    payload.category = value;
  else if (field === 'description') payload.description = value;
  else if (field === 'payMethod')   payload.payMethod = value;
  // Локально обновляем модель → пересчёт KPI/итога без потери фокуса
  var rec = (App._expenses || []).find(function(x){ return String(x['ID']) === String(id); });
  if (rec) {
    if (field === 'date') rec['Дата'] = payload.date;
    else if (field === 'category') rec['Категория'] = value;
    else if (field === 'description') rec['Описание'] = value;
    else if (field === 'amount') rec['Сумма'] = payload.amount;
    else if (field === 'payMethod') rec['Способ оплаты'] = value;
    updateExpensesKpi(App._expenses, null);
    var footer = document.getElementById('expenses-footer');
    if (footer) {
      var t = (App._expenses || []).reduce(function(s,x){ return s + (Number(x['Сумма'])||0); }, 0);
      footer.textContent = 'Записей: ' + App._expenses.length + ' · Итого: ' + t.toLocaleString('ru') + ' ' + CUR;
    }
  }
  App._expCache = null; App._dashCache = null; App._kassaCache = null;
  google.script.run
    .withSuccessHandler(function(resp){ if (!resp || !resp.ok) toast('Ошибка сохранения расхода', 'error'); })
    .withFailureHandler(function(e){ toast('Ошибка: ' + e.message, 'error'); })
    .updateExpense(id, payload);
}

    '@page{size:A4;margin:14mm}*{box-sizing:border-box}' +
    'body{font-family:"Times New Roman",serif;font-size:11pt;color:#000;margin:0}' +
    '.doc{max-width:180mm;margin:0 auto;position:relative;z-index:1}' +
    'h2{text-align:center;margin:3px 0;font-size:13pt}h3{font-size:11pt;margin:10px 0 4px}' +
    'table{width:100%;border-collapse:collapse;margin:6px 0}' +
    'td,th{border:1px solid #000;padding:3px 6px;font-size:10pt}th{background:#eee}' +
    '@media print{.noprint{display:none}}' +
    '</style></head><body>' +
    '<div class="noprint" style="text-align:right;margin:8px 14px"><button onclick="window.print()" style="padding:8px 20px;font-size:13px;cursor:pointer">🖨 Распечатать</button></div>' +
    wm + '<div class="doc">' +
      (logo ? '<img src="' + logo + '" style="height:56px;display:block;margin:0 auto 6px">' : '') +
      '<h2>' + (brand.companyName || 'Расходы') + '</h2>' +
      '<h2>Отчёт по расходам ' + periodLabel + '</h2>' +
      '<p style="text-align:center;font-size:9.5pt;color:#333">Сформировано: ' + new Date().toLocaleString('ru') + '</p>' +

        '<tr><td style="text-align:right"><b>ИТОГО</b></td><td style="text-align:right"><b>' + f(total) + '</b></td></tr></tbody></table>' +

  if (w) { w.document.write(html); w.document.close(); }
  else toast('Разрешите всплывающие окна, чтобы открыть отчёт', 'error');
}

function updateExpensesKpi(list, compare) {
  var sum = function(arr, cats) {
    return arr.reduce(function(acc, e) {
      var c = e['Категория'] || '';
      var s = Number(e['Сумма']) || 0;
      return acc + (cats ? (cats.indexOf(c) >= 0 ? s : 0) : s);
    }, 0);
  };

  var total = sum(list);
  var fixed = sum(list, ['Аренда','Коммунальные']);
  var mkt   = sum(list, ['Маркетинг']);
  var trans = sum(list, ['Транспорт']);

  var fmt = function(n){ return Math.round(n).toLocaleString('ru') + ' ' + CUR; };
  var set = function(id,v){ var el=document.getElementById(id); if(el) el.textContent=v; };
  set('exp-total',    fmt(total));
  set('exp-fixed',    fmt(fixed));
  set('exp-marketing',fmt(mkt));
  set('exp-transport',fmt(trans));

  // Дельта при сравнении
  if (compare && compare.length >= 0) {
    var cTotal = sum(compare);
    var cFixed = sum(compare, ['Аренда','Коммунальные']);
    var cMkt   = sum(compare, ['Маркетинг']);
    var cTrans = sum(compare, ['Транспорт']);

    var delta = function(a, b, elId) {
      var el = document.getElementById(elId);
      if (!el) return;
      if (b <= 0) { el.textContent = ''; return; }
      var pct  = Math.round((a - b) / b * 100);
      var sign = pct > 0 ? '+' : '';
      var col  = pct > 0 ? 'var(--danger)' : 'var(--success)';
      el.innerHTML = '<span style="color:' + col + ';font-weight:600">' + sign + pct + '%</span> vs пред. период (' + fmt(b) + ')';
    };

    delta(total, cTotal, 'exp-total-delta');
    delta(fixed, cFixed, 'exp-fixed-delta');
    delta(mkt,   cMkt,   'exp-marketing-delta');
    delta(trans, cTrans, 'exp-transport-delta');
  } else {
    ['exp-total-delta','exp-fixed-delta','exp-marketing-delta','exp-transport-delta'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.textContent = '';
    });
  }
}

// Открыть форму расхода: заполнить категории, спрятать выбор сотрудника
function openExpenseModal() {
  fillExpenseCategoryOptions_();
  toggleExpenseEmployee_();
  openModal('modal-new-expense');
}

function fillExpenseCategoryOptions_() {
  var sel = document.getElementById('exp-category');
  if (!sel) return;
  var cur = sel.value;
  var html = ['<option value="">— выбрать —</option>'];
  expenseCategoryList_().forEach(function(c){
    html.push('<option' + (c.deduct ? ' data-deduct="1"' : '') + '>' + c.name + '</option>');
  });
  sel.innerHTML = html.join('');
  if (cur) sel.value = cur;
}

// Показать выбор сотрудника только для «зарплатных» категорий (вычитаемых из ЗП)
function toggleExpenseEmployee_() {
  var sel = document.getElementById('exp-category');
  var row = document.getElementById('exp-employee-row');
  if (!sel || !row) return;
  var opt = sel.options[sel.selectedIndex];
  var isSalary = !!(opt && opt.getAttribute('data-deduct') === '1');
  row.style.display = isSalary ? '' : 'none';
  if (isSalary) fillExpenseEmployees_();
}

function fillExpenseEmployees_() {
  var sel = document.getElementById('exp-employee');
  if (!sel) return;
  var render = function(list){
    var cur = sel.value;
    var html = ['<option value="">— выбрать —</option>'];
    (list || []).forEach(function(e){
      var nm = e['ФИО'] || e['Имя'] || '';
      if (!nm || !e['ID']) return;
      html.push('<option value="' + e['ID'] + '">' + nm + '</option>');
    });
    sel.innerHTML = html.join('');
    if (cur) sel.value = cur;
  };
  if (App.employees && App.employees.length) { render(App.employees); return; }
  google.script.run.withSuccessHandler(function(resp){
    App.employees = (resp && resp.ok && resp.data) ? resp.data : [];
    render(App.employees);
  }).getEmployees(true);
}

function submitNewExpense() {
  var amount   = Number((document.getElementById('exp-amount')   ||{}).value||0);
  var category = ((document.getElementById('exp-category')||{}).value||'').trim();
  if (!amount)   { toast('Укажите сумму','error'); return; }
  if (!category) { toast('Выберите категорию','error'); return; }

  // Для «зарплатных» категорий обязателен сотрудник — иначе вычесть не из кого
  var empRow = document.getElementById('exp-employee-row');
  var isSalary = empRow && empRow.style.display !== 'none';
  var employeeId = isSalary ? ((document.getElementById('exp-employee')||{}).value||'').trim() : '';
  if (isSalary && !employeeId) { toast('Выберите сотрудника для вычета из ЗП','error'); return; }

  // Установим сегодня если дата пустая
  var dateEl = document.getElementById('exp-date');
  if (dateEl && !dateEl.value) {
    var now = new Date();
    dateEl.value = now.toISOString().slice(0,10);
  }

  var payload = {
    date:        dateEl ? dateEl.value.split('-').reverse().join('.') : '',
    amount:      amount,
    category:    category,
    description: ((document.getElementById('exp-description')||{}).value||'').trim(),
    payMethod:   (document.getElementById('exp-pay-method')||{}).value||'Нал',
    orderId:     ((document.getElementById('exp-order-id')||{}).value||'').trim(),
    employeeId:  employeeId,
  };

  var btn = document.getElementById('exp-submit-btn');
  if (btn) { btn.disabled=true; btn.textContent='Сохраняем...'; }

  google.script.run
    .withSuccessHandler(function(resp) {
      if (btn) { btn.disabled=false; btn.textContent='Сохранить'; }
      if (!resp||!resp.ok) { toast('Ошибка: '+(resp?resp.error:''),'error'); return; }
      toast('Расход записан','success');
      closeModal('modal-new-expense');
      ['exp-amount','exp-description','exp-order-id'].forEach(function(id){
        var el=document.getElementById(id); if(el) el.value='';
      });
      if (App.currentPage==='expenses') loadExpenses();
    })
    .withFailureHandler(function(e){ if(btn){btn.disabled=false;btn.textContent='Сохранить';} toast('Ошибка: '+e.message,'error'); })
    .createExpense(payload);
}

function deleteExp(id) {
  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp||!resp.ok) { toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); return; }

    })
    .withFailureHandler(function(e){ toast('Ошибка: ' + e.message, 'error'); })

/* ===== ДЕБИТОРКА И РАССРОЧКИ ===== */

function loadDebt() {
  var tbody = document.getElementById('debt-tbody');
  // Мгновенно из кэша (если уже открывали), свежие данные подтянем в фоне
  if (App._debtRows) renderDebtTable(App._debtRows);
  else if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text3)">Загрузка...</td></tr>';

  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) {
        if (!App._debtRows && tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--danger)">' + (resp ? resp.error : 'Ошибка загрузки') + '</td></tr>';
        return;
      }
      App._debtRows = resp.data || [];
      renderDebtTable(App._debtRows);
    })
    .withFailureHandler(function(e) {
      if (!App._debtRows && tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--danger)">' + e.message + '</td></tr>';
    })
    .getDebtOrders();
}

function renderDebtTable(rows) {
  var tbody  = document.getElementById('debt-tbody');
  var footer = document.getElementById('debt-footer');
  if (!tbody) return;

  // KPI
  var totalRemaining = 0, overdueCount = 0, partialCount = 0;
  rows.forEach(function(r) {
    totalRemaining += r.remaining;
    if (r.isOverdue)         overdueCount++;
    if (r.beznal === 'Частично') partialCount++;
  });

  var fmt = function(n){ return (Math.round(n*100)/100).toLocaleString('ru') + ' ' + CUR; };
  var set = function(id, v){ var el = document.getElementById(id); if (el) el.textContent = v; };
  set('debt-total',   fmt(totalRemaining));
  set('debt-count',   rows.length);
  set('debt-overdue', overdueCount);
  set('debt-partial', partialCount);

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--success);font-size:15px">✅ Дебиторки нет — все оплачено!</td></tr>';
    if (footer) footer.textContent = '';
    return;
  }

  tbody.innerHTML = rows.map(function(r) {
    // Цвет строки и метка срока
    var rowStyle = '';
    var dueCell  = '';

    if (r.dueDate) {
      if (r.isOverdue) {
        rowStyle = 'border-left:3px solid var(--danger);';
        var overDays = Math.abs(r.daysUntilDue);
        dueCell = '<div style="font-weight:700;color:var(--danger)">просрочено ' + overDays + ' д.</div>' +
                  '<div style="font-size:10px;color:var(--text3)">' + r.dueDate + '</div>';
      } else if (r.daysUntilDue === 0) {
        rowStyle = 'border-left:3px solid #f59e0b;';
        dueCell = '<div style="font-weight:700;color:#f59e0b">сегодня</div>' +
                  '<div style="font-size:10px;color:var(--text3)">' + r.dueDate + '</div>';
      } else if (r.daysUntilDue <= 3) {
        rowStyle = 'border-left:3px solid #f59e0b;';
        dueCell = '<div style="font-weight:600;color:#f59e0b">через ' + r.daysUntilDue + ' д.</div>' +
                  '<div style="font-size:10px;color:var(--text3)">' + r.dueDate + '</div>';
      } else {
        dueCell = '<div style="color:var(--text2)">через ' + r.daysUntilDue + ' д.</div>' +
                  '<div style="font-size:10px;color:var(--text3)">' + r.dueDate + '</div>';
      }
    } else {
      dueCell = '<span style="font-size:11px;color:var(--text3)">не задан</span>';
    }

    var beznalBadge = r.beznal === 'Частично'
      ? '<span style="font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(245,158,11,.15);color:#f59e0b;white-space:nowrap">рассрочка</span>'
      : '<span style="font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(220,53,69,.1);color:var(--danger);white-space:nowrap">долг</span>';

    var remainingStr = fmt(r.remaining);
    var clientSafe = r.client.replace(/'/g, "\\'");
    var dueDateSafe = r.dueDate.replace(/'/g, "\\'");

    return '<tr style="cursor:pointer;' + rowStyle + '" onclick="openOrderCard(\'' + r.id + '\')">' +
      '<td>' +
        '<div style="font-weight:600;font-size:12px">' + (r.contract || r.id) + '</div>' +
        '<div style="margin-top:3px">' + beznalBadge + '</div>' +
      '</td>' +
      '<td>' +
        '<div style="font-weight:500;font-size:13px">' + r.client + '</div>' +
        '<div style="font-size:11px;color:var(--text3)">' + r.phone + '</div>' +
      '</td>' +
      '<td>' +
        '<div style="font-size:12px">' + r.car + '</div>' +
        '<div style="font-size:11px;color:var(--text3)">' + r.service + '</div>' +
      '</td>' +
      '<td style="text-align:right">' +
        '<div style="font-weight:700;color:var(--danger);font-size:14px">' + remainingStr + '</div>' +
        (r.paid > 0 ? '<div style="font-size:10px;color:var(--success)">оплачено: ' + fmt(r.paid) + '</div>' : '') +
      '</td>' +
      '<td>' + dueCell + '</td>' +
      '<td onclick="event.stopPropagation()" style="white-space:nowrap">' +
        '<button onclick="event.stopPropagation();openPayOrderModal(\'' + r.id + '\',\'' + clientSafe + '\',' + r.price + ',\'' + dueDateSafe + '\')" ' +
          'style="padding:4px 10px;font-size:11px;font-weight:600;background:rgba(34,197,94,.15);color:var(--success);border:1px solid rgba(34,197,94,.3);border-radius:6px;cursor:pointer;margin-right:4px">+ Оплата</button>' +
        '<button onclick="event.stopPropagation();openSetDueDateModal(\'' + r.id + '\',\'' + dueDateSafe + '\',\'' + clientSafe + '\')" ' +
          'style="padding:4px 8px;font-size:11px;background:var(--bg-hover);border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--text2)">📅 Срок</button>' +
      '</td>' +
    '</tr>';
  }).join('');

  if (footer) footer.textContent = 'Итого к получению: ' + fmt(totalRemaining) + ' · ' + rows.length + ' заказов';
  makeColumnsResizable(document.getElementById('debt-table'));   // регулируемые + сохраняемые колонки
}

function parseClientDate(str) {
  if (!str) return null;
  var m = String(str).match(/^(\d{2})\.(\d{2})\.(\d{4})/);
  return m ? new Date(+m[3], +m[2]-1, +m[1]) : null;
}

App._setDueDateOrderId = null;

function openSetDueDateModal(orderId, currentDueDate, clientName) {
  App._setDueDateOrderId = orderId;
  var titleEl = document.getElementById('set-due-date-client');
  var inputEl = document.getElementById('set-due-date-input');
  if (titleEl) titleEl.textContent = clientName || '';
  if (inputEl) {
    // Конвертируем dd.MM.yyyy → YYYY-MM-DD для date input
    var m = currentDueDate ? String(currentDueDate).match(/^(\d{2})\.(\d{2})\.(\d{4})/) : null;
    inputEl.value = m ? m[3] + '-' + m[2] + '-' + m[1] : '';
  }
  openModal('modal-set-due-date');
}

function confirmSetDueDate() {
  var id      = App._setDueDateOrderId;
  var dateVal = (document.getElementById('set-due-date-input') || {}).value || '';
  if (!id) return;

  var btn = document.getElementById('set-due-date-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Сохраняем...'; }

  google.script.run
    .withSuccessHandler(function(resp) {
      if (btn) { btn.disabled = false; btn.textContent = 'Сохранить'; }
      if (!resp || !resp.ok) { toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); return; }
      toast(dateVal ? 'Срок оплаты установлен' : 'Срок сброшен', 'success');
      closeModal('modal-set-due-date');
      if (App.currentPage === 'debt') loadDebt();
    })
    .withFailureHandler(function(e) {
      if (btn) { btn.disabled = false; btn.textContent = 'Сохранить'; }
      toast('Ошибка: ' + e.message, 'error');
    })
    .setOrderDueDate(id, dateVal);
}

  tb.innerHTML = list.map(function(s, i){

    .withSuccessHandler(function(resp) {

function renderDDS_(d) {
  var fmt    = function(n){ return (Number(n)||0).toLocaleString('ru') + ' ' + CUR; };

    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = v;
    if (color) el.style.color = color;
  };
  var s = d.summary;

      // Касса
      set('dds-nal',     fmt(s.totalNal),    'var(--success)');
      set('dds-exp-nal', fmt(s.expNal),      'var(--danger)');
      set('dds-kassa',   fmt(s.kassaBalance), s.kassaBalance >= 0 ? 'var(--success)' : 'var(--danger)');

      // Р/счёт
      set('dds-beznal-gross', fmt(s.totalBeznal));
      set('dds-beznal-net',   fmt(s.totalBeznalNet), 'var(--success)');
      set('dds-exp-bnk',      fmt(s.expBnk),         'var(--danger)');
      set('dds-bank',         fmt(s.bankBalance), s.bankBalance >= 0 ? 'var(--success)' : 'var(--danger)');

      // Дебиторка
      set('dds-debt',       fmt(s.totalDebt), '#f59e0b');
      set('dds-debt-count', s.debtCount + ' заказов без оплаты');

      // Таблица нал
      var nalTbody = document.getElementById('dds-nal-tbody');
      if (nalTbody) nalTbody.innerHTML = d.nalRows.length
        ? d.nalRows.map(function(r) {
            return '<tr><td style="font-size:11px;color:var(--text3)">' + (r.date||'') + '</td>' +
              '<td style="font-size:12px">' + (r.desc||'') + '</td>' +
              '<td style="text-align:right;font-weight:600;color:var(--success)">' + (Number(r.amount)||0).toLocaleString('ru') + ' ' + CUR + '</td></tr>';
          }).join('')
        : '<tr><td colspan="3" style="text-align:center;color:var(--text3);padding:12px">Нет нал оплат</td></tr>';

      // Таблица безнал
      var bnkTbody = document.getElementById('dds-bnk-tbody');
      if (bnkTbody) bnkTbody.innerHTML = d.beznalRows.length
        ? d.beznalRows.map(function(r) {
            return '<tr><td style="font-size:11px;color:var(--text3)">' + (r.date||'') + '</td>' +
              '<td style="font-size:12px">' + (r.desc||'') +
                '<div style="font-size:10px;color:var(--text3)">−15% = ' + (Number(r.fee)||0).toFixed(2) + ' ' + CUR + '</div></td>' +
              '<td style="text-align:right;font-weight:600;color:var(--accent)">' + (Number(r.net)||0).toLocaleString('ru') + ' ' + CUR + '</td></tr>';
          }).join('')
        : '<tr><td colspan="3" style="text-align:center;color:var(--text3);padding:12px">Нет безнал оплат</td></tr>';

      // Расходы (все вместе)
      var expTbody = document.getElementById('dds-expense-tbody');
      var allExp   = (d.expNalRows||[]).concat(d.expBnkRows||[]).sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
      if (expTbody) expTbody.innerHTML = allExp.length
        ? allExp.map(function(r) {
            return '<tr><td style="font-size:11px;color:var(--text3)">' + (r.date||'') + '</td>' +
              '<td style="font-size:11px"><span style="padding:1px 5px;border-radius:6px;background:var(--bg-hover)">' + (r.category||'') + '</span></td>' +
              '<td style="text-align:right;font-weight:600;color:var(--danger)">' + (Number(r.amount)||0).toLocaleString('ru') + ' ' + CUR + '</td></tr>';
          }).join('')
        : '<tr><td colspan="3" style="text-align:center;color:var(--text3);padding:12px">Нет расходов</td></tr>';
}

function loadCertList_() {

          '<div style="text-align:right;white-space:nowrap"><div style="font-weight:700;color:' + (used?'var(--text3)':'var(--success)') + '">' + fmt(c.remaining) + '</div><div style="font-size:10px;color:var(--text3)">остаток</div></div>' +

    .withSuccessHandler(function(resp){
