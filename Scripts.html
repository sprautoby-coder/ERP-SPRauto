    '<div class="inline-foot">' +
      verBtn +
      '<span style="font-size:12px;color:var(--text2)">Итого плёнка (нетто): <b id="inline-mattot-' + id + '">' + _inlFmt(matTot) + '</b> · Расходы: <b id="inline-exptot-' + id + '">' + _inlFmt(expTot) + '</b></span>' +
      '<span id="inline-status-' + id + '" style="font-size:11px;color:var(--text3);margin-left:auto"></span>' +
    '</div>';
}

// быстрый пересчёт стоимостей/итогов без полной перерисовки (сохраняет фокус ввода)
function inlineRecalc(id) {
  var st = App._inline[id]; if (!st) return;
  var matTot = 0;
  st.mats.forEach(function(m, i){
    var sqm = _matSqm(m), cost = _matCost(m), isOst = m.type === 'остаток'; matTot += cost;
    var se = document.getElementById('inline-sqm-' + id + '-' + i); if (se) se.textContent = sqm.toFixed(2) + ' м²';
    var ce = document.getElementById('inline-cost-' + id + '-' + i);
    if (ce) { ce.textContent = isOst ? '− ' + _inlFmt(Math.abs(cost)) : _inlFmt(cost); ce.style.color = isOst ? 'var(--danger)' : 'inherit'; }
  });
  var expTot = st.exps.reduce(function(s, e){ return s + (Number(e.amount)||0); }, 0);
  var mt = document.getElementById('inline-mattot-' + id); if (mt) mt.textContent = _inlFmt(matTot);
  var et = document.getElementById('inline-exptot-' + id); if (et) et.textContent = _inlFmt(expTot);
}

function inlineNum(id, i, field, val) { var st = App._inline[id]; if (!st) return; st.mats[i][field] = Number(val) || 0; inlineRecalc(id); inlineAutoSave(id); }
function inlineField(id, i, field, val) { var st = App._inline[id]; if (!st) return; st.mats[i][field] = val; inlineRender(id); inlineAutoSave(id); }
function inlineMatSelect(id, i, sel) {
  var st = App._inline[id]; if (!st) return;
  var opt = sel.selectedOptions && sel.selectedOptions[0];
  st.mats[i].matId = sel.value;
  if (opt) {
    st.mats[i].name  = opt.textContent || '';
    st.mats[i].price = Number(opt.dataset.price) || 0;
    st.mats[i].roll  = Number(opt.dataset.roll)  || 1.52;
    if (opt.dataset.unit) st.mats[i].unit = opt.dataset.unit;
  }
  inlineRender(id);
  inlineAutoSave(id);
}
function inlineExp(id, i, field, val) { var st = App._inline[id]; if (!st) return; st.exps[i][field] = (field === 'amount') ? (Number(val)||0) : val; if (field === 'amount') inlineRecalc(id); inlineAutoSave(id); }
function inlineAddMat(id) { var st = App._inline[id]; if (!st) return; st.mats.push({ matId:'', name:'', unit:'пм', qty:0, roll:1.52, price:0, type:'расход' }); inlineRender(id); }
function inlineDelMat(id, i) { var st = App._inline[id]; if (!st) return; st.mats.splice(i,1); inlineRender(id); inlineAutoSave(id); }
function inlineAddExp(id) { var st = App._inline[id]; if (!st) return; st.exps.push({ name:'', amount:0 }); inlineRender(id); }
function inlineDelExp(id, i) { var st = App._inline[id]; if (!st) return; st.exps.splice(i,1); inlineRender(id); inlineAutoSave(id); }

function inlineToggleVer(id) {
  var st = App._inline[id]; if (!st) return;
  var prev = !!st.verified; st.verified = !prev; inlineRender(id);
  App.orders = []; App._cardCache = {}; App._dashCache = null;
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) { st.verified = prev; inlineRender(id); toast('Ошибка: ' + (resp?resp.error:''), 'error'); }
      else toast(resp.data.verified ? 'Отмечено как проверенное' : 'Проверка снята', 'success');
    })
    .withFailureHandler(function(e){ st.verified = prev; inlineRender(id); toast('Ошибка: ' + e.message, 'error'); })
    .toggleOrderVerification(id);
}

App._inlineTimers = {};
App._inlineDirty  = {};

function inlineSetStatus_(id, text, color) {
  var el = document.getElementById('inline-status-' + id);
  if (el) { el.textContent = text; el.style.color = color || 'var(--text3)'; }
}

// Автосохранение инлайн-редактора в таблице (debounce, без перезагрузки таблицы)
function inlineAutoSave(id) {
  App._inlineDirty[id] = true;
  inlineSetStatus_(id, '● не сохранено', 'var(--warning)');
  clearTimeout(App._inlineTimers[id]);
  App._inlineTimers[id] = setTimeout(function(){ inlineFlush_(id); }, 900);
}

function inlineFlush_(id, cb) {
  clearTimeout(App._inlineTimers[id]);
  if (!App._inlineDirty[id]) { if (cb) cb(); return; }
  App._inlineDirty[id] = false;
  var st = App._inline[id]; if (!st) { if (cb) cb(); return; }
  var matLines = st.mats.filter(function(m){ return m.matId || String(m.name||'').trim() || Number(m.qty) > 0; })
    .map(function(m){ return { materialId:m.matId||'', name:m.name||'', unit:m.unit||'пм', qty:Number(m.qty)||0, rollWidth:Number(m.roll)||1.52, pricePerSqm:Number(m.price)||0, type:m.type==='остаток'?'остаток':'расход' }; });
  var expLines = st.exps.filter(function(e){ return String(e.name||'').trim() || Number(e.amount) > 0; })
    .map(function(e){ return { name:e.name||'', amount:Number(e.amount)||0 }; });
  inlineSetStatus_(id, 'сохранение…');
  var fail = function(){ inlineSetStatus_(id, 'ошибка сохранения', 'var(--danger)'); if (cb) cb(); };
  google.script.run.withSuccessHandler(function(r1){
    if (!r1 || !r1.ok) { fail(); return; }
    google.script.run.withSuccessHandler(function(r2){
      if (!r2 || !r2.ok) { fail(); return; }
      google.script.run.withSuccessHandler(function(){
        App.orders = []; App._cardCache = {}; App._dashCache = null; App._debtCache = null;
        inlineSetStatus_(id, '✓ сохранено', 'var(--success)'); if (cb) cb();
      }).withFailureHandler(fail).recalcOrderFinance(id);
    }).withFailureHandler(fail).saveOrderExpenses(id, expLines);
  }).withFailureHandler(fail).saveOrderMaterials(id, matLines);
}

// Досохранить все открытые инлайн-редакторы (перед навигацией)
function flushAllInline_() {
  Object.keys(App._inlineDirty || {}).forEach(function(id){ if (App._inlineDirty[id]) inlineFlush_(id); });
}

/* ===== КАНБАН-ДОСКА ===== */
var KANBAN_COLUMNS = ['Новый', 'В работе', 'Готов', 'Выдан', 'Отменён'];

// Компактный бейдж оплаты для карточки канбана
function kanbanPayBadge_(o) {
  var price     = Number(o['Стоимость заказа']) || 0;
  var paid      = Number(o._paid) || 0;
  var payStatus = String(o['Статус оплаты'] || '').trim() || 'Не оплачен';
  var payType   = String(o['Тип оплаты'] || '').trim();
  if (payStatus === 'Оплачен')
    return '<span class="kanban-badge" style="background:var(--green-soft);color:var(--success)">✓ оплачен</span>';
  if (payStatus === 'Частично')
    return '<span class="kanban-badge" style="background:var(--blue-soft);color:var(--blue)">рассрочка ' + Math.round(price ? paid/price*100 : 0) + '%</span>';
  if (payType === 'Отсрочка')
    return '<span class="kanban-badge" style="background:var(--yellow-soft);color:var(--warning)">отсрочка</span>';
  if (payType === 'Рассрочка')
    return '<span class="kanban-badge" style="background:var(--blue-soft);color:var(--blue)">рассрочка</span>';
  return '<span class="kanban-badge" style="background:var(--red-soft);color:var(--danger)">долг</span>';
}

function renderOrdersKanban(orders) {
  var board = document.getElementById('orders-kanban');
  if (!board) return;
  orders = orders || [];

  // Группируем по статусу
  var byStatus = {};
  KANBAN_COLUMNS.forEach(function(s){ byStatus[s] = []; });
  orders.forEach(function(o){
    var s = o['Статус'] || 'Новый';
    if (!byStatus[s]) byStatus[s] = [];   // на случай нестандартного статуса
    byStatus[s].push(o);
  });

  var esc = function(s){ return String(s||'').replace(/'/g,"\\'"); };
  var html = '';

  Object.keys(byStatus).forEach(function(status){
    if (KANBAN_COLUMNS.indexOf(status) < 0 && byStatus[status].length === 0) return;
    var list  = byStatus[status];
    var color = ORDER_STATUS_COLORS[status] || 'var(--text2)';
    var sum   = list.reduce(function(a, o){ return a + (Number(o['Стоимость заказа']) || 0); }, 0);

    var cards = list.map(function(o){
      var oid    = o['ID'] || '';
      var price  = Number(o['Стоимость заказа']) || 0;
      var isLegal = o._clientType === 'юр';
      return '<div class="kanban-card" draggable="true" style="border-left-color:' + color + '"' +
        ' ondragstart="kanbanDragStart(event,\'' + oid + '\')" ondragend="kanbanDragEnd(event)"' +
        ' onclick="openOrderCard(\'' + oid + '\')">' +
        '<div class="kanban-card-top">' +
          '<span class="kanban-card-num">' + (o['Номер договора'] || oid) + '</span>' +
          '<span class="kanban-card-sum">' + price.toLocaleString('ru') + ' ' + CUR + '</span>' +
        '</div>' +
        '<div class="kanban-card-client">' + (o['Клиент'] || '—') +
          (isLegal ? ' <span class="kanban-badge" style="background:var(--purple-soft);color:var(--purple)">ЮЛ</span>' : '') +
        '</div>' +
        '<div class="kanban-card-car">' + (o['Авто'] || '—') + (o['Госномер'] ? ' · ' + o['Госномер'] : '') + '</div>' +
        '<div class="kanban-card-foot">' +
          kanbanPayBadge_(o) +
          '<span class="kanban-card-svc">' + (o['Услуга'] || '') + '</span>' +
        '</div>' +
      '</div>';
    }).join('');

    html +=
      '<div class="kanban-col" data-status="' + status + '"' +
        ' ondragover="kanbanDragOver(event, this)" ondragleave="kanbanDragLeave(event, this)"' +
        ' ondrop="kanbanDrop(event, this)">' +
        '<div class="kanban-col-head"><span class="kanban-dot" style="background:' + color + '"></span>' + status +
          '<span class="kanban-count">' + list.length + '</span></div>' +
        '<div class="kanban-col-sum">' + Math.round(sum).toLocaleString('ru') + ' ' + CUR + '</div>' +
        '<div class="kanban-col-body">' + (cards || '<div class="kanban-empty">Перетащите сюда</div>') + '</div>' +
      '</div>';
  });

  board.innerHTML = html;
}

// --- Drag & drop ---
var _kanbanDragId = null;

function kanbanDragStart(ev, oid) {
  _kanbanDragId = oid;
  try { ev.dataTransfer.setData('text/plain', oid); ev.dataTransfer.effectAllowed = 'move'; } catch(e){}
  if (ev.currentTarget) ev.currentTarget.classList.add('dragging');
}
function kanbanDragEnd(ev) {
  if (ev.currentTarget) ev.currentTarget.classList.remove('dragging');
  _kanbanDragId = null;
  document.querySelectorAll('.kanban-col.drop-hover').forEach(function(c){ c.classList.remove('drop-hover'); });
}
function kanbanDragOver(ev, col) {
  ev.preventDefault();                       // разрешаем drop
  try { ev.dataTransfer.dropEffect = 'move'; } catch(e){}
  if (col) col.classList.add('drop-hover');
}
function kanbanDragLeave(ev, col) {
  // снимаем подсветку только когда курсор реально покинул колонку
  if (col && !col.contains(ev.relatedTarget)) col.classList.remove('drop-hover');
}
function kanbanDrop(ev, col) {
  ev.preventDefault();
  if (col) col.classList.remove('drop-hover');
  var status = col ? col.getAttribute('data-status') : '';
  var oid = _kanbanDragId;
  try { if (!oid) oid = ev.dataTransfer.getData('text/plain'); } catch(e){}
  _kanbanDragId = null;
  if (oid && status) moveOrderToStatus(oid, status);
}

// Перемещение карточки в новый статус — оптимистично, с откатом при ошибке
function moveOrderToStatus(orderId, newStatus) {
  var order = null;
  for (var i = 0; i < App.orders.length; i++) {
    if (App.orders[i]['ID'] === orderId) { order = App.orders[i]; break; }
  }
  if (!order) return;
  var prevStatus = order['Статус'];
  if (prevStatus === newStatus) return;       // ничего не изменилось

  order['Статус'] = newStatus;                // оптимистично
  filterOrders();                             // мгновенная перерисовка доски

  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) {
        order['Статус'] = prevStatus; filterOrders();
        toast('Ошибка: ' + (resp ? resp.error : ''), 'error');
        return;
      }
      App._dashCache = null;                  // статус влияет на «в работе» на дашборде
      toast('→ ' + newStatus, 'success');
    })
    .withFailureHandler(function(e){
      order['Статус'] = prevStatus; filterOrders();
      toast('Ошибка: ' + e.message, 'error');
    })
    .updateOrderStatus(orderId, newStatus);
}

function changeOrderStatus(orderId, selectEl) {
  var newStatus = selectEl.value;
  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) { toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); return; }
      for (var i = 0; i < App.orders.length; i++) {
        if (App.orders[i]['ID'] === orderId) { App.orders[i]['Статус'] = newStatus; break; }
      }
      toast('Статус обновлён', 'success');
    })
    .withFailureHandler(function(e){ toast('Ошибка: ' + e.message, 'error'); })
    .updateOrderStatus(orderId, newStatus);
}

/* --- Справочник материалов: заполнить select --- */
function fillMaterialSelect(sel, selectedId) {
  sel.innerHTML = '<option value="">— материал —</option>';
  App._materials.forEach(function(m) {
    var opt = document.createElement('option');
    opt.value = m['ID'] || '';
    opt.textContent = m['Название'] + (m['Категория'] ? ' (' + m['Категория'] + ')' : '');
    opt.dataset.unit      = m['Единица']      || 'пм';
    opt.dataset.price     = m['Цена']          || 0;
    opt.dataset.rollWidth = m['Ширина рулона'] || 1.52;
    if (m['ID'] === selectedId) opt.selected = true;
    sel.appendChild(opt);

function addMaterialLine() {
  var idx = App._orderMaterials.length;

    '<select class="line-item-unit" onchange="onMaterialChange(' + idx + ')">' +
      '<option value="пм">пм</option>' +
      '<option value="м²">м²</option>' +
    '</select>' +
    '<input class="line-item-qty" type="number" placeholder="кол-во" min="0" step="0.01" oninput="onMaterialChange(' + idx + ')">' +
    '<select class="line-item-type" onchange="onMaterialChange(' + idx + ')">' +
      '<option value="расход">расход</option>' +
      '<option value="остаток">остаток</option>' +

function onMaterialSelect(sel, idx) {
  var opt = sel.options[sel.selectedIndex];
  if (!opt || !opt.value) return;
  var m = App._orderMaterials[idx];
  if (!m) return;
  m.materialId  = opt.value;
  m.name        = opt.textContent.split(' (')[0];
  m.unit        = opt.dataset.unit      || 'пм';
  m.pricePerSqm = Number(opt.dataset.price)     || 0;
  m.rollWidth   = Number(opt.dataset.rollWidth)  || 1.52;

  var row     = document.getElementById('mat-row-' + idx);
  var unitSel = row ? row.querySelector('.line-item-unit') : null;
  if (unitSel) unitSel.value = m.unit;
  onMaterialChange(idx);
}

function onMaterialChange(idx) {
  var row = document.getElementById('mat-row-' + idx);
  if (!row) return;
  var m = App._orderMaterials[idx];
  if (!m) return;
  var unitSel = row.querySelector('.line-item-unit');
  var qtyInp  = row.querySelector('.line-item-qty');
  var typeSel = row.querySelector('.line-item-type');

  m.unit = unitSel ? unitSel.value : m.unit;
  m.qty  = Number(qtyInp ? qtyInp.value : 0) || 0;
  m.type = typeSel ? typeSel.value : 'расход';

  var qtySqm = (m.unit === 'пм') ? Math.round(m.qty * m.rollWidth * 100) / 100 : m.qty;
  // остаток вычитается из расхода → отрицательная стоимость
  m.cost = Math.round(qtySqm * m.pricePerSqm * 100) / 100 * (m.type === 'остаток' ? -1 : 1);

  var costEl = document.getElementById('mat-cost-' + idx);
  if (costEl) {
    costEl.textContent = (m.type === 'остаток' ? '− ' : '') + Math.abs(m.cost) + ' ' + CUR;
    costEl.style.color = m.type === 'остаток' ? 'var(--danger)' : 'var(--success)';
  }
  recalcOrderPreview();
}

function removeMaterialLine(idx) {
  var row = document.getElementById('mat-row-' + idx);
  if (row) row.remove();
  App._orderMaterials[idx] = null;
  var remaining = App._orderMaterials.filter(function(m){ return m; });
  var empty = document.getElementById('ord-materials-empty');
  if (empty) empty.style.display = remaining.length ? 'none' : 'block';
  recalcOrderPreview();
}

  var idx  = App._orderExpenses.length;
  App._orderExpenses.push({ name:'', amount:0 });

  var list  = document.getElementById('ord-expenses-list');
  var empty = document.getElementById('ord-expenses-empty');
  if (empty) empty.style.display = 'none';

  var hints = App._expenseHints;
  var dOpts = hints.map(function(h){ return '<option value="' + h + '">'; }).join('');

  var row = document.createElement('div');
  row.className = 'line-item-row';
  row.id = 'exp-row-' + idx;
  row.innerHTML =
    '<input class="line-item-name" list="exp-hints-' + idx + '" placeholder="Такси / Арматура..." ' +
      'oninput="onExpenseChange(' + idx + ')">' +
    '<datalist id="exp-hints-' + idx + '">' + dOpts + '</datalist>' +

      'style="max-width:100px" oninput="onExpenseChange(' + idx + ')">' +
    '<span style="font-size:12px;color:var(--text3)">' + CUR + '</span>' +

function removeExpenseLine(idx) {
  var row = document.getElementById('exp-row-' + idx);

  App._orderExpenses[idx] = null;
  var remaining = App._orderExpenses.filter(function(e){ return e; });
  var empty = document.getElementById('ord-expenses-empty');
  if (empty) empty.style.display = remaining.length ? 'none' : 'block';

function recalcOrderPreview() {
  var price   = Number((document.getElementById('ord-price') || {}).value) || 0;
  var payType = App._orderPayType;
  var manager = ((document.getElementById('ord-manager') || {}).value) || '';
  var masters = ((document.getElementById('ord-masters') || {}).value) || '';

  var totalMat = App._orderMaterials.reduce(function(s, m) { return s + (m ? (m.cost || 0) : 0); }, 0);
  var totalExp = App._orderExpenses.reduce(function(s, e)  { return s + (e ? (e.amount || 0) : 0); }, 0);

  // Показываем итоги строк
  var matTotEl = document.getElementById('prev-mat-total');
  var expTotEl = document.getElementById('prev-exp-total');
  if (matTotEl) matTotEl.textContent = Math.round(totalMat * 100) / 100 + ' ' + CUR;
  if (expTotEl) expTotEl.textContent = Math.round(totalExp * 100) / 100 + ' ' + CUR;

  if (!price) { var p = document.getElementById('ord-finance-preview'); if(p) p.style.display = 'none'; return; }

  var fmt        = function(n){ return Math.round(n * 100) / 100; };
  var bezDisc    = (payType === 'Безнал') ? price * 0.15 : 0;
  var gross      = price - totalMat - totalExp - bezDisc;
  var mgrCount   = manager ? 1 : 0;
  var mstrCount  = masters.split(',').filter(function(s){ return s.trim(); }).length;
  var mgrBonus   = mgrCount  > 0 ? gross * 0.10 / mgrCount  : 0;
  var mstrBonus  = mstrCount > 0 ? gross * 0.35 / mstrCount : 0;
  var margin     = gross - (mgrCount > 0 ? gross * 0.10 : 0) - (mstrCount > 0 ? gross * 0.35 : 0);

  document.getElementById('prev-gross').textContent  = fmt(gross)     + ' ' + CUR;
  document.getElementById('prev-mgr').textContent    = fmt(mgrBonus)  + ' ' + CUR;
  document.getElementById('prev-master').textContent = fmt(mstrBonus) + ' ' + CUR;
  document.getElementById('prev-margin').textContent = fmt(margin)    + ' ' + CUR;
  var p = document.getElementById('ord-finance-preview'); if(p) p.style.display = 'block';
}

function submitNewOrder() {
  var service = (document.getElementById('ord-service') || {}).value;
  var name    = ((document.getElementById('ord-client-name') || {}).value || '').trim();
  var price   = Number((document.getElementById('ord-price') || {}).value || 0);

  if (!service) { toast('Выберите услугу', 'error'); return; }
  if (!name)    { toast('Укажите имя клиента', 'error'); return; }
  if (!price)   { toast('Укажите стоимость заказа', 'error'); return; }

  // Предупреждаем о незаполненных строках (иначе они молча отбрасываются)
  var badMats = (App._orderMaterials || []).filter(function(m){ return m && !m.materialId && (Number(m.qty) > 0); }).length;
  var badExps = (App._orderExpenses  || []).filter(function(e){ return e && ((e.name && !(Number(e.amount) > 0)) || (!e.name && Number(e.amount) > 0)); }).length;
  if (badMats || badExps) {
    var msg = 'Не сохранятся незаполненные строки:';
    if (badMats) msg += '\n• материалов без выбранного материала: ' + badMats;
    if (badExps) msg += '\n• расходов без названия или суммы: ' + badExps;
    msg += '\n\nПродолжить создание заказа без них?';
    uiConfirm(msg, submitNewOrderProceed, { title: 'Незаполненные строки', okText: 'Продолжить', danger: false });
    return;
  }
  submitNewOrderProceed();
}

function submitNewOrderProceed() {
  var service = (document.getElementById('ord-service') || {}).value;
  var name    = ((document.getElementById('ord-client-name') || {}).value || '').trim();
  var price   = Number((document.getElementById('ord-price') || {}).value || 0);

  var payType     = App._orderPayType || '';
  var duePay      = (document.getElementById('ord-duepay') || {}).value || '';
  var prepay      = Number((document.getElementById('ord-prepay') || {}).value || 0);
  var prepayMeth  = (document.getElementById('ord-prepay-method') || {}).value || 'Нал';
  var rassrMonths = Number((document.getElementById('ord-rassr-months') || {}).value || 0);

  var payload = {
    service:     service,
    clientId:    (document.getElementById('ord-client-id')    || {}).value || '',
    clientName:  name,
    clientPhone: (document.getElementById('ord-client-phone') || {}).value || '',
    car:         (document.getElementById('ord-car')          || {}).value || '',
    plate:       (document.getElementById('ord-plate')        || {}).value || '',
    price:       price,
    payType:     payType,
    duePayDate:  duePay,
    manager:     (document.getElementById('ord-manager') || {}).value || '',
    masters:     ((document.getElementById('ord-masters') || {}).value || '').trim(),
    notes:       ((document.getElementById('ord-notes')   || {}).value || '').trim(),
    materials:   App._orderMaterials.filter(function(m){ return m && m.materialId; }),
    expenses:    App._orderExpenses.filter(function(e){ return e && e.name && e.amount > 0; }),
  };

  var btn = document.getElementById('ord-submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Сохраняем...'; }
  var resetBtn = function(){ if (btn) { btn.disabled = false; btn.textContent = 'Создать заказ'; } };

  var finalizeNewOrder = function() {
    closeModal('modal-new-order');
    ['ord-service','ord-client-phone','ord-client-name','ord-client-id',
     'ord-car','ord-plate','ord-price','ord-masters','ord-notes','ord-prepay'].forEach(function(id){
      var el = document.getElementById(id); if (el) el.value = '';
    });
    var found = document.getElementById('ord-client-found'); if (found) found.style.display = 'none';
    var preview = document.getElementById('ord-finance-preview'); if (preview) preview.style.display = 'none';
    App._orderPayType = '';
    initOrderForm();
    var hid = document.getElementById('ord-paytype'); if (hid) hid.value = '';
    var duepayEl = document.getElementById('ord-duepay'); if (duepayEl) duepayEl.value = '';
    var dueRow = document.getElementById('ord-duepay-row'); if (dueRow) dueRow.style.display = 'none';
    document.querySelectorAll('#modal-new-order .ctype-btn').forEach(function(b){ b.classList.remove('active'); });
    App._foundClient = null;
    App.clients = [];        // мог появиться новый клиент — обновим список при заходе
    App._dashCache = null;   // дашборд пересчитается
    App._debtCache = null;
    if (App.currentPage === 'orders') loadOrders(true);  // принудительно — показать новый заказ сразу
  };

  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) { resetBtn(); toast('Ошибка: ' + (resp ? resp.error : 'нет ответа'), 'error'); return; }
      var orderId  = resp.data.id;
      var contract = resp.data.contractNumber || '';

      // Если заказ создавали из записи — привяжем запись к заказу и отметим «Пришёл»
      if (App._aptPendingLink) {
        var aptId = App._aptPendingLink; App._aptPendingLink = null;
        google.script.run
          .withSuccessHandler(function(){ if (App.currentPage === 'appointments') loadAppointments(true); })
          .withFailureHandler(function(){ toast('Заказ создан, но привязать к записи не удалось', 'error'); })
          .linkAppointmentOrder(aptId, orderId);
      }

      var done = function() {
        resetBtn();
        toast('✅ Заказ ' + contract + ' создан', 'success');
        finalizeNewOrder();
      };
      // Шаг 3: график рассрочки (на остаток после предоплаты)
      var buildPlan = function() {
        if (payType === 'Рассрочка' && rassrMonths >= 1) {
          google.script.run
            .withSuccessHandler(function(){ done(); })
            .withFailureHandler(function(e){ resetBtn(); toast('Заказ создан, но график не построен: ' + e.message, 'error'); finalizeNewOrder(); })
            .createInstallmentPlan(orderId, { months: rassrMonths, startDate: duePay });
        } else done();
      };
      // Шаг 2: предоплата (если указана)
      if (prepay > 0) {
        google.script.run
          .withSuccessHandler(function(){ buildPlan(); })
          .withFailureHandler(function(e){ resetBtn(); toast('Заказ создан, но предоплата не внесена: ' + e.message, 'error'); finalizeNewOrder(); })
          .addOrderPayment(orderId, { amount: prepay, payType: prepayMeth, comment: 'Предоплата при создании' });
      } else {
        buildPlan();
      }
    })
    .withFailureHandler(function(e) {
      resetBtn();
      toast('Ошибка: ' + e.message, 'error');
    })
    .createOrder(payload);
}

/* ===== СТРАНИЦА СПРАВОЧНИКА МАТЕРИАЛОВ ===== */

function loadMaterials(force) {
  var tbody = document.getElementById('materials-tbody');
  var err   = document.getElementById('materials-error');
  if (err)   err.style.display = 'none';

  var hasCache = App._materials && App._materials.length;
  if (hasCache && !force) {
    filterMaterials();
  } else if (tbody) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--text3)">Загрузка...</td></tr>';
  }

  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) {
        if (!hasCache && err) { err.textContent = resp ? resp.error : 'Нет ответа'; err.style.display = 'block'; }
        return;
      }
      App._materials = resp.data || [];
      filterMaterials();
    })
    .withFailureHandler(function(e) {
      if (!hasCache && err) { err.textContent = e.message; err.style.display = 'block'; }
    })
    .getMaterials(null);
}

// Поиск/фильтр в справочнике материалов (клиентская фильтрация App._materials)
function filterMaterials() {
  var q   = ((document.getElementById('mat-search')     || {}).value || '').toLowerCase().trim();
  var cat = (document.getElementById('mat-cat-filter')  || {}).value || '';
  var list = (App._materials || []).filter(function(m) {
    if (cat && String(m['Категория'] || '') !== cat) return false;
    if (q && String(m['Название'] || '').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  renderMaterialsTable(list);
}

function renderMaterialsTable(list) {
  var tbody = document.getElementById('materials-tbody');
  if (!tbody) return;
  if (!list || list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--text3)">Материалы не добавлены. Нажмите «+ Добавить материал» или «⬇ Импорт из таблицы»</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(function(m) {
    var unit      = m['Единица']      || '—';
    var rollWidth = m['Ширина рулона'] ? m['Ширина рулона'] + ' м' : '—';
    var price     = m['Цена'] ? Number(m['Цена']).toLocaleString('ru') + ' ' + CUR : '—';
    var active    = m['Активен'] !== 'Нет';
    var id        = m['ID'] || '';
    var ellip = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    return '<tr style="' + (active ? '' : 'opacity:.45') + '">' +
      '<td style="font-weight:600;' + ellip + '" title="' + String(m['Название']||'').replace(/"/g,'&quot;') + '">' + (m['Название'] || '—') + '</td>' +
      '<td style="color:var(--text3);font-size:12px;' + ellip + '">' + (m['Категория'] || '—') + '</td>' +
      '<td style="font-size:12px">' + (m['Услуга'] || '—') + '</td>' +
      '<td style="font-size:12px">' + unit + '</td>' +
      '<td style="font-size:12px">' + (unit === 'пм' ? rollWidth : '—') + '</td>' +
      '<td style="font-weight:600;color:var(--accent);text-align:right;white-space:nowrap">' + price + '</td>' +
      '<td style="text-align:center"><span style="font-size:11px;padding:2px 8px;border-radius:20px;background:' +
        (active ? 'rgba(40,167,69,.15)' : 'var(--bg-hover)') + ';color:' +
        (active ? 'var(--success)' : 'var(--text3)') + '">' +
        (active ? 'Активен' : 'Архив') + '</span></td>' +
      '<td style="text-align:right;white-space:nowrap">' +
        '<button class="btn btn-ghost" style="padding:3px 9px;font-size:11px;margin-right:4px;color:var(--accent);font-weight:600" ' +
          'onclick=\'openEditMaterial(' + JSON.stringify(m).replace(/'/g, "\\u0027") + ')\'>Изменить</button>' +
        (active
          ? '<button class="btn btn-ghost" style="padding:3px 9px;font-size:11px;color:var(--text3);margin-right:4px" onclick="deactivateMat(\'' + id + '\')">Архив</button>'
          : '<button class="btn btn-ghost" style="padding:3px 9px;font-size:11px;color:var(--success);margin-right:4px" onclick="restoreMat(\'' + id + '\')">Восст.</button>') +
        '<button class="btn btn-ghost" style="padding:3px 9px;font-size:11px;color:var(--danger)" title="Удалить навсегда" onclick="deleteMatRow(\'' + id + '\',\'' + String(m['Название']||'').replace(/'/g,"\\'") + '\')">Удалить</button>' +
      '</td>' +
      '</tr>';
  }).join('');
}

// Диапазон периода дашборда: если заданы даты — берём их, иначе пресет
function getDashRange() {
  var from = (document.getElementById('dash-from') || {}).value;
  var to   = (document.getElementById('dash-to')   || {}).value;
  if (from || to) {
    return {
      from: from ? new Date(from).toISOString() : null,
      to:   to   ? new Date(to + 'T23:59:59').toISOString() : null,
    };
  }
  return getPeriodRange((document.getElementById('dash-period') || {}).value || 'month');
}

// Смена пресета периода → заполняем календари и пересчитываем
function onDashPeriodChange() {
  var r = getPeriodRange((document.getElementById('dash-period') || {}).value || 'month');
  var f = document.getElementById('dash-from');
  var t = document.getElementById('dash-to');
  if (f) f.value = r.from ? r.from.slice(0, 10) : '';
  if (t) t.value = r.to   ? r.to.slice(0, 10)   : '';

function renderDashData_(d) {
  var kpi = document.getElementById('dash-kpi');
  var k = d.kpi || {};
  var fmt = function(n){ return (Math.round(Number(n)*100)/100).toLocaleString('ru') + ' ' + CUR; };

function renderDashboard() {
  var range = getDashRange();
  var key   = (range.from || '') + '_' + (range.to || '');
  var kpi   = document.getElementById('dash-kpi');

  // Мгновенно из кэша, если период тот же
  var cached = (App._dashCache && App._dashCache.key === key) ? App._dashCache.data : null;
  if (cached) {
    renderDashData_(cached);
  } else if (kpi) {
    kpi.innerHTML = '<div class="kpi-skeleton"></div><div class="kpi-skeleton"></div><div class="kpi-skeleton"></div><div class="kpi-skeleton"></div>';
  }
  if (App._debtCache) renderDebtAlert_(App._debtCache);   // дебиторку тоже мгновенно из кэша

  // Фоновое обновление — ОДНИМ вызовом (KPI + дебиторка), вместо двух round-trip
  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) return;
      var b = resp.data || {};
      if (b.dash) { App._dashCache = { key: key, data: b.dash }; renderDashData_(b.dash); }
      App._debtCache = b.debt || [];
      renderDebtAlert_(App._debtCache);
    })
    .withFailureHandler(function(){})
    .getDashboardBundle(range);
}

// Переключить «Проверено» из таблицы дашборда (оптимистично + сразу обновляет данные)
function toggleOrderVerDash(id, btn) {
  if (!id) return;
  var recent = (App._dashCache && App._dashCache.data && App._dashCache.data.recentOrders) || [];
  var o = recent.find(function(x){ return String(x.id) === String(id); });
  var prev = o ? !!o.verified : false;
  var willOn = !prev;
  if (o) o.verified = willOn;
  if (btn) { btn.className = 'ver-btn ' + (willOn ? 'ver-on' : 'ver-off'); btn.textContent = willOn ? '✓' : 'проверено'; }
  App.orders = []; App._cardCache = {};  // список заказов пересоберётся с новым статусом проверки
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) {
        if (o) o.verified = prev;
        if (btn) { btn.className = 'ver-btn ' + (prev ? 'ver-on' : 'ver-off'); btn.textContent = prev ? '✓' : 'проверено'; }
        toast('Ошибка: ' + (resp ? resp.error : ''), 'error');
      } else {
        toast(resp.data.verified ? 'Отмечено как проверенное' : 'Проверка снята', 'success');
      }
    })
    .withFailureHandler(function(e){
      if (o) o.verified = prev;
      if (btn) { btn.className = 'ver-btn ' + (prev ? 'ver-on' : 'ver-off'); btn.textContent = prev ? '✓' : 'проверено'; }
      toast('Ошибка: ' + e.message, 'error');
    })
    .toggleOrderVerification(id);
}

function getPeriodRange(period) {
  var now   = new Date();
  var year  = now.getFullYear();
  var month = now.getMonth();
  var day   = now.getDate();
  if (period === 'today')      return { from: new Date(year, month, day).toISOString(),            to: new Date(year, month, day, 23, 59, 59).toISOString() };
  if (period === 'week')       return { from: new Date(year, month, day - 6).toISOString(),         to: new Date(year, month, day, 23, 59, 59).toISOString() };
  if (period === 'month')      return { from: new Date(year, month, 1).toISOString(),               to: new Date(year, month+1, 0, 23, 59, 59).toISOString() };
  if (period === 'prev_month') return { from: new Date(year, month-1, 1).toISOString(),             to: new Date(year, month, 0, 23, 59, 59).toISOString() };
  if (period === 'quarter')    return { from: new Date(year, Math.floor(month/3)*3, 1).toISOString(),to: now.toISOString() };
  if (period === 'half')       return { from: new Date(year, month, 1).toISOString(),               to: now.toISOString() };
  if (period === 'year')       return { from: new Date(year, 0, 1).toISOString(),                   to: new Date(year, 11, 31, 23, 59, 59).toISOString() };
  if (period === 'all')        return {};
  return {};
}

// Читает диапазон дат из UI для страниц с prefix-from/to и prefix-period
function getPeriodRangeFromUI(prefix) {
  var period = (document.getElementById(prefix + '-period') || {}).value || 'month';
  if (period === 'custom') {
    var fromVal = (document.getElementById(prefix + '-from') || {}).value;
    var toVal   = (document.getElementById(prefix + '-to')   || {}).value;
    return {
      from: fromVal ? new Date(fromVal).toISOString() : null,
      to:   toVal   ? new Date(toVal + 'T23:59:59').toISOString() : null,
    };
  }
  return getPeriodRange(period);
}

// Показывает/скрывает поля дат при выборе "Произвольный…" в любом select
function _onPeriodChange(prefix, loadFn) {
  var period    = (document.getElementById(prefix + '-period') || {}).value;
  var customWrap = document.getElementById(prefix + '-custom-range');
  if (customWrap) customWrap.style.display = (period === 'custom') ? 'flex' : 'none';
  if (period !== 'custom') loadFn();
}

// Включение/выключение режима сравнения
function toggleExpCompare() {
  App._expCompare = !App._expCompare;
  var btn  = document.getElementById('exp-compare-btn');
  var wrap = document.getElementById('exp-compare-range');
  if (btn)  btn.style.background  = App._expCompare ? 'var(--accent-soft)' : '';
  if (btn)  btn.style.color       = App._expCompare ? 'var(--accent)' : '';
  if (wrap) wrap.style.display    = App._expCompare ? 'flex' : 'none';

  // Подставляем "прошлый период" по умолчанию при включении сравнения
  if (App._expCompare) {
    var range = getPeriodRangeFromUI('exp');
    if (range.from && range.to) {
      var ms   = new Date(range.to) - new Date(range.from);
      var cmpTo   = new Date(new Date(range.from) - 1);
      var cmpFrom = new Date(cmpTo - ms);
      var toISO = function(d){ return d.toISOString().slice(0,10); };
      var cmpFromEl = document.getElementById('exp-cmp-from');
      var cmpToEl   = document.getElementById('exp-cmp-to');
      if (cmpFromEl && !cmpFromEl.value) cmpFromEl.value = toISO(cmpFrom);
      if (cmpToEl   && !cmpToEl.value)   cmpToEl.value   = toISO(cmpTo);
    }
  }
  loadExpenses();
}

function loadExpenses() {
  var tbody = document.getElementById('expenses-tbody');
  if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text3)">Загрузка...</td></tr>';

  var range  = getPeriodRangeFromUI('exp');
  var filter = { from: range.from || null, to: range.to || null };

  if (App._expCompare) {
    // Два параллельных запроса
    var cmpFrom = (document.getElementById('exp-cmp-from') || {}).value;
    var cmpTo   = (document.getElementById('exp-cmp-to')   || {}).value;
    var filterB = {
      from: cmpFrom ? new Date(cmpFrom).toISOString()              : null,
      to:   cmpTo   ? new Date(cmpTo + 'T23:59:59').toISOString()  : null,
    };

    App._expLoading = 2;
    App._expDataA   = null;
    App._expDataB   = null;

    google.script.run
      .withSuccessHandler(function(resp) {
        App._expDataA = (resp && resp.ok) ? (resp.data || []) : [];
        if (--App._expLoading === 0) _renderExpensesWithCompare();
      })
      .withFailureHandler(function(e){ toast('Ошибка загрузки: ' + e.message, 'error'); })
      .getExpenses(filter);

    google.script.run
      .withSuccessHandler(function(resp) {
        App._expDataB = (resp && resp.ok) ? (resp.data || []) : [];
        if (--App._expLoading === 0) _renderExpensesWithCompare();
      })
      .withFailureHandler(function(e){ toast('Ошибка загрузки: ' + e.message, 'error'); })
      .getExpenses(filterB);

  } else {
    google.script.run
      .withSuccessHandler(function(resp) {
        if (!resp || !resp.ok) {
          toast('Ошибка расходов: ' + (resp ? resp.error : 'нет ответа'), 'error');
          if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--danger)">Ошибка загрузки</td></tr>';
          return;
        }
        App._expenses = resp.data || [];
        renderExpensesTable(App._expenses);
        updateExpensesKpi(App._expenses, null);
      })
      .withFailureHandler(function(e) {
        toast('Ошибка: ' + e.message, 'error');
        if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--danger)">' + e.message + '</td></tr>';
      })
      .getExpenses(filter);
  }
}

function _renderExpensesWithCompare() {
  App._expenses = App._expDataA || [];
  renderExpensesTable(App._expenses);
  updateExpensesKpi(App._expenses, App._expDataB || []);
}

function filterExpenses() {
  var cat    = (document.getElementById('exp-cat-filter') || {}).value || '';
  var search = ((document.getElementById('exp-search') || {}).value || '').toLowerCase();
  var list   = App._expenses.filter(function(e) {
    if (cat    && e['Категория'] !== cat) return false;
    if (search && !String(e['Описание']||'').toLowerCase().includes(search) &&
                  !String(e['Категория']||'').toLowerCase().includes(search)) return false;
    return true;
  });
  renderExpensesTable(list);
}

function renderExpensesTable(list) {
  var tbody  = document.getElementById('expenses-tbody');
  var footer = document.getElementById('expenses-footer');
  if (!tbody) return;

  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text3)">Расходов за выбранный период нет</td></tr>';
    if (footer) footer.textContent = '';
    return;
  }

  var total = 0;
  tbody.innerHTML = list.map(function(e) {
    var sum = Number(e['Сумма']) || 0;
    total += sum;
    return '<tr>' +
      '<td style="color:var(--text3);font-size:12px;white-space:nowrap">' + (e['Дата'] || '—') + '</td>' +
      '<td><span style="font-size:11px;padding:2px 8px;border-radius:12px;background:var(--bg-hover)">' + (e['Категория'] || '—') + '</span></td>' +
      '<td style="font-size:13px">' + (e['Описание'] || '—') + '</td>' +
      '<td style="text-align:right;font-weight:600;white-space:nowrap">' + sum.toLocaleString('ru') + ' ' + CUR + '</td>' +
      '<td style="font-size:12px;color:var(--text3)">' + (e['Способ оплаты'] || '') + '</td>' +
      '<td style="text-align:right">' +
        '<button class="btn btn-ghost" style="padding:2px 8px;font-size:11px;color:var(--danger)" onclick="deleteExp(\'' + e['ID'] + '\')">Удалить</button>' +
      '</td>' +
    '</tr>';
  }).join('');

  if (footer) footer.textContent = 'Записей: ' + list.length + ' · Итого: ' + total.toLocaleString('ru') + ' ' + CUR;
}

function updateExpensesKpi(list, compare) {
  var sum = function(arr, cats) {
    return arr.reduce(function(acc, e) {
      var c = e['Категория'] || '';
      var s = Number(e['Сумма']) || 0;
      return acc + (cats ? (cats.indexOf(c) >= 0 ? s : 0) : s);
    }, 0);
  };

  var total = sum(list);
  var fixed = sum(list, ['Аренда','Коммунальные']);
  var mkt   = sum(list, ['Маркетинг']);
  var trans = sum(list, ['Транспорт']);

  var fmt = function(n){ return Math.round(n).toLocaleString('ru') + ' ' + CUR; };
  var set = function(id,v){ var el=document.getElementById(id); if(el) el.textContent=v; };
  set('exp-total',    fmt(total));
  set('exp-fixed',    fmt(fixed));
  set('exp-marketing',fmt(mkt));
  set('exp-transport',fmt(trans));

  // Дельта при сравнении
  if (compare && compare.length >= 0) {
    var cTotal = sum(compare);
    var cFixed = sum(compare, ['Аренда','Коммунальные']);
    var cMkt   = sum(compare, ['Маркетинг']);
    var cTrans = sum(compare, ['Транспорт']);

    var delta = function(a, b, elId) {
      var el = document.getElementById(elId);
      if (!el) return;
      if (b <= 0) { el.textContent = ''; return; }
      var pct  = Math.round((a - b) / b * 100);
      var sign = pct > 0 ? '+' : '';
      var col  = pct > 0 ? 'var(--danger)' : 'var(--success)';
      el.innerHTML = '<span style="color:' + col + ';font-weight:600">' + sign + pct + '%</span> vs пред. период (' + fmt(b) + ')';
    };

    delta(total, cTotal, 'exp-total-delta');
    delta(fixed, cFixed, 'exp-fixed-delta');
    delta(mkt,   cMkt,   'exp-marketing-delta');
    delta(trans, cTrans, 'exp-transport-delta');
  } else {
    ['exp-total-delta','exp-fixed-delta','exp-marketing-delta','exp-transport-delta'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.textContent = '';
    });
  }
}

function submitNewExpense() {
  var amount   = Number((document.getElementById('exp-amount')   ||{}).value||0);
  var category = ((document.getElementById('exp-category')||{}).value||'').trim();
  if (!amount)   { toast('Укажите сумму','error'); return; }
  if (!category) { toast('Выберите категорию','error'); return; }

  // Установим сегодня если дата пустая
  var dateEl = document.getElementById('exp-date');
  if (dateEl && !dateEl.value) {
    var now = new Date();
    dateEl.value = now.toISOString().slice(0,10);
  }

  var payload = {
    date:        dateEl ? dateEl.value.split('-').reverse().join('.') : '',
    amount:      amount,
    category:    category,
    description: ((document.getElementById('exp-description')||{}).value||'').trim(),
    payMethod:   (document.getElementById('exp-pay-method')||{}).value||'Нал',
    orderId:     ((document.getElementById('exp-order-id')||{}).value||'').trim(),
  };

  var btn = document.getElementById('exp-submit-btn');
  if (btn) { btn.disabled=true; btn.textContent='Сохраняем...'; }

  google.script.run
    .withSuccessHandler(function(resp) {
      if (btn) { btn.disabled=false; btn.textContent='Сохранить'; }
      if (!resp||!resp.ok) { toast('Ошибка: '+(resp?resp.error:''),'error'); return; }
      toast('Расход записан','success');
      closeModal('modal-new-expense');
      ['exp-amount','exp-description','exp-order-id'].forEach(function(id){
        var el=document.getElementById(id); if(el) el.value='';
      });
      if (App.currentPage==='expenses') loadExpenses();
    })
    .withFailureHandler(function(e){ if(btn){btn.disabled=false;btn.textContent='Сохранить';} toast('Ошибка: '+e.message,'error'); })
    .createExpense(payload);
}

function deleteExp(id) {
  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp||!resp.ok) { toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); return; }
      toast('Удалено','success');
      loadExpenses();
    })
    .withFailureHandler(function(e){ toast('Ошибка: ' + e.message, 'error'); })
    .deleteExpense(id);
}

function loadDebt() {
  var tbody = document.getElementById('debt-tbody');
  if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--text3)">Загрузка...</td></tr>';

  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) {
        if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--danger)">' + (resp ? resp.error : 'Ошибка загрузки') + '</td></tr>';
        return;
      }
      renderDebtTable(resp.data || []);
    })
    .withFailureHandler(function(e) {
      if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--danger)">' + e.message + '</td></tr>';
    })
    .getDebtOrders();
}

function renderDebtTable(rows) {
  var tbody  = document.getElementById('debt-tbody');
  var footer = document.getElementById('debt-footer');
  if (!tbody) return;

  // KPI
  var totalRemaining = 0, overdueCount = 0, partialCount = 0;
  rows.forEach(function(r) {
    totalRemaining += r.remaining;
    if (r.isOverdue)         overdueCount++;
    if (r.beznal === 'Частично') partialCount++;
  });

  var fmt = function(n){ return (Math.round(n*100)/100).toLocaleString('ru') + ' ' + CUR; };
  var set = function(id, v){ var el = document.getElementById(id); if (el) el.textContent = v; };
  set('debt-total',   fmt(totalRemaining));
  set('debt-count',   rows.length);
  set('debt-overdue', overdueCount);
  set('debt-partial', partialCount);

  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--success);font-size:15px">✅ Дебиторки нет — все оплачено!</td></tr>';
    if (footer) footer.textContent = '';
    return;
  }

  tbody.innerHTML = rows.map(function(r) {
    // Цвет строки и метка срока
    var rowStyle = '';
    var dueCell  = '';

    if (r.dueDate) {
      if (r.isOverdue) {
        rowStyle = 'border-left:3px solid var(--danger);';
        var overDays = Math.abs(r.daysUntilDue);
        dueCell = '<div style="font-weight:700;color:var(--danger)">просрочено ' + overDays + ' д.</div>' +
                  '<div style="font-size:10px;color:var(--text3)">' + r.dueDate + '</div>';
      } else if (r.daysUntilDue === 0) {
        rowStyle = 'border-left:3px solid #f59e0b;';
        dueCell = '<div style="font-weight:700;color:#f59e0b">сегодня</div>' +
                  '<div style="font-size:10px;color:var(--text3)">' + r.dueDate + '</div>';
      } else if (r.daysUntilDue <= 3) {
        rowStyle = 'border-left:3px solid #f59e0b;';
        dueCell = '<div style="font-weight:600;color:#f59e0b">через ' + r.daysUntilDue + ' д.</div>' +
                  '<div style="font-size:10px;color:var(--text3)">' + r.dueDate + '</div>';
      } else {
        dueCell = '<div style="color:var(--text2)">через ' + r.daysUntilDue + ' д.</div>' +
                  '<div style="font-size:10px;color:var(--text3)">' + r.dueDate + '</div>';
      }
    } else {
      dueCell = '<span style="font-size:11px;color:var(--text3)">не задан</span>';
    }

    var beznalBadge = r.beznal === 'Частично'
      ? '<span style="font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(245,158,11,.15);color:#f59e0b;white-space:nowrap">рассрочка</span>'
      : '<span style="font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(220,53,69,.1);color:var(--danger);white-space:nowrap">долг</span>';

    var remainingStr = fmt(r.remaining);
    var clientSafe = r.client.replace(/'/g, "\\'");
    var dueDateSafe = r.dueDate.replace(/'/g, "\\'");

    return '<tr style="cursor:pointer;' + rowStyle + '" onclick="openOrderCard(\'' + r.id + '\')">' +
      '<td>' +
        '<div style="font-weight:600;font-size:12px">' + (r.contract || r.id) + '</div>' +
        '<div style="margin-top:3px">' + beznalBadge + '</div>' +
      '</td>' +
      '<td>' +
        '<div style="font-weight:500;font-size:13px">' + r.client + '</div>' +
        '<div style="font-size:11px;color:var(--text3)">' + r.phone + '</div>' +
      '</td>' +
      '<td>' +
        '<div style="font-size:12px">' + r.car + '</div>' +
        '<div style="font-size:11px;color:var(--text3)">' + r.service + '</div>' +
      '</td>' +
      '<td style="text-align:right">' +
        '<div style="font-weight:700;color:var(--danger);font-size:14px">' + remainingStr + '</div>' +
        (r.paid > 0 ? '<div style="font-size:10px;color:var(--success)">оплачено: ' + fmt(r.paid) + '</div>' : '') +
      '</td>' +
      '<td>' + dueCell + '</td>' +
      '<td onclick="event.stopPropagation()" style="white-space:nowrap">' +
        '<button onclick="event.stopPropagation();openPayOrderModal(\'' + r.id + '\',\'' + clientSafe + '\',' + r.price + ',\'' + dueDateSafe + '\')" ' +
          'style="padding:4px 10px;font-size:11px;font-weight:600;background:rgba(34,197,94,.15);color:var(--success);border:1px solid rgba(34,197,94,.3);border-radius:6px;cursor:pointer;margin-right:4px">+ Оплата</button>' +
        '<button onclick="event.stopPropagation();openSetDueDateModal(\'' + r.id + '\',\'' + dueDateSafe + '\',\'' + clientSafe + '\')" ' +
          'style="padding:4px 8px;font-size:11px;background:var(--bg-hover);border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--text2)">📅 Срок</button>' +
      '</td>' +
    '</tr>';
  }).join('');

  if (footer) footer.textContent = 'Итого к получению: ' + fmt(totalRemaining) + ' · ' + rows.length + ' заказов';
}

function parseClientDate(str) {
  if (!str) return null;
  var m = String(str).match(/^(\d{2})\.(\d{2})\.(\d{4})/);
  return m ? new Date(+m[3], +m[2]-1, +m[1]) : null;
}

App._setDueDateOrderId = null;

function openSetDueDateModal(orderId, currentDueDate, clientName) {
  App._setDueDateOrderId = orderId;
  var titleEl = document.getElementById('set-due-date-client');
  var inputEl = document.getElementById('set-due-date-input');
  if (titleEl) titleEl.textContent = clientName || '';
  if (inputEl) {
    // Конвертируем dd.MM.yyyy → YYYY-MM-DD для date input
    var m = currentDueDate ? String(currentDueDate).match(/^(\d{2})\.(\d{2})\.(\d{4})/) : null;
    inputEl.value = m ? m[3] + '-' + m[2] + '-' + m[1] : '';
  }
  openModal('modal-set-due-date');
}

function confirmSetDueDate() {
  var id      = App._setDueDateOrderId;
  var dateVal = (document.getElementById('set-due-date-input') || {}).value || '';
  if (!id) return;

  var btn = document.getElementById('set-due-date-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Сохраняем...'; }

  google.script.run
    .withSuccessHandler(function(resp) {
      if (btn) { btn.disabled = false; btn.textContent = 'Сохранить'; }
      if (!resp || !resp.ok) { toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); return; }
      toast(dateVal ? 'Срок оплаты установлен' : 'Срок сброшен', 'success');
      closeModal('modal-set-due-date');
      if (App.currentPage === 'debt') loadDebt();
    })
    .withFailureHandler(function(e) {
      if (btn) { btn.disabled = false; btn.textContent = 'Сохранить'; }
      toast('Ошибка: ' + e.message, 'error');
    })
    .setOrderDueDate(id, dateVal);
}

App._servicesEdit = null;   // рабочая копия каталога услуг для редактирования

function loadServices() {
  // рабочая копия из конфига (white-label каталог)
  App._servicesEdit = ((App.config && App.config.services) || []).map(function(s){
    return {
      code: s.code || '', name: s.name || '', icon: s.icon || '🔧',
      active: s.active !== false, contractPrefix: s.contractPrefix || '',
      calcType: s.calcType || 'fixed', bonusPoolPct: (s.bonusPoolPct != null ? s.bonusPoolPct : 35),
      managerBonusPct: (s.managerBonusPct != null ? s.managerBonusPct : 10),
    };
  });
  renderServicesEditor();
}

function renderServicesEditor() {
  var tb = document.getElementById('services-tbody');
  if (!tb) return;
  var list = App._servicesEdit || [];
  var inp = 'padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--inp);color:var(--text);font-size:13px;width:100%';
  if (!list.length) { tb.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text3);padding:16px">Нет услуг — нажмите «+ Услуга»</td></tr>'; return; }
  tb.innerHTML = list.map(function(s, i){
    return '<tr>' +
      '<td><input value="' + (s.icon||'').replace(/"/g,'&quot;') + '" onchange="svcEdit(' + i + ',\'icon\',this.value)" style="' + inp + ';text-align:center" maxlength="2"></td>' +
      '<td><input value="' + (s.name||'').replace(/"/g,'&quot;') + '" onchange="svcEdit(' + i + ',\'name\',this.value)" placeholder="Название услуги" style="' + inp + '"></td>' +
      '<td><input value="' + (s.contractPrefix||'').replace(/"/g,'&quot;') + '" onchange="svcEdit(' + i + ',\'contractPrefix\',this.value)" placeholder="04/01-" style="' + inp + '"></td>' +
      '<td><input type="number" min="0" max="100" value="' + s.bonusPoolPct + '" onchange="svcEdit(' + i + ',\'bonusPoolPct\',this.value)" style="' + inp + ';text-align:right"></td>' +
      '<td><input type="number" min="0" max="100" value="' + s.managerBonusPct + '" onchange="svcEdit(' + i + ',\'managerBonusPct\',this.value)" style="' + inp + ';text-align:right"></td>' +
      '<td style="text-align:center"><input type="checkbox"' + (s.active?' checked':'') + ' onchange="svcEdit(' + i + ',\'active\',this.checked)"></td>' +
      '<td style="text-align:center"><button class="pay-del" onclick="removeServiceRow(' + i + ')" title="Удалить">✕</button></td>' +
    '</tr>';
  }).join('');
}

function svcEdit(i, field, val) {
  if (!App._servicesEdit || !App._servicesEdit[i]) return;
  if (field === 'bonusPoolPct' || field === 'managerBonusPct') val = Number(val) || 0;
  App._servicesEdit[i][field] = val;
}
function addServiceRow() {
  if (!App._servicesEdit) App._servicesEdit = [];
  App._servicesEdit.push({ code:'', name:'', icon:'🔧', active:true, contractPrefix:'', calcType:'fixed', bonusPoolPct:35, managerBonusPct:10 });
  renderServicesEditor();
}
function removeServiceRow(i) {
  if (!App._servicesEdit) return;
  App._servicesEdit.splice(i, 1);
  renderServicesEditor();
}
function saveServicesCatalogUI() {
  var list = (App._servicesEdit || []).filter(function(s){ return String(s.name||'').trim(); });
  if (!list.length) { toast('Добавьте хотя бы одну услугу', 'error'); return; }
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) { toast('Ошибка: ' + (resp?resp.error:''), 'error'); return; }
      if (App.config) App.config.services = resp.data.services;
      fillServiceDropdowns();          // обновить все списки услуг
      toast('Каталог услуг сохранён', 'success');
      loadServices();
    })
    .withFailureHandler(function(e){ toast('Ошибка: ' + e.message, 'error'); })
    .saveServicesCatalog(list);
}

function loadDDS() {
  var range = getPeriodRangeFromUI('dds');
  var fmt    = function(n){ return (Number(n)||0).toLocaleString('ru') + ' ' + CUR; };
  var set    = function(id, v, color) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = v;
    if (color) el.style.color = color;
  };

  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp||!resp.ok) return;
      var d = resp.data;
      var s = d.summary;

      // Касса
      set('dds-nal',     fmt(s.totalNal),    'var(--success)');
      set('dds-exp-nal', fmt(s.expNal),      'var(--danger)');
      set('dds-kassa',   fmt(s.kassaBalance), s.kassaBalance >= 0 ? 'var(--success)' : 'var(--danger)');

      // Р/счёт
      set('dds-beznal-gross', fmt(s.totalBeznal));
      set('dds-beznal-net',   fmt(s.totalBeznalNet), 'var(--success)');
      set('dds-exp-bnk',      fmt(s.expBnk),         'var(--danger)');
      set('dds-bank',         fmt(s.bankBalance), s.bankBalance >= 0 ? 'var(--success)' : 'var(--danger)');

      // Дебиторка
      set('dds-debt',       fmt(s.totalDebt), '#f59e0b');
      set('dds-debt-count', s.debtCount + ' заказов без оплаты');

      // Таблица нал
      var nalTbody = document.getElementById('dds-nal-tbody');
      if (nalTbody) nalTbody.innerHTML = d.nalRows.length
        ? d.nalRows.map(function(r) {
            return '<tr><td style="font-size:11px;color:var(--text3)">' + (r.date||'') + '</td>' +
              '<td style="font-size:12px">' + (r.desc||'') + '</td>' +
              '<td style="text-align:right;font-weight:600;color:var(--success)">' + (Number(r.amount)||0).toLocaleString('ru') + ' ' + CUR + '</td></tr>';
          }).join('')
        : '<tr><td colspan="3" style="text-align:center;color:var(--text3);padding:12px">Нет нал оплат</td></tr>';

      // Таблица безнал
      var bnkTbody = document.getElementById('dds-bnk-tbody');
      if (bnkTbody) bnkTbody.innerHTML = d.beznalRows.length
        ? d.beznalRows.map(function(r) {
            return '<tr><td style="font-size:11px;color:var(--text3)">' + (r.date||'') + '</td>' +
              '<td style="font-size:12px">' + (r.desc||'') +
                '<div style="font-size:10px;color:var(--text3)">−15% = ' + (Number(r.fee)||0).toFixed(2) + ' ' + CUR + '</div></td>' +
              '<td style="text-align:right;font-weight:600;color:var(--accent)">' + (Number(r.net)||0).toLocaleString('ru') + ' ' + CUR + '</td></tr>';
          }).join('')
        : '<tr><td colspan="3" style="text-align:center;color:var(--text3);padding:12px">Нет безнал оплат</td></tr>';

      // Расходы (все вместе)
      var expTbody = document.getElementById('dds-expense-tbody');
      var allExp   = (d.expNalRows||[]).concat(d.expBnkRows||[]).sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
      if (expTbody) expTbody.innerHTML = allExp.length
        ? allExp.map(function(r) {
            return '<tr><td style="font-size:11px;color:var(--text3)">' + (r.date||'') + '</td>' +
              '<td style="font-size:11px"><span style="padding:1px 5px;border-radius:6px;background:var(--bg-hover)">' + (r.category||'') + '</span></td>' +
              '<td style="text-align:right;font-weight:600;color:var(--danger)">' + (Number(r.amount)||0).toLocaleString('ru') + ' ' + CUR + '</td></tr>';
          }).join('')
        : '<tr><td colspan="3" style="text-align:center;color:var(--text3);padding:12px">Нет расходов</td></tr>';

      App._ddsData = d;
    })
    .withFailureHandler(function(e){ toast('Ошибка ДДС: '+e.message,'error'); })
    .getDDS(range.from||null, range.to||null);
}

function openPayOrderModal(orderId, clientName, price, currentDueDate) {
  document.getElementById('pay-order-id').value = orderId;
  App._payOrderPrice = Number(price) || 0;
  App._payTypeSelected = 'Нал';

  // Сброс
  var amtEl  = document.getElementById('pay-amount');
  var cmmEl  = document.getElementById('pay-comment');
  var nextEl = document.getElementById('pay-next-date');
  if (amtEl)  amtEl.value = '';
  if (cmmEl)  cmmEl.value = '';
  // Предзаполняем текущий срок если был передан
  if (nextEl) {
    var m = currentDueDate ? String(currentDueDate).match(/^(\d{2})\.(\d{2})\.(\d{4})/) : null;
    nextEl.value = m ? m[3] + '-' + m[2] + '-' + m[1] : '';
  }
  document.querySelectorAll('#modal-pay-order .ctype-btn').forEach(function(b){ b.classList.remove('active'); });
  var nalBtn = document.getElementById('pay-type-nal');
  if (nalBtn) nalBtn.classList.add('active');

  // Загружаем историю платежей и остаток
  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) return;
      var d = resp.data;
      App._payOrderPaid = d.totalPaid || 0;
      var remaining = Math.max(0, App._payOrderPrice - App._payOrderPaid);

      var desc = document.getElementById('pay-order-desc');
      if (desc) desc.innerHTML =
        '<div style="font-weight:600;margin-bottom:4px">' + (clientName||'') + '</div>' +
        '<div style="display:flex;gap:16px;font-size:12px">' +
          '<span>Сумма заказа: <b>' + App._payOrderPrice.toLocaleString('ru') + ' ' + CUR + '</b></span>' +
          '<span style="color:var(--success)">Оплачено: <b>' + d.totalPaid.toLocaleString('ru') + ' ' + CUR + '</b></span>' +
          '<span style="color:' + (remaining>0?'var(--danger)':'var(--success)') + '">Остаток: <b>' + remaining.toLocaleString('ru') + ' ' + CUR + '</b></span>' +
        '</div>';

      var hint = document.getElementById('pay-remaining-hint');
      if (hint) hint.textContent = 'Остаток к оплате: ' + remaining.toLocaleString('ru') + ' ' + CUR;
      if (amtEl) amtEl.value = remaining > 0 ? remaining : '';

      // История
      var hist = document.getElementById('pay-history');
      var histList = document.getElementById('pay-history-list');
      if (d.payments && d.payments.length > 0 && hist && histList) {
        hist.style.display = 'block';
        histList.innerHTML = d.payments.map(function(p) {
          return '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)">' +
            '<span style="color:var(--text3)">' + (p['Дата']||'') + ' — ' + (p['Способ оплаты']||'') + '</span>' +
            '<span style="font-weight:600;color:var(--success)">' + (Number(p['Сумма'])||0).toLocaleString('ru') + ' ' + CUR + '</span>' +
          '</div>';
        }).join('');
      } else if (hist) {
        hist.style.display = 'none';
      }
    })
    .withFailureHandler(function(){})
    .getOrderPaymentSummary(orderId);

  openModal('modal-pay-order');
}

function confirmPayOrder() {
  var id       = (document.getElementById('pay-order-id')||{}).value;
  var amount   = Number((document.getElementById('pay-amount')||{}).value||0);
  var payType  = App._payTypeSelected || 'Нал';
  var comment  = ((document.getElementById('pay-comment')||{}).value||'').trim();
  var nextDate = ((document.getElementById('pay-next-date')||{}).value||'').trim();

  if (!id)     { toast('Ошибка: нет ID заказа','error'); return; }
  if (!amount) { toast('Укажите сумму','error'); return; }

  var btn = document.getElementById('pay-submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Сохраняем...'; }

  google.script.run
    .withSuccessHandler(function(resp) {
      if (btn) { btn.disabled = false; btn.textContent = 'Принять платёж'; }
      if (!resp||!resp.ok) { toast('Ошибка: '+(resp?resp.error:''),'error'); return; }

      // Если задан следующий срок — сохраняем его (даже если оплата полная,
      // бэкенд updateOrderPaymentStatus_ сам сбросит срок при полном закрытии)
      if (nextDate) {
        google.script.run.setOrderDueDate(id, nextDate);
      }

      toast(payType==='Безнал' ? 'Безнал → р/счёт зафиксирован' : 'Нал → касса зафиксирован', 'success');
      closeModal('modal-pay-order');
      App._dashCache = null; App._debtCache = null;   // оплата меняет дашборд/дебиторку
      if (App.currentPage==='orders')     loadOrders(true);
      if (App.currentPage==='dds')        loadDDS();
      if (App.currentPage==='debt')       loadDebt();
      if (App.currentPage==='order-card') reopenCard(id);
    })
    .withFailureHandler(function(e){ if(btn){btn.disabled=false;btn.textContent='Принять платёж';} toast('Ошибка: '+e.message,'error'); })
    .addOrderPayment(id, { amount: amount, payType: payType, comment: comment });
}

App._currentOrderId = null;

App._cardCache = {};   // кэш карточек по orderId (мгновенное повторное открытие)

// перерисовать карточку после правки: сбросить кэш этого заказа и открыть заново
function reopenCard(id) { if (id && App._cardCache) delete App._cardCache[id]; openOrderCard(id); }

function cardSkeleton_() {
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
    '<div class="kpi-skeleton" style="min-height:120px"></div><div class="kpi-skeleton" style="min-height:120px"></div>' +
    '<div class="kpi-skeleton" style="min-height:160px"></div><div class="kpi-skeleton" style="min-height:160px"></div>' +
    '</div>';
}

function openOrderCard(orderId) {
  if (typeof flushCard_ === 'function') flushCard_();   // досохранить правки прошлой карточки (до смены id)
  App._currentOrderId = orderId;
  goPage('order-card');
  var content = document.getElementById('order-card-content');

  // 1) Мгновенно из кэша, если карточка уже открывалась
  var cached = App._cardCache[orderId];
  if (cached) { renderOrderCard(cached); }
  else if (content) { content.innerHTML = cardSkeleton_(); }

  // 2) Справочник плёнок грузим ПАРАЛЛЕЛЬНО (не блокирует карточку);
  //    когда придёт — обновим выпадающие списки плёнки, если карточка открыта
  if (!App._materials || !App._materials.length) {
    google.script.run
      .withSuccessHandler(function(resp) {
        App._materials = (resp && resp.ok) ? (resp.data || []) : [];
        if (App.currentPage === 'order-card' && App._currentOrderId === orderId &&
            App._currentOrder && document.getElementById('card-mat-tbody')) refreshCardMats();
      })
      .withFailureHandler(function(){})
      .getMaterials(null);
  }

  // 3) Полные данные заказа — один запрос; кэшируем и перерисовываем
  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) { if (!cached) toast('Ошибка загрузки заказа', 'error'); return; }
      App._cardCache[orderId] = resp.data;
      if (App._currentOrderId === orderId) renderOrderCard(resp.data);
    })
    .withFailureHandler(function(e){ if (!cached) toast('Ошибка: ' + e.message, 'error'); })
    .getOrderFull(orderId);
}

// Удалить платёж из карточки заказа (бэкенд пересчитает статус оплаты и остаток)
function deletePaymentFromCard(paymentId) {
  if (!paymentId) return;
  uiConfirm('Удалить этот платёж? Сумма оплаты и статус заказа пересчитаются автоматически.', function(){
    google.script.run
      .withSuccessHandler(function(resp){
        if (!resp || !resp.ok) { toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); return; }
        toast('Платёж удалён', 'success');
        App.orders = []; App._cardCache = {}; App._dashCache = null; App._debtCache = null; // пересчитать списки/дашборд/дебиторку
        if (App._currentOrderId) reopenCard(App._currentOrderId);   // перерисовать карточку
      })
      .withFailureHandler(function(e){ toast('Ошибка: ' + e.message, 'error'); })
      .deleteOrderPayment(paymentId);
  }, { okText: 'Удалить платёж' });
}

function loadOrderPhotos(oid) {

    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) { renderPhotoGallery_('gallery-before', []); renderPhotoGallery_('gallery-after', []); return; }
      renderPhotoGallery_('gallery-before', resp.data.before || []);
      renderPhotoGallery_('gallery-after',  resp.data.after  || []);
    })
    .withFailureHandler(function(){ renderPhotoGallery_('gallery-before', []); renderPhotoGallery_('gallery-after', []); })
    .getOrderPhotos(oid);

function renderPhotoGallery_(elId, list) {
  var el = document.getElementById(elId);

    el.innerHTML = '<div style="color:var(--text3);font-size:12px">Нет фото</div>';

  el.innerHTML = list.map(function(p) {

        '<img src="' + p.img + '" loading="lazy" onclick="openPhotoLightbox(\'' + p.img + '\')" alt="фото">' +
        '<button class="photo-del" title="Удалить" onclick="deletePhotoCard(\'' + p.id + '\')">✕</button>' +

// Загрузка файлов: сжимаем на клиенте (быстрее и легче для Drive), затем шлём
function handlePhotoFiles(input, kind) {
  var files = Array.prototype.slice.call(input.files || []);
  input.value = '';
  if (!files.length) return;
  var oid = App._currentOrderId;
  if (!oid) { toast('Сначала откройте заказ', 'error'); return; }

  var galId = kind === 'После' ? 'gallery-after' : 'gallery-before';
  var gal = document.getElementById(galId);
  var queued = files.length, done = 0;
  toast('Загрузка фото: ' + queued + ' шт…', 'info');

  files.forEach(function(file) {
    if (!/^image\//.test(file.type)) { queued--; return; }
    resizeImage_(file, 1600, 0.82, function(dataUrl) {
      google.script.run
        .withSuccessHandler(function(resp) {
          done++;
          if (resp && resp.ok) {
            if (done >= queued) { loadOrderPhotos(oid); toast('Фото загружены', 'success'); }
          } else {
            toast('Ошибка загрузки: ' + (resp ? resp.error : ''), 'error');
            if (done >= queued) loadOrderPhotos(oid);
          }
        })
        .withFailureHandler(function(e) {
          done++;
          toast('Ошибка: ' + e.message, 'error');
          if (done >= queued) loadOrderPhotos(oid);
        })
        .uploadOrderPhoto({ orderId: oid, kind: kind, dataUrl: dataUrl, filename: file.name });
    });
  });
}

// Сжатие картинки через canvas: ограничиваем макс. сторону, отдаём JPEG dataURL
function resizeImage_(file, maxDim, quality, cb) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var w = img.width, h = img.height;
      var scale = Math.min(1, maxDim / Math.max(w, h));
      var cw = Math.round(w * scale), ch = Math.round(h * scale);
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
      try { cb(canvas.toDataURL('image/jpeg', quality)); }
      catch (err) { cb(e.target.result); }   // на всякий случай — оригинал
    };
    img.onerror = function(){ cb(e.target.result); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// Пересчитать производные поля всех материалов и перерисовать таблицу
function refreshCardMats() {
  (App._currentOrder.materials || []).forEach(function(m) {
    var unit  = m['Единица'] || 'пм';
    var roll  = Number(m['Ширина рулона']) || 1.52;
    var price = Number(m['Цена за м²']) || 0;
    var qty   = Number(m['Кол-во']) || 0;
    var sqm   = (unit === 'пм') ? Math.round(qty * roll * 100) / 100 : qty;
    m['Кол-во м²']  = sqm;
    // остаток вычитается из расхода → отрицательная стоимость
    m['Стоимость']  = Math.round(sqm * price * 100) / 100 * (m['Тип'] === 'остаток' ? -1 : 1);
  });
  var tb = document.getElementById('card-mat-tbody');
  if (tb) tb.innerHTML = renderCardMatRows();
}

// Изменение кол-ва / единицы / типа / названия в строке
function onCardMatEdit(i) {
  var m = App._currentOrder && App._currentOrder.materials[i];
  if (!m) return;
  var q  = document.querySelector('.cardmat-qty[data-i="'   + i + '"]');
  var u  = document.querySelector('.cardmat-unit[data-i="'  + i + '"]');
  var t  = document.querySelector('.cardmat-type[data-i="'  + i + '"]');
  var nm = document.querySelector('.cardmat-name[data-i="'  + i + '"]');
  var pr = document.querySelector('.cardmat-price[data-i="' + i + '"]');
  if (q)  m['Кол-во']    = Number(q.value) || 0;
  if (u)  m['Единица']   = u.value;
  if (t)  m['Тип']       = t.value;
  if (nm) m['Название']  = nm.value;
  if (pr) m['Цена за м²'] = Number(pr.value) || 0;
  refreshCardMats();
  matAutoSave();
}

// Выбор материала из справочника
function onCardMatSelect(i) {
  var m = App._currentOrder && App._currentOrder.materials[i];
  if (!m) return;
  var sel = document.querySelector('.cardmat-mat[data-i="' + i + '"]');
  if (!sel) return;
  var opt = sel.options[sel.selectedIndex];
  m['Материал ID']   = opt.value || '';
  m['Название']      = opt.value ? opt.textContent : '';
  m['Единица']       = (opt.dataset.unit) || 'пм';
  m['Цена за м²']    = Number(opt.dataset.price) || 0;
  m['Ширина рулона'] = Number(opt.dataset.roll) || 1.52;
  // подхватываем введённое кол-во
  var q = document.querySelector('.cardmat-qty[data-i="' + i + '"]');
  if (q) m['Кол-во'] = Number(q.value) || 0;
  refreshCardMats();
  matAutoSave();
}

function addCardMatLine() {
  if (!App._currentOrder) return;

  var o = App._currentOrder;
  if (!o) return;
  var lines = (o.materials || []).filter(function(m) {

    return (m['Материал ID'] || String(m['Название'] || '').trim() || Number(m['Кол-во']) > 0);

      (verified ? 'Снять проверку' : 'Отметить проверенным') +
    '</button>';
}

function verifyOrderCard(orderId) {
  var o = App._currentOrder;
  var wrap = document.getElementById('card-verify-banner');
  var prev = (o && String(o['Проверено']) === 'Да');
  var next = !prev;

  // 1) Мгновенно меняем баннер и кэш (оптимистично)
  if (o) o['Проверено'] = next ? 'Да' : 'Нет';
  if (wrap) wrap.innerHTML = verifyBannerHtml_(orderId, next);

  // 2) Синхронизируем с сервером в фоне, при ошибке откатываем
  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) {
        if (o) o['Проверено'] = prev ? 'Да' : 'Нет';
        if (wrap) wrap.innerHTML = verifyBannerHtml_(orderId, prev);
        toast('Ошибка: ' + (resp ? resp.error : ''), 'error');
        return;
      }
      var v = !!resp.data.verified;
      if (o) o['Проверено'] = v ? 'Да' : 'Нет';
      // обновляем кэш списка заказов
      for (var i = 0; i < (App.orders || []).length; i++) {
        if (String(App.orders[i]['ID']) === String(orderId)) { App.orders[i]['Проверено'] = v ? 'Да' : 'Нет'; break; }
      }
      toast(v ? 'Отмечено проверенным' : 'Проверка снята', 'success');
    })
    .withFailureHandler(function(e){
      if (o) o['Проверено'] = prev ? 'Да' : 'Нет';
      if (wrap) wrap.innerHTML = verifyBannerHtml_(orderId, prev);
      toast('Ошибка: ' + e.message, 'error');
    })
    .toggleOrderVerification(orderId);
}

// Общий флаш карточки (поля авто + плёнка/расходы + персонал) — перед печатью и уходом
function flushCard_(cb) { cvFlush_(function(){ matFlush_(function(){ persFlush_(cb); }); }); }

function finLine_(label, value, color, bold) {
  return '<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:13px' + (bold?';font-weight:700':'') + '">' +
    '<span style="color:var(--text2)">' + label + '</span>' +
    '<span style="font-weight:600;color:' + (color||'') + '">' + value + '</span></div>';
}

// Внутренности блока «Финансовый итог» (для обновления без перезагрузки карточки)
function renderCardFinance_(order) {
  var fmt = function(n){ return (Math.round((Number(n)||0)*100)/100).toLocaleString('ru') + ' ' + CUR; };
  var payType = String(order['Тип оплаты'] || '').trim();
  return '<div style="font-weight:600;margin-bottom:10px">Финансовый итог</div>' +
    finLine_('Стоимость заказа', fmt(order['Стоимость заказа']), '') +
    finLine_('Итого материалы', '−' + fmt(order['Итого материалы']), 'var(--text3)') +
    finLine_('Итого расходы',   '−' + fmt(order['Итого расходы']),   'var(--text3)') +
    (payType==='Безнал' ? finLine_('Безнал −15%', '−' + fmt(Number(order['Стоимость заказа'])*0.15), 'var(--text3)') : '') +
    '<div style="border-top:1px solid var(--border);margin:8px 0"></div>' +
    finLine_('Валовая прибыль', fmt(order['Валовая прибыль']), 'var(--success)') +
    finLine_('Бонус менеджера', fmt(order['Бонус менеджера']), 'var(--accent)') +
    finLine_('Бонус мастера',   fmt(order['Бонус оклейщика']), 'var(--accent)') +
    '<div style="border-top:2px solid var(--border);margin:8px 0"></div>' +
    finLine_('Маржинальная',    fmt(order['Маржинальная прибыль']), 'var(--success)', true);
}

// Печать документа: сперва досохраняем правки (cvFlush_), затем генерируем
function printDoc_(genFnName) {
  var id = App._currentOrderId;
  if (!id) return;
  flushCard_(function(){
    google.script.run
      .withSuccessHandler(function(resp) {
        if (!resp||!resp.ok) { toast('Ошибка: '+(resp?resp.error:''),'error'); return; }
        var w = window.open('','_blank'); if(w){ w.document.write(resp.data); w.document.close(); }
      })
      .withFailureHandler(function(e){ toast('Ошибка: '+e.message,'error'); })
      [genFnName](id);
  });
}
function printOrderContract() { printDoc_('generateContractHtml'); }
function printOrderNarad()    { printDoc_('generateOrderNaradHtml'); }
function printWorkCard()      { printDoc_('generateWorkCardHtml'); }

/* ===== ИНИЦИАЛИЗАЦИЯ ===== */
function init() {
  refreshSync();
  var lbl = document.getElementById('theme-label');
  if (lbl) lbl.textContent = App._theme === 'dark' ? 'Светлая тема' : 'Тёмная тема';

  google.script.run
    .withSuccessHandler(function(resp) {
      var loader = document.getElementById('app-loading');
      if (loader) loader.classList.add('hidden');
      var dash = document.getElementById('page-dashboard');
      if (dash) dash.classList.add('active');
      if (!resp) { toast('Сервер не вернул данные', 'error'); return; }
      var data;
      if (resp.ok === true && resp.data) { data = resp.data; }
      else if (resp.brand || resp.config || resp.employees) { data = resp; }
      else { toast('Ошибка: ' + (resp.error || 'unknown'), 'error'); return; }
      if (data.brand) applyBrand(data.brand);
      App.config = data.config;
      App.employees = data.employees || [];
      fillServiceDropdowns();   // списки услуг из каталога (white-label)
      if (data.config && data.config.positions) fillPositions(data.config.positions);
      if (data.config && data.config.leadSources) fillLeadSources(data.config.leadSources);
      else if (window.CONFIG_LEAD_SOURCES) fillLeadSources(window.CONFIG_LEAD_SOURCES);
      onDashPeriodChange();   // заполняет календари текущим месяцем и грузит данные
      refreshSync();
    })
    .withFailureHandler(function(err) {
      var loader = document.getElementById('app-loading');
      if (loader) loader.classList.add('hidden');
      var dash = document.getElementById('page-dashboard');
      if (dash) dash.classList.add('active');
      toast('Ошибка: ' + err.message, 'error');
    })
    .initApp();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
