  applyOrderColVisibility();
}

/* ===== ВЫДЕЛЕНИЕ СТРОК ЗАКАЗОВ + ГРУППОВОЕ УДАЛЕНИЕ ===== */
App._selOrders = App._selOrders || {};   // { orderId: true }

function toggleOrderSel(oid, cb) {
  if (!oid) return;
  if (cb && cb.checked) App._selOrders[oid] = true; else delete App._selOrders[oid];
  var tr = cb && cb.closest('tr');
  if (tr) tr.classList.toggle('row-selected', !!(cb && cb.checked));
  updateOrderSelBar();
}

// «Выбрать все» из шапки — выделяет только строки текущего отфильтрованного списка
function toggleAllOrderSel(master) {
  var on = master && master.checked;
  (App._ordersFiltered || []).forEach(function(o){
    var id = o['ID']; if (!id) return;
    if (on) App._selOrders[id] = true; else delete App._selOrders[id];
  });
  document.querySelectorAll('#orders-tbody .order-sel-cb').forEach(function(cb){
    cb.checked = on;
    var tr = cb.closest('tr'); if (tr) tr.classList.toggle('row-selected', on);
  });
  updateOrderSelBar();
}

function clearOrderSel() {
  App._selOrders = {};
  document.querySelectorAll('#orders-tbody .order-sel-cb').forEach(function(cb){
    cb.checked = false; var tr = cb.closest('tr'); if (tr) tr.classList.remove('row-selected');
  });
  var master = document.getElementById('orders-sel-all'); if (master) { master.checked = false; master.indeterminate = false; }
  updateOrderSelBar();
}

function selectedOrderIds_() { return Object.keys(App._selOrders || {}); }

// Обновить панель действий и состояние «выбрать все»
function updateOrderSelBar() {
  var ids = selectedOrderIds_();
  var bar = document.getElementById('orders-bulkbar');
  var cnt = document.getElementById('orders-bulk-count');
  if (bar) bar.style.display = ids.length ? 'flex' : 'none';
  if (cnt) cnt.textContent = 'Выбрано заказов: ' + ids.length;
  var master = document.getElementById('orders-sel-all');
  if (master) {
    var total = (App._ordersFiltered || []).length;
    var selHere = (App._ordersFiltered || []).filter(function(o){ return App._selOrders[o['ID']]; }).length;
    master.checked = total > 0 && selHere === total;
    master.indeterminate = selHere > 0 && selHere < total;
  }
}

// Групповое удаление выбранных заказов (мягкое — в Корзину, обратимо)
function bulkDeleteSelectedOrders() {
  var ids = selectedOrderIds_();
  if (!ids.length) return;
  uiConfirm('Удалить выбранные заказы (' + ids.length + ' шт.)?\n\nОни скроются со всех списков и досок. Вернуть можно из «Корзины».',
    function() {
      var idSet = {}; ids.forEach(function(x){ idSet[String(x)] = true; });
      // Оптимистично: сразу убираем строки и перерисовываем — без скелетона и без рефетча
      var removed = (App.orders || []).filter(function(o){ return idSet[String(o['ID'])]; });
      App.orders = (App.orders || []).filter(function(o){ return !idSet[String(o['ID'])]; });
      App._selOrders = {};
      App._dashCache = null; App._debtCache = null; App._cardCache = {};  // пересчитаются при заходе
      filterOrders(); loadOrdersKpi();
      toast('Удалено заказов: ' + ids.length + ' (в Корзине)', 'success');

      // Серверные вызовы — в фоне; не удалённые из-за ошибки возвращаем в список
      var done = 0, failed = 0, failedIds = {};
      var finish = function() {
        if (done + failed < ids.length) return;
        if (failed) {
          var back = removed.filter(function(o){ return failedIds[String(o['ID'])]; });
          if (back.length) { App.orders = back.concat(App.orders || []); filterOrders(); loadOrdersKpi(); }
          toast('Не удалось удалить: ' + failed + ' — вернул в список', 'error');
        }
      };
      ids.forEach(function(oid) {
        google.script.run
          .withSuccessHandler(function(resp){ if (resp && resp.ok) done++; else { failed++; failedIds[String(oid)] = true; } finish(); })
          .withFailureHandler(function(){ failed++; failedIds[String(oid)] = true; finish(); })
          .softDeleteOrder(oid);
      });
    },
    { title: 'Удалить выбранные', okText: 'Удалить', danger: true });
}

// Переключить «Проверено» прямо из таблицы (оптимистично, без захода в карточку)
function toggleOrderVer(id, btn) {
  if (!id) return;
  // оптимистичное обновление кэша и кнопки
  var o = (App.orders || []).find(function(x){ return String(x['ID']) === String(id); });
  var prev = o ? String(o['Проверено'] || '') : null;
  var willOn = prev !== 'Да';
  if (o) o['Проверено'] = willOn ? 'Да' : 'Нет';
  var tr = btn && btn.closest('tr');
  if (btn) {
    btn.className = 'ver-btn ' + (willOn ? 'ver-on' : 'ver-off');
    btn.textContent = willOn ? '✓' : 'проверено';
    btn.title = willOn ? 'Проверено — нажмите, чтобы снять' : 'Отметить проверенным';
  }
  if (tr) tr.classList.toggle('row-verified', willOn);   // затемнить/осветлить строку сразу
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) { // откат
        if (o) o['Проверено'] = prev;
        if (btn) { var on = prev === 'Да'; btn.className = 'ver-btn ' + (on?'ver-on':'ver-off'); btn.textContent = on?'✓':'проверено'; }
        if (tr) tr.classList.toggle('row-verified', prev === 'Да');
        toast('Ошибка: ' + (resp ? resp.error : ''), 'error');
      } else {
        toast(resp.data.verified ? 'Отмечено как проверенное' : 'Проверка снята', 'success');
      }
    })
    .withFailureHandler(function(e){
      if (o) o['Проверено'] = prev;
      if (btn) { var on = prev === 'Да'; btn.className = 'ver-btn ' + (on?'ver-on':'ver-off'); btn.textContent = on?'✓':'проверено'; }
      if (tr) tr.classList.toggle('row-verified', prev === 'Да');
      toast('Ошибка: ' + e.message, 'error');
    })
    .toggleOrderVerification(id);
}

// Ресайз столбцов перетаскиванием правой границы заголовка (один раз на таблицу).
// Ширина запоминается в localStorage по ключу таблицы и восстанавливается при загрузке.
// v2 — сброс старых сохранённых ширин после добавления столбца-чекбокса (сдвиг индексов)
function colWidthsKey_(table) { return 'colw3_' + (table.id || 'table'); }

// Применить ширины столбцов. По умолчанию таблица УЖИМАЕТСЯ под ширину экрана
// (чтобы все колонки были видны без прокрутки); ячейки обрезаются многоточием.
// Если пользователь вручную растянул столбцы (есть сохранённые ширины) —
// уважаем их и, если шире экрана, показываем горизонтальный бегунок.
function applyColWidths_(table) {
  var ths = table.querySelectorAll('thead th');
  var saved = null;
  try { var raw = localStorage.getItem(colWidthsKey_(table)); if (raw) saved = JSON.parse(raw); } catch (e) {}
  var widths = [];
  ths.forEach(function(th, i){
    widths.push((saved && saved[i] > 20) ? saved[i] : (table._origW ? table._origW[i] : th.offsetWidth));
  });
  var sum = widths.reduce(function(a, b){ return a + b; }, 0);
  var wrap = table.parentElement;
  var containerW = wrap ? wrap.clientWidth : 0;
  var fitted = false;
  // Не трогали вручную и таблица шире контейнера → ужать пропорционально, но НЕ уже минимума.
  // Если даже при минимуме всё не влезает (маленький экран) — оставляем шире контейнера,
  // чтобы появился горизонтальный скролл (иначе колонки нечитаемо сжимаются).
  if (!saved && containerW && sum > containerW) {
    var minColW = 64;
    var k = containerW / sum;
    // Узкие колонки (чекбокс/действия) не раздуваем — минимум = min(64, естественная ширина)
    widths = widths.map(function(w){ return Math.max(Math.min(minColW, w), Math.floor(w * k)); });
    sum = widths.reduce(function(a, b){ return a + b; }, 0);
    fitted = (sum <= containerW);   // влезло после минимумов — тянем на 100%; иначе — скролл
  }
  // Снимаем инлайновый min-width из разметки, иначе он не даст столбцу ужаться.
  // Если у таблицы есть <colgroup> (fixed-layout), синхронизируем и ширины <col> —
  // иначе они перебьют ширину th и перетаскивание не будет видно.
  var cols = table.querySelectorAll('colgroup col');
  ths.forEach(function(th, i){
    th.style.width = widths[i] + 'px'; th.style.minWidth = '0';
    if (cols[i]) cols[i].style.width = widths[i] + 'px';
  });
  // Пользователь задал ширины вручную (saved) → уважаем их ТОЧНО, в пикселях, без растягивания
  // на 100% (иначе колонки, влезающие в экран, распираются и «плывут» при возврате в раздел).
  // Первый показ (без saved): влезло — тянем на всю ширину; шире экрана — по сумме (бегунок).
  if (saved) {
    table.style.width = sum + 'px';
  } else {
    table.style.width = (fitted || (containerW && sum <= containerW)) ? '100%' : (sum + 'px');
  }
}

function saveColWidths_(table) {
  try {
    var ths = table.querySelectorAll('thead th');
    var widths = Array.prototype.map.call(ths, function(th){ return th.offsetWidth; });
    localStorage.setItem(colWidthsKey_(table), JSON.stringify(widths));
  } catch (e) { /* localStorage недоступен — не критично */ }
}

// Сбросить ширины столбцов к исходным и забыть сохранённое
function resetTableColWidths_(table) {
  if (!table) return;
  try { localStorage.removeItem(colWidthsKey_(table)); } catch (e) {}
  applyColWidths_(table);   // без сохранённых ширин → снова ужмётся под экран
  if (table.id === 'orders-table') applyOrderColVisibility();
}
function resetOrderColWidths() { resetTableColWidths_(document.getElementById('orders-table')); toast('Ширина столбцов сброшена', 'success'); }

/* ===== ПОКАЗ/СКРЫТИЕ СТОЛБЦОВ ТАБЛИЦЫ ЗАКАЗОВ ===== */
// nth-child столбцов таблицы заказов (1 = чекбокс). Скрываемые — те, что можно
// убрать на узком экране ноутбука, чтобы важные столбцы влезли без прокрутки.
var ORDER_COLS = [
  { n: 2,  label: 'Кнопка «Оплатить»' },
  { n: 4,  label: 'Дата' },
  { n: 7,  label: 'Услуга' },
  { n: 8,  label: 'Сумма' },
  { n: 9,  label: 'Затраты' },
  { n: 10, label: 'Оплата (метка)' },
  { n: 13, label: 'Проверено' },
  { n: 14, label: 'Менеджер' },
  { n: 15, label: 'Мастера' },
];
function orderHiddenCols_() {
  try { var raw = localStorage.getItem('orders_hidden_cols'); if (raw) return JSON.parse(raw) || []; } catch (e) {}
  return [];
}
function applyOrderColVisibility() {
  var hidden = orderHiddenCols_();
  var css = hidden.map(function(n){
    return '#orders-table thead th:nth-child(' + n + '),#orders-table tbody td:nth-child(' + n + '){display:none}';
  }).join('');
  var st = document.getElementById('orders-colhide-style');
  if (!st) { st = document.createElement('style'); st.id = 'orders-colhide-style'; document.head.appendChild(st); }
  st.textContent = css;
  // Если что-то скрыто — пересчитать ширину по видимым столбцам, чтобы таблица
  // реально сократилась. Если ничего не скрыто — ширину не трогаем (её уже
  // корректно выставил applyColWidths_: «влезло» = 100%).
  var table = document.getElementById('orders-table');
  if (table && table._resizable && hidden.length) {
    var ths = table.querySelectorAll('thead th');
    var total = 0;
    ths.forEach(function(th, i){ if (hidden.indexOf(i + 1) < 0) total += th.offsetWidth; });
    if (total) table.style.width = total + 'px';
  }
}
function toggleColsMenu(ev) {
  if (ev) ev.stopPropagation();
  var menu = document.getElementById('orders-cols-menu');
  if (!menu) return;
  if (menu.style.display === 'block') { menu.style.display = 'none'; return; }
  var hidden = orderHiddenCols_();
  menu.innerHTML =
    '<div style="font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px 6px">Показывать столбцы</div>' +
    ORDER_COLS.map(function(c){
      var on = hidden.indexOf(c.n) < 0;
      return '<label style="display:flex;align-items:center;gap:8px;padding:5px 6px;font-size:13px;cursor:pointer;border-radius:6px">' +
        '<input type="checkbox"' + (on ? ' checked' : '') + ' onchange="setOrderColVisible(' + c.n + ',this.checked)"> ' + c.label + '</label>';
    }).join('') +
    '<div style="border-top:1px solid var(--border);margin-top:6px;padding-top:6px">' +
      '<button class="btn btn-ghost" onclick="showAllOrderCols()" style="width:100%;font-size:12px;padding:5px">Показать все</button>' +
    '</div>';
  menu.style.display = 'block';
  setTimeout(function(){
    document.addEventListener('click', closeColsMenuOnce_, { once: true });
  }, 0);
}
function closeColsMenuOnce_(e) {
  var menu = document.getElementById('orders-cols-menu');
  if (menu && !menu.contains(e.target)) menu.style.display = 'none';
  else if (menu) document.addEventListener('click', closeColsMenuOnce_, { once: true }); // клик внутри — держим открытым
}
function setOrderColVisible(n, visible) {
  var hidden = orderHiddenCols_();
  var i = hidden.indexOf(n);
  if (visible && i >= 0) hidden.splice(i, 1);
  else if (!visible && i < 0) hidden.push(n);
  try { localStorage.setItem('orders_hidden_cols', JSON.stringify(hidden)); } catch (e) {}
  applyOrderColVisibility();
}
function showAllOrderCols() {
  try { localStorage.removeItem('orders_hidden_cols'); } catch (e) {}
  applyOrderColVisibility();
  var menu = document.getElementById('orders-cols-menu'); if (menu) menu.style.display = 'none';
}

function makeColumnsResizable(table) {
  if (!table) return;
  if (table._resizable) { applyColWidths_(table); return; }  // перерисовка тела — восстановить ширины
  table._resizable = true;
  var ths = Array.prototype.slice.call(table.querySelectorAll('thead th'));
  // снимок исходных ширин (defaults) ДО фиксации раскладки и применения сохранённых
  table._origW = ths.map(function(th){ return th.offsetWidth; });
  // фиксированная раскладка: тянется только нужный столбец, таблица растёт вправо (скролл)
  table.style.tableLayout = 'fixed';
  applyColWidths_(table);  // выставит ширины th и общую ширину таблицы
  ths.forEach(function(th, i){
    if (i === ths.length - 1) return; // последнюю колонку не тянем
    th.style.position = 'relative';
    var handle = document.createElement('span');
    handle.className = 'col-resizer';
    th.appendChild(handle);
    handle.addEventListener('mousedown', function(e){
      e.preventDefault(); e.stopPropagation();
      var startX = e.pageX, startW = th.offsetWidth, startTableW = table.offsetWidth;
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      function move(ev){
        var w = Math.max(40, startW + (ev.pageX - startX));
        th.style.width = w + 'px';
        var col = table.querySelectorAll('colgroup col')[i];   // синхронизируем colgroup (fixed-layout)
        if (col) col.style.width = w + 'px';
        table.style.width = (startTableW + (w - startW)) + 'px';  // двигается только правая граница
      }
      function up(){
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        document.body.style.cursor = ''; document.body.style.userSelect = '';
        saveColWidths_(table);  // сохранить после перетаскивания
      }
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  });
}

// ── Раскрытие РЕДАКТИРУЕМОЙ детализации (плёнка + расходы) прямо в таблице ──
App._inline = {};   // состояние редакторов по orderId

var _inlEsc = function(s){ return String(s == null ? '' : s).replace(/"/g, '&quot;'); };
var _inlFmt = function(n){ return (Math.round((Number(n)||0)*100)/100).toLocaleString('ru') + ' ' + CUR; };
function _matSqm(m){ return (m.unit === 'пм') ? Math.round((Number(m.qty)||0)*(Number(m.roll)||1.52)*100)/100 : (Number(m.qty)||0); }
// Цена — ЗА М²: стоимость = м² × цена_м².
function _matCost(m){ return Math.round(_matSqm(m)*(Number(m.price)||0)*100)/100 * (m.type === 'остаток' ? -1 : 1); }

function _inlineEnsureMaterials(cb) {
  if (App._materials && App._materials.length) { cb(); return; }
  google.script.run
    .withSuccessHandler(function(resp){ App._materials = (resp && resp.ok) ? (resp.data || []) : []; cb(); })
    .withFailureHandler(function(){ cb(); })
    .getMaterials(null);
}

function toggleOrderFilms(id, ctrl) {
  var tr = ctrl.closest('tr');
  if (!tr) return;
  var next = tr.nextElementSibling;
  if (next && next.classList.contains('film-detail-row')) { inlineFlush_(id); next.remove(); ctrl.classList.remove('open'); return; }
  ctrl.classList.add('open');
  var colspan = tr.children.length;
  var detail = document.createElement('tr');
  detail.className = 'film-detail-row';
  detail.innerHTML = '<td colspan="' + colspan + '" style="padding:0"><div class="film-detail" id="inline-wrap-' + id + '">Загрузка…</div></td>';
  tr.parentNode.insertBefore(detail, tr.nextSibling);
  _inlineEnsureMaterials(function(){
    google.script.run
      .withSuccessHandler(function(resp){
        if (!resp || !resp.ok) { _setInline(id, '<span style="color:var(--danger)">' + (resp ? resp.error : 'Ошибка') + '</span>'); return; }
        var o = resp.data;
        App._inline[id] = {
          mats: (o.materials || []).map(function(m){ return {
            matId: m['Материал ID'] || '', name: m['Название'] || '', unit: m['Единица'] || 'пм',
            qty: Number(m['Кол-во'])||0, roll: Number(m['Ширина рулона'])||1.52,
            price: Number(m['Цена за м²'])||0, type: m['Тип'] === 'остаток' ? 'остаток' : 'расход' }; }),
          exps: (o.expenses || []).map(function(e){ return { name: e['Название'] || '', amount: Number(e['Сумма'])||0 }; }),
          verified: String(o['Проверено'] || '') === 'Да',
        };
        inlineRender(id);
      })
      .withFailureHandler(function(e){ _setInline(id, '<span style="color:var(--danger)">' + e.message + '</span>'); })
      .getOrderFull(id);
  });
}

function _setInline(id, html){ var w = document.getElementById('inline-wrap-' + id); if (w) w.innerHTML = html; }
function inlineRender(id){ _setInline(id, buildInlineEditor(id)); }

function buildInlineEditor(id) {
  var st = App._inline[id]; if (!st) return '';
  var hasRef = (App._materials || []).length > 0;
  var inp = 'padding:3px 6px;border:1px solid var(--border);border-radius:5px;background:var(--inp);color:var(--text);font-size:12px';
  var matTot = 0, expTot = 0;

  var matRows = st.mats.map(function(m, i){
    var sqm = _matSqm(m), cost = _matCost(m), isOst = m.type === 'остаток'; matTot += cost;
    var matCell = hasRef
      ? '<select onchange="inlineMatSelect(\'' + id + '\',' + i + ',this)" style="' + inp + ';min-width:150px">' + cardMatOptions_(m.matId) + '</select>'
      : '<input value="' + _inlEsc(m.name) + '" oninput="inlineField(\'' + id + '\',' + i + ',\'name\',this.value)" placeholder="плёнка" style="' + inp + ';min-width:140px">';
    return '<tr>' +
      '<td>' + matCell + '</td>' +
      '<td style="white-space:nowrap"><input type="number" step="0.01" min="0" value="' + m.qty + '" oninput="inlineNum(\'' + id + '\',' + i + ',\'qty\',this.value)" style="' + inp + ';width:62px"> ' +
        '<select onchange="inlineField(\'' + id + '\',' + i + ',\'unit\',this.value)" style="' + inp + '"><option value="пм"' + (m.unit==='пм'?' selected':'') + '>пм</option><option value="м²"' + (m.unit==='м²'?' selected':'') + '>м²</option></select></td>' +
      '<td id="inline-sqm-' + id + '-' + i + '" style="text-align:right">' + sqm.toFixed(2) + ' м²</td>' +
      '<td style="white-space:nowrap"><input type="number" step="0.01" min="0" value="' + m.price + '" oninput="inlineNum(\'' + id + '\',' + i + ',\'price\',this.value)" style="' + inp + ';width:66px"> ' + CUR + '</td>' +
      '<td><select onchange="inlineField(\'' + id + '\',' + i + ',\'type\',this.value)" style="' + inp + '"><option value="расход"' + (!isOst?' selected':'') + '>расход</option><option value="остаток"' + (isOst?' selected':'') + '>остаток</option></select></td>' +
      '<td id="inline-cost-' + id + '-' + i + '" style="text-align:right;font-weight:600;color:' + (isOst?'var(--danger)':'inherit') + '">' + (isOst?'− '+_inlFmt(Math.abs(cost)):_inlFmt(cost)) + '</td>' +
      '<td><button class="pay-del" onclick="inlineDelMat(\'' + id + '\',' + i + ')" title="Удалить">✕</button></td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="7" style="color:var(--text3);padding:6px">Плёнка не внесена.</td></tr>';

  var expRows = st.exps.map(function(e, i){
    expTot += Number(e.amount)||0;
    return '<tr>' +
      '<td><input value="' + _inlEsc(e.name) + '" oninput="inlineExp(\'' + id + '\',' + i + ',\'name\',this.value)" placeholder="напр. Такси, Арматура" style="' + inp + ';min-width:200px"></td>' +
      '<td style="white-space:nowrap"><input type="number" step="0.01" min="0" value="' + e.amount + '" oninput="inlineExp(\'' + id + '\',' + i + ',\'amount\',this.value)" style="' + inp + ';width:90px"> ' + CUR + '</td>' +
      '<td><button class="pay-del" onclick="inlineDelExp(\'' + id + '\',' + i + ')" title="Удалить">✕</button></td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="3" style="color:var(--text3);padding:6px">Расходов нет.</td></tr>';

  var verBtn = st.verified
    ? '<button class="ver-btn ver-on" style="width:auto;padding:5px 12px" onclick="inlineToggleVer(\'' + id + '\')">✓ проверено</button>'
    : '<button class="ver-btn ver-off" onclick="inlineToggleVer(\'' + id + '\')">проверено</button>';

  return '<div class="film-detail-title">🎞 Расход плёнки и расходы — сверьте с данными мастеров (остаток вычитается)</div>' +
    '<div class="inline-cols">' +
      '<div>' +
        '<table class="film-table"><thead><tr><th>Плёнка</th><th>Кол-во</th><th style="text-align:right">Площадь</th><th style="text-align:right">Цена/м²</th><th>Тип</th><th style="text-align:right">Сумма</th><th></th></tr></thead>' +
        '<tbody>' + matRows + '</tbody></table>' +
        '<button class="btn btn-ghost" style="margin-top:4px;padding:3px 10px;font-size:11px" onclick="inlineAddMat(\'' + id + '\')">+ Плёнка</button>' +
      '</div>' +
      '<div>' +
        '<table class="film-table"><thead><tr><th>Расход (такси, арматура…)</th><th style="text-align:right">Сумма</th><th></th></tr></thead>' +
        '<tbody>' + expRows + '</tbody></table>' +
        '<button class="btn btn-ghost" style="margin-top:4px;padding:3px 10px;font-size:11px" onclick="inlineAddExp(\'' + id + '\')">+ Расход</button>' +
      '</div>' +
    '</div>' +
    '<div class="inline-foot">' +
      verBtn +
      '<span style="font-size:12px;color:var(--text2)">Итого плёнка (нетто): <b id="inline-mattot-' + id + '">' + _inlFmt(matTot) + '</b> · Расходы: <b id="inline-exptot-' + id + '">' + _inlFmt(expTot) + '</b></span>' +
      '<span id="inline-status-' + id + '" style="font-size:11px;color:var(--text3);margin-left:auto"></span>' +
    '</div>';
}

// быстрый пересчёт стоимостей/итогов без полной перерисовки (сохраняет фокус ввода)
function inlineRecalc(id) {
  var st = App._inline[id]; if (!st) return;
  var matTot = 0;
  st.mats.forEach(function(m, i){
    var sqm = _matSqm(m), cost = _matCost(m), isOst = m.type === 'остаток'; matTot += cost;
    var se = document.getElementById('inline-sqm-' + id + '-' + i); if (se) se.textContent = sqm.toFixed(2) + ' м²';
    var ce = document.getElementById('inline-cost-' + id + '-' + i);
    if (ce) { ce.textContent = isOst ? '− ' + _inlFmt(Math.abs(cost)) : _inlFmt(cost); ce.style.color = isOst ? 'var(--danger)' : 'inherit'; }
  });
  var expTot = st.exps.reduce(function(s, e){ return s + (Number(e.amount)||0); }, 0);
  var mt = document.getElementById('inline-mattot-' + id); if (mt) mt.textContent = _inlFmt(matTot);
  var et = document.getElementById('inline-exptot-' + id); if (et) et.textContent = _inlFmt(expTot);
}

function inlineNum(id, i, field, val) { var st = App._inline[id]; if (!st) return; st.mats[i][field] = Number(val) || 0; inlineRecalc(id); inlineAutoSave(id); }
function inlineField(id, i, field, val) { var st = App._inline[id]; if (!st) return; st.mats[i][field] = val; inlineRender(id); inlineAutoSave(id); }
function inlineMatSelect(id, i, sel) {
  var st = App._inline[id]; if (!st) return;
  var opt = sel.selectedOptions && sel.selectedOptions[0];
  st.mats[i].matId = sel.value;
  if (opt) {
    st.mats[i].name  = opt.textContent || '';
    st.mats[i].price = Number(opt.dataset.price) || 0;
    st.mats[i].roll  = Number(opt.dataset.roll)  || 1.52;
    if (opt.dataset.unit) st.mats[i].unit = opt.dataset.unit;
  }
  inlineRender(id);
  inlineAutoSave(id);
}
function inlineExp(id, i, field, val) { var st = App._inline[id]; if (!st) return; st.exps[i][field] = (field === 'amount') ? (Number(val)||0) : val; if (field === 'amount') inlineRecalc(id); inlineAutoSave(id); }
function inlineAddMat(id) { var st = App._inline[id]; if (!st) return; st.mats.push({ matId:'', name:'', unit:'пм', qty:0, roll:1.52, price:0, type:'расход' }); inlineRender(id); }
function inlineDelMat(id, i) { var st = App._inline[id]; if (!st) return; st.mats.splice(i,1); inlineRender(id); inlineAutoSave(id); }
function inlineAddExp(id) { var st = App._inline[id]; if (!st) return; st.exps.push({ name:'', amount:0 }); inlineRender(id); }
function inlineDelExp(id, i) { var st = App._inline[id]; if (!st) return; st.exps.splice(i,1); inlineRender(id); inlineAutoSave(id); }

function inlineToggleVer(id) {
  var st = App._inline[id]; if (!st) return;
  var prev = !!st.verified; st.verified = !prev; inlineRender(id);
  App.orders = []; App._cardCache = {}; App._dashCache = null;
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) { st.verified = prev; inlineRender(id); toast('Ошибка: ' + (resp?resp.error:''), 'error'); }
      else toast(resp.data.verified ? 'Отмечено как проверенное' : 'Проверка снята', 'success');
    })
    .withFailureHandler(function(e){ st.verified = prev; inlineRender(id); toast('Ошибка: ' + e.message, 'error'); })
    .setOrderVerifiedAll(id, !prev);
}

App._inlineTimers = {};
App._inlineDirty  = {};

function inlineSetStatus_(id, text, color) {
  var el = document.getElementById('inline-status-' + id);
  if (el) { el.textContent = text; el.style.color = color || 'var(--text3)'; }
}

// Автосохранение инлайн-редактора в таблице (debounce, без перезагрузки таблицы)
function inlineAutoSave(id) {
  App._inlineDirty[id] = true;
  inlineSetStatus_(id, '● не сохранено', 'var(--warning)');
  clearTimeout(App._inlineTimers[id]);
  App._inlineTimers[id] = setTimeout(function(){ inlineFlush_(id); }, 900);
}

function inlineFlush_(id, cb) {
  clearTimeout(App._inlineTimers[id]);
  if (!App._inlineDirty[id]) { if (cb) cb(); return; }
  App._inlineDirty[id] = false;
  var st = App._inline[id]; if (!st) { if (cb) cb(); return; }
  var matLines = st.mats.filter(function(m){ return m.matId || String(m.name||'').trim() || Number(m.qty) > 0; })
    .map(function(m){ return { materialId:m.matId||'', name:m.name||'', unit:m.unit||'пм', qty:Number(m.qty)||0, rollWidth:Number(m.roll)||1.52, pricePerSqm:Number(m.price)||0, type:m.type==='остаток'?'остаток':'расход' }; });
  var expLines = st.exps.filter(function(e){ return String(e.name||'').trim() || Number(e.amount) > 0; })
    .map(function(e){ return { name:e.name||'', amount:Number(e.amount)||0 }; });
  inlineSetStatus_(id, 'сохранение…');
  var fail = function(){ inlineSetStatus_(id, 'ошибка сохранения', 'var(--danger)'); if (cb) cb(); };
  google.script.run.withSuccessHandler(function(r1){
    if (!r1 || !r1.ok) { fail(); return; }
    google.script.run.withSuccessHandler(function(r2){
      if (!r2 || !r2.ok) { fail(); return; }
      google.script.run.withSuccessHandler(function(){
        App.orders = []; App._cardCache = {}; App._dashCache = null; App._debtCache = null;
        inlineSetStatus_(id, '✓ сохранено', 'var(--success)'); if (cb) cb();
      }).withFailureHandler(fail).recalcOrderFinance(id);
    }).withFailureHandler(fail).saveOrderExpenses(id, expLines);
  }).withFailureHandler(fail).saveOrderMaterials(id, matLines);
}

// Досохранить все открытые инлайн-редакторы (перед навигацией)
function flushAllInline_() {
  Object.keys(App._inlineDirty || {}).forEach(function(id){ if (App._inlineDirty[id]) inlineFlush_(id); });
}

/* ===== КАНБАН-ДОСКА ===== */
// Колонки канбана = настраиваемые воронки (orderStatusNames из white-label конфига)

// Компактный бейдж оплаты для карточки канбана
function kanbanPayBadge_(o) {
  var price     = Number(o['Стоимость заказа']) || 0;
  var paid      = Number(o._paid) || 0;
  var payStatus = String(o['Статус оплаты'] || '').trim() || 'Не оплачен';
  var payType   = String(o['Тип оплаты'] || '').trim();
  if (payStatus === 'Оплачен')
    return '<span class="kanban-badge" style="background:var(--green-soft);color:var(--success)">✓ оплачен</span>';
  if (payStatus === 'Частично')
    return '<span class="kanban-badge" style="background:var(--blue-soft);color:var(--blue)">рассрочка ' + Math.round(price ? paid/price*100 : 0) + '%</span>';
  if (payType === 'Отсрочка')
    return '<span class="kanban-badge" style="background:var(--yellow-soft);color:var(--warning)">отсрочка</span>';
  if (payType === 'Рассрочка')
    return '<span class="kanban-badge" style="background:var(--blue-soft);color:var(--blue)">рассрочка</span>';
  return '<span class="kanban-badge" style="background:var(--red-soft);color:var(--danger)">долг</span>';
}

function renderOrdersKanban(orders) {
  var board = document.getElementById('orders-kanban');
  if (!board) return;
  orders = orders || [];

  // Группируем по статусу (воронки — из white-label конфига)
  var STATUS_NAMES = orderStatusNames();
  var defStatus = STATUS_NAMES[0] || 'Новый';
  // Имя статуса «Выдан» (done) — туда автоматически попадают оплаченные заказы
  var doneName = (function(){ for (var i=0;i<STATUS_NAMES.length;i++) if (isDoneStatus(STATUS_NAMES[i])) return STATUS_NAMES[i]; return null; })();
  var byStatus = {};
  STATUS_NAMES.forEach(function(s){ byStatus[s] = []; });
  orders.forEach(function(o){
    // Карточка показывается в колонке своего РЕАЛЬНОГО статуса (куда перетащили — там и остаётся).
    // Без авто-прыжка оплаченных в «Выдан» — иначе заказ «исчезал» из колонки, куда его бросили.
    var s = o['Статус'] || defStatus;
    if (!byStatus[s]) byStatus[s] = [];   // нестандартный статус (напр. из старых данных)
    byStatus[s].push(o);
  });

  // Порядок колонок: настроенные воронки по порядку + нестандартные с карточками в конце
  var columns = STATUS_NAMES.slice();
  Object.keys(byStatus).forEach(function(s){ if (columns.indexOf(s) < 0 && byStatus[s].length) columns.push(s); });

  var esc = function(s){ return String(s||'').replace(/'/g,"\\'"); };
  var html = '';

  columns.forEach(function(status){
    var list  = byStatus[status] || [];
    // Ручной порядок: карточки сортируются по сохранённому списку ID; новые (ещё не расставленные) — наверх
    var ord = (App._kanbanOrder && App._kanbanOrder[status]) || [];
    if (ord.length) {
      list = list.slice().sort(function(a, b){
        var ia = ord.indexOf(a['ID']), ib = ord.indexOf(b['ID']);
        if (ia === -1 && ib === -1) return 0;
        if (ia === -1) return -1;
        if (ib === -1) return 1;
        return ia - ib;
      });
    }
    var color = orderStatusColor(status);
    var sum   = list.reduce(function(a, o){ return a + (Number(o['Стоимость заказа']) || 0); }, 0);

    var cards = list.map(function(o){
      var oid    = o['ID'] || '';
      var price  = Number(o['Стоимость заказа']) || 0;
      var isLegal = o._clientType === 'юр';
      return '<div class="kanban-card" draggable="true" data-id="' + oid + '" style="border-left-color:' + color + '"' +
        ' ondragstart="kanbanDragStart(event,\'' + oid + '\')" ondragend="kanbanDragEnd(event)"' +
        ' onclick="openOrderCard(\'' + oid + '\')">' +
        '<button class="kanban-del" title="Удалить заказ" onclick="event.stopPropagation();deleteOrderFromKanban(\'' + oid + '\')">✕</button>' +
        '<div class="kanban-card-top">' +
          '<span class="kanban-card-num">' + (o['Номер договора'] || oid) + '</span>' +
          '<span class="kanban-card-sum">' + price.toLocaleString('ru') + ' ' + CUR + '</span>' +
        '</div>' +
        '<div class="kanban-card-client">' + (o['Клиент'] || '—') +
          (isLegal ? ' <span class="kanban-badge" style="background:var(--purple-soft);color:var(--purple)">ЮЛ</span>' : '') +
        '</div>' +
        '<div class="kanban-card-car">' + (o['Авто'] || '—') + (o['Госномер'] ? ' · ' + o['Госномер'] : '') + '</div>' +
        '<div class="kanban-card-foot">' +
          kanbanPayBadge_(o) +
          '<span class="kanban-card-svc">' + (o['Услуга'] || '') + '</span>' +
        '</div>' +
      '</div>';
    }).join('');

    var eName = esc(status);
    var hx    = hex6_(color);
    html +=
      '<div class="kanban-col" data-status="' + status + '"' +
        ' ondragover="kanbanDragOver(event, this)" ondragleave="kanbanDragLeave(event, this)"' +
        ' ondrop="kanbanDrop(event, this)">' +
        '<div class="kanban-col-head" draggable="true" title="Перетащите, чтобы поменять порядок воронок"' +
          ' ondragstart="colDragStart(event,\'' + eName + '\')" ondragend="colDragEnd(event)"' +
          ' style="background:' + hx + ';color:' + contrastOn_(hx) + '">' +
          '<input type="color" class="kanban-col-color" value="' + hx + '" title="Цвет воронки"' +
            ' onclick="event.stopPropagation()" onchange="changeStatusColorInline(\'' + eName + '\', this.value)">' +
          '<span class="kanban-title" title="Двойной клик — переименовать" ondblclick="startStatusRename(event,\'' + eName + '\')">' + status + '</span>' +
          '<span class="kanban-count">' + list.length + '</span>' +
          '<button class="kanban-col-del" title="Удалить воронку" onclick="event.stopPropagation();deleteStatusInline(\'' + eName + '\')">✕</button>' +
        '</div>' +
        '<div class="kanban-col-sum">' + Math.round(sum).toLocaleString('ru') + ' ' + CUR + '</div>' +
        '<div class="kanban-col-body">' + (cards || '<div class="kanban-empty">Перетащите сюда</div>') + '</div>' +
      '</div>';
  });

  // Плитка добавления новой воронки
  html += '<button class="kanban-add-col" title="Добавить воронку" onclick="addStatusInline()">+</button>';

  board.innerHTML = html;
}

// --- Drag & drop ---
var _kanbanDragId = null;

function kanbanDragStart(ev, oid) {
  _kanbanDragId = oid;
  try { ev.dataTransfer.setData('text/plain', oid); ev.dataTransfer.effectAllowed = 'move'; } catch(e){}
  if (ev.currentTarget) ev.currentTarget.classList.add('dragging');
}
function kanbanDragEnd(ev) {
  if (ev.currentTarget) ev.currentTarget.classList.remove('dragging');
  _kanbanDragId = null;
  document.querySelectorAll('.kanban-col.drop-hover').forEach(function(c){ c.classList.remove('drop-hover'); });
  kanbanClearIndicator_(null);   // снять линии-индикаторы во всех колонках
}
function kanbanDragOver(ev, col) {
  ev.preventDefault();                       // разрешаем drop
  try { ev.dataTransfer.dropEffect = 'move'; } catch(e){}
  if (App._colDrag != null) {                // перетаскивание КОЛОНКИ (смена порядка воронок)
    if (col) col.classList.add('col-drop-hover');
    return;
  }
  if (col) {
    col.classList.add('drop-hover');
    kanbanShowIndicator_(col.querySelector('.kanban-col-body'), ev.clientY);   // линия в точке вставки
  }
}
function kanbanDragLeave(ev, col) {
  // снимаем подсветку только когда курсор реально покинул колонку
  if (col && !col.contains(ev.relatedTarget)) {
    col.classList.remove('drop-hover');
    col.classList.remove('col-drop-hover');
    kanbanClearIndicator_(col.querySelector('.kanban-col-body'));
  }
}
function kanbanDrop(ev, col) {
  ev.preventDefault();
  if (col) { col.classList.remove('drop-hover'); col.classList.remove('col-drop-hover'); }
  if (App._colDrag != null) {                // бросили КОЛОНКУ → меняем порядок воронок
    var tgt = col ? col.getAttribute('data-status') : '';
    var frm = App._colDrag; App._colDrag = null;
    if (tgt && frm && tgt !== frm) reorderStatuses(frm, tgt);
    return;
  }
  var body   = col ? col.querySelector('.kanban-col-body') : null;
  var index  = kanbanInsertIndex_(body, ev.clientY);     // позиция вставки ДО подсчёта учитывает все карточки кроме перетаскиваемой
  if (body) kanbanClearIndicator_(body);
  var status = col ? col.getAttribute('data-status') : '';
  var oid = _kanbanDragId;
  try { if (!oid) oid = ev.dataTransfer.getData('text/plain'); } catch(e){}
  _kanbanDragId = null;
  if (oid && status) moveOrderToStatusAt(oid, status, index, body);
}

// Индекс вставки в колонке по координате курсора (исключая перетаскиваемую карточку)
function kanbanInsertIndex_(body, clientY) {
  if (!body) return 0;
  var cards = Array.prototype.slice.call(body.querySelectorAll('.kanban-card:not(.dragging)'));
  for (var i = 0; i < cards.length; i++) {
    var r = cards[i].getBoundingClientRect();
    if (clientY < r.top + r.height / 2) return i;   // курсор выше середины карточки → вставить перед ней
  }
  return cards.length;                               // ниже всех → в конец
}

// Показать линию-индикатор места вставки
function kanbanShowIndicator_(body, clientY) {
  if (!body) return;
  kanbanClearIndicator_(body);
  var cards = Array.prototype.slice.call(body.querySelectorAll('.kanban-card:not(.dragging)'));
  var idx = kanbanInsertIndex_(body, clientY);
  if (idx < cards.length) cards[idx].classList.add('kb-drop-before');
  else if (cards.length) cards[cards.length - 1].classList.add('kb-drop-after');
  else body.classList.add('kb-drop-empty');
}
function kanbanClearIndicator_(body) {
  var scope = body || document;
  scope.querySelectorAll('.kb-drop-before, .kb-drop-after').forEach(function(c){ c.classList.remove('kb-drop-before','kb-drop-after'); });
  (body ? [body] : Array.prototype.slice.call(document.querySelectorAll('.kanban-col-body'))).forEach(function(b){ b.classList.remove('kb-drop-empty'); });
}

// Сохранение порядка на сервер — с задержкой (накапливаем быстрые перетаскивания)
function kanbanScheduleSave_() {
  clearTimeout(App._kanbanSaveTimer);
  App._kanbanSaveTimer = setTimeout(function(){
    google.script.run
      .withSuccessHandler(function(){})
      .withFailureHandler(function(){})   // порядок — некритичная вещь, тихо
      .saveKanbanOrder(App._kanbanOrder || {});
  }, 700);
}

// Перемещение карточки в статус И в конкретную позицию — оптимистично, с откатом при ошибке
function moveOrderToStatusAt(orderId, newStatus, index, body) {
  var order = null;
  for (var i = 0; i < App.orders.length; i++) {
    if (App.orders[i]['ID'] === orderId) { order = App.orders[i]; break; }
  }
  if (!order) return;
  var prevStatus = order['Статус'];
  var statusChanged = (prevStatus !== newStatus);

  // Авторитетный порядок целевой колонки — берём из ТЕКУЩЕГО показа (DOM), исключая перетаскиваемую
  if (!App._kanbanOrder) App._kanbanOrder = {};
  var ids = [];
  if (body) {
    ids = Array.prototype.slice.call(body.querySelectorAll('.kanban-card'))
      .map(function(c){ return c.getAttribute('data-id'); })
      .filter(function(id){ return id && id !== orderId; });
  } else {
    ids = (App._kanbanOrder[newStatus] || []).filter(function(id){ return id !== orderId; });
  }
  if (index == null || index < 0 || index > ids.length) index = ids.length;
  ids.splice(index, 0, orderId);
  App._kanbanOrder[newStatus] = ids;
  // убрать ID из старой колонки, чтобы не задваивался при смене статуса
  if (statusChanged && App._kanbanOrder[prevStatus]) {
    App._kanbanOrder[prevStatus] = App._kanbanOrder[prevStatus].filter(function(id){ return id !== orderId; });
  }

  order['Статус'] = newStatus;                // оптимистично
  filterOrders();                             // мгновенная перерисовка доски в новом порядке

  if (statusChanged) {
    google.script.run
      .withSuccessHandler(function(resp){
        if (!resp || !resp.ok) {
          order['Статус'] = prevStatus; filterOrders();
          toast('Ошибка: ' + (resp ? resp.error : ''), 'error');
          return;
        }
        App._dashCache = null;                // статус влияет на «в работе» на дашборде
        kanbanScheduleSave_();                // порядок сохраняем после успешной смены статуса
        toast('→ ' + newStatus, 'success');
      })
      .withFailureHandler(function(e){
        order['Статус'] = prevStatus; filterOrders();
        toast('Ошибка: ' + e.message, 'error');
      })
      .updateOrderStatus(orderId, newStatus);
  } else {
    kanbanScheduleSave_();                     // только переупорядочивание внутри колонки
  }
}

// Удаление заказа с канбана — мягкое (в Корзину), обратимо
function deleteOrderFromKanban(oid) {
  var order = null;
  for (var i = 0; i < App.orders.length; i++) { if (App.orders[i]['ID'] === oid) { order = App.orders[i]; break; } }
  var num = order ? (order['Номер договора'] || oid) : oid;
  var sum = order ? (Number(order['Стоимость заказа']) || 0) : 0;
  uiConfirm('Удалить заказ ' + num + (sum ? (' на ' + sum.toLocaleString('ru') + ' ' + CUR) : '') + '?\n\nЗаказ скроется со всех досок и списков. Его можно вернуть из «Корзины».',
    function() {
      // Оптимистично: убираем сразу, серверный вызов в фоне, откат при ошибке
      var removed = order;
      App.orders = App.orders.filter(function(o){ return o['ID'] !== oid; });
      if (App._kanbanOrder) Object.keys(App._kanbanOrder).forEach(function(s){
        App._kanbanOrder[s] = (App._kanbanOrder[s] || []).filter(function(id){ return id !== oid; });
      });
      App._dashCache = null; App._cardCache = {}; App._debtCache = null;
      filterOrders();
      toast('Заказ удалён (в Корзине)', 'success');
      var restore = function(msg){
        if (removed) { App.orders = [removed].concat(App.orders || []); filterOrders(); }
        toast(msg, 'error');
      };
      google.script.run
        .withSuccessHandler(function(resp){ if (!resp || !resp.ok) restore('Не удалось удалить — вернул заказ: ' + (resp ? resp.error : '')); })
        .withFailureHandler(function(e){ restore('Ошибка: ' + e.message + ' — вернул заказ'); })
        .softDeleteOrder(oid);
    },
    { title: 'Удалить заказ', okText: 'Удалить', danger: true });
}

// Корзина: открыть и показать удалённые заказы
function openTrash() {
  openModal('modal-trash');
  var box = document.getElementById('trash-list');
  if (box) box.innerHTML = '<div style="text-align:center;padding:28px;color:var(--text3)">Загрузка…</div>';
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) { if (box) box.innerHTML = '<div style="color:var(--danger);padding:16px">Ошибка: ' + (resp ? resp.error : '') + '</div>'; return; }
      renderTrash(resp.data || []);
    })
    .withFailureHandler(function(e){ if (box) box.innerHTML = '<div style="color:var(--danger);padding:16px">Ошибка: ' + e.message + '</div>'; })
    .getOrders({ deleted: true });
}

function renderTrash(list) {
  var box = document.getElementById('trash-list'); if (!box) return;
  if (!list.length) { box.innerHTML = '<div style="text-align:center;padding:28px;color:var(--text3)">Корзина пуста</div>'; return; }
  box.innerHTML = list.map(function(o){

        '<div style="font-size:12px;color:var(--text3)">' + (o['Дата'] || '') + ' · ' + (o['Авто'] || '—') + ' · ' + (o['Услуга'] || '') + ' · ' + price.toLocaleString('ru') + ' ' + CUR + '</div>' +
      '</div>' +
      '<button class="btn btn-ghost" style="white-space:nowrap" onclick="restoreOrderFromTrash(\'' + o['ID'] + '\')">↩ Вернуть</button>' +

function restoreOrderFromTrash(id) {
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) { toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); return; }
      App.orders = []; App._dashCache = null; App._cardCache = {};
      toast('Заказ восстановлен', 'success');
      openTrash();
      if (App.currentPage === 'orders') loadOrders(true);
    })
    .withFailureHandler(function(e){ toast('Ошибка: ' + e.message, 'error'); })
    .restoreOrder(id);
}

function hardDeleteFromTrash(id) {
  uiConfirm('Удалить заказ НАВСЕГДА вместе с его платежами и графиком рассрочки?\n\nЭто действие необратимо.',
    function() {
      google.script.run
        .withSuccessHandler(function(resp){
          if (!resp || !resp.ok) { toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); return; }
          App._dashCache = null;
          toast('Удалено навсегда' + (resp.data && resp.data.payments ? ' (платежей: ' + resp.data.payments + ')' : ''), 'success');
          openTrash();
        })
        .withFailureHandler(function(e){ toast('Ошибка: ' + e.message, 'error'); })
        .hardDeleteOrder(id);
    },
    { title: 'Удалить навсегда', okText: 'Удалить навсегда', danger: true });
}

function changeOrderStatus(orderId, selectEl) {
  var newStatus = selectEl.value;
  // Оптимистично: меняем локально и перерисовываем СРАЗУ, не дожидаясь сервера
  var prev = null;
  for (var i = 0; i < App.orders.length; i++) {
    if (App.orders[i]['ID'] === orderId) { prev = App.orders[i]['Статус']; App.orders[i]['Статус'] = newStatus; break; }
  }
  if (App.currentPage === 'orders') { filterOrders(); loadOrdersKpi(); }
  var revert = function() {
    for (var j = 0; j < App.orders.length; j++) { if (App.orders[j]['ID'] === orderId) { App.orders[j]['Статус'] = prev; break; } }
    if (App.currentPage === 'orders') { filterOrders(); loadOrdersKpi(); }
  };
  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) { revert(); toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); return; }
      // тихо помечаем кэш свежим — данные уже актуальны локально
      markLoaded_('orders');
    })
    .withFailureHandler(function(e){ revert(); toast('Ошибка: ' + e.message, 'error'); })
    .updateOrderStatus(orderId, newStatus);
}

/* ===== ФОРМА НОВОГО ЗАКАЗА ===== */

App._orderPayType  = '';   // условия оплаты в форме нового заказа
App._materials     = [];   // справочник материалов
App._expenseHints  = ['Такси','Арматура','Парковка','Доставка','Инструмент','Прочее'];
App._orderMaterials = [];  // строки материалов текущей формы
App._orderExpenses  = [];  // строки расходов текущей формы

/* --- Инициализация формы заказа --- */
function initOrderForm() {
  App._orderMaterials = [];
  App._orderExpenses  = [];
  var ml = document.getElementById('ord-materials-list');
  var el = document.getElementById('ord-expenses-list');
  if (ml) ml.innerHTML = '';
  if (el) el.innerHTML = '';
  var me = document.getElementById('ord-materials-empty');
  var ee = document.getElementById('ord-expenses-empty');
  if (me) me.style.display = 'block';
  if (ee) ee.style.display = 'block';
  // Сбрасываем выбор мастеров
  var lbl = document.getElementById('ord-masters-label');
  if (lbl) lbl.textContent = '— выбрать —';
  document.querySelectorAll('#ord-masters-wrap input[type=checkbox]').forEach(function(cb){ cb.checked = false; });
  var hid = document.getElementById('ord-masters'); if (hid) hid.value = '';
  App._mastersManual = false;   // сбрасываем: мастер подтянется авто по роли под услугу
  setOrderPaidNow_(false);      // сбрасываем «Принять оплату сразу»

  // Авто-подстановка менеджера и администратора: последний использованный (запоминаем),
  // иначе — первый сотрудник с ролью менеджер/админ. Ставим всегда (форма новая).
  ensureEmployeesLoaded_(function(){
    fillOrderEmployees();
    var lastM = '', lastA = '';
    try { lastM = localStorage.getItem('spr_last_manager') || ''; lastA = localStorage.getItem('spr_last_admin') || ''; } catch (e) {}
    var selMgr = document.getElementById('ord-manager');
    if (selMgr) selMgr.value = lastM || defaultEmpByRole_(/менеджер/i) || '';
    var selAdm = document.getElementById('ord-admin');
    if (selAdm) selAdm.value = lastA || defaultEmpByRole_(/админ/i) || '';
  });

  // Сбрасываем тип заказчика на «Физ. лицо»
  setOrderClientType('физ', document.getElementById('ord-ctype-phys'));

  // Автоподбор клиента по имени/названию из базы
  fillOrderClientDatalist();

  // Если открыто «Создать заказ» из карточки клиента — подставляем клиента
  if (App._prefillClient) { applyPrefillClient_(App._prefillClient); App._prefillClient = null; }

  // Комплекс оклейки: заполняем список, сбрасываем поля, показываем/прячем по услуге
  fillOrdComplexOptions();
  var oc = document.getElementById('ord-complex'); if (oc) oc.value = '';
  var oe = document.getElementById('ord-elements'); if (oe) oe.value = '';
  var oec = document.getElementById('ord-elements-count'); if (oec) oec.value = '';
  onOrdServiceChange();

  // Загружаем справочник материалов
  if (App._materials.length === 0) {
    google.script.run
      .withSuccessHandler(function(resp) {
        App._materials = (resp && resp.ok) ? (resp.data || []) : [];
        document.querySelectorAll('.mat-select').forEach(function(sel) {
          fillMaterialSelect(sel, '');
        });
      })
      .withFailureHandler(function(){})
      .getMaterials(null);
  }
}

/* --- Справочник материалов: заполнить select --- */
function fillMaterialSelect(sel, selectedId) {
  sel.innerHTML = '<option value="">— материал —</option>';
  App._materials.forEach(function(m) {
    var opt = document.createElement('option');
    opt.value = m['ID'] || '';
    opt.textContent = m['Название'] + (m['Категория'] ? ' (' + m['Категория'] + ')' : '');
    opt.dataset.unit      = m['Единица']      || 'пм';
    opt.dataset.price     = matSebestM2_(m);            // цена — за м²
    opt.dataset.rollWidth = m['Ширина рулона'] || 1.52;
    opt.dataset.roll      = m['Ширина рулона'] || 1.52;
    if (m['ID'] === selectedId) opt.selected = true;
    sel.appendChild(opt);
  });
}

/* --- Добавить строку материала --- */
function addMaterialLine(asLeftover) {
  var idx = App._orderMaterials.length;
  var type = asLeftover ? 'остаток' : 'расход';
  var unit = asLeftover ? 'м²' : 'пм';   // остаток обычно меряют в м²
  var m = { materialId:'', name:'', unit:unit, qty:0, rollWidth:1.52, pricePerSqm:0, type:type, cost:0 };
  var lm = (!asLeftover) ? matById_(lastMatId_()) : null;   // расход — подставляем последний выбранный материал
  if (lm) {
    m.materialId = lm['ID'] || ''; m.name = lm['Название'] || '';
    m.unit = lm['Единица'] || 'пм'; m.rollWidth = Number(lm['Ширина рулона']) || 1.52;
    m.pricePerSqm = matSebestM2_(lm); unit = m.unit;
  }
  App._orderMaterials.push(m);

  var list  = document.getElementById('ord-materials-list');
  var empty = document.getElementById('ord-materials-empty');
  if (empty) empty.style.display = 'none';

  var row = document.createElement('div');
  row.className = 'line-item-row' + (asLeftover ? ' line-item-leftover' : '');
  row.id = 'mat-row-' + idx;
  var sel = function(v, cur){ return v === cur ? ' selected' : ''; };
  row.innerHTML =
    '<select class="mat-select line-item-select" onchange="onMaterialSelect(this,' + idx + ')"></select>' +
    '<select class="line-item-unit" onchange="onMaterialChange(' + idx + ')">' +
      '<option value="пм"' + sel('пм', unit) + '>пм</option>' +
      '<option value="м²"' + sel('м²', unit) + '>м²</option>' +
    '</select>' +
    '<input class="line-item-qty" type="number" placeholder="кол-во" min="0" step="0.01" oninput="onMaterialChange(' + idx + ')">' +
    '<select class="line-item-type" onchange="onMaterialChange(' + idx + ')">' +
      '<option value="расход"' + sel('расход', type) + '>расход</option>' +
      '<option value="остаток"' + sel('остаток', type) + '>остаток (−)</option>' +
    '</select>' +
    '<span class="line-item-cost" id="mat-cost-' + idx + '" style="min-width:60px;text-align:right;font-size:12px">0 ' + CUR + '</span>' +
    '<button class="line-item-remove" onclick="removeMaterialLine(' + idx + ')">✕</button>';

  list.appendChild(row);
  fillMaterialSelect(row.querySelector('.mat-select'), m.materialId || '');
  if (m.materialId) onMaterialChange(idx);   // сразу пересчитать превью с подставленным материалом
}

function onMaterialSelect(sel, idx) {
  var opt = sel.options[sel.selectedIndex];
  if (!opt || !opt.value) return;
  var m = App._orderMaterials[idx];
  if (!m) return;
  m.materialId  = opt.value;
  m.name        = opt.textContent.split(' (')[0];
  // для строки-остатка сохраняем выбранную единицу (обычно м²), для расхода — берём дефолт материала
  if (m.type !== 'остаток') m.unit = opt.dataset.unit || 'пм';
  m.pricePerSqm = Number(opt.dataset.price)     || 0;
  m.rollWidth   = Number(opt.dataset.rollWidth)  || 1.52;
  setLastMatId_(m.materialId);   // запоминаем последний выбранный материал

  var row     = document.getElementById('mat-row-' + idx);
  var unitSel = row ? row.querySelector('.line-item-unit') : null;
  if (unitSel) unitSel.value = m.unit;
  onMaterialChange(idx);
}

function onMaterialChange(idx) {
  var row = document.getElementById('mat-row-' + idx);
  if (!row) return;
  var m = App._orderMaterials[idx];
  if (!m) return;
  var unitSel = row.querySelector('.line-item-unit');
  var qtyInp  = row.querySelector('.line-item-qty');
  var typeSel = row.querySelector('.line-item-type');

  m.unit = unitSel ? unitSel.value : m.unit;
  m.qty  = Number(qtyInp ? qtyInp.value : 0) || 0;
  m.type = typeSel ? typeSel.value : 'расход';

  var qtySqm = (m.unit === 'пм') ? Math.round(m.qty * m.rollWidth * 100) / 100 : m.qty;
  // остаток вычитается из расхода → отрицательная стоимость
  m.cost = Math.round(qtySqm * m.pricePerSqm * 100) / 100 * (m.type === 'остаток' ? -1 : 1);

  var costEl = document.getElementById('mat-cost-' + idx);
  if (costEl) {
    costEl.textContent = (m.type === 'остаток' ? '− ' : '') + Math.abs(m.cost) + ' ' + CUR;
    costEl.style.color = m.type === 'остаток' ? 'var(--danger)' : 'var(--success)';
  }
  recalcOrderPreview();
}

function removeMaterialLine(idx) {
  var row = document.getElementById('mat-row-' + idx);
  if (row) row.remove();
  App._orderMaterials[idx] = null;
  var remaining = App._orderMaterials.filter(function(m){ return m; });
  var empty = document.getElementById('ord-materials-empty');
  if (empty) empty.style.display = remaining.length ? 'none' : 'block';
  recalcOrderPreview();
}

/* --- Добавить строку расхода --- */
function addExpenseLine() {
  var idx  = App._orderExpenses.length;
  App._orderExpenses.push({ name:'', amount:0 });

  var list  = document.getElementById('ord-expenses-list');
  var empty = document.getElementById('ord-expenses-empty');
  if (empty) empty.style.display = 'none';

  var hints = App._expenseHints;
  var dOpts = hints.map(function(h){ return '<option value="' + h + '">'; }).join('');

  var row = document.createElement('div');
  row.className = 'line-item-row';
  row.id = 'exp-row-' + idx;
  row.innerHTML =
    '<input class="line-item-name" list="exp-hints-' + idx + '" placeholder="Такси / Арматура..." ' +
      'oninput="onExpenseChange(' + idx + ')">' +
    '<datalist id="exp-hints-' + idx + '">' + dOpts + '</datalist>' +
    '<input class="line-item-amount" type="number" placeholder="сумма" min="0" step="0.01" ' +
      'style="max-width:100px" oninput="onExpenseChange(' + idx + ')">' +
    '<span style="font-size:12px;color:var(--text3)">' + CUR + '</span>' +
    '<button class="line-item-remove" onclick="removeExpenseLine(' + idx + ')">✕</button>';

  list.appendChild(row);
}

function onExpenseChange(idx) {
  var row = document.getElementById('exp-row-' + idx);
  if (!row) return;
  var e = App._orderExpenses[idx];
  if (!e) return;
  e.name   = (row.querySelector('.line-item-name')   || {}).value || '';
  e.amount = Number((row.querySelector('.line-item-amount') || {}).value) || 0;
  recalcOrderPreview();
}

function removeExpenseLine(idx) {
  var row = document.getElementById('exp-row-' + idx);
  if (row) row.remove();
  App._orderExpenses[idx] = null;
  var remaining = App._orderExpenses.filter(function(e){ return e; });
  var empty = document.getElementById('ord-expenses-empty');
  if (empty) empty.style.display = remaining.length ? 'none' : 'block';
  recalcOrderPreview();
}

function setOrderPayType(val, btn) {
  // Повторный клик по активному — снять выбор (условия пока не ясны)
  var already = (App._orderPayType === val);
  App._orderPayType = already ? '' : val;
  var hid = document.getElementById('ord-paytype');
  if (hid) hid.value = App._orderPayType;
  btn.closest('div').querySelectorAll('.ctype-btn').forEach(function(b){ b.classList.remove('active'); });
  if (!already) btn.classList.add('active');

  // Поле срока/предоплаты показываем для отсрочки и рассрочки
  var isDeferred = (App._orderPayType === 'Отсрочка' || App._orderPayType === 'Рассрочка');
  var isRassr    = (App._orderPayType === 'Рассрочка');
  var dueRow = document.getElementById('ord-duepay-row');
  if (dueRow) dueRow.style.display = isDeferred ? 'block' : 'none';
  var monthsWrap = document.getElementById('ord-rassr-months-wrap');
  if (monthsWrap) monthsWrap.style.display = isRassr ? 'block' : 'none';
  var hint = document.getElementById('ord-rassr-hint');
  if (hint) hint.style.display = isRassr ? 'block' : 'none';
  var dueLabel = document.getElementById('ord-duepay-label');
  if (dueLabel) dueLabel.textContent = isRassr ? 'Дата первого взноса' : 'Срок оплаты';

  // «Принять оплату сразу» доступно только для конкретного способа (Нал/Нал с чеком/Безнал)
  if (['Нал','Нал с чеком','Безнал'].indexOf(App._orderPayType) < 0) setOrderPaidNow_(false);

  recalcOrderPreview();
}

// Кнопка «Принять оплату сразу» в форме нового заказа (полная оплата + статус «Выдан»)
function setOrderPaidNow_(on) {
  App._orderPaidNow = !!on;
  var btn = document.getElementById('ord-paidnow-btn');
  if (btn) {
    btn.classList.toggle('active', App._orderPaidNow);
    btn.style.background = App._orderPaidNow ? 'var(--success)' : 'var(--green-soft)';
    btn.style.color      = App._orderPaidNow ? '#fff' : 'var(--success)';
    btn.textContent      = App._orderPaidNow ? '✓ Оплачено — будет «Выдан»' : '✓ Принять оплату сразу';
  }
}
function toggleOrderPaidNow() {
  if (['Нал','Нал с чеком','Безнал'].indexOf(App._orderPayType || '') < 0) {
    toast('Сначала выберите способ оплаты: Нал, Нал с чеком или Безнал', 'error');
    return;
  }
  setOrderPaidNow_(!App._orderPaidNow);
}

// Заполнить datalist имён клиентов для автоподбора в форме заказа.
// Берёт из App.clients, при отсутствии — подгружает один раз.
function fillOrderClientDatalist() {
  var dl = document.getElementById('ord-client-namelist');
  if (!dl) return;
  var build = function(list) {
    dl.innerHTML = (list || []).map(function(c) {
      var name = String(c['Имя'] || '').replace(/"/g, '&quot;');
      var hint = (String(c['Тип'] || '') === 'юр' ? 'юр. лицо' : 'физ. лицо') +
                 (c['Телефон'] ? ' · ' + c['Телефон'] : '');
      return name ? '<option value="' + name + '">' + hint + '</option>' : '';
    }).join('');
  };
  if (App.clients && App.clients.length) { build(App.clients); return; }
  google.script.run
    .withSuccessHandler(function(resp) {
      if (resp && resp.ok) { App.clients = resp.data || []; build(App.clients); }
    })
    .withFailureHandler(function(){})
    .getClients({});
}

// При вводе имени/названия — если точно совпало с клиентом из базы, подставить его данные.
function orderClientNameInput() {
  var el = document.getElementById('ord-client-name');
  var name = (el ? el.value : '').trim().toLowerCase();
  if (!name) { var idEl = document.getElementById('ord-client-id'); if (idEl) idEl.value = ''; return; }
  var list = App.clients || [];
  for (var i = 0; i < list.length; i++) {
    if (String(list[i]['Имя'] || '').trim().toLowerCase() === name) {
      applyOrderClient(list[i]);
      return;
    }
  }
  // Имя изменили вручную и оно не совпадает с существующим — отвязываем ID (создастся новый клиент)
  var idEl2 = document.getElementById('ord-client-id'); if (idEl2) idEl2.value = '';
}

// Переключатель Физ./Юр. лицо в форме заказа
function setOrderClientType(type, btn) {
  App._orderClientType = type;
  if (btn) {
    var wrap = btn.closest('div');
    if (wrap) wrap.querySelectorAll('.ctype-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
  } else {
    // программное переключение (например, при подстановке найденного клиента)
    var phys = document.getElementById('ord-ctype-phys');
    var leg  = document.getElementById('ord-ctype-legal');
    if (phys) phys.classList.toggle('active', type !== 'юр');
    if (leg)  leg.classList.toggle('active',  type === 'юр');
  }
  var legalBox = document.getElementById('ord-legal-fields');
  if (legalBox) legalBox.style.display = (type === 'юр') ? 'block' : 'none';
  var lbl = document.getElementById('ord-client-name-label');
  if (lbl) lbl.textContent = (type === 'юр') ? 'Название организации *' : 'Имя клиента *';
  var nameEl = document.getElementById('ord-client-name');
  if (nameEl) nameEl.placeholder = (type === 'юр') ? 'ООО «Компания»' : 'ФИО клиента';
}

// Подставить данные найденного/выбранного клиента в форму заказа (имя, тип, реквизиты)
function applyOrderClient(c) {
  if (!c) return;
  document.getElementById('ord-client-name').value = c['Имя'] || '';
  document.getElementById('ord-client-id').value   = c['ID']  || '';
  var phoneEl = document.getElementById('ord-client-phone');
  if (phoneEl && c['Телефон']) phoneEl.value = c['Телефон'];
  var passEl = document.getElementById('ord-client-passport');
  if (passEl) passEl.value = c['Паспорт'] || c['Паспортные данные'] || '';
  var type = (String(c['Тип'] || '') === 'юр') ? 'юр' : 'физ';
  setOrderClientType(type, null);
  if (type === 'юр') {
    var set = function(id, v){ var el = document.getElementById(id); if (el) el.value = v || ''; };
    set('ord-cl-unp', c['УНП']);
    set('ord-cl-director', c['Директор']);
    set('ord-cl-address', c['Юр. адрес']);
    set('ord-cl-postal', c['Почтовый адрес']);
    set('ord-cl-bank', c['Банк. реквизиты']);
  }
}

function orderSearchClient() {
  var phone = (document.getElementById('ord-client-phone') || {}).value || '';
  if (phone.replace(/\D/g,'').length < 7) return;
  google.script.run
    .withSuccessHandler(function(resp) {
      var found = document.getElementById('ord-client-found');
      if (!resp || !resp.ok || !resp.data) { if (found) found.style.display = 'none'; return; }
      var c = resp.data;
      if (found) {
        found.style.display = 'block';
        found.innerHTML = '<strong>' + (c['Имя'] || '') + '</strong>' +
          (String(c['Тип']||'') === 'юр' ? ' &nbsp;<span style="color:var(--text3)">(юр. лицо)</span>' : '') +
          (c['Авто'] ? ' &nbsp;·&nbsp; ' + c['Авто'] : '') +
          '<button class="btn btn-ghost" style="margin-left:10px;padding:2px 8px;font-size:11px" onclick="fillOrderClient()">Использовать</button>';
        App._foundClient = c;
      }
      applyOrderClient(c);
    })
    .withFailureHandler(function(){})
    .findClientByPhone(phone);
}

function fillOrderClient() {
  if (!App._foundClient) return;
  applyOrderClient(App._foundClient);
  var found = document.getElementById('ord-client-found');
  if (found) found.style.display = 'none';
}

function recalcOrderPreview() {
  var price   = Number((document.getElementById('ord-price') || {}).value) || 0;
  var payType = App._orderPayType;
  var manager = ((document.getElementById('ord-manager') || {}).value) || '';
  var masters = ((document.getElementById('ord-masters') || {}).value) || '';

  var totalMat = App._orderMaterials.reduce(function(s, m) { return s + (m ? (m.cost || 0) : 0); }, 0);
  var totalExp = App._orderExpenses.reduce(function(s, e)  { return s + (e ? (e.amount || 0) : 0); }, 0);

  // Показываем итоги строк
  var matTotEl = document.getElementById('prev-mat-total');
  var expTotEl = document.getElementById('prev-exp-total');
  if (matTotEl) matTotEl.textContent = Math.round(totalMat * 100) / 100 + ' ' + CUR;
  if (expTotEl) expTotEl.textContent = Math.round(totalExp * 100) / 100 + ' ' + CUR;

  if (!price) { var p = document.getElementById('ord-finance-preview'); if(p) p.style.display = 'none'; return; }

  var admin      = ((document.getElementById('ord-admin') || {}).value) || '';
  var fmt        = function(n){ return Math.round(n * 100) / 100; };
  var bezDisc    = (payType === 'Безнал') ? price * 0.15 : 0;
  var gross      = price - totalMat - totalExp - bezDisc;

  // Смешанный заказ: валовая делится по доле цены — тонировка ← своя часть, оклейка ← остальное.
  var mixed      = isMixedInForm_();
  var tintPrice  = mixed ? (Number((document.getElementById('ord-tint-price') || {}).value) || 0) : 0;
  if (tintPrice < 0) tintPrice = 0;
  if (tintPrice > price) tintPrice = price;
  var tintGross  = price > 0 ? gross * (tintPrice / price) : 0;
  var wrapGross  = gross - tintGross;

  // Кол-во оклейщиков (общий список «Мастер(а)») и тонировщиков (блок тонировки)
  var mgrCount   = manager ? 1 : 0;
  var mstrCount  = masters.split(',').filter(function(s){ return s.trim(); }).length;
  var tintCount  = 0;
  if (mixed) document.querySelectorAll('.ord-tinter-cb:checked').forEach(function(){ tintCount++; });

  // Ставки бонусов — глобальные из Настроек (те же, что на сервере)
  var rates      = (App.config && App.config.bonusRates) || { manager:10, master:35, admin:5 };
  // Менеджер и админ ведут заказ целиком → бонус с полной валовой. Мастера — каждый со своей услуги.
  var mgrBonus   = mgrCount  > 0 ? gross     * (rates.manager/100) / mgrCount  : 0;
  var mstrBonus  = mstrCount > 0 ? wrapGross * (rates.master/100)  / mstrCount : 0;   // оклейщик — с оклейки
  var tintBonus  = tintCount > 0 ? tintGross * (rates.master/100)  / tintCount : 0;   // тонировщик — с тонировки
  var admBonus   = admin ? gross * (rates.admin/100) : 0;

  var mgrTotal   = mgrCount  > 0 ? gross     * (rates.manager/100) : 0;
  var mstrTotal  = mstrCount > 0 ? wrapGross * (rates.master/100)  : 0;
  var tintTotal  = tintCount > 0 ? tintGross * (rates.master/100)  : 0;
  var margin     = gross - mgrTotal - mstrTotal - tintTotal - admBonus;

  document.getElementById('prev-gross').textContent  = fmt(gross)     + ' ' + CUR;
  document.getElementById('prev-mgr').textContent    = fmt(mgrBonus)  + ' ' + CUR;

  // Подпись бонуса мастера: для смешанного — «оклейщиков», иначе «мастера»
  var mLbl = document.getElementById('prev-master-lbl');
  if (mLbl) mLbl.textContent = mixed ? 'Бонус оклейщика:' : 'Бонус мастера:';
  document.getElementById('prev-master').textContent = fmt(mstrBonus) + ' ' + CUR;

  // Отдельная строка бонуса тонировщика — только для смешанного заказа
  var tLbl = document.getElementById('prev-tint-master-lbl'), tVal = document.getElementById('prev-tint-master');
  if (tLbl && tVal) {
    var tShow = (mixed && tintCount > 0) ? '' : 'none';
    tLbl.style.display = tShow; tVal.style.display = tShow;
    tVal.textContent = fmt(tintBonus) + ' ' + CUR;
  }

  var admLbl = document.getElementById('prev-admin-lbl'), admVal = document.getElementById('prev-admin');
  if (admLbl && admVal) {
    var show = admin ? '' : 'none';
    admLbl.style.display = show; admVal.style.display = show;
    admVal.textContent = fmt(admBonus) + ' ' + CUR;
  }
  document.getElementById('prev-margin').textContent = fmt(margin)    + ' ' + CUR;
  var p = document.getElementById('ord-finance-preview'); if(p) p.style.display = 'block';
}

// Подпись поля «Мастер(а)» под контекст услуг: тонировка → «Тонировщик(и)», оклейка → «Оклейщики».
function updateMastersRoleLabel_() {
  var t    = formServicesText_();
  var tint = /тонир|tint/i.test(t);
  var wrap = /оклей|ppf/i.test(t);
  var lbl  = document.getElementById('ord-masters-role-label');
  var hint = document.getElementById('ord-masters-hint');
  if (lbl)  lbl.textContent = (tint && !wrap) ? 'Тонировщик(и)' : (wrap ? 'Оклейщики' : 'Мастер(а)');
  if (hint) hint.style.display = (tint && wrap) ? 'block' : 'none';   // подсказка только для смешанного
}

// Заполнить выпадающий список комплексов в форме заказа (из white-label каталога)
function fillOrdComplexOptions() {
  var sel = document.getElementById('ord-complex');
  if (!sel) return;
  var opts = '<option value="">— не выбран —</option>';
  Object.keys(OKLEYKA_COMPLEXES).forEach(function(k){
    var pr = OKLEYKA_COMPLEXES[k].price;
    opts += '<option value="' + k + '">' + k + (pr ? ' (~' + pr + ')' : '') + '</option>';
  });
  sel.innerHTML = opts;
}

// Показать блок комплекса только для оклейки (не тонировка), как в карточке заказа
function onOrdServiceChange() {
  var svc = document.getElementById('ord-service');
  var block = document.getElementById('ord-complex-block');
  if (svc && block) {
    var txt = (svc.options[svc.selectedIndex] || {}).textContent || '';
    var isTint = /тонир|tint/i.test(txt) || /tint/i.test(svc.value);
    var isOkl  = svc.value && !isTint;   // оклейка = выбрана услуга и это не тонировка
    block.style.display = isOkl ? 'block' : 'none';
  }
  updateOrderTintBlock_();
}

// Строка всех выбранных услуг заказа (основная + доп.) — коды и подписи
function formServicesText_() {
  var txt = '';
  var sv = document.getElementById('ord-service');
  if (sv) txt += ((sv.options[sv.selectedIndex] || {}).textContent || '') + ' ' + sv.value + ' ';
  document.querySelectorAll('.ord-extra-svc:checked').forEach(function(cb){
    txt += cb.value + ' ' + (cb.parentNode ? cb.parentNode.textContent : '') + ' ';
  });
  return txt;
}
// Есть ли тонировка среди услуг заказа (основная или доп.)?
function isTintInForm_() { return /тонир|tint/i.test(formServicesText_()); }
// Смешанный заказ: и тонировка, и оклейка (тогда нужна отдельная стоимость/мастер тонировки)
function isMixedInForm_() {
  var t = formServicesText_();
  return /тонир|tint/i.test(t) && /оклей|ppf|антихром|полиров|керам|шумо|антикор|химч|защит/i.test(t);
}
// Ручной клик по мастеру — фиксируем, что выбор сделан вручную (авто-подтяжку больше не трогаем)
function onMasterToggle_() { App._mastersManual = true; updateMastersField(); }

// Авто-подтяжка мастера в поле «Мастер(а)» по роли под услугу.
// Снимает все галочки и отмечает ТОЛЬКО сотрудников с нужной ролью
// (чистая тонировка → тонировщик; иначе → оклейщик). Ручной выбор не трогаем.
function autoPickMastersByService_() {
  if (App._mastersManual) return;
  var wrap = document.getElementById('ord-masters-wrap'); if (!wrap) return;
  // Авто-подтяжка ТОЛЬКО для чистой тонировки (тонировщик — обычно один, Саня).
  // Для оклейки/смешанного/прочего — оставляем ПУСТО (мастеров выбирают вручную).
  var tintOnly = isTintInForm_() && !isMixedInForm_();
  var names = {};
  if (tintOnly) (App.employees || []).forEach(function(e){ if (empHasRole_(e, /тонировщик/i)) names[empName_(e)] = true; });
  wrap.querySelectorAll('input[type=checkbox]').forEach(function(cb){ cb.checked = !!names[cb.value]; });
  updateMastersField();
}

// Заполнить список тонировщиков (по роли), при первом показе — авто-отметить
function fillOrderTinters_() {
  var wrap = document.getElementById('ord-tinters-wrap');
  if (!wrap) return;
  var emps = App.employees || [];
  var tinters = emps.filter(function(e){
    var roles = (e['Основная должность'] || '') + ',' + (e['Доп. роли'] || '');
    return /тонировщик/i.test(roles);
  });
  var list = tinters.length ? tinters : emps;
  if (!list.length) { wrap.innerHTML = '<div style="font-size:11px;color:var(--text3)">Нет сотрудников — добавьте в «Сотрудники»</div>'; return; }
  var checked = {};
  wrap.querySelectorAll('.ord-tinter-cb:checked').forEach(function(cb){ checked[cb.value] = true; });
  var firstFill = !wrap.getAttribute('data-filled');
  wrap.innerHTML = list.map(function(e, idx){
    var n = e['ФИО'] || e['Имя'] || ''; if (!n) return '';
    // Авто-отмечаем только ШТАТНОГО (первого) тонировщика — остальных выбирают вручную.
    var on = checked[n] || (firstFill && tinters.length > 0 && idx === 0);
    return '<label style="display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 0;cursor:pointer">' +
      '<input type="checkbox" class="ord-tinter-cb" value="' + n.replace(/"/g,'&quot;') + '" onchange="recalcOrderPreview()"' + (on ? ' checked' : '') + '> ' + n + '</label>';
  }).join('');
  wrap.setAttribute('data-filled', '1');
}

// Показать/скрыть блок тонировки; отдельная стоимость/мастер тонировки — только для смешанного
function updateOrderTintBlock_() {
  var block = document.getElementById('ord-tint-block');
  if (!block) return;
  var tint  = isTintInForm_();
  block.style.display = tint ? 'block' : 'none';
  var mixed = tint && isMixedInForm_();
  var mixedBox = document.getElementById('ord-tint-mixed');
  if (mixedBox) mixedBox.style.display = mixed ? 'block' : 'none';
  if (mixed) { fillOrderTinters_(); }
  else {
    var w = document.getElementById('ord-tinters-wrap'); if (w) w.removeAttribute('data-filled');   // сброс авто-подтяжки
    var p = document.getElementById('ord-tint-price'); if (p) p.value = '';
  }
  autoPickMastersByService_();   // подтянуть основного мастера по роли под услугу
  updateMastersRoleLabel_();     // подпись поля мастеров под контекст (оклейщики / тонировщик)
  if (tint) fillOrdTintFilms_(); // подсказки плёнок (тонировочная) в поле «Плёнка»
  if (typeof recalcOrderPreview === 'function') recalcOrderPreview();
}

// Наполнить <datalist> плёнок в форме нового заказа материалами категории «Тонировочная плёнка»
function fillOrdTintFilms_() {
  var dl = document.getElementById('ord-tint-film-list'); if (!dl) return;
  var put = function(){ dl.innerHTML = tintFilmNames_().map(function(n){ return '<option value="' + String(n).replace(/"/g,'&quot;') + '">'; }).join(''); };
  put();

}

// Выбор комплекса в форме — авто-заполнить элементы и их количество
function onOrdComplexSelect() {
  var sel = document.getElementById('ord-complex'); if (!sel) return;
  var c = OKLEYKA_COMPLEXES[sel.value];
  if (c) {
    var elsEl = document.getElementById('ord-elements'); if (elsEl) elsEl.value = c.els.join('\n');

// Явное закрытие формы нового заказа (× / Отмена): сбрасываем черновик полностью
function cancelNewOrder() {
  App._orderDirty = false; App._orderResume = false;
  ['ord-service','ord-client-phone','ord-client-name','ord-client-id','ord-client-passport','ord-car','ord-vin',
   'ord-price','ord-masters','ord-notes','ord-prepay','ord-complex','ord-elements','ord-elements-count',
   'ord-tint-price','ord-tint-film','ord-tint-light','ord-cl-unp','ord-cl-director','ord-cl-address','ord-cl-postal','ord-cl-bank'].forEach(function(id){

  });

  var tintersWrap = document.getElementById('ord-tinters-wrap'); if (tintersWrap) { tintersWrap.innerHTML = ''; tintersWrap.removeAttribute('data-filled'); }

  var hid = document.getElementById('ord-paytype'); if (hid) hid.value = '';
  setOrderPaidNow_(false);
  setOrderClientType('физ', document.getElementById('ord-ctype-phys'));
