// ── Услуги заказа: чипы текущих услуг + меню «Добавить услугу» ──
function cardServicesHtml_(order) {
  var current = String(order['Услуга'] || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  var catalog = (App.config && App.config.services) || [];
  var oid = order['ID'] || '';
  var esc = function(s){ return String(s).replace(/'/g, "\\'"); };
  var metaByName = function(nm){ for (var i = 0; i < catalog.length; i++){ if (catalog[i].name === nm) return catalog[i]; } return null; };
  var chips = current.map(function(nm){
    var m = metaByName(nm);
    var color = (m && m.color) || 'var(--accent)';
    var icon = (m && m.icon) ? m.icon + ' ' : '';
    var canRemove = current.length > 1;
    return '<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:' + color + ';background:' + color + '1a;border:1px solid ' + color + '66;padding:3px 6px 3px 11px;border-radius:14px">' +
      icon + escapeHtml_(nm) +
      (canRemove ? '<button onclick="removeOrderService(\'' + esc(oid) + '\',\'' + esc(nm) + '\')" title="Убрать услугу" style="border:none;background:none;color:' + color + ';cursor:pointer;font-size:13px;line-height:1;padding:0 2px">✕</button>' : '') +
    '</span>';
  }).join('');
  var available = catalog.filter(function(s){ return s.active !== false && current.indexOf(s.name) < 0; });
  var addMenu = available.length
    ? '<div style="position:relative;display:inline-block">' +
        '<button onclick="toggleAddServiceMenu_(event)" style="font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:1px dashed var(--border-h);border-radius:14px;padding:4px 12px;cursor:pointer">+ Добавить услугу</button>' +
        '<div id="card-add-svc-menu" style="display:none;position:absolute;top:100%;left:0;z-index:60;margin-top:4px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:190px;max-height:260px;overflow:auto">' +
          available.map(function(s){
            return '<div onclick="addOrderService(\'' + esc(oid) + '\',\'' + esc(s.name) + '\')" style="padding:7px 10px;font-size:13px;cursor:pointer;border-radius:7px;display:flex;align-items:center;gap:8px;white-space:nowrap" onmouseover="this.style.background=\'var(--bg-hover)\'" onmouseout="this.style.background=\'transparent\'">' + (s.icon ? s.icon + ' ' : '') + escapeHtml_(s.name) + '</div>';
          }).join('') +
        '</div>' +
      '</div>'
    : '';
  return '<span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2)">Услуги</span>' + chips + addMenu;

function toggleAddServiceMenu_(ev) {

  var open = m.style.display !== 'none';
  m.style.display = open ? 'none' : 'block';
  if (!open) setTimeout(function(){ document.addEventListener('click', closeAddSvcMenu_); }, 30);
}
function closeAddSvcMenu_(){ var m = document.getElementById('card-add-svc-menu'); if (m) m.style.display = 'none'; document.removeEventListener('click', closeAddSvcMenu_); }
function addOrderService(orderId, name) {
  var o = App._currentOrder; if (!o) return;
  var cur = String(o['Услуга'] || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  if (cur.indexOf(name) < 0) cur.push(name);

}
function removeOrderService(orderId, name) {
  var o = App._currentOrder; if (!o) return;
  var cur = String(o['Услуга'] || '').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  cur = cur.filter(function(s){ return s !== name; });

}
function saveOrderServices_(orderId, servicesStr) {

// Комплексы оклейки (white-label): карта name -> {price, els}, строится из App.config.complexes.

var OKLEYKA_COMPLEXES = {};
function rebuildComplexesMap_() {

function complexSelectHtml_(selected) {

function ddmmyyyyToIso_(s){ var m = String(s||'').match(/^(\d{2})\.(\d{2})\.(\d{4})/); return m ? m[3]+'-'+m[2]+'-'+m[1] : ''; }
function isoToDdmmyyyy_(s){ var m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'.'+m[2]+'.'+m[1] : ''; }
function cvDate_(label, id, value) {

// Собрать payload из полей блока «Клиент и автомобиль»
function cvCollect_() {
  var val = function(eid){ var e = document.getElementById(eid); return e ? e.value.trim() : undefined; };
  var p = {
    clientName: val('cv-name'), clientPhone: val('cv-phone'),
    car: val('cv-car'), plate: val('cv-plate'), vin: val('cv-vin'),
    year: val('cv-year'), mileage: val('cv-mileage'),
  };
  var light = val('cv-light'); if (light !== undefined) p.lightTransmission = light;
  var elems = val('cv-elements'); if (elems !== undefined) p.elements = elems;
  var sig = val('cv-signatory'); if (sig !== undefined) p.signatory = sig;
  var att = val('cv-attorney');  if (att !== undefined) p.attorney = att;
  var pass = val('cv-passport'); if (pass !== undefined) p.passport = pass;
  var pi = val('cv-passport-issued'); if (pi !== undefined) p.passportIssued = pi;
  var addr = val('cv-address'); if (addr !== undefined) p.address = addr;
  var ec = val('cv-elements-count'); if (ec !== undefined) p.elementsCount = ec;
  var cx = document.getElementById('cv-complex'); if (cx) p.complex = cx.value;
  // Даты сохраняем ТОЛЬКО если заполнены — иначе автосохранение других полей
  // затирало бы уже проставленную дату пустым значением (дата «пропадала»).
  var ws = document.getElementById('cv-work-start'); if (ws && ws.value) p.workStart = isoToDdmmyyyy_(ws.value);
  var we = document.getElementById('cv-work-end');   if (we && we.value) p.workEnd   = isoToDdmmyyyy_(we.value);
  return p;
}

// Автосохранение с задержкой: запускается при вводе, сохраняет через 0.7с после паузы
function cvAutoSave() {

  clearTimeout(App._cvTimer);
  App._cvTimer = setTimeout(function(){ cvFlush_(); }, 700);

// Немедленно сохранить (вызывается debounce-таймером и перед печатью документов)
function cvFlush_(cb) {
  clearTimeout(App._cvTimer);
  if (!App._cvDirty) { if (cb) cb(); return; }
  var id = App._currentOrderId;
  if (!id) { if (cb) cb(); return; }
  App._cvDirty = false;   // сбрасываем сразу, чтобы повторный синхронный вызов не дублировал
  cvSetStatus_('сохранение…');
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) { cvSetStatus_('ошибка сохранения', 'var(--danger)'); if (cb) cb(); return; }
      App._cvDirty = false;
      cvSetStatus_('✓ сохранено', 'var(--success)');
      App.orders = []; App._dashCache = null;          // списки пересоберутся
      if (App._cardCache) delete App._cardCache[id];   // карточка перечитается свежей
      if (cb) cb();
    })
    .withFailureHandler(function(e){ cvSetStatus_('ошибка: ' + e.message, 'var(--danger)'); if (cb) cb(); })
    .updateOrder(id, cvCollect_());
}

// Считать значения инпутов плёнки/расходов в модель без перерисовки (сохранить фокус)
function syncCardEditors_() {
  var o = App._currentOrder; if (!o) return;
  (o.materials || []).forEach(function(m, i){
    var q = document.querySelector('.cardmat-qty[data-i="'+i+'"]');   if (q) m['Кол-во']     = Number(q.value)||0;
    var u = document.querySelector('.cardmat-unit[data-i="'+i+'"]');  if (u) m['Единица']    = u.value;
    var t = document.querySelector('.cardmat-type[data-i="'+i+'"]');  if (t) m['Тип']        = t.value;
    var nm= document.querySelector('.cardmat-name[data-i="'+i+'"]');  if (nm) m['Название']  = nm.value;
    var pr= document.querySelector('.cardmat-price[data-i="'+i+'"]'); if (pr) m['Цена за м²']= Number(pr.value)||0;
    var z = document.querySelector('.cardmat-zone[data-i="'+i+'"]');  if (z) m['Зона']       = z.value;   // тонировка
    var lt= document.querySelector('.cardmat-light[data-i="'+i+'"]'); if (lt) m['Светопропускаемость'] = lt.value; // тонировка
  });
  (o.expenses || []).forEach(function(e, i){
    var n = document.querySelector('.cardexp-name[data-i="'+i+'"]');   if (n) e['Название'] = n.value;
    var a = document.querySelector('.cardexp-amount[data-i="'+i+'"]'); if (a) e['Сумма']    = Number(a.value)||0;
  });
}
function matAutoSave() {
  App._matDirty = true;
  matSetStatus_('● не сохранено', 'var(--warning)');
  clearTimeout(App._matTimer);
  App._matTimer = setTimeout(function(){ matFlush_(); }, 900);
}
function matFlush_(cb) {
  clearTimeout(App._matTimer);
  if (!App._matDirty) { if (cb) cb(); return; }
  App._matDirty = false;
  var o = App._currentOrder; if (!o || !o['ID']) { if (cb) cb(); return; }
  var id = o['ID'];
  syncCardEditors_();
  var matLines = (o.materials || []).filter(function(m){ return (m['Материал ID'] || String(m['Название']||'').trim() || Number(m['Кол-во']) > 0); })
    .map(function(m){ return { materialId:m['Материал ID']||'', name:m['Название']||'', unit:m['Единица']||'пм', qty:Number(m['Кол-во'])||0, rollWidth:Number(m['Ширина рулона'])||1.52, pricePerSqm:Number(m['Цена за м²'])||0, type:m['Тип']==='остаток'?'остаток':'расход', lenPiece:Number(m['Длина куска'])||0, widPiece:Number(m['Ширина куска'])||0, zone:m['Зона']||'', light:m['Светопропускаемость']||'' }; });
  var expLines = (o.expenses || []).filter(function(e){ return (String(e['Название']||'').trim()) || (Number(e['Сумма']) > 0); })
    .map(function(e){ return { name:e['Название']||'', amount:Number(e['Сумма'])||0 }; });
  matSetStatus_('сохранение…');
  var fail = function(){ matSetStatus_('ошибка сохранения', 'var(--danger)'); if (cb) cb(); };
  google.script.run.withSuccessHandler(function(r1){
    if (!r1 || !r1.ok) { fail(); return; }
    google.script.run.withSuccessHandler(function(r2){
      if (!r2 || !r2.ok) { fail(); return; }
      google.script.run.withSuccessHandler(function(r3){
        if (r3 && r3.ok && r3.data) {
          var f = r3.data.finance || {};
          o['Итого материалы'] = r3.data.totalMat; o['Итого расходы'] = r3.data.totalExp;
          o['Валовая прибыль'] = f.grossProfit; o['Бонус менеджера'] = f.managerBonus;
          o['Бонус оклейщика'] = f.masterBonus; o['Бонус администратора'] = f.adminBonus; o['Маржинальная прибыль'] = f.marginalProfit;
          if (f.tintMasterBonus  !== undefined) o['Бонус тонировщика'] = f.tintMasterBonus;
          if (f.tintManagerBonus !== undefined) o['Бонус менеджера тонировки'] = f.tintManagerBonus;
          if (f.tintAdminBonus   !== undefined) o['Бонус администратора тонировки'] = f.tintAdminBonus;
          var box = document.getElementById('card-fin-box'); if (box) box.innerHTML = renderCardFinance_(o);
        }
        App.orders = []; App._dashCache = null; if (App._cardCache) delete App._cardCache[id];
        matSetStatus_('✓ сохранено', 'var(--success)'); if (cb) cb();
      }).withFailureHandler(fail).recalcOrderFinance(id);
    }).withFailureHandler(fail).saveOrderExpenses(id, expLines);
  }).withFailureHandler(fail).saveOrderMaterials(id, matLines);
}

// Внутренности блока «Финансовый итог» (для обновления без перезагрузки карточки)
function renderCardFinance_(order) {
  var fmt = function(n){ return (Math.round((Number(n)||0)*100)/100).toLocaleString('ru') + ' ' + CUR; };
  // Фактический вычет −15% = Стоимость − материалы − расходы − Валовая (считается от официальных денег)
  var discount = Math.max(0, (Number(order['Стоимость заказа'])||0) - (Number(order['Итого материалы'])||0)
                              - (Number(order['Итого расходы'])||0) - (Number(order['Валовая прибыль'])||0));
  return '<div style="font-weight:600;margin-bottom:10px">Финансовый итог</div>' +
    finLine_('Стоимость заказа', fmt(order['Стоимость заказа']), '') +
    finLine_('Итого материалы', '−' + fmt(order['Итого материалы']), 'var(--text3)') +
    finLine_('Итого расходы',   '−' + fmt(order['Итого расходы']),   'var(--text3)') +
    (discount > 0.5 ? finLine_('−15% (безнал/нал с чеком)', '−' + fmt(discount), 'var(--text3)') : '') +
    '<div style="border-top:1px solid var(--border);margin:8px 0"></div>' +
    finLine_('Валовая прибыль', fmt(order['Валовая прибыль']), 'var(--success)') +
    finLine_('Бонус менеджера', fmt(order['Бонус менеджера']), 'var(--accent)') +
    finLine_('Бонус мастера' + (Number(order['Бонус тонировщика']) > 0 ? ' (оклейка)' : ''),   fmt(order['Бонус оклейщика']), 'var(--accent)') +
    (Number(order['Бонус администратора']) > 0 ? finLine_('Бонус администратора', fmt(order['Бонус администратора']), 'var(--accent)') : '') +
    (Number(order['Бонус тонировщика']) > 0 ? finLine_('🎨 Бонус тонировщика', fmt(order['Бонус тонировщика']), '#e0559a') : '') +
    (Number(order['Бонус менеджера тонировки']) > 0 ? finLine_('🎨 Бонус менеджера (тонировка)', fmt(order['Бонус менеджера тонировки']), '#e0559a') : '') +
    (Number(order['Бонус администратора тонировки']) > 0 ? finLine_('🎨 Бонус админ. (тонировка)', fmt(order['Бонус администратора тонировки']), '#e0559a') : '') +
    '<div style="border-top:2px solid var(--border);margin:8px 0"></div>' +
    finLine_('Маржинальная',    fmt(order['Маржинальная прибыль']), 'var(--success)', true);

// Печать документа: сперва досохраняем правки (cvFlush_), затем генерируем.
// service: '' | 'wrap' (оклейка) | 'tint' (тонировка) — для отдельных документов мультиуслуги.
// Делает открытый документ РЕДАКТИРУЕМЫМ: весь текст можно править прямо во вкладке,
// сверху — панель с кнопкой печати (она не попадает в печать). Правки видны при печати/сохранении в PDF.
function makeDocEditable_(w) {
  try {
    var d = w.document;
    if (!d || !d.body) return;

    var style = d.createElement('style');
    style.textContent =
      '@media print{.doc-editbar{display:none!important}}' +
      '.doc-editbar button{cursor:pointer;border:none;border-radius:6px;padding:6px 14px;font:600 13px inherit}' +
      'body{caret-color:#0ea5b7}' +
      '[contenteditable="true"]:focus{outline:2px solid rgba(14,165,183,.35);outline-offset:2px}';
    if (d.head) d.head.appendChild(style);

    var bar = d.createElement('div');
    bar.className = 'doc-editbar';
    bar.setAttribute('contenteditable', 'false');
    bar.style.cssText =
      'position:fixed;top:0;left:0;right:0;z-index:99999;display:flex;gap:10px;align-items:center;' +
      'padding:8px 14px;background:#0ea5b7;color:#fff;' +
      'font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;' +
      'box-shadow:0 2px 10px rgba(0,0,0,.22)';
    bar.innerHTML =
      '<span style="flex:1">✏️ Документ можно редактировать — правьте текст прямо здесь, затем печатайте.</span>' +
      '<button onclick="window.print()" style="background:#fff;color:#0ea5b7">🖨️ Печать / PDF</button>';

    d.body.setAttribute('contenteditable', 'true');
    d.body.setAttribute('spellcheck', 'false');
    d.body.style.marginTop = '52px';               // чтобы контент не прятался под панелью
    d.body.insertBefore(bar, d.body.firstChild);
  } catch (e) {}
}

// Блокирует кнопки документов и показывает «Формируется…» на нажатой.
// Возвращает функцию восстановления исходного состояния.
function docBtnBusy_(btn) {
  var box  = document.getElementById('order-card-docbtns');
  var btns = box ? Array.prototype.slice.call(box.querySelectorAll('button')) : [];
  var orig = btn ? btn.innerHTML : '';
  btns.forEach(function(el){ el.disabled = true; el.style.opacity = '.5'; el.style.cursor = 'wait'; });
  if (btn) { btn.innerHTML = '⏳ Формируется…'; btn.style.opacity = '1'; }
  return function(){
    btns.forEach(function(el){ el.disabled = false; el.style.opacity = ''; el.style.cursor = ''; });
    if (btn) btn.innerHTML = orig;
  };
}

function printDoc_(genFnName, service, btn) {
  var id = App._currentOrderId;
  if (!id) return;
  if (App._docBusy) return;              // уже формируется — игнорируем повторные клики
  App._docBusy = true;
  var restore = docBtnBusy_(btn);        // визуально: кнопки заблокированы, идёт «⏳ Формируется…»
  var finished = false;
  var done = function(){ if (finished) return; finished = true; clearTimeout(guard); restore(); App._docBusy = false; };
  var guard = setTimeout(function(){ if (!finished) { done(); toast('Документ формируется дольше обычного — попробуйте ещё раз', 'error'); } }, 30000);
  flushCard_(function(){
    google.script.run
      .withSuccessHandler(function(resp) {
        done();
        if (!resp||!resp.ok) { toast('Ошибка: '+(resp?resp.error:''),'error'); return; }
        var w = window.open('','_blank'); if(w){ w.document.write(resp.data); w.document.close(); makeDocEditable_(w); }
        else toast('Разрешите всплывающие окна, чтобы открыть документ', 'error');
      })
      .withFailureHandler(function(e){ done(); toast('Ошибка: '+e.message,'error'); })
      [genFnName](id, service || '');
  });
}

      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
        '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text2)">🚗 Автомобили по договору' + (grouped?(' · ' + members.length):'') + '</div>' +
        '<button class="btn" onclick="openAddCarModal(\'' + String(orderId).replace(/'/g,"\\'") + '\')" style="padding:4px 10px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);border:1px solid var(--border-h);border-radius:7px">+ Добавить авто</button>' +
      '</div>' +
      rows +
      '<div style="font-size:13px;margin-top:8px">Итого по договору: <b>' + fmt(data.total) + '</b></div>' +
      (grouped
        ? '<div style="font-size:11px;color:var(--text3);margin:8px 0 4px">Документы на все авто сразу:</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
            gBtn_(orderId, 'contract', '📄 Договор на все авто') +
            gBtn_(orderId, 'narad',    '📋 Наряд на все авто') +
            gBtn_(orderId, 'act',      '🧾 Акт на все авто') +
          '</div>'
        : '<div style="font-size:12px;color:var(--text3);margin-top:8px">Добавьте второе авто — появятся кнопки «Договор / Наряд / Акт на все авто».</div>') +
    '</div>';
}

function openAddCarModal(parentId) {
  App._groupParentId = parentId;
  closeAddCarModal_();
  var films = tintFilmNames_().map(function(n){ return '<option value="' + String(n).replace(/"/g,'&quot;') + '">'; }).join('');
  var html =
    '<div class="modal-dialog-bg" id="addcar-modal">' +
      '<div class="modal" style="max-width:460px">' +
        '<div class="modal-header"><div class="modal-title">Добавить авто в договор</div>' +
          '<button class="modal-close" onclick="closeAddCarModal_()">&#10005;</button></div>' +
        '<div class="modal-body">' +
          '<div class="form-row"><label class="form-label">Услуга</label>' +
            '<select class="form-select" id="ac-service"><option value="TINT">Тонировка</option><option value="PPF">Оклейка PPF</option></select></div>' +
          '<div class="form-row"><label class="form-label">Авто (марка, модель) *</label><input class="form-input" id="ac-car" placeholder="Volkswagen Caravelle"></div>' +
          '<div class="form-row"><label class="form-label">VIN</label><input class="form-input" id="ac-vin"></div>' +
          '<div style="display:grid;grid-template-columns:1fr 90px;gap:10px">' +
            '<div class="form-row" style="margin:0"><label class="form-label">Плёнка</label><input class="form-input" id="ac-film" list="ac-film-list" placeholder="напр. Luxfil Carbon"><datalist id="ac-film-list">' + films + '</datalist></div>' +
            '<div class="form-row" style="margin:0"><label class="form-label">Светопр., %</label><input class="form-input" id="ac-light" type="number" min="0" max="100"></div>' +
          '</div>' +
          '<div class="form-row"><label class="form-label">Стоимость, ' + CUR + ' *</label><input class="form-input" id="ac-price" type="number" min="0" placeholder="0"></div>' +
          '<div style="font-size:11px;color:var(--text3)">Плёнки/расход и мастеров можно указать потом в карточке этого авто.</div>' +
        '</div>' +
        '<div class="modal-footer">' +
          '<button class="btn btn-ghost" onclick="closeAddCarModal_()">Отмена</button>' +
          '<button class="btn btn-primary" id="ac-submit" onclick="submitAddCar_()">Добавить авто</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', html);
  openModal('addcar-modal');   // применяет оверлей-стили (position:fixed, z-index, фон)
  ensureMaterialsLoaded_(function(){
    var dl = document.getElementById('ac-film-list');
    if (dl) dl.innerHTML = tintFilmNames_().map(function(n){ return '<option value="' + String(n).replace(/"/g,'&quot;') + '">'; }).join('');
  });
}
function closeAddCarModal_(){ var w = document.getElementById('addcar-modal'); if (w) w.remove(); }

function submitAddCar_() {
  var parentId = App._groupParentId; if (!parentId) return;
  var svc  = (document.getElementById('ac-service') || {}).value || 'TINT';
  var car  = ((document.getElementById('ac-car')   || {}).value || '').trim();
  var price = Number((document.getElementById('ac-price') || {}).value) || 0;
  if (!car)   { toast('Укажите авто', 'error'); return; }
  if (!price) { toast('Укажите стоимость', 'error'); return; }
  var payload = {
    service: svc, car: car,
    vin:   ((document.getElementById('ac-vin')   || {}).value || '').trim(),
    price: price,
    film:  ((document.getElementById('ac-film')  || {}).value || '').trim(),
    light: ((document.getElementById('ac-light') || {}).value || '').trim(),
    tintPrice: 0   // отдельная машина = один заказ одной услуги (не смешанный)
  };
  var btn = document.getElementById('ac-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Добавляем...'; }
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) { if (btn) { btn.disabled=false; btn.textContent='Добавить авто'; } toast('Ошибка: ' + (resp?resp.error:''), 'error'); return; }
      toast('Авто добавлено в договор', 'success');
      closeAddCarModal_();
      App.orders = []; App._cardCache = {}; App._dashCache = null;
      reopenCard(parentId);
    })
    .withFailureHandler(function(e){ if (btn) { btn.disabled=false; btn.textContent='Добавить авто'; } toast('Ошибка: ' + e.message, 'error'); })
    .addCarToGroup(parentId, payload);
}

function printGroupDoc(orderId, kind, btn) {
  if (App._docBusy) return;                    // защита от повторных кликов
  App._docBusy = true;
  var orig = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.style.opacity = '.6'; btn.style.cursor = 'wait'; btn.innerHTML = '⏳ Формируется…'; }
  var finished = false;
  var done = function(){ if (finished) return; finished = true; App._docBusy = false; clearTimeout(guard);
    if (btn) { btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = ''; btn.innerHTML = orig; } };
  var guard = setTimeout(function(){ if (!finished) { done(); toast('Документ формируется дольше обычного — попробуйте ещё раз', 'error'); } }, 30000);
  var onOk = function(resp){
    done();
    if (!resp || !resp.ok) { toast('Ошибка: ' + (resp?resp.error:''), 'error'); return; }
    var w = window.open('', '_blank'); if (w) { w.document.write(resp.data); w.document.close(); makeDocEditable_(w); }
    else toast('Разрешите всплывающие окна, чтобы открыть документ', 'error');
  };
  var onErr = function(e){ done(); toast('Ошибка: ' + e.message, 'error'); };
  if (kind === 'narad') {
    google.script.run.withSuccessHandler(onOk).withFailureHandler(onErr).generateGroupNaradHtml(orderId);
  } else {
    google.script.run.withSuccessHandler(onOk).withFailureHandler(onErr).generateGroupContractHtml(orderId, kind);
  }
}

// Определение состава услуг заказа
function orderHasTint_(o){ return /тонир|tint/i.test(String((o||{})['Услуга'] || '')); }
function orderHasWrap_(o){ return /оклейк|ppf|полиров|керам|антихром|шумо|химч/i.test(String((o||{})['Услуга'] || '')); }
function orderMultiService_(o){ return orderHasTint_(o) && orderHasWrap_(o); }

// Кнопки документов: для мультиуслуги — отдельные договор/наряд на каждую услугу
function renderDocButtons_(o) {
  var box = document.getElementById('order-card-docbtns');
  if (!box) return;
  var b = function(label, fn){ return '<button class="btn btn-ghost doc-btn" onclick="' + fn + '">' + label + '</button>'; };
  if (orderMultiService_(o)) {
    box.innerHTML =
      b('📄 Договор · Оклейка',   "printOrderContract('wrap',this)") +
      b('📄 Договор · Тонировка', "printOrderContract('tint',this)") +
      b('📋 Наряд · Оклейка',     "printOrderNarad('wrap',this)") +
      b('📋 Наряд · Тонировка',   "printOrderNarad('tint',this)") +
      b('Акт',         "printOrderAct('',this)") +
      b('Карта работ', "printWorkCard(this)");
  } else {
    box.innerHTML =
      b('Договор',      "printOrderContract('',this)") +
      b('Заказ-наряд',  "printOrderNarad('',this)") +
      b('Акт',          "printOrderAct('',this)") +
      b('Карта работ',  "printWorkCard(this)");
  }
}

/* ===== ИНИЦИАЛИЗАЦИЯ ===== */
function init() {
  refreshSync();
  setupNavGuards_();
  var lbl = document.getElementById('theme-label');
  if (lbl) lbl.textContent = App._theme === 'dark' ? 'Светлая тема' : 'Тёмная тема';

  google.script.run
    .withSuccessHandler(function(resp) {
      var loader = document.getElementById('app-loading');
      if (loader) loader.classList.add('hidden');
      var dash = document.getElementById('page-dashboard');
      if (dash) dash.classList.add('active');
      if (!resp) { toast('Сервер не вернул данные', 'error'); return; }
      var data;
      if (resp.ok === true && resp.data) { data = resp.data; }
      else if (resp.brand || resp.config || resp.employees) { data = resp; }
      else { toast('Ошибка: ' + (resp.error || 'unknown'), 'error'); return; }
      if (data.brand) applyBrand(data.brand);
      App.config = data.config;
      App.employees = data.employees || [];
      fillServiceDropdowns();   // списки услуг из каталога (white-label)
      rebuildComplexesMap_();   // комплексы оклейки из каталога (white-label)
      App._kanbanOrder = (data.config && data.config.kanbanOrder) || {};   // ручной порядок канбана
      if (data.config && data.config.positions) fillPositions(data.config.positions);
      if (data.config && data.config.leadSources) fillLeadSources(data.config.leadSources);
      else if (window.CONFIG_LEAD_SOURCES) fillLeadSources(window.CONFIG_LEAD_SOURCES);
      // Период дашборда: восстанавливаем сохранённый; если его нет — текущий месяц
      var hasSavedDash = false;
      try { hasSavedDash = !!localStorage.getItem('sprauto-period-dash'); } catch (e) {}
      if (hasSavedDash) { restorePeriod_('dash'); renderDashboard(); }
      else { onDashPeriodChange(); }   // дефолт — текущий месяц + загрузка
      refreshSync();
      // Базовая страница в истории приложения = дашборд
      App.currentPage = 'dashboard';
      App._navStack = ['dashboard'];
      // Если в адресе указана страница (#orders и т.п.) — открыть её (главные разделы, не карточки)
      try {
        var hp = (location.hash || '').replace(/^#/, '');
        if (hp && hp.indexOf('-card') < 0 && document.getElementById('page-' + hp)) goPage(hp);
      } catch (e) {}
    })
    .withFailureHandler(function(err) {
      var loader = document.getElementById('app-loading');
      if (loader) loader.classList.add('hidden');
      var dash = document.getElementById('page-dashboard');
      if (dash) dash.classList.add('active');
      toast('Ошибка: ' + err.message, 'error');
    })
    .initApp();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
