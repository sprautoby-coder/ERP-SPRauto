/* ===== КЛИЕНТЫ: ФИЛЬТР ===== */
function setClientFilter(type, btn) {
  App._clientFilter = type;
  document.querySelectorAll('.filter-tab').forEach(function(b){ b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  filterClients();
}

function filterClients() {
  var search = (document.getElementById('clients-search') || {}).value || '';
  var sourceFilter = (document.getElementById('clients-source-filter') || {}).value || '';
  var q = search.toLowerCase();

  var filtered = App.clients.filter(function(c) {
    if (App._clientFilter === 'опт') { if (String(c['Оптовик']) !== 'Да') return false; }
    else if (App._clientFilter !== 'all' && c['Тип'] !== App._clientFilter) return false;
    if (sourceFilter && c['Источник лида'] !== sourceFilter) return false;
    if (q) {
      var name  = String(c['Имя'] || '').toLowerCase();
      var phone = String(c['Телефон'] || '').toLowerCase();
      var auto  = String(c['_autoLabel'] || '').toLowerCase();
      if (!name.includes(q) && !phone.includes(q) && !auto.includes(q)) return false;
    }
    return true;
  });

  var sort = App._clientSort;
  if (sort && sort.key) {
    filtered = filtered.slice().sort(function(a, b) {
      var av, bv;
      if (sort.key === 'name')   { av = String(a['Имя'] || ''); bv = String(b['Имя'] || ''); return sort.dir * av.localeCompare(bv, 'ru'); }
      if (sort.key === 'orders') { av = Number(a['Всего заказов'] || 0); bv = Number(b['Всего заказов'] || 0); return sort.dir * (av - bv); }
      if (sort.key === 'sum')    { av = Number(a['Сумма заказов'] || 0); bv = Number(b['Сумма заказов'] || 0); return sort.dir * (av - bv); }
      return 0;
    });
  }

  renderClientsTable(filtered);
}

/* ===== КЛИЕНТЫ: СОРТИРОВКА ===== */
function sortClients(key) {
  var sort = App._clientSort;
  if (sort.key === key) { sort.dir *= -1; } else { sort.key = key; sort.dir = 1; }

  ['name', 'orders', 'sum'].forEach(function(k) {
    var el = document.getElementById('sort-icon-' + k);
    if (!el) return;
    el.className = 'ct-sort-icon' + (k === key ? ' active' : '');
    el.textContent = k === key ? (sort.dir === 1 ? '↑' : '↓') : '↕';
  });

  filterClients();
}

/* ===== КЛИЕНТЫ: СТАТИСТИКА ===== */
function renderClientsKpi(clients) {
  var total = clients.length;
  var fiz   = clients.filter(function(c){ return c['Тип'] === 'физ'; }).length;
  var yur   = clients.filter(function(c){ return c['Тип'] === 'юр'; }).length;
  var sum   = clients.reduce(function(acc, c){ return acc + (Number(c['Сумма заказов']) || 0); }, 0);

  function set(id, val) { var el = document.getElementById(id); if (el) el.textContent = val; }
  set('ckpi-total', total);
  set('ckpi-fiz',   fiz);
  set('ckpi-yur',   yur);
  set('ckpi-sum',   sum ? sum.toLocaleString('ru') + ' ' + CUR : '—');
}

/* ===== КЛИЕНТЫ: ФИЛЬТР ИСТОЧНИКОВ ===== */
function fillClientsSourceFilter(clients) {
  var sel = document.getElementById('clients-source-filter');
  if (!sel) return;
  var sources = {};
  clients.forEach(function(c){ if (c['Источник лида']) sources[c['Источник лида']] = 1; });
  var keys = Object.keys(sources).sort();
  sel.innerHTML = '<option value="">Все источники</option>';
  keys.forEach(function(s) {
    var o = document.createElement('option');
    o.value = s; o.textContent = s;
    sel.appendChild(o);
  });
}

/* ===== КЛИЕНТЫ: ПЕРЕКЛЮЧЕНИЕ ВИДА ===== */
function setClientsView(view) {
  App._clientView = view;
  localStorage.setItem('sprauto-clients-view', view);

  var btnTable = document.getElementById('view-btn-table');
  var btnCards = document.getElementById('view-btn-cards');
  var tableWrap = document.getElementById('clients-table-wrap');
  var cardsWrap = document.getElementById('clients-cards-wrap');

  if (btnTable) btnTable.classList.toggle('active', view === 'table');
  if (btnCards) btnCards.classList.toggle('active', view === 'cards');
  if (tableWrap) tableWrap.style.display = view === 'table' ? 'block' : 'none';
  if (cardsWrap) cardsWrap.style.display = view === 'cards' ? 'grid' : 'none';

  filterClients();
}

/* ===== КЛИЕНТЫ: РЕНДЕР ===== */
function renderClients(clients) {
  App.clients.forEach(function(c) {
    c['_autoLabel'] = App._vehicleMap && App._vehicleMap[c['ID']] ? App._vehicleMap[c['ID']] : '';
  });
  renderClientsKpi(App.clients);

function renderClientsTable(clients) {
  var tbody = document.getElementById('clients-tbody');
  var footer = document.getElementById('clients-table-footer');

  var cardsWrap = document.getElementById('clients-cards-wrap');

  if (!clients || clients.length === 0) {
    var emptyHtml =
      '<div class="ct-empty">' +
        '<div class="ct-empty-icon">👤</div>' +
        '<div class="ct-empty-title">Нет клиентов</div>' +
        '<div class="ct-empty-sub">Попробуйте изменить фильтр или добавьте первого клиента</div>' +
      '</div>';
    if (tbody) tbody.innerHTML = '<tr><td colspan="8">' + emptyHtml + '</td></tr>';
    if (cardsWrap) cardsWrap.innerHTML = emptyHtml;
    if (footer) footer.textContent = 'Нет записей';
    return;
  }

  clients.forEach(function(c) {
    var id        = c['ID'] || '';
    var name      = c['Имя'] || '—';
    var type      = c['Тип'] || 'физ';
    var phone     = c['Телефон'] || '';
    var source    = c['Источник лида'] || '—';
    var orders    = Number(c['Всего заказов']) || 0;
    var sum       = Number(c['Сумма заказов']) || 0;
    var autoLabel = c['_autoLabel'] || '—';
    var isYur     = type === 'юр';
    var sumStr    = sum ? sum.toLocaleString('ru') + ' ' + CUR : '—';

    var ini = name.split(' ').slice(0,2).map(function(s){
      return (s && s[0] ? s[0].toUpperCase() : '');
    }).join('');

    var avClass    = isYur ? 'ct-av-yur' : 'ct-av-fiz';
    var badgeClass = isYur ? 'badge badge-yur' : 'badge badge-fiz';
    var typeLabel  = isYur ? 'Юр.' : 'Физ.';

    c['_ini']       = ini;
    c['_avClass']   = avClass;
    c['_badge']     = badgeClass;
    c['_typeLabel'] = typeLabel;
    c['_sumStr']    = sumStr;
    c['_autoLabel'] = autoLabel;
    c['_phone']     = phone;
    c['_source']    = source;
    c['_orders']    = orders;
  });

  // ── ТАБЛИЦА ──
  if (tbody) {
    tbody.innerHTML = clients.map(function(c) {
      var id = c['ID'] || '';
      return '<tr onclick="openClientCard(\'' + id + '\')">' +
        '<td><div class="ct-name-cell">' +
          '<div class="ct-avatar ' + c['_avClass'] + '">' + c['_ini'] + '</div>' +
          '<span class="ct-client-name">' + (c['Имя'] || '—') + '</span>' +
        '</div></td>' +
        '<td><span class="' + c['_badge'] + '">' + c['_typeLabel'] + '</span></td>' +
        '<td style="color:var(--text2);font-size:12.5px;">' + c['_phone'] + '</td>' +
        '<td style="color:var(--text2);font-size:12px;">' + c['_autoLabel'] + '</td>' +
        '<td style="color:var(--text3);font-size:12px;">' + c['_source'] + '</td>' +
        '<td style="text-align:center;font-weight:600;">' + c['_orders'] + '</td>' +
        '<td style="font-weight:600;">' + c['_sumStr'] + '</td>' +
        '<td><div class="ct-actions">' +
          '<button class="ct-action-btn" title="Карточка" onclick="event.stopPropagation();openClientCard(\'' + id + '\')">👤</button>' +
          '<button class="ct-action-btn" title="Редактировать" onclick="event.stopPropagation();openClientCardAndEdit(\'' + id + '\')">✏️</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
  }

  // ── КАРТОЧКИ ──
  if (cardsWrap) {
    cardsWrap.innerHTML = clients.map(function(c) {
      var id = c['ID'] || '';
      return '<div class="client-row" onclick="openClientCard(\'' + id + '\')">' +
        '<div class="ct-avatar ' + c['_avClass'] + '" style="width:40px;height:40px;font-size:14px;flex-shrink:0;">' + c['_ini'] + '</div>' +
        '<div class="client-info">' +
          '<div class="client-name">' +
            (c['Имя'] || '—') +
            ' <span class="' + c['_badge'] + '">' + c['_typeLabel'] + '</span>' +
          '</div>' +
          '<div class="client-meta">' +
            (c['_phone'] ? '<span>📞 ' + c['_phone'] + '</span>' : '') +
            (c['_source'] !== '—' ? '<span>📍 ' + c['_source'] + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="client-stats">' +
          '<div class="client-stat"><div class="client-stat-val">' + c['_orders'] + '</div><div class="client-stat-lbl">заказов</div></div>' +
          '<div class="client-stat"><div class="client-stat-val">' + c['_sumStr'] + '</div><div class="client-stat-lbl">сумма</div></div>' +
        '</div>' +
        '<div class="client-arrow">›</div>' +
      '</div>';
    }).join('');
  }

  if (footer) {
    footer.textContent = 'Показано ' + clients.length + ' из ' + App.clients.length;
  }
  makeColumnsResizable(document.getElementById('clients-table'));   // регулируемые + сохраняемые колонки

function openClientCard(id) {
  App._currentClientId = id;
  var content = document.getElementById('client-card-content');
  if (content) content.innerHTML = '<div class="kpi-skeleton" style="min-height:200px"></div>';
  goPage('client-card');

  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) {
        toast('Ошибка загрузки клиента', 'error');
        return;
      }
      App._currentClientObj = resp.data.client;
      App._currentClientVehicles = resp.data.vehicles || [];
      renderClientCard(resp.data.client, resp.data.vehicles);
    })
    .withFailureHandler(function(e){ toast('Ошибка: ' + e.message, 'error'); })
    .getClientWithVehicles(id);
}

function openClientCardAndEdit(id) {
  App._currentClientId = id;

function infoRow(label, value) {
  if (!value) return '';
  return '<div class="info-row"><span class="info-label">' + label + '</span><span class="info-value">' + value + '</span></div>';
}

// Подгрузить заказы клиента в раздел карточки (с переходом в карточку заказа по клику)
function loadClientOrders_(clientId) {
  var box = document.getElementById('client-orders-list'); if (!box) return;
  google.script.run
    .withSuccessHandler(function(resp){ renderClientOrders_((resp && resp.ok) ? (resp.data || []) : []); })
    .withFailureHandler(function(e){ box.innerHTML = '<div style="color:var(--danger);font-size:12px">Ошибка: ' + e.message + '</div>'; })
    .getOrders({ clientId: clientId });
}

function renderClientOrders_(list) {
  var box = document.getElementById('client-orders-list'); if (!box) return;
  if (!list.length) { box.innerHTML = '<div style="color:var(--text3);font-size:13px">Заказов нет</div>'; return; }
  var fmt = function(n){ return (Number(n)||0).toLocaleString('ru') + ' ' + CUR; };
  box.innerHTML = list.map(function(o){
    return '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="openOrderCard(\'' + String(o['ID']).replace(/'/g,"\\'") + '\')">' +
      '<div style="min-width:0">' +
        '<div style="font-weight:600;font-size:13px">' + (o['Номер договора'] || o['ID']) + ' · ' + (o['Услуга'] || '') + '</div>' +
        '<div style="font-size:11px;color:var(--text3)">' + (o['Дата'] || '') + (o['Авто'] ? ' · ' + o['Авто'] : '') + (o['Госномер'] ? ' · ' + o['Госномер'] : '') + '</div>' +
      '</div>' +
      '<div style="text-align:right;white-space:nowrap">' +
        '<div style="font-weight:600">' + fmt(o['Стоимость заказа']) + '</div>' +
        '<div style="font-size:11px;color:var(--text3)">' + (o['Статус'] || '') + '</div>' +
      '</div>' +
      '<span style="color:var(--text3);font-size:18px">›</span>' +
    '</div>';
  }).join('');
}

function openEditClientModal() {
  var id = App._currentClientId;
  if (!id) return;
  var c = null;
  for (var i = 0; i < App.clients.length; i++) {
    if (App.clients[i]['ID'] === id) { c = App.clients[i]; break; }
  }
  if (!c) { toast('Клиент не найден', 'error'); return; }

  var isLegal = c['Тип'] === 'юр';
  document.getElementById('edit-cl-name').value = c['Имя'] || '';
  document.getElementById('edit-cl-phone').value = c['Телефон'] || '';
  document.getElementById('edit-cl-email').value = c['Email'] || '';
  document.getElementById('edit-cl-notes').value = c['Заметки'] || '';

  if (isLegal) {
    document.getElementById('edit-cl-phys-fields').style.display = 'none';
    document.getElementById('edit-cl-legal-fields').style.display = 'block';
    document.getElementById('edit-cl-unp').value = c['УНП'] || '';
    document.getElementById('edit-cl-director').value = c['Директор'] || '';
    document.getElementById('edit-cl-contact').value = c['Контактное лицо'] || '';
    document.getElementById('edit-cl-address').value = c['Юр. адрес'] || '';
    document.getElementById('edit-cl-postal').value = c['Почтовый адрес'] || '';
    document.getElementById('edit-cl-bank').value = c['Банк. реквизиты'] || '';
  } else {
    document.getElementById('edit-cl-phys-fields').style.display = 'block';
    document.getElementById('edit-cl-legal-fields').style.display = 'none';
    document.getElementById('edit-cl-passport').value = c['Паспорт'] || '';
  }

  var sel = document.getElementById('edit-cl-source');
  if (sel) sel.value = c['Источник лида'] || '';

  openModal('modal-edit-client');
}

function submitNewClient() {
  var type = App._newClientType || 'физ';
  var isLegal = type === 'юр';

  var name = isLegal
    ? document.getElementById('cl-org-name').value.trim()
    : document.getElementById('cl-fio').value.trim();

  if (!name) {
    toast(isLegal ? 'Укажи название организации' : 'Укажи ФИО', 'error');
    return;
  }

  var payload = {
    type: type,
    name: name,
    phone: isLegal ? document.getElementById('cl-legal-phone').value.trim() : document.getElementById('cl-phone').value.trim(),
    email: isLegal ? document.getElementById('cl-legal-email').value.trim() : document.getElementById('cl-email').value.trim(),
    leadSource: document.getElementById('cl-source').value,
    notes: document.getElementById('cl-notes').value.trim(),
    wholesale: (document.getElementById('cl-wholesale') || {}).checked || false
  };

  if (isLegal) {
    payload.unp = document.getElementById('cl-unp').value.trim();
    payload.director = document.getElementById('cl-director').value.trim();
    payload.contactPerson = document.getElementById('cl-contact').value.trim();
    payload.legalAddress = document.getElementById('cl-address').value.trim();
    payload.postalAddress = document.getElementById('cl-postal').value.trim();
    payload.bankDetails = document.getElementById('cl-bank').value.trim();
  } else {
    payload.passport = document.getElementById('cl-passport').value.trim();
  }

  var btn = document.getElementById('cl-submit-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Сохраняем...'; }
  toast('Сохраняем клиента...', 'info');

  google.script.run
    .withSuccessHandler(function(resp){
      if (btn) { btn.disabled = false; btn.textContent = 'Сохранить клиента'; }
      if (!resp || !resp.ok) {
        toast('Ошибка: ' + (resp ? resp.error : 'нет ответа'), 'error');
        return;
      }

      var clientId = resp.data ? resp.data['ID'] : null;
      var clientName = resp.data ? resp.data['Имя'] : name;

      var carBrand = document.getElementById('cl-car-brand').value.trim();
      var carModel = document.getElementById('cl-car-model').value.trim();
      if (carBrand && clientId) {
        google.script.run
          .withSuccessHandler(function(){ toast('✅ Клиент и авто сохранены', 'success'); })
          .withFailureHandler(function(){ toast('✅ Клиент сохранён (авто не добавлено)', 'success'); })
          .createVehicle({
            clientId: clientId,
            brand: carBrand,
            model: carModel,
            plate: document.getElementById('cl-car-plate').value.trim(),
            vin: document.getElementById('cl-car-vin').value.trim()
          });
      } else {
        toast('✅ ' + clientName + ' добавлен', 'success');
      }

      closeModal('modal-new-client');
      ['cl-fio','cl-phone','cl-email','cl-passport','cl-org-name','cl-unp',
       'cl-legal-phone','cl-legal-email','cl-director','cl-contact','cl-address','cl-postal',
       'cl-bank','cl-car-brand','cl-car-model','cl-car-plate','cl-car-vin','cl-notes'].forEach(function(id){
        var el = document.getElementById(id);
        if (el) el.value = '';
      });
      document.getElementById('cl-source').value = '';
      App._newClientType = 'физ';
      document.getElementById('client-phys-fields').style.display = 'block';
      document.getElementById('client-legal-fields').style.display = 'none';

      if (App.currentPage === 'clients') loadClients();
    })
    .withFailureHandler(function(e){
      if (btn) { btn.disabled = false; btn.textContent = 'Сохранить клиента'; }
      toast('Ошибка: ' + e.message, 'error');
    })
    .createClient(payload);
}

function loadTeam(force) {

  var err = document.getElementById('team-error');
  if (!grid) return;
  if (err) err.style.display = 'none';

  var hasCache = App._teamList && App._teamList.length;
  if (hasCache && !force) {
    renderTeam(App._teamList);
    if (cacheFresh_('team')) return;   // свежий кэш — фоновую дозагрузку пропускаем
  } else {
    grid.innerHTML = '<div class="kpi-skeleton" style="min-height:200px;grid-column:1/-1;"></div>';
  }

  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) {
        if (!hasCache) {
          grid.innerHTML = '';
          if (err) { err.style.display = 'flex'; var t1 = document.getElementById('team-error-text'); if (t1) t1.textContent = 'Ошибка: ' + (resp ? resp.error : 'нет данных'); }
        }
        return;
      }
      App._teamList = resp.data || [];
      App.employees = App._teamList; // обновляем общий список тоже
      markLoaded_('team');
      renderTeam(App._teamList);
    })
    .withFailureHandler(function(e){
      if (!hasCache) {
        grid.innerHTML = '';
        if (err) { err.style.display = 'flex'; var t3 = document.getElementById('team-error-text'); if (t3) t3.textContent = 'Ошибка: ' + e.message; }
      }
    })
    .getEmployees(false);
}

function renderTeam(employees) {
  var grid = document.getElementById('team-grid');
  if (!grid) return;
  if (!employees || !employees.length) {
    grid.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text3);grid-column:1/-1;">' +
      '<div style="font-size:48px;margin-bottom:12px;">👥</div>' +
      '<div style="font-size:15px;font-weight:600;">Нет сотрудников</div>' +
      '</div>';
    return;
  }
  var cards = employees.map(function(e, idx) {
    var fio = e['ФИО'] || '—';
    var status = e['Статус'] || '—';
    var pos = e['Основная должность'] || '—';
    var salary = e['Базовая ставка'] || 0;
    var bonus = e['% бонуса'] || 0;
    var phone = e['Телефон'] || '';
    var ini = fio.split(' ').slice(0,2).map(function(s){ return (s&&s[0]?s[0].toUpperCase():''); }).join('');
    var isActive = (status === 'Работает');
    var sc = isActive ? 'status-work' : status === 'Отпуск' ? 'status-vacation' : 'status-off';
    return '<div class="team-card" data-team-idx="'+idx+'">' +
      '<div class="team-status '+sc+'">'+status+'</div>' +
      '<div class="team-head"><div class="team-avatar">'+ini+'</div>' +
      '<div><div class="team-name">'+fio+'</div><div class="team-role">'+pos+'</div>' +
      (phone?'<div class="team-role" style="margin-top:2px;">'+phone+'</div>':'') +
      '</div></div>' +
      '<div class="team-stats">' +
        '<div class="team-stat"><div class="team-stat-label">Ставка</div><div class="team-stat-value">'+Number(salary).toLocaleString('ru')+' ' + CUR + '</div></div>' +
        '<div class="team-stat"><div class="team-stat-label">% бонуса</div><div class="team-stat-value">'+bonus+'%</div></div>' +
      '</div>' +
      '<div style="display:flex;gap:6px;margin-top:10px;">' +
        '<button class="btn btn-secondary btn-sm" style="flex:1;" data-action="edit">✏️ Изменить</button>' +
        '<button class="btn btn-sm" style="flex:1;background:'+(isActive?'var(--red-soft)':'var(--green-soft)')+';color:'+(isActive?'var(--red)':'var(--green)')+';border:1px solid '+(isActive?'rgba(231,76,60,0.2)':'rgba(46,204,113,0.2)')+'" data-action="toggle">'+(isActive?'🔴 Отключить':'🟢 Восстановить')+'</button>' +
      '</div>' +
    '</div>';
  }).join('');

  grid.innerHTML = cards;

  // Делегирование событий: один обработчик на контейнер, навешивается ОДИН раз.
  // Так клики работают для любых перерисованных карточек и не зависят от
  // повторного навешивания слушателей на каждую кнопку (что ломалось в sandbox GAS).
  if (!grid._teamHandlerBound) {
    grid.addEventListener('click', function(ev) {
      // Ищем нажатую кнопку с data-action (клик мог прийти по тексту/эмодзи внутри неё)
      var btn = ev.target;
      while (btn && btn !== grid && !(btn.getAttribute && btn.getAttribute('data-action'))) {
        btn = btn.parentNode;
      }
      if (!btn || btn === grid) return;

      var action = btn.getAttribute('data-action');

      // Находим карточку и её индекс
      var card = btn;
      while (card && card !== grid && !(card.getAttribute && card.getAttribute('data-team-idx'))) {
        card = card.parentNode;
      }
      if (!card || card === grid) return;
      var idx = parseInt(card.getAttribute('data-team-idx'), 10);

      ev.stopPropagation();
      if (action === 'edit')   openEditEmployee(idx);
      if (action === 'toggle') toggleEmployeeStatus(idx);
    });
    grid._teamHandlerBound = true;
  }
}

function setupStatusHtml_(st) {
  if (!st) return '';
  var rows = (st.sheets || []).map(function(s) {
    var ok = s.exists && (!s.missing || s.missing.length === 0);
    var icon = ok ? '<span style="color:var(--success)">✓</span>' : (s.exists ? '<span style="color:var(--warning)">⚠</span>' : '<span style="color:var(--danger)">✗</span>');
    var note = !s.exists ? ' <span style="color:var(--danger)">— нет листа</span>'
             : (s.missing && s.missing.length ? ' <span style="color:var(--warning)">— нет колонок: ' + s.missing.join(', ') + '</span>'
             : ' <span style="color:var(--text3)">· строк: ' + (s.rows||0) + '</span>');
    return '<div style="padding:1px 0">' + icon + ' ' + s.name + note + '</div>';
  }).join('');
  var head = st.ready
    ? '<div style="color:var(--success);font-weight:600;margin-bottom:6px">✓ База готова к работе</div>'
    : '<div style="color:var(--warning);font-weight:600;margin-bottom:6px">⚠ Требуется настройка: проблемных листов ' + st.issuesCount + '</div>';
  return head + rows;
}

// Импорт заказов: dryRun=true — предпросмотр, false — выполнить
function runImportOrders(dryRun) {
  var run = function() {
    var btnP = document.getElementById('import-preview-btn');
    var btnR = document.getElementById('import-run-btn');
    var btn = dryRun ? btnP : btnR;
    var label = dryRun ? '2. Предпросмотр импорта' : '3. Выполнить импорт';
    if (btn) { btn.disabled = true; btn.textContent = dryRun ? 'Считаю…' : 'Импортирую…'; }
    impShowOut_(dryRun ? 'Считаю, что попадёт под импорт…' : 'Создаю заказы… (может занять до минуты)');
    google.script.run
      .withSuccessHandler(function(resp){
        if (btn) { btn.disabled = false; btn.textContent = label; }
        if (!resp || !resp.ok) { impShowOut_('Ошибка: ' + (resp?resp.error:'нет ответа')); return; }
        var d = resp.data;
        var lines = [];
        lines.push(dryRun ? '=== ПРЕДПРОСМОТР (ничего не создано) ===' : '=== ИМПОРТ ВЫПОЛНЕН ===');
        lines.push('Дата отсечки: ≥ ' + d.fromDate);
        lines.push('');
        lines.push('Тонировка: подходит ' + d.tint.matched + ', создано ' + d.tint.created + ', пропущено(дубли) ' + d.tint.skipped);
        lines.push('Оклейка:   подходит ' + d.ppf.matched  + ', создано ' + d.ppf.created  + ', пропущено(дубли) ' + d.ppf.skipped);
        lines.push('ИТОГО подходит: ' + d.totalMatched + ', создано: ' + d.totalCreated + ', пропущено: ' + d.totalSkipped);
        var errs = (d.tint.errors || []).concat(d.ppf.errors || []);
        if (errs.length) { lines.push(''); lines.push('Ошибки (' + errs.length + '):'); lines.push(errs.slice(0,20).join('\n')); }
        if (dryRun) {
          lines.push('');
          lines.push('--- Примеры того, что будет создано (по 3 на услугу): ---');
          lines.push('ТОНИРОВКА:'); lines.push(JSON.stringify(d.tint.samples, null, 2));
          lines.push('ОКЛЕЙКА:');   lines.push(JSON.stringify(d.ppf.samples, null, 2));
          lines.push('');
          lines.push('Проверьте маппинг. Если всё верно — жмите «3. Выполнить импорт».');
        }
        impShowOut_(lines.join('\n'));
        toast(dryRun ? ('Подходит заказов: ' + d.totalMatched) : ('Создано заказов: ' + d.totalCreated), 'success');

function sendRemindersNow() {
  toast('Готовим дайджест…', 'info');

    .withSuccessHandler(function(resp) {

      var ch = [];

      var where = ch.length ? (' → ' + ch.join(', ')) : ' (каналы не настроены)';

function toggleReminders() {
  var btn = document.getElementById('reminder-toggle-btn');
  if (btn) btn.disabled = true;
  var done = function(resp) {
    if (btn) btn.disabled = false;
    if (!resp || !resp.ok) { toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); return; }
    toast(resp.data.enabled ? 'Ежедневные напоминания включены' : 'Напоминания выключены', 'success');
    loadReminderStatus();
  };
  var fail = function(e){ if (btn) btn.disabled = false; toast('Ошибка: ' + e.message, 'error'); };
  var r = google.script.run.withSuccessHandler(done).withFailureHandler(fail);
  if (App._reminderEnabled) r.disablePaymentReminders();
  else r.enablePaymentReminders(Number((document.getElementById('set-reminder-hour') || {}).value) || 9);
}

function loadOrdersKpi() {
  // KPI считаем по заказам ВЫБРАННОГО ПЕРИОДА (период + услуга + поиск, без учёта
  // вкладки статуса) — чтобы цифры вверху совпадали с тем, что показано в таблице.
  var list = App._ordersPeriodBase || App.orders || [];
  var totalCount = 0, totalRevenue = 0, inWork = 0;
  list.forEach(function(o) {
    if (!o['ID']) return;
    totalCount++;
    if (isCancelledStatus(o['Статус'])) return;
    // Выручка = признанная: оплаченные + отсрочка/рассрочка
    var payType = String(o['Тип оплаты'] || '').trim();
    var paidFull = String(o['Статус оплаты'] || '') === 'Оплачен';
    var arrangement = (payType === 'Отсрочка' || payType === 'Рассрочка');
    if (paidFull || arrangement) totalRevenue += Number(o['Стоимость заказа']) || 0;
    if (!isDoneStatus(o['Статус'])) inWork++;
  });
  var avg = totalCount > 0 ? totalRevenue / totalCount : 0;
  var fmt = function(n){ return Math.round(n).toLocaleString('ru') + ' ' + CUR; };
  var el = function(id, v){ var e = document.getElementById(id); if(e) e.textContent = v; };
  el('okpi-total',   totalCount);
  el('okpi-revenue', fmt(totalRevenue));
  el('okpi-avg',     fmt(avg));
  el('okpi-inwork',  inWork);
  updateOrderTabCounts();
}

// Разбор даты заказа dd.MM.yyyy → мс (или null)
function parseOrdDate_(s) {
  var m = String(s || '').match(/^(\d{2})\.(\d{2})\.(\d{4})/);
  return m ? new Date(+m[3], +m[2] - 1, +m[1]).getTime() : null;
}
// Смена периода отображения заказов
function onOrdPeriodChange() {
  var p = (document.getElementById('ord-period') || {}).value;
  var cw = document.getElementById('ord-custom-range');
  if (cw) cw.style.display = (p === 'custom') ? 'flex' : 'none';
  savePeriod_('ord');
  filterOrders();
}

function filterOrders() {
  var search  = (document.getElementById('orders-search')         || {}).value || '';
  var service = (document.getElementById('orders-service-filter') || {}).value || '';
  var range   = getPeriodRangeFromUI('ord');   // {from,to} ISO или пусто (Всё время)
  var fromMs  = range.from ? new Date(range.from).getTime() : null;
  var toMs    = range.to   ? new Date(range.to).getTime()   : null;
  // База периода: период + услуга + поиск (БЕЗ вкладки статуса) — для KPI и счётчиков
  var periodBase = App.orders.filter(function(o) {
    if (!o['ID']) return false;
    if (service && o['Услуга'] !== service) return false;
    if (fromMs || toMs) {
      var od = parseOrdDate_(o['Дата']);
      if (od != null) { if (fromMs && od < fromMs) return false; if (toMs && od > toMs) return false; }
    }
    if (search) {
      var q  = search.toLowerCase();
      var cl = String(o['Клиент']   || '').toLowerCase();
      var av = String(o['Авто']     || '').toLowerCase();
      var gn = String(o['Госномер'] || '').toLowerCase();
      var ph = String(o['Телефон']  || '').toLowerCase();
      var vn = String(o['VIN']      || '').toLowerCase();
      if (!cl.includes(q) && !av.includes(q) && !gn.includes(q) && !ph.includes(q) && !vn.includes(q)) return false;
    }
    return true;
  });
  App._ordersPeriodBase = periodBase;
  // Таблица дополнительно фильтруется вкладкой статуса
  var filtered = (App._orderFilter && App._orderFilter !== 'all')
    ? periodBase.filter(function(o){ return o['Статус'] === App._orderFilter; })
    : periodBase.slice();
  // Сортировка по дате: по умолчанию убывание (новые сверху); клик по заголовку меняет направление.
  var asc = App._orderSortDir === 'asc';
  filtered.sort(function(a, b){
    var da = parseOrdDate_(a['Дата']) || 0, db = parseOrdDate_(b['Дата']) || 0;
    if (db !== da) return asc ? (da - db) : (db - da);
    // при равной дате — по ID (последний созданный ближе к «новее»)
    var cmp = String(a['ID'] || '').localeCompare(String(b['ID'] || ''), undefined, { numeric: true });
    return asc ? cmp : -cmp;
  });
  App._ordersFiltered = filtered;
  loadOrdersKpi();   // KPI/счётчики — по периоду (использует App._ordersPeriodBase)
  if (App._ordersView === 'kanban') renderOrdersKanban(filtered);
  else renderOrdersTable(filtered);
}

var DEFAULT_ORDER_STATUSES = [
  { name: 'Новый',    color: '#2f6fd0' },
  { name: 'В работе', color: '#e08a00' },
  { name: 'Готов',    color: '#2b8fd4' },
  { name: 'Выдан',    color: '#3f9b3f', done: true },
  { name: 'Отменён',  color: '#d9534f', cancelled: true },
];
function orderStatusList() {
  var list = (App.config && App.config.orderStatuses) || [];
  return (list && list.length) ? list : DEFAULT_ORDER_STATUSES;
}
function orderStatusNames() { return orderStatusList().map(function(s){ return s.name; }); }
function orderStatusMeta(name) {
  var l = orderStatusList();
  for (var i = 0; i < l.length; i++) { if (l[i].name === name) return l[i]; }
  return null;
}
function orderStatusColor(name) { var m = orderStatusMeta(name); return m ? m.color : 'var(--text2)'; }
function isCancelledStatus(name) { var m = orderStatusMeta(name); return !!(m && m.cancelled); }
function isDoneStatus(name) { var m = orderStatusMeta(name); return !!(m && m.done); }
// Дебиторка возникает только когда работа выполнена: статус «Готов» и позже (не отменён).
// Заказы «Новый»/«В работе» долгом не считаются.
function isReceivableStatus(name) {
  if (isCancelledStatus(name)) return false;
  var list = orderStatusList(), readyIdx = -1, curIdx = -1;
  for (var i = 0; i < list.length; i++) {
    if (list[i].name === 'Готов') readyIdx = i;
    if (list[i].name === name)    curIdx = i;
  }
  if (readyIdx >= 0 && curIdx >= 0) return curIdx >= readyIdx;   // на «Готов» и позже
  return isDoneStatus(name);   // запасной вариант (если «Готов» нет в конфиге)
}

// Нормализовать цвет к #rrggbb (для input type=color)
function hex6_(c) {
  c = String(c || '').trim();
  var m3 = /^#([0-9a-fA-F]{3})$/.exec(c);
  if (m3) return '#' + m3[1].split('').map(function(x){ return x + x; }).join('');
  return /^#[0-9a-fA-F]{6}$/.test(c) ? c : '#6c8ebf';
}
// Контрастный цвет текста на заданном фоне
function contrastOn_(hex) {
  var h = hex6_(hex).slice(1);
  var r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  var lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.62 ? '#12202e' : '#ffffff';
}

// Рабочая копия списка воронок (из текущего конфига)
function statusesWorking_() {
  return orderStatusList().map(function(s){
    return { id: s.id, name: s.name, color: s.color, cancelled: !!s.cancelled, done: !!s.done };
  });

// Оптимистично применить новый список воронок и сохранить на сервере

  if (App.currentPage === 'orders') { filterOrders(); updateOrderTabCounts(); }

      if (App.config) App.config.orderStatuses = resp.data.statuses;
    })
    .withFailureHandler(function(e){ toast('Ошибка: ' + e.message, 'error'); location.reload(); })
    .saveOrderStatuses({ list: list, renames: renames || [] });
}

// Перетаскивание колонки-воронки (смена порядка)
function colDragStart(ev, name) {
  App._colDrag = name;
  try { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', ''); } catch(e){}
  if (ev.currentTarget) ev.currentTarget.classList.add('col-dragging');
  ev.stopPropagation();
}
function colDragEnd(ev) {
  App._colDrag = null;
  if (ev.currentTarget) ev.currentTarget.classList.remove('col-dragging');
  document.querySelectorAll('.kanban-col.col-drop-hover').forEach(function(c){ c.classList.remove('col-drop-hover'); });
}
function reorderStatuses(fromName, toName) {
  var list = statusesWorking_();
  var fi = -1;
  for (var i = 0; i < list.length; i++) { if (list[i].name === fromName) { fi = i; break; } }
  if (fi < 0) return;
  var moved = list.splice(fi, 1)[0];
  var ti = list.length;
  for (var j = 0; j < list.length; j++) { if (list[j].name === toName) { ti = j; break; } }
  list.splice(ti, 0, moved);
  pushStatuses_(list, []);
}

// Смена цвета воронки
function changeStatusColorInline(name, color) {
  var list = statusesWorking_();
  for (var i = 0; i < list.length; i++) { if (list[i].name === name) { list[i].color = hex6_(color); break; } }
  pushStatuses_(list, []);
}

// Добавить новую воронку (+ сразу открыть переименование)
function addStatusInline() {
  var list = statusesWorking_();
  var exists = function(nm){ return list.some(function(s){ return s.name.toLowerCase() === nm.toLowerCase(); }); };
  var name = 'Новая', n = 1;
  while (exists(name)) { name = 'Новая ' + (++n); }
  var palette = ['#6c8ebf','#f0a500','#4da6ff','#5cb85c','#9b59b6','#e67e22','#1abc9c','#d9534f'];
  list.push({ id: 'st_new_' + Date.now(), name: name, color: palette[list.length % palette.length], cancelled: false, done: false });
  pushStatuses_(list, []);
  setTimeout(function(){
    var t = document.querySelector('.kanban-col[data-status="' + name.replace(/"/g,'\\"') + '"] .kanban-title');
    if (t) startStatusRename({ stopPropagation: function(){}, currentTarget: t }, name);
  }, 60);
}

// Удалить воронку (с переносом её заказов в первую)
function deleteStatusInline(name) {
  var list = statusesWorking_();
  if (list.length <= 1) { toast('Нужна хотя бы одна воронка', 'error'); return; }
  var cnt = (App.orders || []).filter(function(o){ return (o['Статус'] || '') === name; }).length;
  var fallback = (list[0].name === name) ? (list[1] && list[1].name) : list[0].name;
  var doDelete = function(){
    var newList = list.filter(function(s){ return s.name !== name; });
    (App.orders || []).forEach(function(o){ if ((o['Статус'] || '') === name) o['Статус'] = fallback; });
    if (App._orderFilter === name) App._orderFilter = 'all';
    pushStatuses_(newList, []);
  };
  if (cnt > 0) {
    uiConfirm('В воронке «' + name + '» ' + cnt + ' заказ(ов) — они переедут в «' + fallback + '». Удалить воронку?',
      doDelete, { title: 'Удалить воронку', okText: 'Удалить', danger: true });
  } else {
    doDelete();
  }
}

// Инлайн-переименование по двойному клику
function startStatusRename(ev, name) {
  if (ev.stopPropagation) ev.stopPropagation();
  var span = ev.currentTarget;
  if (!span) return;
  var head = span.closest('.kanban-col-head');
  if (head) head.setAttribute('draggable', 'false');   // не мешаем вводу
  var input = document.createElement('input');
  input.className = 'kanban-title-input';
  input.value = name;
  span.replaceWith(input);
  input.focus(); input.select();
  var done = false;
  var finish = function(commit){
    if (done) return; done = true;
    if (commit) commitStatusRename(name, input.value);
    else if (App.currentPage === 'orders') filterOrders();
  };
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { finish(false); }
  });
  input.addEventListener('blur', function(){ finish(true); });
}
function commitStatusRename(oldName, val) {
  var newName = String(val || '').trim();
  if (!newName || newName === oldName) { if (App.currentPage === 'orders') filterOrders(); return; }
  var list = statusesWorking_();
  if (list.some(function(s){ return s.name.toLowerCase() === newName.toLowerCase() && s.name !== oldName; })) {
    toast('Воронка «' + newName + '» уже есть', 'error');
    if (App.currentPage === 'orders') filterOrders();
    return;
  }
  for (var i = 0; i < list.length; i++) { if (list[i].name === oldName) { list[i].name = newName; break; } }
  (App.orders || []).forEach(function(o){ if ((o['Статус'] || '') === oldName) o['Статус'] = newName; });
  if (App._kanbanOrder && App._kanbanOrder[oldName]) { App._kanbanOrder[newName] = App._kanbanOrder[oldName]; delete App._kanbanOrder[oldName]; }
  if (App._orderFilter === oldName) App._orderFilter = newName;
  pushStatuses_(list, [{ from: oldName, to: newName }]);
}

// Бейдж статуса заказа: тёмный читаемый текст + цветная рамка/подложка.
// Текст всегда var(--text) — виден при ЛЮБОМ (даже очень светлом) цвете статуса.
function statusBadge_(status) {
  if (!status) return '';
  var c = orderStatusColor(status);
  var hex = /^#[0-9a-fA-F]{6}$/.test(c);
  var bg = hex ? c + '22' : 'rgba(120,140,170,.15)';
  var bd = hex ? c : 'var(--text3)';
  return '<span style="display:inline-block;font-size:11px;font-weight:700;color:var(--text)' +
         ';background:' + bg + ';border:1px solid ' + bd + ';padding:1px 9px;border-radius:10px;white-space:nowrap">' + status + '</span>';
}

// Мастера заказа для колонки таблицы: оклейщики + тонировщики через запятую
function ordersMastersText_(o) {
  // Объединяем оклейщиков и тонировщиков без повторов (один человек может быть в обоих полях)
  var names = [];
  [String(o['Оклейщики'] || ''), String(o['Тонировщики'] || '')].forEach(function(f) {
    f.split(',').forEach(function(n) { n = n.trim(); if (n && names.indexOf(n) < 0) names.push(n); });
  });
  return names.join(', ');
}

/* ─── ПРОВЕРКА ДИРЕКТОРОМ: 4 категории ───────────────────────────────────────
   mat — расход плёнки, exp — расходы, arm — арматурные работы, bez — безнал.
   Статусы хранятся JSON-ом в поле заказа «Проверки». */
var CHK_CATS = [
  ['mat', 'М', 'Материал (расход плёнки)'],
  ['exp', 'Р', 'Расходы заказа'],
  ['arm', 'А', 'Арматурные работы'],
  ['bez', 'Б', 'Безналичная оплата']
];
function checkLabel_(cat){ for (var i=0;i<CHK_CATS.length;i++) if (CHK_CATS[i][0]===cat) return CHK_CATS[i][2]; return cat; }
// Разобрать JSON проверок заказа → { s:{...}, notes:{...}, armItems:[...] }
function orderChecksObj_(o){ try { return JSON.parse((o && o['Проверки']) || '{}') || {}; } catch(e){ return {}; } }
function orderChecks_(o){ var j = orderChecksObj_(o); return j.s || {}; }

// 4 чипа статуса в колонке «Пров.»
function checkChips_(o){
  var s  = orderChecks_(o);
  var id = o['ID'] || '';
  return '<div style="display:flex;gap:3px;justify-content:center;flex-wrap:wrap">' + CHK_CATS.map(function(c){
    var st  = s[c[0]] || '';
    var bg  = st==='ok' ? 'var(--green-soft)' : st==='err' ? 'var(--red-soft)'  : 'var(--bg-card2)';
    var col = st==='ok' ? 'var(--success)'    : st==='err' ? 'var(--danger)'    : 'var(--text3)';
    var tip = c[2] + ' — ' + (st==='ok' ? 'проверено ✓' : st==='err' ? 'ОШИБКА ✕' : 'не проверено');

  }).join('') + '</div>';
}

// Открыть окно сверки по категории
App._chk = null;
function openCheckModal(orderId, cat){
  var o = (App.orders || []).find(function(x){ return String(x['ID']) === String(orderId); });
  if (!o){ toast('Заказ не найден', 'error'); return; }
  App._chk = { id: orderId, cat: cat, order: o, rows: [] };
  var title = document.getElementById('check-title');
  var body  = document.getElementById('check-body');
  if (title) title.textContent = 'Проверка · ' + checkLabel_(cat);
  if (body)  body.innerHTML = '<div style="text-align:center;color:var(--text3);padding:24px">Загрузка…</div>';
  openModal('modal-check');

  if (cat === 'arm'){                          // арматура — данные лежат в самом заказе
    App._chk.rows = (orderChecksObj_(o).armItems || []).map(function(r){ return { work:r.work||'', who:r.who||'', sum:Number(r.sum)||0 }; });
    if (typeof ensureEmployeesLoaded_ === 'function') ensureEmployeesLoaded_(function(){ renderCheckBody_(); });  // список мастеров для «Кто»
    else renderCheckBody_();
    return;
  }
  var fetchRows = function(){
    google.script.run
      .withSuccessHandler(function(resp){
        App._chk.rows = (resp && resp.ok) ? (resp.data || []) : [];
        renderCheckBody_();
      })
      .withFailureHandler(function(e){ toast('Ошибка загрузки: ' + e.message, 'error'); App._chk.rows = []; renderCheckBody_(); })
      .getOrderCheckData(orderId, cat);
  };
  // Для материала нужен справочник плёнок (селекты выбора) — подгружаем, если не загружен
  if (cat === 'mat' && typeof ensureMaterialsLoaded_ === 'function') ensureMaterialsLoaded_(fetchRows);
  else fetchRows();
}

      : '<input class="chk-mat-name" data-i="' + i + '" value="' + escapeHtml_(r['Название']||'') + '" placeholder="название плёнки" oninput="chkMatRecalc_()" style="' + inp + ';min-width:130px">';
    return '<tr>' +
      '<td>' + matCell + '</td>' +

      '<td style="text-align:center"><select class="chk-mat-unit" data-i="' + i + '" onchange="chkMatRecalc_()" style="' + inp + '"><option value="пм"' + ((r['Единица']||'пм')==='пм'?' selected':'') + '>пм</option><option value="м²"' + (r['Единица']==='м²'?' selected':'') + '>м²</option></select></td>' +
      '<td style="text-align:center"><input class="chk-mat-price" data-i="' + i + '" type="number" step="0.01" min="0" value="' + (Number(r['Цена за м²'])||0) + '" oninput="chkMatRecalc_()" style="' + inp + ';width:70px"></td>' +
      '<td><select class="chk-mat-type" data-i="' + i + '" onchange="chkMatRecalc_()" style="' + inp + '"><option value="расход"' + (!isOst?' selected':'') + '>расход</option><option value="остаток"' + (isOst?' selected':'') + '>остаток</option></select></td>' +
      '<td style="text-align:right;white-space:nowrap" class="chk-mat-cost" data-i="' + i + '">' + (Number(r['Стоимость'])||0).toLocaleString('ru') + ' ' + CUR + '</td>' +

    '</tr>';

// Пересчёт стоимости строк материала на лету (цена — за пог.м)
function chkMatRecalc_(){
  var rows = App._chk.rows, total = 0;
  rows.forEach(function(r, i){
    var q = document.querySelector('.chk-mat-qty[data-i="' + i + '"]');
    var u = document.querySelector('.chk-mat-unit[data-i="' + i + '"]');
    var p = document.querySelector('.chk-mat-price[data-i="' + i + '"]');
    var t = document.querySelector('.chk-mat-type[data-i="' + i + '"]');
    var nm = document.querySelector('.chk-mat-name[data-i="' + i + '"]');
    if (nm) r['Название'] = nm.value;
    if (q) r['Кол-во'] = Number(q.value)||0;
    if (u) r['Единица'] = u.value;
    if (p) r['Цена за м²'] = Number(p.value)||0;
    if (t) r['Тип'] = t.value;
    var roll = Number(r['Ширина рулона'])||1.52;
    var sqm  = (r['Единица']==='пм') ? Math.round((Number(r['Кол-во'])||0)*roll*100)/100 : (Number(r['Кол-во'])||0);
    var cost = Math.round(sqm * (Number(r['Цена за м²'])||0) * 100)/100 * (r['Тип']==='остаток'?-1:1);   // цена — за м²
    r['Кол-во м²'] = sqm; r['Стоимость'] = cost;
    var cell = document.querySelector('.chk-mat-cost[data-i="' + i + '"]');

// Сохранить проверку: при необходимости — правки строк → пересчёт финансов → статус категории
function saveCheck_(status){
  if (!App._chk || App._chk.busy) return;
  App._chk.busy = true;
  var id = App._chk.id, cat = App._chk.cat;
  var note = (document.getElementById('chk-note') || {}).value || '';

  // Видимый индикатор процесса (как при формировании договора)
  var actLabel = status==='ok' ? 'Отмечаю проверенным…' : status==='err' ? 'Отмечаю ошибку…' : 'Снимаю отметку…';
  var act = document.getElementById('chk-actions');
  if (act) act.innerHTML = '<span style="display:inline-flex;align-items:center;gap:8px;color:var(--text2);font-weight:600"><span class="chk-spin"></span>' + actLabel + '</span>';
  var restore = function(){ App._chk.busy = false; renderCheckBody_(); };

  // Финальный шаг: записать статус проверки и обновить строку заказа
  var doCheck = function(){
    google.script.run
      .withSuccessHandler(function(resp){
        App._chk.busy = false;
        if (!resp || !resp.ok){ toast('Ошибка: ' + (resp?resp.error:''), 'error'); restore(); return; }
        var ord = (App.orders || []).find(function(x){ return String(x['ID'])===String(id); });
        if (ord) { ord['Проверки'] = resp.data.checksJson; ord['Проверено'] = resp.data.verified ? 'Да' : 'Нет'; }  // чипы + общий статус (зелёная строка, когда все 4 ok)
        if (typeof filterOrders === 'function') filterOrders();
        closeModal('modal-check');
        toast(status==='ok' ? 'Отмечено: проверено ✓' : status==='err' ? 'Отмечено: ошибка ⚠' : 'Отметка снята', status==='err'?'error':'success');
      })
      .withFailureHandler(function(e){ toast('Ошибка: ' + e.message, 'error'); restore(); })
      .setOrderCheck(id, cat, status, { note: note, items: (cat==='arm' ? App._chk.rows : undefined) });
  };
  // После правки строк — пересчитать итоги/бонусы заказа, затем зафиксировать статус
  var recalcThen = function(){
    google.script.run
      .withSuccessHandler(function(r3){
        if (r3 && r3.ok && r3.data){
          var ord = (App.orders || []).find(function(x){ return String(x['ID'])===String(id); });
          if (ord){ ord['Итого материалы'] = r3.data.totalMat; ord['Итого расходы'] = r3.data.totalExp; }
        }
        doCheck();
      })
      .withFailureHandler(function(){ doCheck(); })
      .recalcOrderFinance(id);
  };

  if (cat === 'mat'){
    chkMatRecalc_();
    var matLines = App._chk.rows.map(function(r){ return { materialId:r['Материал ID']||'', name:r['Название']||'', unit:r['Единица']||'пм', qty:Number(r['Кол-во'])||0, rollWidth:Number(r['Ширина рулона'])||1.52, pricePerSqm:Number(r['Цена за м²'])||0, type:r['Тип']==='остаток'?'остаток':'расход', lenPiece:Number(r['Длина куска'])||0, widPiece:Number(r['Ширина куска'])||0, zone:r['Зона']||'', light:r['Светопропускаемость']||'' }; });
    google.script.run.withSuccessHandler(recalcThen).withFailureHandler(function(e){ toast('Ошибка сохранения расхода: ' + e.message, 'error'); restore(); }).saveOrderMaterials(id, matLines);
  } else if (cat === 'exp'){
    chkExpSync_();
    var expLines = App._chk.rows.filter(function(r){ return String(r['Название']||'').trim() || Number(r['Сумма'])>0; }).map(function(r){ return { name:r['Название']||'', amount:Number(r['Сумма'])||0 }; });
    google.script.run.withSuccessHandler(recalcThen).withFailureHandler(function(e){ toast('Ошибка сохранения расходов: ' + e.message, 'error'); restore(); }).saveOrderExpenses(id, expLines);
  } else if (cat === 'arm'){
    chkArmSync_();
    App._chk.rows = App._chk.rows.filter(function(r){ return String(r.work||'').trim() || Number(r.sum)>0 || String(r.who||'').trim(); });
    doCheck();
  } else {
    doCheck();   // безнал — без правок строк
  }
}

function renderOrdersTable(orders) {
  var tbody  = document.getElementById('orders-tbody');
  var footer = document.getElementById('orders-table-footer');
  if (!tbody) return;

  if (!orders || orders.length === 0) {
    tbody.innerHTML = '<tr><td colspan="15" style="text-align:center;padding:32px;color:var(--text2)">Заказов не найдено</td></tr>';
    if (footer) footer.textContent = '';
    updateOrderSelBar();
    return;
  }

  var esc = function(s){ return String(s||'').replace(/'/g,"\\'"); };

  var html = '';
  orders.forEach(function(o) {
    var price      = Number(o['Стоимость заказа']) || 0;
    var paid       = Number(o._paid) || 0;
    var status     = o['Статус'] || '';
    var color      = orderStatusColor(status);
    var payStatus  = String(o['Статус оплаты'] || '').trim() || 'Не оплачен';
    var payType    = String(o['Тип оплаты'] || '').trim();
    var isLegal    = o._clientType === 'юр';
    var isPaid     = payStatus === 'Оплачен';

    // Дебиторка учитывается только для готовых заказов (работа выполнена)
    var receivable = isReceivableStatus(status);
    // Просрочка: готовый неоплаченный заказ, срок платежа которого уже прошёл
    var todayStart = new Date(); todayStart.setHours(0,0,0,0);
    var dueStr  = o._nextPay || o['Срок оплаты'] || o._finalPay || '';
    var dueMs   = parseOrdDate_(dueStr);
    var overdue = !isPaid && receivable && dueMs != null && dueMs < todayStart.getTime();

    // Класс подсветки строки (контроль дебиторки). Просрочка — приоритетнее (красный).
    var rowClass = '';
    if (isPaid)                                       rowClass = 'row-paid';
    else if (!receivable)                             rowClass = 'row-open';   // работа не готова — не долг
    else if (overdue)                                 rowClass = 'row-overdue';
    else if (isLegal)                                 rowClass = 'row-legal';
    else if (payStatus === 'Частично' || payType === 'Рассрочка') rowClass = 'row-rass';
    else if (payType === 'Отсрочка')                  rowClass = 'row-otsr';
    else                                              rowClass = 'row-debt';
    // Проверенный заказ — затемняем строку на ~2 тона (визуальный признак проверки)
    if (String(o['Проверено'] || '') === 'Да')        rowClass += ' row-verified';
    // Ошибка хотя бы в одной категории проверки → красная подсветка строки
    var _chk = orderChecks_(o);
    if (_chk.mat === 'err' || _chk.exp === 'err' || _chk.arm === 'err' || _chk.bez === 'err') rowClass += ' row-check-err';

    // Бейдж оплаты
    var payBadge;
    if (isPaid) {
      payBadge = '<span style="font-size:11px;background:var(--green-soft);color:var(--success);padding:2px 7px;border-radius:10px;">✓ оплачен</span>';
    } else if (payStatus === 'Частично') {
      payBadge = '<span style="font-size:11px;background:var(--blue-soft);color:var(--blue);padding:2px 7px;border-radius:10px;" title="Оплачено ' + paid.toLocaleString('ru') + ' из ' + price.toLocaleString('ru') + ' ' + CUR + '">рассрочка ' + Math.round(price ? paid/price*100 : 0) + '%</span>';
    } else if (payType === 'Отсрочка') {
      payBadge = '<span style="font-size:11px;background:var(--yellow-soft);color:var(--warning);padding:2px 7px;border-radius:10px;">отсрочка</span>';
    } else if (payType === 'Рассрочка') {
      payBadge = '<span style="font-size:11px;background:var(--blue-soft);color:var(--blue);padding:2px 7px;border-radius:10px;">рассрочка</span>';
    } else if (receivable) {
      payBadge = '<span style="font-size:11px;background:var(--red-soft);color:var(--danger);padding:2px 7px;border-radius:10px;">долг</span>';
    } else {
      // Работа ещё не готова — это не долг, а просто неоплаченный открытый заказ
      payBadge = '<span style="font-size:11px;background:var(--bg-card2);color:var(--text3);padding:2px 7px;border-radius:10px;">не оплачен</span>';
    }
    if (isLegal) {
      payBadge += ' <span style="font-size:10px;background:var(--purple-soft);color:var(--purple);padding:1px 5px;border-radius:8px;" title="Юридическое лицо">ЮЛ</span>';
    }
    if (overdue) {
      payBadge += ' <span style="font-size:10px;background:var(--red-soft);color:var(--danger);padding:1px 6px;border-radius:8px;font-weight:700" title="Срок оплаты прошёл">⚠ просрочка</span>';
    }

    // Затраты = материалы + расходы (данные уже в заказе)
    var matCost = Number(o['Итого материалы']) || 0;
    var expCost = Number(o['Итого расходы'])   || 0;
    var costSum = matCost + expCost;
    var costCell = costSum > 0
      ? '<span title="Материалы ' + matCost.toLocaleString('ru') + ' ' + CUR + ' + расходы ' + expCost.toLocaleString('ru') + ' ' + CUR + '">' + costSum.toLocaleString('ru') + ' ' + CUR + '</span>'
      : '<span style="color:var(--text3)">—</span>';

    // Проверка директором — 4 чипа по категориям (материал/расходы/арматура/безнал)
    var verCell = checkChips_(o);

    var oid    = o['ID'] || '';
    var payBtn = !isPaid
      ? '<button class="btn" onclick="event.stopPropagation();openPayOrderModal(\'' + oid + '\',\'' + esc(o['Клиент']) + '\',' + price + ',\'' + esc(o['Срок оплаты']) + '\')" ' +
          'style="padding:3px 8px;font-size:11px;font-weight:600;background:var(--green-soft);color:var(--success);border:1px solid rgba(46,204,113,.3);border-radius:6px;white-space:nowrap">✓ Оплатить</button>'
      : '<span style="font-size:11px;color:var(--success);font-weight:600">✓ оплачен</span>';

    // Даты следующего и финального платежа (для рассрочки/отсрочки)
    var nextPay  = o._nextPay  || '';
    var finalPay = o._finalPay || '';
    var payDates = (!isPaid && (nextPay || finalPay))
      ? '<div style="font-size:10px;color:var(--text3);margin-top:3px;white-space:nowrap">' +
          (nextPay ? '📅 ' + nextPay : '') +
          (finalPay && finalPay !== nextPay ? (nextPay ? ' · ' : '') + 'до ' + finalPay : '') +
        '</div>'
      : '';

    var isSel = App._selOrders && App._selOrders[oid];
    html +=
      '<tr class="' + rowClass + (isSel ? ' row-selected' : '') + '" data-oid="' + oid + '" style="cursor:pointer" onclick="openOrderCard(\'' + oid + '\')">' +
      '<td class="col-sel" onclick="event.stopPropagation()" style="text-align:center"><input type="checkbox" class="order-sel-cb"' + (isSel ? ' checked' : '') + ' onclick="toggleOrderSel(\'' + oid + '\',this)"></td>' +
      '<td onclick="event.stopPropagation()" style="white-space:nowrap">' + payBtn + '</td>' +
      '<td style="font-weight:600;font-size:12px;white-space:nowrap"><button class="film-toggle" onclick="event.stopPropagation();toggleOrderFilms(\'' + oid + '\',this)" title="Показать расход плёнки">▸</button>' + (o['Номер договора'] || oid || '') + '</td>' +
      '<td style="font-size:12px;color:var(--text-secondary)">' + (o['Дата'] || '') + '</td>' +
      '<td>' +
        '<div style="font-weight:500;font-size:13px">' + (o['Клиент'] || '—') + '</div>' +
        '<div style="font-size:11px;color:var(--text-secondary)">' + (o['Телефон'] || '') + '</div>' +
      '</td>' +
      '<td>' +
        '<div style="font-size:13px">' + (o['Авто'] || '—') + '</div>' +
        '<div style="font-size:11px;color:var(--text-secondary)">' + (o['Госномер'] || '') + '</div>' +
      '</td>' +
      '<td style="font-size:13px">' + (o['Услуга'] || '') + '</td>' +
      '<td style="text-align:right;font-weight:600">' + price.toLocaleString('ru') + ' ' + CUR + '</td>' +
      '<td style="text-align:right;font-size:12px;color:var(--text2)">' + costCell + '</td>' +
      '<td style="text-align:center">' + payBadge + payDates + '</td>' +
      '<td style="text-align:center">' + payMethodBadge_(o._payMethod) + '</td>' +
      '<td style="text-align:center">' + statusBadge_(status) + '</td>' +
      '<td style="text-align:center">' + verCell + '</td>' +
      '<td style="font-size:12px;color:var(--text-secondary)">' + (o['Менеджер'] || '—') + '</td>' +
      '<td style="font-size:12px;color:var(--text-secondary)">' + (ordersMastersText_(o) || '—') + '</td>' +
      '<td onclick="event.stopPropagation()">' +
        '<select class="form-select" style="font-size:11px;padding:2px 4px;height:26px;width:100%;min-width:0;max-width:100%" onchange="changeOrderStatus(\'' + oid + '\', this)">' +
          orderStatusNames().map(function(s){
            return '<option value="' + s + '"' + (s === status ? ' selected' : '') + '>' + s + '</option>';
          }).join('') +
        '</select>' +
      '</td>' +
      '</tr>';
  });

  tbody.innerHTML = html;
  if (footer) footer.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px">' +
      '<span>Показано: ' + orders.length + ' из ' + App.orders.length + '</span>' +
      '<button onclick="resetOrderColWidths()" title="Вернуть стандартную ширину столбцов" ' +
        'style="background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:4px">' +
        '↔ Сбросить ширину</button>' +
    '</div>';
  makeColumnsResizable(document.getElementById('orders-table'));
