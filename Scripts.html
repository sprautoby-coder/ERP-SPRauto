<script>
console.log('=== Scripts.html начал загружаться ===');

var App = {
  currentPage: 'dashboard',
  brand: null,
  config: null,
  employees: [],
  clients: [],
  settings: {},
  pendingLogoDataUrl: null,
  _theme: localStorage.getItem('sprauto-theme') || 'dark',
  _toastTimer: null,
  _editingId: null,
  _editingIdx: null,
  _clientFilter: 'all',
  _currentClientId: null,
  _clientSort: { key: null, dir: 1 },
  _clientView: localStorage.getItem('sprauto-clients-view') || 'table',
  _modalStack: [],
  _nextZIndex: 9999
};

console.log('App object created:', App);
document.body.setAttribute('data-theme', App._theme);
console.log('Theme set:', App._theme);

/* ===== СВЕЖЕСТЬ КЛИЕНТСКОГО КЭША (анти-лишний-round-trip) =====
   Каждый google.script.run = HTTPS round-trip к Apps Script (~0.3–2с). Раньше
   кэш-загрузчики рисовали из памяти мгновенно, НО всё равно дёргали сервер в фоне
   на КАЖДУЮ навигацию. Мутации уже сбрасывают кэш (App.orders=[]/App.clients=[]…),
   значит непустой кэш = локально данные не менялись. Гейтим фоновую дозагрузку по
   времени: пока кэш «свежий», сервер не трогаем; кнопка «Обновить» (force) и любая
   мутация (опустошает кэш) гарантируют актуальность. TTL — страховка от правок с
   другого устройства. */
var CACHE_TTL_MS = 90000; // 90с — внутри одной сессии работы навигация без перезапросов
App._loadedAt = {};
function cacheFresh_(key) {
  return App._loadedAt[key] && (Date.now() - App._loadedAt[key]) < CACHE_TTL_MS;
}
function markLoaded_(key) { App._loadedAt[key] = Date.now(); }

/* ===== ТЕМА ===== */
function toggleTheme() {
  App._theme = App._theme === 'dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', App._theme);
  localStorage.setItem('sprauto-theme', App._theme);
  var lbl = document.getElementById('theme-label');
  if (lbl) lbl.textContent = App._theme === 'dark' ? 'Светлая тема' : 'Тёмная тема';
}

/* ===== НАВИГАЦИЯ ===== */
var PAGE_TITLES = {
  dashboard:'Дашборд', orders:'Заказы', 'my-orders':'Мои заказы', clients:'Клиенты',
  'client-card':'Карточка клиента', 'order-card':'Карточка заказа',
  kassa:'Касса', finance:'Финансы', dds:'ДДС — Движение денег', expenses:'Расходы',
  debt:'Дебиторка', salary:'Расчёт заработной платы',
  team:'Сотрудники', services:'Услуги', inventory:'Склад',
  appointments:'Записи — календарь',
  materials:'Справочник материалов', sales:'Продажи материалов', settings:'Настройки'
};

// Мобильное выезжающее меню
function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }
function closeSidebar()  { document.body.classList.remove('sidebar-open'); }

// Отслеживание черновика нового заказа + перехват кнопки «назад» (мышь/браузер),
// чтобы приложение не «вылетало» и незаконченный заказ не терялся.
function setupNavGuards_() {
  var om = document.getElementById('modal-new-order');
  if (om) {
    // любое изменение поля формы заказа помечает черновик как «в работе»
    om.addEventListener('input',  function(){ App._orderDirty = true; });
    om.addEventListener('change', function(){ App._orderDirty = true; });
  }
  // «Назад» (мышь/браузер): закрываем открытую модалку, иначе возвращаемся на
  // ПРЕДЫДУЩУЮ страницу из истории приложения (а не всегда на дашборд).
  // В песочнице iframe History API может быть недоступен — тогда работает как раньше (try/catch).
  try {
    history.pushState({ app: 1 }, '');   // буфер, чтобы первая «назад» попала к обработчику
    window.addEventListener('popstate', function() {
      if (App._modalStack && App._modalStack.length) {
        closeAllModals();
        App._orderDirty = false; App._orderResume = false;   // «назад» закрыл модалку — черновик не возобновляем
      } else {
        navBack_();   // на предыдущую страницу приложения
      }
      try { history.pushState({ app: 1 }, ''); } catch (e) {}   // всегда восстанавливаем буфер — приложение не выходит
    });
  } catch (e) {}
}

// История страниц приложения (для кнопки «назад» браузера)
App._navStack = App._navStack || [];
App._navBack  = false;
function navBack_() {
  var st = App._navStack || [];
  if (st.length > 1) {
    st.pop();                          // убрать текущую страницу
    var prev = st[st.length - 1];
    App._navBack = true;               // не пушить эту навигацию обратно в стек
    try { goPage(prev); } finally { App._navBack = false; }
  }
  // если в истории одна страница — остаёмся (буфер не даёт выйти из приложения)
}

function goPage(name) {
  closeSidebar();   // на мобильном закрываем меню при выборе пункта
  // Уходим с открытого черновика нового заказа — запомним, чтобы вернуть его
  var _ordM = document.getElementById('modal-new-order');
  if (_ordM && _ordM.classList.contains('open') && App._orderDirty) App._orderResume = true;
  // Досохраняем несохранённые правки карточки и инлайн-редакторов перед уходом
  if (typeof flushCard_ === 'function') flushCard_();
  if (typeof flushAllInline_ === 'function') flushAllInline_();
  if (typeof flushMatEdits_ === 'function') flushMatEdits_();
  if (typeof flushServicesSave_ === 'function') flushServicesSave_();
  if (typeof flushComplexesSave_ === 'function') flushComplexesSave_();
  // Закрываем все открытые модальные окна при смене страницы
  closeAllModals();

  App.currentPage = name;
  document.querySelectorAll('.page').forEach(function(el){ el.classList.remove('active'); });
  var t = document.getElementById('page-' + name);
  if (t) t.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(el){
    el.classList.toggle('active', el.dataset.page === name || (name === 'client-card' && el.dataset.page === 'clients'));
  });
  var h = document.getElementById('topbar-title');
  if (h) h.textContent = PAGE_TITLES[name] || name;

  var actionBtn = document.getElementById('topbar-action-btn');
  if (actionBtn) {
    if (name === 'clients') {
      actionBtn.style.display = 'inline-flex';
      actionBtn.textContent = '+ Новый клиент';
      actionBtn.onclick = function(){ openModal('modal-new-client'); };
    } else if (name === 'materials') {
      actionBtn.style.display = 'inline-flex';
      actionBtn.textContent = '+ Добавить материал';
      actionBtn.onclick = function(){ openModal('modal-new-material'); };
    } else if (name === 'sales') {
      actionBtn.style.display = 'inline-flex';
      actionBtn.textContent = '+ Продажа';
      actionBtn.onclick = function(){ openNewSale(); };
    } else if (name === 'team') {
      actionBtn.style.display = 'inline-flex';
      actionBtn.textContent = '+ Добавить сотрудника';
      actionBtn.onclick = function(){ openModal('modal-new-employee'); };
    } else if (name === 'salary') {
      actionBtn.style.display = 'inline-flex';
      actionBtn.textContent = 'Рассчитать ЗП';
      actionBtn.onclick = function(){ calcSalary(); };
    } else if (name === 'appointments') {
      actionBtn.style.display = 'inline-flex';
      actionBtn.textContent = '+ Новая запись';
      actionBtn.onclick = function(){ openNewAppointment(); };
    } else {
      actionBtn.style.display = 'none';
    }
  }
  // Глобальную «+ Заказ» прячем на странице «Заказы» — там уже есть своя кнопка (без дубля)
  var orderBtn = document.getElementById('topbar-order-btn');
  if (orderBtn) orderBtn.style.display = (name === 'orders') ? 'none' : '';

  // История приложения (для «назад») + отражение страницы в URL (#page) для перезагрузки/закладки
  if (!App._navBack) {
    App._navStack = App._navStack || [];
    if (App._navStack[App._navStack.length - 1] !== name) App._navStack.push(name);
    if (App._navStack.length > 60) App._navStack.shift();
  }
  try { history.replaceState(history.state || { app: 1 }, '', '#' + name); } catch (e) {}

  window.scrollTo(0,0);
  loadCurrentPage();
  // Возвращаемся к незаконченному черновику заказа при заходе на «Заказы»
  if (name === 'orders' && App._orderResume) openModal('modal-new-order');
}

document.querySelectorAll('.nav-item').forEach(function(el){
  if (el.dataset.page) el.setAttribute('href', '#' + el.dataset.page);   // для «открыть в новой вкладке»
  el.addEventListener('click', function(e){
    // Ctrl/Cmd/средняя кнопка — пусть браузер открывает в новой вкладке (не перехватываем)
    if (e.ctrlKey || e.metaKey || e.button === 1) return;
    e.preventDefault(); goPage(el.dataset.page);
  });
});

function topbarAction() {}

/* ===== СИНХРОНИЗАЦИЯ ===== */
function refreshSync() {
  var n = new Date();
  var p = function(x){ return String(x).padStart(2,'0'); };
  var el = document.getElementById('sync-time');
  if (el) el.textContent = 'Обновлено: '+p(n.getDate())+'.'+p(n.getMonth()+1)+' '+p(n.getHours())+':'+p(n.getMinutes());
}

/* ===== КРАСИВОЕ ПОДТВЕРЖДЕНИЕ (вместо нативного confirm) ===== */
function uiConfirm(message, onConfirm, opts) {
  opts = opts || {};
  var title  = opts.title  || 'Подтвердите действие';
  var okText = opts.okText || 'Удалить';
  var danger = (opts.danger !== false); // по умолчанию опасное (красная кнопка)
  var html   = String(message || '').replace(/\n/g, '<br>');

  var bg = document.createElement('div');
  bg.style.cssText = 'position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px';
  bg.innerHTML =
    '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:14px;max-width:400px;width:100%;box-shadow:var(--shadow);overflow:hidden;animation:li-fade .15s ease">' +
      '<div style="padding:18px 20px 6px;font-weight:700;font-size:16px;color:var(--text)">' + title + '</div>' +
      '<div style="padding:0 20px 18px;font-size:14px;color:var(--text2);line-height:1.5">' + html + '</div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);background:var(--bg-card2)">' +
        '<button class="btn btn-ghost" data-act="cancel" style="padding:8px 16px">Отмена</button>' +
        '<button class="btn" data-act="ok" style="padding:8px 16px;font-weight:600;color:#fff;background:' + (danger ? 'var(--danger)' : 'var(--accent)') + '">' + okText + '</button>' +
      '</div>' +
    '</div>';

  function close() { if (bg.parentNode) bg.parentNode.removeChild(bg); document.removeEventListener('keydown', onKey); }
  function onKey(e) { if (e.key === 'Escape') close(); }
  bg.addEventListener('click', function(e) {
    if (e.target === bg) { close(); return; }
    var act = e.target.getAttribute('data-act');
    if (act === 'cancel') close();
    if (act === 'ok') { close(); if (onConfirm) onConfirm(); }
  });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(bg);
}

/* ===== ТОСТ ===== */
function toast(msg, type) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(App._toastTimer);
  App._toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3500);
}

/* ===== МОДАЛКИ ===== */
function closeAllModals() {
  document.querySelectorAll('.modal-dialog-bg').forEach(function(modal) {
    modal.classList.remove('open');
    modal.style.cssText = 'display:none';
  });
  App._modalStack = [];
  App._nextZIndex = 9999;
  document.body.style.overflow = '';
}

function closeModal(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('open');
  el.style.cssText = 'display:none';

  // Убираем из стека
  var idx = App._modalStack.indexOf(id);
  if (idx !== -1) App._modalStack.splice(idx, 1);

  // Если стек пустой, разблокируем скролл
  if (App._modalStack.length === 0) {
    document.body.style.overflow = '';
  }
}

function openModal(id) {
  var el = document.getElementById(id);
  if (!el) { toast('Модал не найден: ' + id, 'error'); return; }

  // Перемещаем в конец body чтобы гарантировать отрисовку поверх всего
  document.body.appendChild(el);

  // Выставляем все стили явно через JS — обходим любые CSS-блокировки
  el.style.cssText = [
    'position:fixed',
    'top:0', 'left:0',
    'width:100vw', 'height:100vh',
    'background:rgba(0,0,0,0.75)',
    'z-index:2147483647',
    'display:flex',
    'align-items:center',
    'justify-content:center',
    'padding:20px',
    'box-sizing:border-box'
  ].join(';');

  el.classList.add('open');
  App._modalStack.push(id);
  document.body.style.overflow = 'hidden';

  if (id === 'modal-new-order') {
    App._aptPendingLink = null;  // сброс возможной висящей привязки записи (выставится заново в orderFromAppointment)
    if (App._orderResume) {
      // Возобновляем незаконченный черновик: значения полей в DOM целы —
      // НЕ переинициализируем и не сбрасываем, просто показываем как было.
      App._orderResume = false;
    } else if (!App.employees || App.employees.length === 0) {
      google.script.run
        .withSuccessHandler(function(resp) {
          App.employees = (resp && resp.ok && resp.data) ? resp.data : [];
          fillOrderEmployees(); initOrderForm();
        })
        .withFailureHandler(function(){ fillOrderEmployees(); initOrderForm(); })
        .getEmployees(true);
    } else {
      fillOrderEmployees(); initOrderForm();
    }
  }

  if (id === 'modal-new-expense') {
    var dateEl = document.getElementById('exp-date');
    if (dateEl && !dateEl.value) {
      dateEl.value = new Date().toISOString().slice(0, 10);
    }
  }

  if (id === 'modal-new-employee') {
    if (App.config && App.config.positions) fillPositions(App.config.positions);
  }
}

// ─── ВЫБОР МЕНЕДЖЕРА: любой сотрудник, но по приоритету должностей ───────────
// Порядок: Менеджер → Администратор → Зам.директора → Директор → остальные.
function empName_(e){ return e['ФИО'] || e['Имя'] || ''; }
function empRolePriority_(e){
  var roles = ((e['Основная должность'] || '') + ' ' + (e['Доп. роли'] || '')).toLowerCase();
  if (/менеджер/.test(roles))            return 1;
  if (/админ/.test(roles))               return 2;
  if (/зам[\s.\-]*директор/.test(roles)) return 3;
  if (/директор/.test(roles))            return 4;
  return 5;
}
// Все сотрудники, отсортированные по приоритету должности, затем по алфавиту
function employeesByRolePriority_(){
  return (App.employees || []).slice().sort(function(a, b){
    var pa = empRolePriority_(a), pb = empRolePriority_(b);
    if (pa !== pb) return pa - pb;
    return String(empName_(a)).localeCompare(String(empName_(b)), 'ru');
  });
}
// Есть ли у сотрудника роль (по регэкспу) в должности или доп. ролях
function empHasRole_(e, re){ return re.test((e['Основная должность'] || '') + ' ' + (e['Доп. роли'] || '')); }
// ФИО первого сотрудника с ролью (по регэкспу) — для авто-подстановки менеджера/админа/мастера
function defaultEmpByRole_(re){
  var l = App.employees || [];
  for (var i = 0; i < l.length; i++){ if (empHasRole_(l[i], re)) return empName_(l[i]); }
  return '';
}
// HTML <option>-ов для селекта менеджера (любой сотрудник, приоритет должностей)
function managerOptionsHtml_(selected, placeholder){
  var opts = '<option value="">' + (placeholder || '— выбрать —') + '</option>';
  employeesByRolePriority_().forEach(function(e){
    var n = empName_(e); if (!n) return;
    opts += '<option value="' + String(n).replace(/"/g,'&quot;') + '"' + (String(selected) === String(n) ? ' selected' : '') + '>' + n + '</option>';
  });
  return opts;
}

// Определение состава услуг заказа (для тонировочных/оклеечных блоков карточки)
function svcHasTint_(s){ return /тонир|tint/i.test(String(s||'')); }
function svcHasOkl_(s){ return /оклей|ppf|антихром|полиров|керам|шумо|антикор|химч|защит/i.test(String(s||'')); }
// «Чистая тонировка» — только тонировка, без оклейки/прочего (тогда показываем блок плёнок)
function isTintOnly_(s){ return svcHasTint_(s) && !svcHasOkl_(s); }

function fillOrderEmployees() {
  var employees = App.employees || [];

  // Менеджер и Администратор — select (любой сотрудник, по приоритету должностей)
  var selMgr = document.getElementById('ord-manager');
  if (selMgr) selMgr.innerHTML = managerOptionsHtml_(selMgr.value);
  var selAdm = document.getElementById('ord-admin');
  if (selAdm) selAdm.innerHTML = managerOptionsHtml_(selAdm.value);

  // Мастера — заменяем текстовое поле на select с множественным выбором
  var masterWrap = document.getElementById('ord-masters-wrap');
  if (masterWrap) {
    masterWrap.innerHTML = '';
    employees.forEach(function(e) {
      var name = e['ФИО'] || e['Имя'] || '';
      if (!name) return;
      var label = document.createElement('label');
      label.className = 'master-checkbox';
      label.innerHTML =
        '<input type="checkbox" value="' + name + '" onchange="onMasterToggle_()"> ' + name;
      masterWrap.appendChild(label);
    });
  }

  // Загружаем справочник материалов — через initOrderForm
}

function toggleMastersDropdown(e) {
  e.stopPropagation();
  var dd = document.getElementById('masters-dropdown');
  if (!dd) return;
  var isOpen = dd.style.display !== 'none';
  if (isOpen) {
    dd.style.display = 'none';
    document.removeEventListener('click', closeMastersOnOutside);
  } else {
    dd.style.display = 'block';
    // Небольшая задержка чтобы этот же клик не закрыл сразу
    setTimeout(function() {
      document.addEventListener('click', closeMastersOnOutside);
    }, 100);
  }
}

function closeMastersOnOutside(e) {
  var dd = document.getElementById('masters-dropdown');
  if (!dd) return;
  // Если клик был внутри дропдауна — не закрываем
  if (dd.contains(e.target)) return;
  dd.style.display = 'none';
  document.removeEventListener('click', closeMastersOnOutside);
}

function updateMastersField() {
  var checked = [];
  document.querySelectorAll('#ord-masters-wrap input[type=checkbox]:checked').forEach(function(cb) {
    checked.push(cb.value);
  });
  var hidden = document.getElementById('ord-masters');
  if (hidden) hidden.value = checked.join(', ');
  // Обновляем метку кнопки
  var lbl = document.getElementById('ord-masters-label');
  if (lbl) lbl.textContent = checked.length ? checked.join(', ') : '— выбрать —';
  recalcOrderPreview();
}

function closeModalOnOverlay(e) {
  if (e.target === e.currentTarget) closeModal(e.currentTarget.id);
}

/* ===== СКЛАД (остатки материалов) ===== */
App._stock = [];

function loadInventory(force) {
  var tbody = document.getElementById('stock-tbody');
  if (!tbody) return;
  var hasCache = App._stock && App._stock.length;
  if (hasCache && !force) {
    renderStock();
    if (cacheFresh_('stock')) return;   // свежий кэш — фоновую дозагрузку пропускаем
  }
  else if (tbody) tbody.innerHTML = '<tr><td colspan="7" class="ct-loading"><div class="kpi-skeleton" style="min-height:40px;margin:4px 0"></div></td></tr>';

  google.script.run
    .withSuccessHandler(function(resp) {
      if (!resp || !resp.ok) {
        if (!hasCache) tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--danger)">' + (resp ? resp.error : 'Ошибка') + '</td></tr>';
        return;
      }
      App._stock = resp.data.items || [];
      markLoaded_('stock');
      var k = function(id, v){ var e = document.getElementById(id); if (e) e.textContent = v; };
      k('stock-kpi-count', resp.data.count);
      k('stock-kpi-low',   resp.data.lowCount);
      k('stock-kpi-value', money(resp.data.totalValue));
      renderStock();
    })
    .withFailureHandler(function(e) {
      if (!hasCache) tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--danger)">' + e.message + '</td></tr>';
    })
    .getStockList();
}

function renderStock() {
  var tbody  = document.getElementById('stock-tbody');
  var footer = document.getElementById('stock-footer');
  if (!tbody) return;
  var q       = (document.getElementById('stock-search') || {}).value || '';
  var lowOnly = (document.getElementById('stock-low-only') || {}).checked;
  q = q.toLowerCase();

  var list = (App._stock || []).filter(function(m) {
    if (lowOnly && !m.low) return false;
    if (q && !((m.name || '').toLowerCase().includes(q) || (m.category || '').toLowerCase().includes(q))) return false;
    return true;
  });

  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text2)">Ничего не найдено</td></tr>';
    if (footer) footer.textContent = '';
    return;
  }

  tbody.innerHTML = list.map(function(m) {
    var stockColor = m.low ? 'var(--danger)' : 'var(--text)';

var STOCK_OP_META = {

function openStockOp(matId, type) {
  var m = (App._stock || []).find(function(x){ return x.id === matId; });
  if (!m) return;
  var meta = STOCK_OP_META[type] || STOCK_OP_META.receipt;
  document.getElementById('stock-op-matid').value = matId;
  document.getElementById('stock-op-type').value  = type;
  document.getElementById('stock-op-title').textContent = meta.title;
  document.getElementById('stock-op-matname').textContent = m.name + ' · текущий остаток: ' + m.stock + ' ' + m.unit;
  document.getElementById('stock-op-qty-label').textContent = meta.qtyLabel + ' (' + m.unit + ')';
  document.getElementById('stock-op-qty').value = (type === 'adjust') ? m.stock : '';
  document.getElementById('stock-op-comment').value = '';
  document.getElementById('stock-op-submit').textContent = meta.submit;
  openModal('modal-stock-op');
}

function submitStockOp() {
  var matId   = document.getElementById('stock-op-matid').value;
  var type    = document.getElementById('stock-op-type').value;
  var qty     = Number(document.getElementById('stock-op-qty').value);
  var comment = document.getElementById('stock-op-comment').value.trim();
  var btn     = document.getElementById('stock-op-submit');
  if (isNaN(qty) || (type !== 'adjust' && qty <= 0)) { toast('Введите количество', 'error'); return; }
  if (btn) { btn.disabled = true; btn.textContent = '...'; }

  var done = function(resp) {
    if (btn) btn.disabled = false;
    if (!resp || !resp.ok) { toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); return; }
    toast('Готово: остаток ' + resp.data.stock, 'success');
    closeModal('modal-stock-op');
    loadInventory(true);
  };
  var fail = function(e){ if (btn) btn.disabled = false; toast('Ошибка: ' + e.message, 'error'); };

  var r = google.script.run.withSuccessHandler(done).withFailureHandler(fail);
  if (type === 'receipt')  r.stockReceipt(matId, qty, comment);
  else if (type === 'writeoff') r.stockWriteoff(matId, qty, comment, '');
  else r.stockAdjust(matId, qty, comment);
}

function aptPad_(n){ return String(n).padStart(2,'0'); }
function aptFmtDmy(d){ return aptPad_(d.getDate())+'.'+aptPad_(d.getMonth()+1)+'.'+d.getFullYear(); }
function aptFmtIso(d){ return d.getFullYear()+'-'+aptPad_(d.getMonth()+1)+'-'+aptPad_(d.getDate()); }
function aptParseIso(s){ var m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }

// понедельник–воскресенье недели, содержащей d
function aptWeekRange(d) {
  var dow = (d.getDay() + 6) % 7; // 0 = понедельник
  var mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
  var sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
  return { mon: mon, sun: sun };
}

// Границы месячной сетки (недели Пн–Вс, покрывающие месяц даты d)
function aptMonthGrid(d) {
  var first = new Date(d.getFullYear(), d.getMonth(), 1);
  var startDow = (first.getDay() + 6) % 7;            // 0 = понедельник
  var gridStart = new Date(first.getFullYear(), first.getMonth(), 1 - startDow);
  var gridEnd = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + 41); // 6 недель
  return { start: gridStart, end: gridEnd, month: d.getMonth() };
}

// Рендер месяца: сетка 6 недель × 7 дней, в каждом дне — чипы записей

    cells += '<div class="apt-mon-cell' + (other ? ' apt-mon-other' : '') + (isToday ? ' apt-mon-today' : '') + '" ondblclick="aptOpenDay(\'' + aptFmtIso(day) + '\')" title="Двойной клик — открыть день">' +

  wrap.innerHTML = '<div class="apt-mon-head">' + heads + '</div><div class="apt-mon-grid">' + cells + '</div>';

// Рендер недели: 7 колонок Пн–Вс, в каждой — чипы записей по времени
// Раскладка пересекающихся записей по колонкам (проставляет _col/_cols). items отсортированы по _s.
function aptLayoutLanes_(items) {
  var cluster = [], clEnd = -1;
  var layout = function(cl){
    var lanes = [];
    cl.forEach(function(a){
      var placed = false;
      for (var i = 0; i < lanes.length; i++) { if (a._s >= lanes[i]) { a._col = i; lanes[i] = a._e; placed = true; break; } }
      if (!placed) { a._col = lanes.length; lanes.push(a._e); }
    });
    cl.forEach(function(a){ a._cols = lanes.length; });
  };
  items.forEach(function(a){
    if (cluster.length && a._s >= clEnd) { layout(cluster); cluster = []; clEnd = -1; }
    cluster.push(a); clEnd = Math.max(clEnd, a._e);
  });
  if (cluster.length) layout(cluster);
}

// Компактный блок записи в недельной сетке
function aptWkBlockHtml_(a, gridStart, HH) {
  var color = serviceColor(a.service);
  var cancelled = a.status === 'Отменена';
  var top = (a._s - gridStart) / 60 * HH;
  var height = Math.max(17, (a._e - a._s) / 60 * HH - 2);
  var wPct = 100 / (a._cols || 1), leftPct = (a._col || 0) * wPct;
  var stateCls = a.workState === 'inwork' ? ' apt-block-inwork' : a.workState === 'done' ? ' apt-block-done' : '';
  if (cancelled) stateCls += ' apt-block-cancel';
  return '<div class="apt-wk-block' + stateCls + '" data-id="' + a.id + '" style="top:' + top + 'px;height:' + height + 'px;left:calc(' + leftPct + '% + 1px);width:calc(' + wPct + '% - 2px);' +
      'background:' + hexToRgba_(color, 0.18) + ';border-left:3px solid ' + color + ';cursor:grab"' +
      ' title="' + (a.time||'') + ' ' + String(a.client||'').replace(/"/g,'') + ' · ' + String(a.service||'').replace(/"/g,'') + ' (тяните — перенос, за низ — длительность)">' +
      '<button class="apt-block-del" title="Удалить" onclick="event.stopPropagation();aptDelete(\'' + a.id + '\')">✕</button>' +
      '<div class="apt-wk-block-t">' + (a.time || '') + ' ' + (a.client || '—') + '</div>' +
      '<div class="apt-block-resize" title="Растянуть по длительности"></div>' +
    '</div>';
}
// Перетаскивание (перенос по времени и между днями) + растягивание в недельной сетке.
// Блок следует за курсором в РЕАЛЬНОМ ВРЕМЕНИ. Единый обработчик с гарантированной очисткой:
// одновременно тащится РОВНО один блок (защита от залипших mousemove-слушателей).
function aptWkMouseDown_(e) {
  if (e.button !== 0) return;
  var block = e.target.closest('.apt-wk-block');
  if (!block) return;
  if (e.target.classList.contains('apt-block-del')) return;
  var cal = App._aptWkCal; if (!cal) return;
  var track = block.closest('.apt-wkcal-track'); if (!track) return;
  if (App._aptDragCleanup) App._aptDragCleanup();   // добить залипший предыдущий drag

  var id = block.getAttribute('data-id');
  var isResize = e.target.classList.contains('apt-block-resize') && block.offsetHeight > 34;
  e.preventDefault();
  var HH = cal.HH, moved = false, ghost = null;
  var trackRect = track.getBoundingClientRect();
  var blockRect = block.getBoundingClientRect();
  var offX = e.clientX - blockRect.left, offY = e.clientY - blockRect.top, w = blockRect.width, h0 = blockRect.height;
  var origH = parseFloat(block.style.height) || 18;
  var startX = e.clientX, startY = e.clientY;

  var onMove = function(ev) {
    if (!moved && (Math.abs(ev.clientX - startX) > 3 || Math.abs(ev.clientY - startY) > 3)) moved = true;
    if (!moved) return;
    if (isResize) {   // растягивание меняет высоту САМОГО блока (один блок)
      block.style.zIndex = 20;
      block.style.height = Math.max(HH * 0.25, origH + (ev.clientY - startY)) + 'px';
    } else {          // перенос — тащим ПРИЗРАК-клон, реальные записи не трогаем
      if (!ghost) {
        ghost = block.cloneNode(true);
        ghost.classList.add('apt-dragging');
        ghost.style.position = 'fixed'; ghost.style.left = '0'; ghost.style.top = '0';
        ghost.style.width = w + 'px'; ghost.style.height = h0 + 'px';
        ghost.style.margin = '0'; ghost.style.pointerEvents = 'none'; ghost.style.zIndex = '9999';
        document.body.appendChild(ghost);
        block.style.opacity = '0.35';
      }
      ghost.style.transform = 'translate(' + (ev.clientX - offX) + 'px,' + (ev.clientY - offY) + 'px)';
    }
  };
  var cleanup = function() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    if (ghost) { ghost.remove(); ghost = null; }
    block.style.opacity = '';
    App._aptDragCleanup = null;
  };
  var onUp = function(ev) {
    cleanup();
    if (!moved) { openEditAppointment(id); return; }
    App._aptSuppressClick = true; setTimeout(function(){ App._aptSuppressClick = false; }, 0);
    if (isResize) {
      var hh = parseFloat(block.style.height);
      aptWkCommit_(id, null, null, Math.max(15, Math.round((hh / HH * 60) / 15) * 15));
    } else {
      var topRel = (ev.clientY - offY) - trackRect.top;   // верх призрака относительно дорожки
      var mins = cal.gridStart + Math.round((topRel / HH * 60) / 15) * 15;
      mins = Math.max(0, Math.min(23 * 60 + 45, mins));
      var di = Math.floor((ev.clientX - trackRect.left) / (trackRect.width / 7));
      di = Math.max(0, Math.min(6, di));
      var newDmy = (cal.trackDays || [])[di] || null;
      aptWkCommit_(id, newDmy, aptPad_(Math.floor(mins / 60)) + ':' + aptPad_(mins % 60), null);
    }
  };
  App._aptDragCleanup = cleanup;
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// Сохранить новые дату/время/длительность записи из недельной сетки
function aptWkCommit_(id, newDate, newTime, newDur) {
  var a = (App._apts || []).find(function(x){ return String(x.id) === String(id); });
  if (!a) return;
  if (newDate != null) a.date = newDate;
  if (newTime != null) a.time = newTime;
  if (newDur  != null) a.duration = newDur;
  var dur = Number(a.duration) || 60;
  a.endDate = a.date;
  a.endTime = aptAddMin_(a.time, dur);
  var patch = { date: a.date, time: a.time, duration: dur, endDate: a.endDate, endTime: a.endTime };
  renderAptWeek(aptWeekRange(App._aptDate));
  // Сохраняем в фоне; при ошибке НЕ откатываем позицию (никаких «возвратов назад»), только предупреждаем
  google.script.run
    .withSuccessHandler(function(resp){ if (!resp || !resp.ok) toast('Не сохранилось: ' + (resp ? resp.error : ''), 'error'); })
    .withFailureHandler(function(e){ toast('Не сохранилось: ' + e.message, 'error'); })
    .updateAppointment(id, patch);
}

// Клик по пустому месту в колонке дня (неделя) → новая запись на это время
function aptWkColClick(e, col) {
  if (App._aptSuppressClick) return;              // не создаём после перетаскивания
  if (e.target.closest('.apt-wk-block')) return;
  var cal = App._aptWkCal; if (!cal) return;
  var rect = col.getBoundingClientRect();
  var mins = cal.gridStart + Math.round(((e.clientY - rect.top) / cal.HH * 60) / 15) * 15;
  mins = Math.max(0, Math.min(23 * 60 + 45, mins));
  var d = aptParseIso(col.getAttribute('data-date')); if (d) App._aptDate = d;
  aptCreateAt_(aptPad_(Math.floor(mins / 60)) + ':' + aptPad_(mins % 60));
}

// Убрать дубли записей по id (защита от рассинхрона App._apts)
function aptUniq_(arr) {
  var seen = {}, out = [];
  (arr || []).forEach(function(a){
    if (a && a.id) { if (seen[a.id]) return; seen[a.id] = 1; }
    out.push(a);
  });
  return out;
}

// Недельный вид — сетка по времени: 7 дней × часы (как Google Calendar)
function renderAptWeek(rng) {
  var wrap = document.getElementById('apt-week');
  if (!wrap) return;
  var list = aptUniq_(App._apts);
  var WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  var todayDmy = aptFmtDmy(new Date());
  renderAptKpis_(list);

  var mon0 = new Date(rng.mon.getFullYear(), rng.mon.getMonth(), rng.mon.getDate());
  var dmyToDate = function(s){ var p = String(s||'').split('.'); return p.length===3 ? new Date(+p[2], +p[1]-1, +p[0]) : null; };
  var isMulti = function(a){ return a.endDate && a.endDate !== a.date; };
  var multi  = list.filter(isMulti);
  var single = list.filter(function(a){ return !isMulti(a); });
  var endMin = function(a){ var s = aptMinutes_(a.time); if (a.endTime && a.endDate === a.date) { var em = aptMinutes_(a.endTime); if (em != null && em > s) return em; } return s + (Number(a.duration) || 60); };

  // диапазон часов
  var HH = 42, minStart = 8 * 60, maxEnd = 20 * 60;
  single.forEach(function(a){ var s = aptMinutes_(a.time); if (s == null) return; minStart = Math.min(minStart, s); maxEnd = Math.max(maxEnd, endMin(a)); });
  var startH = Math.max(6, Math.floor(minStart / 60)), endH = Math.min(23, Math.ceil(maxEnd / 60));
  var gridStart = startH * 60, totalH = (endH - startH) * HH;
  var trackDays = [];
  for (var td = 0; td < 7; td++) trackDays.push(aptFmtDmy(new Date(mon0.getFullYear(), mon0.getMonth(), mon0.getDate() + td)));
  App._aptWkCal = { gridStart: gridStart, HH: HH, trackDays: trackDays };

  // шапки дней
  var heads = '';
  for (var i = 0; i < 7; i++) {
    var day = new Date(mon0.getFullYear(), mon0.getMonth(), mon0.getDate() + i);
    var dmy = aptFmtDmy(day);
    var cnt = single.filter(function(a){ return a.date === dmy; }).length;
    heads += '<div class="apt-wkcal-dh' + (dmy === todayDmy ? ' today' : '') + '" onclick="aptOpenDay(\'' + aptFmtIso(day) + '\')" title="Открыть день">' +
      WD[i] + ' ' + dmy.slice(0,5) + (cnt ? ' <span class="apt-week-cnt">' + cnt + '</span>' : '') + '</div>';
  }

  // верхняя строка: многодневные (полосой) + записи без времени (чипом в своём дне)
  var untimedAll = single.filter(function(a){ return aptMinutes_(a.time) == null; });
  var spans = multi.map(function(a){
    var s = dmyToDate(a.date), e = dmyToDate(a.endDate); if (!s || !e) return '';
    var si = Math.max(0, Math.round((s - mon0) / 86400000)), ei = Math.min(6, Math.round((e - mon0) / 86400000));
    if (ei < 0 || si > 6 || ei < si) return '';
    var color = serviceColor(a.service);
    var st = a.workState === 'inwork' ? ' <span class="apt-state apt-state-work">в работе</span>'
           : a.workState === 'done'   ? ' <span class="apt-state apt-state-done">выполнено</span>' : '';
    return '<div class="apt-wk-span" style="grid-column:' + (si+1) + ' / ' + (ei+2) + ';background:' + hexToRgba_(color, 0.18) + ';border-left:3px solid ' + color + '" ' +
      'onclick="openEditAppointment(\'' + a.id + '\')" title="' + (a.service||'') + '"><b>' + (a.client||'—') + '</b> · ' + (a.service||'') + st + '</div>';
  }).join('') +
  untimedAll.map(function(a){
    var s = dmyToDate(a.date); if (!s) return '';
    var di = Math.round((s - mon0) / 86400000); if (di < 0 || di > 6) return '';
    var color = serviceColor(a.service);
    return '<div class="apt-wk-span" style="grid-column:' + (di+1) + ' / ' + (di+2) + ';background:' + hexToRgba_(color, 0.18) + ';border-left:3px solid ' + color + '" ' +
      'onclick="openEditAppointment(\'' + a.id + '\')" title="Без времени — откройте и задайте время">⏱ <b>' + (a.client||'—') + '</b></div>';
  }).join('');
  var allDayRow = (multi.length || untimedAll.length)
    ? '<div class="apt-wkcal-alldayrow"><div class="apt-wkcal-corner apt-wkcal-corner-label">без<br>времени</div><div class="apt-wkcal-spans">' + spans + '</div></div>'
    : '';

  // шкала времени + линии
  var gutter = '', lines = '';
  for (var h = startH; h <= endH; h++) {
    var top = (h - startH) * HH;
    gutter += '<div class="apt-hour-label" style="top:' + top + 'px">' + aptPad_(h) + ':00</div>';
    if (h < endH) lines += '<div class="apt-hour-line" style="top:' + top + 'px"></div>';
  }

  // колонки дней с блоками
  var cols = '';
  for (var d = 0; d < 7; d++) {
    var dday = new Date(mon0.getFullYear(), mon0.getMonth(), mon0.getDate() + d);
    var ddmy = aptFmtDmy(dday);
    var appts = single.filter(function(a){ return a.date === ddmy && aptMinutes_(a.time) != null; });
    appts.forEach(function(a){ a._s = aptMinutes_(a.time); a._e = Math.max(a._s + 15, endMin(a)); });
    appts.sort(function(a,b){ return a._s - b._s || a._e - b._e; });
    aptLayoutLanes_(appts);
    var blocks = appts.map(function(a){ return aptWkBlockHtml_(a, gridStart, HH); }).join('');
    var nowLine = '';
    if (ddmy === todayDmy) { var nm = new Date().getHours()*60 + new Date().getMinutes(); if (nm >= gridStart && nm <= endH*60) nowLine = '<div class="apt-now-line" style="top:' + ((nm-gridStart)/60*HH) + 'px"></div>'; }
    cols += '<div class="apt-wkcal-col" data-date="' + aptFmtIso(dday) + '" style="left:' + (d*100/7) + '%;width:' + (100/7) + '%" onclick="aptWkColClick(event, this)">' + nowLine + blocks + '</div>';
  }

  wrap.innerHTML =
    '<div class="apt-wkcal">' +
      '<div class="apt-wkcal-headrow"><div class="apt-wkcal-corner"></div><div class="apt-wkcal-heads">' + heads + '</div></div>' +
      allDayRow +
      '<div class="apt-wkcal-bodyrow" style="height:' + totalH + 'px">' +
        '<div class="apt-wkcal-timegutter">' + gutter + '</div>' +
        '<div class="apt-wkcal-track">' + lines + cols + '</div>' +
      '</div>' +
    '</div>';

  var wtrack = wrap.querySelector('.apt-wkcal-track');
  if (wtrack) wtrack.addEventListener('mousedown', aptWkMouseDown_);
}

// клик по заголовку дня в неделе → перейти в дневной вид этого дня
function aptOpenDay(iso) {
  var d = aptParseIso(iso); if (!d) return;
  App._aptDate = d;
  setAptView('day');
}
// «+ запись» в дне недели → открыть модал с этой датой
function aptAddOnDay(iso) {
  var d = aptParseIso(iso); if (d) App._aptDate = d;
  openNewAppointment();
}

// Цвет услуги (из каталога, иначе — стабильный из палитры по имени)
function serviceColor(name) {
  var svcs = (App.config && App.config.services) || [];
  for (var i = 0; i < svcs.length; i++) { if (svcs[i].name === name && svcs[i].color) return svcs[i].color; }
  var pal = ['#4da6ff','#9b59b6','#f0a500','#1abc9c','#e67e22','#5cb85c','#d9534f','#6c8ebf','#e84393','#00b894'];
  var h = 0, s = String(name || '');
  for (var j = 0; j < s.length; j++) h = (h * 31 + s.charCodeAt(j)) >>> 0;
  return pal[h % pal.length];
}
function hexToRgba_(hex, a) {
  var h = hex6_(hex).slice(1);
  return 'rgba(' + parseInt(h.slice(0,2),16) + ',' + parseInt(h.slice(2,4),16) + ',' + parseInt(h.slice(4,6),16) + ',' + a + ')';
}
function aptMinutes_(t) {
  var m = String(t || '').match(/^(\d{1,2}):(\d{2})/);
  return m ? (+m[1]) * 60 + (+m[2]) : null;
}

// KPI для дня/недели (используется обоими видами)
function renderAptKpis_(list) {
  var k = function(id, v){ var e = document.getElementById(id); if (e) e.textContent = v; };
  k('apt-kpi-count', list.length);
  k('apt-kpi-planned', list.filter(function(a){ return a.status === 'Запланирована'; }).length);
  k('apt-kpi-came', list.filter(function(a){ return a.status === 'Пришёл'; }).length);
  var byMaster = {};
  list.forEach(function(a){ if (a.status === 'Отменена') return; var m = a.master || '—'; byMaster[m] = (byMaster[m]||0) + (Number(a.duration)||0); });
  var mk = Object.keys(byMaster);
  k('apt-kpi-masters', mk.length ? mk.map(function(m){ return m + ' · ' + Math.round(byMaster[m]/60*10)/10 + 'ч'; }).join(', ') : '—');
}

// Дневной вид — календарь-сетка по времени (как Google Calendar)
function renderAptDayCalendar() {
  var cal    = document.getElementById('apt-cal');
  var footer = document.getElementById('apt-footer');
  if (!cal) return;
  var list = aptUniq_(App._apts);
  renderAptKpis_(list);

  if (!list.length) {
    cal.innerHTML = '<div style="text-align:center;padding:40px 12px;color:var(--text2)">На этот день записей нет. ' +
      '<a href="#" onclick="openNewAppointment();return false" style="color:var(--accent)">Добавить запись</a></div>';
    if (footer) footer.textContent = '';
    return;
  }

  // Разделяем: многодневные (полоса сверху) и однодневные (блоки в сетке)
  var multiDay = list.filter(function(a){ return a.endDate && a.endDate !== a.date; });
  var dayList  = list.filter(function(a){ return !(a.endDate && a.endDate !== a.date); });

  // Длительность блока: по времени окончания (если есть), иначе по «Длительность»
  var aptEndMin_ = function(a){
    var s = aptMinutes_(a.time);
    if (a.endTime && a.endDate === a.date) { var em = aptMinutes_(a.endTime); if (em != null && em > s) return em; }
    return s + (Number(a.duration) || 60);
  };

  // Диапазон часов сетки: по записям, но не уже 8–20
  var HH = 58;                       // высота часа, px
  var minStart = 8 * 60, maxEnd = 20 * 60;
  dayList.forEach(function(a){
    var s = aptMinutes_(a.time); if (s == null) return;
    minStart = Math.min(minStart, s);
    maxEnd   = Math.max(maxEnd, aptEndMin_(a));
  });
  var startH = Math.max(6, Math.floor(minStart / 60));
  var endH   = Math.min(23, Math.ceil(maxEnd / 60));
  var gridStart = startH * 60;
  var totalH = (endH - startH) * HH;

  // Раскладка по колонкам при пересечении
  var timed = dayList.filter(function(a){ return aptMinutes_(a.time) != null; });
  timed.forEach(function(a){ a._s = aptMinutes_(a.time); a._e = Math.max(a._s + 15, aptEndMin_(a)); });
  timed.sort(function(a,b){ return a._s - b._s || a._e - b._e; });
  var cluster = [], clEnd = -1;
  var layout = function(cl){
    var lanes = [];
    cl.forEach(function(a){
      var placed = false;
      for (var i = 0; i < lanes.length; i++) { if (a._s >= lanes[i]) { a._col = i; lanes[i] = a._e; placed = true; break; } }
      if (!placed) { a._col = lanes.length; lanes.push(a._e); }
    });
    cl.forEach(function(a){ a._cols = lanes.length; });
  };
  timed.forEach(function(a){
    if (cluster.length && a._s >= clEnd) { layout(cluster); cluster = []; clEnd = -1; }
    cluster.push(a); clEnd = Math.max(clEnd, a._e);
  });
  if (cluster.length) layout(cluster);

  // Часовые линии + подписи
  var gutter = '', gridlines = '';
  for (var h = startH; h <= endH; h++) {
    var top = (h - startH) * HH;
    gutter    += '<div class="apt-hour-label" style="top:' + top + 'px">' + aptPad_(h) + ':00</div>';
    if (h < endH) gridlines += '<div class="apt-hour-line" style="top:' + top + 'px"></div>';
  }

  // Блоки записей
  var blocks = timed.map(function(a){ return aptBlockHtml_(a, gridStart, HH); }).join('');

  // Линия «сейчас» (если открыт сегодняшний день)
  var nowLine = '';
  if (aptFmtDmy(App._aptDate) === aptFmtDmy(new Date())) {
    var nowMin = new Date().getHours() * 60 + new Date().getMinutes();
    if (nowMin >= gridStart && nowMin <= endH * 60) {
      nowLine = '<div class="apt-now-line" style="top:' + ((nowMin - gridStart) / 60 * HH) + 'px"></div>';
    }
  }

  // Полоса многодневных записей — сверху над сеткой
  // Сверху: многодневные + записи без времени (чтобы были видны и редактируемы)
  var untimedDay = dayList.filter(function(a){ return aptMinutes_(a.time) == null; });
  var allDay = '';
  if (multiDay.length || untimedDay.length) {
    var bar = function(a, note){
      var color = serviceColor(a.service);
      var st = a.workState === 'inwork' ? ' <span class="apt-state apt-state-work">в работе</span>'
             : a.workState === 'done'   ? ' <span class="apt-state apt-state-done">выполнено</span>' : '';
      return '<div class="apt-allday-bar" style="background:' + hexToRgba_(color, 0.18) + ';border-left:3px solid ' + color + '" ' +
        'onclick="openEditAppointment(\'' + a.id + '\')" title="' + (a.service||'') + '">' +
        '<button class="apt-block-del" title="Удалить" onclick="event.stopPropagation();aptDelete(\'' + a.id + '\')">✕</button>' +
        '<b>' + (a.client || '—') + '</b> · ' + (a.service || '') + st +
        '<span class="apt-allday-range">' + note + '</span>' +
      '</div>';
    };
    allDay = '<div class="apt-allday">' +
      multiDay.map(function(a){ return bar(a, (a.date||'') + ' ' + (a.time||'') + ' → ' + (a.endDate||'') + ' ' + (a.endTime||'')); }).join('') +
      untimedDay.map(function(a){ return bar(a, '⏱ без времени — задайте время'); }).join('') +
    '</div>';
  }

  cal.innerHTML = allDay +
    '<div class="apt-cal-grid" style="height:' + totalH + 'px">' +
      '<div class="apt-cal-gutter">' + gutter + '</div>' +
      '<div class="apt-cal-track">' + gridlines + nowLine + blocks + '</div>' +
    '</div>';
  if (footer) footer.textContent = 'Всего записей: ' + list.length + ' · тяните запись для переноса, за нижний край — длительность, клик по пустому месту — новая';

  // параметры сетки для перетаскивания/растягивания
  App._aptCal = { gridStart: gridStart, HH: HH };
  var track = cal.querySelector('.apt-cal-track');
  if (track) {
    track.addEventListener('mousedown', aptCalMouseDown_);
    track.addEventListener('click', aptCalClickEmpty_);   // клик по пустому месту = новая запись
  }
}

// Клик по свободной области сетки → создать запись на это время
function aptCalClickEmpty_(e) {
  if (App._aptSuppressClick) return;                     // не создаём сразу после перетаскивания
  if (e.target.closest('.apt-block')) return;            // клик по записи — не сюда
  var cal = App._aptCal; if (!cal) return;
  var rect = e.currentTarget.getBoundingClientRect();
  var y = e.clientY - rect.top;
  var mins = cal.gridStart + Math.round((y / cal.HH * 60) / 15) * 15;
  mins = Math.max(0, Math.min(23 * 60 + 45, mins));
  aptCreateAt_(aptPad_(Math.floor(mins / 60)) + ':' + aptPad_(mins % 60));
}
function aptCreateAt_(time) {
  openNewAppointment();
  var t = document.getElementById('apt-f-time');
  if (t) t.value = time;
  var et = document.getElementById('apt-f-endtime');
  if (et) et.value = aptAddMin_(time, 60);
}
// Прибавить минуты к 'HH:mm' в пределах суток
function aptAddMin_(time, mins) {
  var m = String(time || '').match(/^(\d{1,2}):(\d{2})/);
  if (!m) return time || '';
  var v = Math.min(23 * 60 + 59, (+m[1]) * 60 + (+m[2]) + (Number(mins) || 0));
  return ('0' + Math.floor(v / 60)).slice(-2) + ':' + ('0' + (v % 60)).slice(-2);
}
// Автозаполнение окончания: пустая дата окончания → = дате начала; пустое/раннее время → начало+1ч
function aptSyncEndDefaults_() {
  var sd = document.getElementById('apt-f-date').value;
  var st = document.getElementById('apt-f-time').value;
  var edEl = document.getElementById('apt-f-enddate');
  var etEl = document.getElementById('apt-f-endtime');
  if (edEl && !edEl.value && sd) edEl.value = sd;
  if (etEl && !etEl.value && st) etEl.value = aptAddMin_(st, 60);
}

// Перетаскивание (перенос по времени) и растягивание (длительность) записи мышью
function aptCalMouseDown_(e) {
  if (e.button !== 0) return;
  var block = e.target.closest('.apt-block');
  if (!block) return;
  if (e.target.closest('.apt-block-acts') || e.target.classList.contains('apt-block-del')) return;   // клики по кнопкам не тянут
  var cal = App._aptCal; if (!cal) return;
  if (App._aptDragCleanup) App._aptDragCleanup();   // добить залипший предыдущий drag
  var track = block.closest('.apt-cal-track');
  var id = block.getAttribute('data-id');
  var isResize = e.target.classList.contains('apt-block-resize') && block.offsetHeight > 34;
  e.preventDefault();

  var HH = cal.HH, moved = false, ghost = null;
  var trackRect = track ? track.getBoundingClientRect() : null;
  var blockRect = block.getBoundingClientRect();
  var offX = e.clientX - blockRect.left, offY = e.clientY - blockRect.top, w = blockRect.width, h0 = blockRect.height;
  var origH = parseFloat(block.style.height) || 26;
  var startX = e.clientX, startY = e.clientY;

  var onMove = function(ev) {
    if (!moved && (Math.abs(ev.clientY - startY) > 3 || Math.abs(ev.clientX - startX) > 3)) moved = true;
    if (!moved) return;
    if (isResize) {   // растягивание — высота самого блока
      block.style.zIndex = 8;
      block.style.height = Math.max(HH * 0.25, origH + (ev.clientY - startY)) + 'px';
    } else {          // перенос — призрак-клон, реальные записи не трогаем
      if (!ghost) {
        ghost = block.cloneNode(true);
        ghost.classList.add('apt-dragging');
        ghost.style.position = 'fixed'; ghost.style.left = '0'; ghost.style.top = '0';
        ghost.style.width = w + 'px'; ghost.style.height = h0 + 'px';
        ghost.style.margin = '0'; ghost.style.pointerEvents = 'none'; ghost.style.zIndex = '9999';
        document.body.appendChild(ghost);
        block.style.opacity = '0.35';
      }
      ghost.style.transform = 'translate(' + (ev.clientX - offX) + 'px,' + (ev.clientY - offY) + 'px)';
    }
  };
  var cleanup = function() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    if (ghost) { ghost.remove(); ghost = null; }
    block.style.opacity = '';
    App._aptDragCleanup = null;
  };
  var onUp = function(ev) {
    cleanup();
    if (!moved) { openEditAppointment(id); return; }   // без движения = клик
    App._aptSuppressClick = true; setTimeout(function(){ App._aptSuppressClick = false; }, 0);
    if (isResize) {
      var h = parseFloat(block.style.height);
      aptCommitTimeChange_(id, null, Math.max(15, Math.round((h / HH * 60) / 15) * 15));
    } else {
      var topRel = trackRect ? ((ev.clientY - offY) - trackRect.top) : 0;
      var mins = cal.gridStart + Math.round((topRel / HH * 60) / 15) * 15;
      mins = Math.max(0, Math.min(23 * 60 + 45, mins));
      aptCommitTimeChange_(id, aptPad_(Math.floor(mins / 60)) + ':' + aptPad_(mins % 60), null);
    }
  };
  App._aptDragCleanup = cleanup;
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// Сохранить новое время/длительность записи (оптимистично + сервер)
function aptCommitTimeChange_(id, time, duration) {
  var a = (App._apts || []).find(function(x){ return String(x.id) === String(id); });
  if (!a) return;
  if (time != null)     a.time = time;
  if (duration != null) a.duration = duration;
  // однодневная запись: пересчитываем окончание из начала + длительности
  var dur = Number(a.duration) || 60;
  a.endDate = a.date;
  a.endTime = aptAddMin_(a.time, dur);
  var patch = { time: a.time, duration: dur, endDate: a.endDate, endTime: a.endTime };
  renderAptDayCalendar();   // мгновенная перерисовка «начисто» (с привязкой к сетке)
  // Сохраняем в фоне; при ошибке НЕ откатываем (без «возвратов назад»), только предупреждаем
  google.script.run
    .withSuccessHandler(function(resp){ if (!resp || !resp.ok) toast('Не сохранилось: ' + (resp ? resp.error : ''), 'error'); })
    .withFailureHandler(function(e){ toast('Не сохранилось: ' + e.message, 'error'); })
    .updateAppointment(id, patch);
}

// HTML одного блока записи в календаре
function aptBlockHtml_(a, gridStart, HH) {
  var color     = serviceColor(a.service);
  var cancelled = a.status === 'Отменена';
  var top    = (a._s - gridStart) / 60 * HH;
  var height = Math.max(26, (a._e - a._s) / 60 * HH - 3);
  var wPct   = 100 / (a._cols || 1);
  var leftPct = (a._col || 0) * wPct;

  // Метка состояния: перенесён в воронку → «в работе», оплачен → «выполнено»
  var stateCls = '', stateBadge = '';
  if (a.workState === 'inwork') { stateCls = ' apt-block-inwork'; stateBadge = '<span class="apt-state apt-state-work">в работе</span>'; }
  else if (a.workState === 'done') { stateCls = ' apt-block-done'; stateBadge = '<span class="apt-state apt-state-done">выполнено</span>'; }
  if (cancelled) stateCls += ' apt-block-cancel';

  // Кнопки (видны при наведении)
  var btns = '';
  if (!cancelled && a.workState === 'none') {
    btns += '<button class="apt-block-btn" title="Перенести в воронку" onclick="event.stopPropagation();aptFunnelMenu(event,\'' + a.id + '\')">→ воронка</button>';
  } else if (a.orderId) {
    btns += '<button class="apt-block-btn" title="Открыть заказ" onclick="event.stopPropagation();openOrderCard(\'' + a.orderId + '\')">' + a.orderId + '</button>';
  }

  var movable = (!cancelled);   // отменённые не двигаем
  return '<div class="apt-block' + stateCls + '" data-id="' + a.id + '" style="top:' + top + 'px;height:' + height + 'px;left:calc(' + leftPct + '% + 2px);width:calc(' + wPct + '% - 4px);' +
      'background:' + hexToRgba_(color, 0.16) + ';border-left:3px solid ' + color + (movable ? ';cursor:grab' : '') + '"' +
      ' title="' + String(a.service||'').replace(/"/g,'') + ' · ' + String(a.master||'').replace(/"/g,'') + ' (тяните — перенос, за низ — длительность)">' +
      '<button class="apt-block-del" title="Удалить запись" onclick="event.stopPropagation();aptDelete(\'' + a.id + '\')">✕</button>' +
      '<div class="apt-block-time">' + (a.time || '') + (stateBadge || '') + '</div>' +
      '<div class="apt-block-client">' + (a.client || '—') + '</div>' +
      '<div class="apt-block-meta">' + (a.service || '') + (a.master ? ' · ' + a.master : '') + '</div>' +
      '<div class="apt-block-acts">' + btns + '</div>' +
      (movable ? '<div class="apt-block-resize" title="Растянуть по длительности"></div>' : '') +
    '</div>';
}

// Меню выбора воронки при переносе записи

function aptShift(delta) {
  if (!App._aptDate) App._aptDate = new Date();
  var d = App._aptDate;
  if (App._aptView === 'month') App._aptDate = new Date(d.getFullYear(), d.getMonth() + delta, 1);
  else {
    var step = App._aptView === 'week' ? 7 : 1;
    App._aptDate = new Date(d.getFullYear(), d.getMonth(), d.getDate() + delta * step);
  }
  loadAppointments(true);
}
function aptGoToday() { App._aptDate = new Date(); loadAppointments(true); }
function aptOnDatePick() {
  var v = (document.getElementById('apt-date') || {}).value;
  var d = aptParseIso(v);
  if (d) { App._aptDate = d; loadAppointments(true); }
}

function aptFillFormLists() {
  // мастера — из сотрудников (приоритет оклейщик/тонировщик, иначе все)
  var sel = document.getElementById('apt-f-master');
  if (sel) {
    var emps = App.employees || [];
    var prev = sel.value;
    sel.innerHTML = '<option value="">— выбрать —</option>';
    var add = function(list){ list.forEach(function(e){
      var name = e['ФИО'] || e['Имя'] || '';
      if (!name) return;
      var o = document.createElement('option'); o.value = name; o.textContent = name; sel.appendChild(o);
    }); };
    var masters = emps.filter(function(e){
      var roles = (e['Основная должность'] || '') + ',' + (e['Доп. роли'] || '');
      return /оклейщик|тонировщик|мастер/i.test(roles);
    });
    add(masters.length ? masters : emps);
    sel.value = prev;
  }
  // клиенты — datalist
  var dl = document.getElementById('apt-clients-list');
  if (dl) {
    dl.innerHTML = '';
    (App.clients || []).forEach(function(c){
      var name = c['ФИО'] || c['Название организации'] || c['Имя'] || '';
      if (!name) return;
      var o = document.createElement('option'); o.value = name; dl.appendChild(o);
    });
  }
  // услуги — datalist из каталога (white-label)
  var sdl = document.getElementById('apt-services-list');
  if (sdl) {
    var svc = ((App.config && App.config.services) || []).filter(function(s){ return s.active !== false; });
    if (svc.length) sdl.innerHTML = svc.map(function(s){ return '<option value="' + s.name + '"></option>'; }).join('');
  }
}

function submitAppointment() {
  var id = document.getElementById('apt-id').value;
  var isoDate = document.getElementById('apt-f-date').value;
  var d = aptParseIso(isoDate);
  var endIso = document.getElementById('apt-f-enddate').value;
  var ed = aptParseIso(endIso);
  var startTime = document.getElementById('apt-f-time').value.trim();
  var endTime   = document.getElementById('apt-f-endtime').value.trim();
  var startDmy  = d ? aptFmtDmy(d) : '';
  var endDmy    = ed ? aptFmtDmy(ed) : startDmy;

  var effEndTime = endTime || (startTime ? aptAddMin_(startTime, 60) : '');
  // длительность из времён (для однодневной) — чтобы изменения времени отражались даже без колонок окончания
  var durMin = 60;
  if (endDmy === startDmy) {
    var sMin = aptMinutes_(startTime), eMin = aptMinutes_(effEndTime);
    if (sMin != null && eMin != null && eMin > sMin) durMin = eMin - sMin;
  }
  var payload = {
    date:     startDmy,
    time:     startTime,
    endDate:  endDmy,
    endTime:  effEndTime,
    duration: durMin,
    client:   document.getElementById('apt-f-client').value.trim(),
    phone:    document.getElementById('apt-f-phone').value.trim(),
    car:      document.getElementById('apt-f-car').value.trim(),
    service:  document.getElementById('apt-f-service').value.trim(),
    master:   document.getElementById('apt-f-master').value,
    comment:  document.getElementById('apt-f-comment').value.trim(),
  };
  var flag = function(elId, msg){
    var el = document.getElementById(elId);
    if (el) { el.focus(); el.style.outline = '2px solid var(--danger)'; setTimeout(function(){ el.style.outline = ''; }, 1800); }
    toast(msg, 'error');
  };
  if (!payload.date)   { flag('apt-f-date', 'Укажите дату'); return; }
  if (!payload.time)   { flag('apt-f-time', 'Укажите время начала'); return; }
  if (!payload.client) { flag('apt-f-client', 'Укажите клиента (обязательное поле)'); return; }
  // Окончание не раньше начала
  var sKey = payload.date.split('.').reverse().join('') + (payload.time.replace(':',''));
  var eKey = payload.endDate.split('.').reverse().join('') + (payload.endTime.replace(':',''));
  if (eKey < sKey) { toast('Окончание не может быть раньше начала', 'error'); return; }

  var btn = document.getElementById('apt-f-submit');
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  var done = function(resp){
    if (btn) btn.disabled = false;
    if (!resp || !resp.ok) { toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); if (btn) btn.textContent = id ? 'Сохранить' : 'Создать запись'; return; }
    toast(id ? 'Запись обновлена' : 'Запись создана', 'success');
    closeModal('modal-appointment');

    // Обновляем локально — БЕЗ полной перезагрузки, чтобы не терять текущий вид
    var saved = resp.data;
    App._apts = App._apts || [];
    if (id) {
      for (var i = 0; i < App._apts.length; i++) {
        if (String(App._apts[i].id) === String(id)) {
          ['date','time','endDate','endTime','duration','client','phone','car','service','master','comment'].forEach(function(k){
            if (saved && saved[k] !== undefined) App._apts[i][k] = saved[k];
          });
          break;
        }
      }
    } else if (saved) {
      App._apts.push(saved);
    }

    // Если запись в текущем периоде — просто перерисуем; иначе перейдём к её дате
    if (aptDateInView_(payload.date)) {
      aptRerender_();
      renderAptKpis_(App._apts);
    } else {
      var sd = aptParseIso(isoDate); if (sd) App._aptDate = sd;
      loadAppointments(true);
    }
  };
  var fail = function(e){ if (btn) { btn.disabled = false; btn.textContent = id ? 'Сохранить' : 'Создать запись'; } toast('Ошибка: ' + e.message, 'error'); };

  var r = google.script.run.withSuccessHandler(done).withFailureHandler(fail);
  if (id) r.updateAppointment(id, payload);
  else r.createAppointment(payload);
}

// Перерисовать записи текущего вида из App._apts (без запроса к серверу)
function aptRerender_() {
  if (App._aptView === 'week') renderAptWeek(aptWeekRange(App._aptDate));
  else if (App._aptView === 'month') renderAptMonth(aptMonthGrid(App._aptDate));
  else renderAptDayCalendar();
}

// Левая легенда услуг с выбором цвета (как «Мои календари» в Google Calendar)
function renderAptLegend() {
  var box = document.getElementById('apt-legend');
  if (!box) return;
  var svcs = ((App.config && App.config.services) || []).filter(function(s){ return s.active !== false; });
  if (!svcs.length) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="apt-legend-title">Услуги — цвета</div>' +
    svcs.map(function(s){
      var color = hex6_(s.color || serviceColor(s.name));
      return '<div class="apt-legend-item">' +
        '<input type="color" class="apt-legend-color" value="' + color + '" title="Сменить цвет услуги" onchange="aptLegendColor(\'' + String(s.code||'').replace(/'/g,"\\'") + '\', this.value)">' +
        '<span class="apt-legend-name" title="' + (s.name||'') + '">' + (s.name || '') + '</span>' +
      '</div>';
    }).join('') +
    '<div class="apt-legend-hint">Цвет услуги = цвет записи в календаре</div>';
}
// Сменить цвет услуги из легенды — мгновенно перекрасить + сохранить каталог
function aptLegendColor(code, color) {
  var svcs = (App.config && App.config.services) || [];
  var found = false;
  for (var i = 0; i < svcs.length; i++) { if (String(svcs[i].code) === String(code)) { svcs[i].color = color; found = true; break; } }
  if (!found) return;
  aptRerender_();          // мгновенно перекрасить записи
  renderAptLegend();
  var list = svcs.map(function(s){
    return { code: s.code, name: s.name, icon: s.icon, color: s.color, active: s.active,
             contractPrefix: s.contractPrefix, calcType: s.calcType, bonusPoolPct: s.bonusPoolPct, managerBonusPct: s.managerBonusPct };
  });
  google.script.run
    .withSuccessHandler(function(resp){ if (resp && resp.ok && App.config) App.config.services = resp.data.services; })
    .withFailureHandler(function(){})
    .saveServicesCatalog(list);
}

// Дата (dd.MM.yyyy) попадает в текущий просматриваемый период?
function aptDateInView_(dmy) {
  var p = String(dmy||'').split('.'); if (p.length !== 3) return true;
  var d = new Date(+p[2], +p[1]-1, +p[0]);
  if (App._aptView === 'week')  { var r = aptWeekRange(App._aptDate); return d >= r.mon && d <= r.sun; }
  if (App._aptView === 'month') { var g = aptMonthGrid(App._aptDate); return d >= g.start && d <= g.end; }
  return aptFmtDmy(App._aptDate) === dmy;   // день
}

function aptSetStatus(id, status) {
  // оптимистично
  var a = (App._apts || []).find(function(x){ return String(x.id) === String(id); });
  var prev = a ? a.status : null;
  if (a) { a.status = status; aptRerender_(); }
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) { if (a) { a.status = prev; aptRerender_(); } toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); }
    })
    .withFailureHandler(function(e){ if (a) { a.status = prev; aptRerender_(); } toast('Ошибка: ' + e.message, 'error'); })
    .setAppointmentStatus(id, status);
}

function aptDelete(id) {
  var a = (App._apts || []).find(function(x){ return String(x.id) === String(id); });
  uiConfirm('Удалить запись' + (a ? ' «' + a.client + ' ' + a.time + '»' : '') + '?', function(){
    // Оптимистично убираем ТОЛЬКО одну запись и перерисовываем — без перезагрузки грида
    App._apts = (App._apts || []).filter(function(x){ return String(x.id) !== String(id); });
    aptRerender_();
    renderAptKpis_(App._apts);
    google.script.run
      .withSuccessHandler(function(resp){
        if (!resp || !resp.ok) { toast('Ошибка: ' + (resp ? resp.error : ''), 'error'); loadAppointments(true); return; }
        toast('Запись удалена', 'success');
      })
      .withFailureHandler(function(e){ toast('Ошибка: ' + e.message, 'error'); loadAppointments(true); })
      .deleteAppointment(id);
  });
}

// Создать заказ из записи: открыть форму заказа с предзаполнением; после создания

// Работает и для физ, и для юр — тип и реквизиты подставляются автоматически.
function newOrderForClient() {

// чтобы пережить возможную асинхронную инициализацию формы).
function applyPrefillClient_(p) {

function orderFromAppointment(aptId) {
  var a = (App._apts || []).find(function(x){ return String(x.id) === String(aptId); });

  setVal('ord-client-phone', a.phone);
  setVal('ord-car', a.car);

// Заполнить все выпадающие списки услуг из каталога (white-label)
function fillServiceDropdowns() {
  var services = (App.config && App.config.services) || [];
  var active = services.filter(function(s){ return s.active !== false; });
  if (!active.length) return;

  // Форма заказа — value = код услуги
  var ord = document.getElementById('ord-service');
  if (ord) {
    var curOrd = ord.value;
    ord.innerHTML = '<option value="">— выбрать —</option>' + active.map(function(s){
      return '<option value="' + s.code + '">' + (s.icon ? s.icon + ' ' : '') + s.name + '</option>';
    }).join('');
    ord.value = curOrd;
  }

  // Доп. услуги — чекбоксы (можно выбрать несколько на одно авто)
  var extra = document.getElementById('ord-extra-services');
  if (extra) extra.innerHTML = active.map(function(s){
    return '<label class="svc-chip"><input type="checkbox" class="ord-extra-svc" value="' + s.code + '" onchange="updateOrderTintBlock_()"> ' + (s.icon ? s.icon + ' ' : '') + s.name + '</label>';
  }).join('');

  // Фильтр заказов — value = название (в заказах хранится название услуги)
  var filt = document.getElementById('orders-service-filter');
  if (filt) {
    var cur = filt.value;
    filt.innerHTML = '<option value="">Все услуги</option>' + active.map(function(s){
      return '<option value="' + s.name + '">' + s.name + '</option>';
    }).join('');

  });

  // Записи — datalist по названиям
  var apt = document.getElementById('apt-services-list');
  if (apt) apt.innerHTML = active.map(function(s){ return '<option value="' + s.name + '"></option>'; }).join('');
}

function applyBrand(brand) {
  if (!brand) return;
  App.brand = brand;
  if (brand.currency && CURRENCY_SYMBOLS[brand.currency]) CUR = CURRENCY_SYMBOLS[brand.currency];
  // Статичные подписи валюты в формах (<span class="cur">) — под выбранную валюту
  document.querySelectorAll('.cur').forEach(function(el){ el.textContent = CUR; });
  var nm = document.getElementById('brand-name');
  if (nm) nm.textContent = brand.companyName || 'SPRauto';
  var sl = document.getElementById('brand-slogan');
  if (sl) sl.textContent = brand.companySlogan || 'ERP';
  if (brand.logoDataUrl) {
    var wrap = document.getElementById('brand-logo-wrap');
    if (wrap) wrap.innerHTML = '<img class="logo-img" src="'+brand.logoDataUrl+'" alt="Logo">';
  }
  if (brand.accentColor) {
    document.documentElement.style.setProperty('--accent', brand.accentColor);
    document.documentElement.style.setProperty('--accent-soft', brand.accentColor + '20');
    document.documentElement.style.setProperty('--accent-glow', brand.accentColor + '45');
  }
  document.title = (brand.companyName || 'SPRauto') + ' ERP';
}

/* ===== КАССА ===== */
App._kassaDate = null; // 'YYYY-MM-DD' просматриваемый день (null = сегодня)

function kassaTodayIso_() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
// 'YYYY-MM-DD' → 'dd.MM.yyyy' для сервера
function kassaIsoToRu_(iso) {
  var m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? (m[3] + '.' + m[2] + '.' + m[1]) : '';
}

// Смена периода Кассы: день / диапазон
function onKassaPeriodChange() {
  var p = (document.getElementById('kassa-period') || {}).value || 'day';
  App._kassaPeriod = p;
  var dn = document.getElementById('kassa-daynav-wrap'); if (dn) dn.style.display = (p === 'day') ? 'inline-flex' : 'none';
  var rw = document.getElementById('kassa-range-wrap'); if (rw) rw.style.display = (p === 'custom') ? 'inline-flex' : 'none';
  savePeriod_('kassa');
  loadKassa(true);
}

function loadKassa(force) {
  var inp = document.getElementById('kassa-date');
  if (!App._kassaDate) App._kassaDate = kassaTodayIso_();
  if (inp && !inp.value) inp.value = App._kassaDate;
  if (inp && inp.value) App._kassaDate = inp.value;
  var ops = document.getElementById('kassa-ops');
  var period = (document.getElementById('kassa-period') || {}).value || 'day';
  App._kassaPeriod = period;
  var _dn = document.getElementById('kassa-daynav-wrap'); if (_dn) _dn.style.display = (period === 'day') ? 'inline-flex' : 'none';
  var _rw = document.getElementById('kassa-range-wrap'); if (_rw) _rw.style.display = (period === 'custom') ? 'inline-flex' : 'none';

  // ── Режим диапазона ──
  if (period !== 'day') {
    var range;
    if (period === 'custom') {
      range = { from: (document.getElementById('kassa-from') || {}).value, to: (document.getElementById('kassa-to') || {}).value };
    } else {
      var r = getPeriodRange(period);
      range = { from: r.from ? r.from.slice(0, 10) : '', to: r.to ? r.to.slice(0, 10) : '' };
    }
    if (!range.from || !range.to) { if (ops) ops.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text3)">Укажите даты периода</div>'; return; }
    if (ops && force) ops.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text3)">Загрузка...</div>';
    google.script.run
      .withSuccessHandler(function(resp){
        if (!resp || !resp.ok) { if (ops) ops.innerHTML = '<div style="text-align:center;padding:24px;color:var(--danger)">' + (resp?resp.error:'Ошибка') + '</div>'; return; }
        App._kassa = resp.data; renderKassa(resp.data);
      })
      .withFailureHandler(function(e){ if (ops) ops.innerHTML = '<div style="text-align:center;padding:24px;color:var(--danger)">' + e.message + '</div>'; })
      .getKassaRange(kassaIsoToRu_(range.from), kassaIsoToRu_(range.to));
    return;
  }

  // ── Режим одного дня ──
  if (App._kassaCache && App._kassaCache.date === App._kassaDate) { App._kassa = App._kassaCache.data; renderKassa(App._kassaCache.data); }
  else if (ops && force) ops.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text3)">Загрузка...</div>';
  var reqDate = App._kassaDate;
  google.script.run
    .withSuccessHandler(function(resp){
      if (!resp || !resp.ok) { if (!App._kassaCache && ops) ops.innerHTML = '<div style="text-align:center;padding:24px;color:var(--danger)">' + (resp?resp.error:'Ошибка') + '</div>'; return; }
      App._kassa = resp.data;
      App._kassaCache = { date: reqDate, data: resp.data };
      renderKassa(resp.data);
    })
    .withFailureHandler(function(e){ if (ops) ops.innerHTML = '<div style="text-align:center;padding:24px;color:var(--danger)">' + e.message + '</div>'; })
    .getKassa(kassaIsoToRu_(App._kassaDate));
}

function renderKassa(k) {
  App._kassaLastK = k;   // для отчёта на печать
  var set = function(id, v){ var e = document.getElementById(id); if (e) e.textContent = v; };
  var isR = !!k.isRange;
  set('kassa-balance', money(k.balanceNow));
  var sub = document.getElementById('kassa-balance-sub');
  if (sub) sub.textContent = k.startDate ? ('учёт с ' + k.startDate) : 'начальный остаток не задан — нажмите «Пересчёт»';
  set('kassa-opening', money(k.opening));
  set('kassa-daynet',  (k.dayNet >= 0 ? '+' : '') + money(k.dayNet));
  set('kassa-beznal',  money(k.dayBeznal));
  set('kassa-closing', money(k.closing));
  // Метки: «за день» ↔ «за период»
  var w = isR ? 'период' : 'день';
  set('kassa-lbl-opening', 'Было на начало ' + (isR ? 'периода' : 'дня'));
  set('kassa-lbl-net',     'Касса за ' + w);
  set('kassa-lbl-beznal',  'Безнал за ' + w);
  set('kassa-lbl-closing', 'Итого на конец ' + (isR ? 'периода' : 'дня'));
  set('kassa-ops-title',   'Операции за ' + w);

  renderKassaReconcile_(k, isR);

  var ops = document.getElementById('kassa-ops');
  if (ops) {
    var opsHtml = (!k.operations || !k.operations.length)
      ? '<div style="text-align:center;padding:24px;color:var(--text3)">Нет операций за ' + (isR ? 'период' : 'этот день') + '</div>'
      : k.operations.map(function(op){
          var cls = op.type === 'расход' ? 'kassa-op-out' : (op.type === 'безнал' ? 'kassa-op-bn' : 'kassa-op-in');
          var amt = (op.type === 'расход' ? '−' : (op.type === 'безнал' ? '' : '+')) + money(op.amount);
          var del = op.expenseId ? '<button class="kassa-op-del" title="Удалить расход" onclick="deleteKassaExpense(\'' + op.expenseId + '\')">✕</button>' : '';
          var when = (isR && op.date ? op.date + ' ' : '') + (op.time || '');
          return '<div class="kassa-op ' + cls + '">' +
            '<span class="kassa-op-time">' + when + '</span>' +
            '<span class="kassa-op-desc">' + (op.type === 'безнал' ? 'БЕЗНАЛ · ' : '') + escapeHtml_(op.desc || '') + '</span>' +
            '<span class="kassa-op-amt">' + amt + '</span>' + del +
          '</div>';
        }).join('');
    ops.innerHTML = opsHtml + kassaOpsTotal_(k, isR);
  }
  // Текст отчёта для Telegram — только в режиме одного дня
  var ta = document.getElementById('kassa-report');
  if (isR) { if (ta) ta.value = 'Отчёт для Telegram доступен в режиме «День».'; return; }
  google.script.run.withSuccessHandler(function(r){
    if (ta && r && r.ok) ta.value = r.data.text || '';
  }).getKassaReportText(kassaIsoToRu_(App._kassaDate));
}

function escapeHtml_(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

// Подытог под списком операций кассы: приход − расход = итог (+ безнал справочно)
function kassaOpsTotal_(k, isR) {
  var f = function(n){ return (Math.round((Number(n)||0)*100)/100).toLocaleString('ru') + ' ' + CUR; };
  var row = function(label, val, color){
    return '<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0">' +
      '<span style="color:var(--text2)">' + label + '</span>' +
      '<span style="font-weight:700;font-variant-numeric:tabular-nums' + (color?';color:'+color:'') + '">' + val + '</span></div>';
  };
  var net = Number(k.dayNet) || 0;
  return '<div style="border-top:2px solid var(--border);margin-top:10px;padding-top:8px">' +
    row('Приход наличными', '+' + f(k.dayIn), 'var(--success)') +
    row('Расход наличными', '−' + f(k.dayOut), 'var(--danger)') +
    (Number(k.dayBeznal) > 0 ? row('Безнал (справочно)', f(k.dayBeznal), 'var(--text3)') : '') +
    '<div style="border-top:1px solid var(--border);margin:4px 0"></div>' +
    row('Итого наличными за ' + (isR ? 'период' : 'день'), (net>=0?'+':'') + f(net), net>=0?'var(--success)':'var(--danger)') +
  '</div>';
}

// Печатный отчёт по кассе (с водяным знаком логотипа) — перед изъятием наличных владельцем
function printKassaReport_() {
  var k = App._kassaLastK;
  if (!k) { toast('Сначала откройте кассу', 'error'); return; }
  var brand = App.brand || {};
  var logo = brand.logoDataUrl || '';
  var f = function(n){ return (Math.round((Number(n)||0)*100)/100).toLocaleString('ru') + ' ' + CUR; };
  var ops = k.operations || [];
  var rows = ops.map(function(op){
    var when = (op.date ? op.date + ' ' : '') + (op.time || '');
    var isOut = op.type === 'расход', isBn = op.type === 'безнал';
    var amt = (isOut ? '−' : (isBn ? '' : '+')) + f(op.amount);
    var color = isOut ? '#c0392b' : (isBn ? '#4f46e5' : '#1e7e34');
    return '<tr><td>' + when + '</td><td>' + (isBn ? 'Безнал · ' : '') + escapeHtml_(op.desc || '') + '</td>' +
      '<td style="text-align:right;color:' + color + '">' + amt + '</td></tr>';
  }).join('') || '<tr><td colspan="3" style="text-align:center;color:#777">Операций нет</td></tr>';
  // Период — по выбранным датам, формат ДД.ММ.ГГГГ (без объектов даты и таймзон)
  var fmtD = function(v){
    if (!v) return '';
    var m = String(v).match(/(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[3] + '.' + m[2] + '.' + m[1];

    return p(d.getDate()) + '.' + p(d.getMonth()+1) + '.' + d.getFullYear();
  };

// Сверка наличных за период: поступило = осело в кассе + изъято + прочие расходы
function renderKassaReconcile_(k, isR) {
  var box = document.getElementById('kassa-reconcile');
  if (!box) return;
  var f = function(n){ return (Math.round((Number(n)||0)*100)/100).toLocaleString('ru') + ' ' + CUR; };
  var inSum  = Number(k.dayIn) || 0;                 // поступило наличными за период
  var outSum = Number(k.dayOut) || 0;                // все нал-расходы за период
  var net    = Number(k.closing) - Number(k.opening); // осело в кассе (кон − нач)
  // Изъятия — из операций (категория «Изъятие владельца»)
  var withdrawals = 0;
  (k.operations || []).forEach(function(op){
    if (op.type === 'расход' && /изъят/i.test(String(op.category || op.desc || ''))) withdrawals += Number(op.amount) || 0;
  });
  var other = Math.round((outSum - withdrawals) * 100) / 100;   // прочие нал-расходы (авансы и т.п.)
  var diff  = Math.round((inSum - (net + withdrawals + other)) * 100) / 100;  // должно быть 0
  var ok = Math.abs(diff) < 0.5;
  var w1 = isR ? 'период' : 'день';
  var row = function(label, val, color){
    return '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px">' +
      '<span style="color:var(--text2)">' + label + '</span>' +
      '<span style="font-weight:600;font-variant-numeric:tabular-nums' + (color?';color:'+color:'') + '">' + val + '</span></div>';
  };
  box.innerHTML =
    '<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;max-width:560px">' +
      '<div style="font-weight:600;margin-bottom:8px">🧮 Сверка наличных за ' + w1 + '</div>' +
      row('Поступило наличными', f(inSum), 'var(--success)') +
      '<div style="border-top:1px solid var(--border);margin:6px 0"></div>' +
      row('→ осело в кассе (кон − нач)', f(net), '') +
      row('→ изъято владельцем', f(withdrawals), '') +
      row('→ прочие нал-расходы (авансы…)', f(other), '') +
      '<div style="border-top:1px solid var(--border);margin:6px 0"></div>' +
      '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:13px;font-weight:700">' +
        '<span>' + (ok ? '✅ Сходится' : '⚠ Расхождение') + '</span>' +
        '<span style="color:' + (ok ? 'var(--success)' : 'var(--danger)') + '">' + (ok ? f(inSum) + ' = ' + f(net + withdrawals + other) : f(diff)) + '</span>' +
      '</div>' +
      '<div style="font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5">Все наличные из оплат за ' + w1 + ' либо остались в кассе, либо изъяты, либо ушли на расходы. Если «расхождение» ≠ 0 — где-то нал не проведён.</div>' +
    '</div>';
}
