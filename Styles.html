<style>
/* ============================================
   SPRauto ERP — финальные стили v2.1
   ============================================ */

:root {
  --accent:     #00B8D4;
  --accent-2:   #E8572A;
  --accent-soft:rgba(0,184,212,0.12);
  --accent-glow:rgba(0,184,212,0.28);
  --green:  #2ECC71; --green-soft: rgba(46,204,113,0.12);
  --red:    #E74C3C; --red-soft:   rgba(231,76,60,0.12);
  --yellow: #F39C12; --yellow-soft:rgba(243,156,18,0.12);
  --blue:   #3498DB; --blue-soft:  rgba(52,152,219,0.12);
  --purple: #9B59B6; --purple-soft:rgba(155,89,182,0.12);
  /* Семантические алиасы (используются в Scripts.html) */
  --success: #2ECC71; --danger: #E74C3C; --warning: #F39C12;
  --t: all 0.22s cubic-bezier(.4,0,.2,1);
}

[data-theme="dark"] {
  color-scheme: dark;   /* нативные элементы (календарь, счётчики, скроллбар) в тёмной гамме */
  --bg:      #0A0E14; --bg-card: #121821; --bg-card2: #1A2230;
  --bg-hover:#1F2A3C; --border:  rgba(255,255,255,.07);
  --border-h:rgba(0,184,212,.35);
  --text:    #EDF2F7; --text2:   #8896A8; --text3: #4E5E72;
  --nav-bg:  rgba(10,14,20,.96);
  --shadow:  0 4px 24px rgba(0,0,0,.45);
  --shadow-s:0 2px 10px rgba(0,0,0,.3);
  --inp:     #0D131C; --scroll:  #243040;
  --row-alt:   rgba(255,255,255,.025);   /* чередование строк (зебра) */
  /* Заливка строк заказов (тёмная тема) */
  --row-paid:  rgba(46,204,113,.12);
  --row-otsr:  rgba(243,156,18,.10);
  --row-rass:  rgba(52,152,219,.10);
  --row-legal: rgba(155,89,182,.10);
  --row-debt:  rgba(231,76,60,.08);
}
[data-theme="light"] {
  color-scheme: light;
  --bg:      #F2F5FA; --bg-card: #FFFFFF; --bg-card2: #F8FAFB;
  --bg-hover:#EBF0F7; --border:  rgba(15,35,65,.09);
  --border-h:rgba(0,184,212,.45);
  --text:    #0B1929; --text2:   #556070; --text3: #9AAAB8;
  --nav-bg:  rgba(242,245,250,.96);
  --shadow:  0 4px 24px rgba(0,0,0,.08);
  --shadow-s:0 2px 10px rgba(0,0,0,.05);
  --inp:     #EBF0F7; --scroll:  #D4DCE8;
  --row-alt:   rgba(15,35,65,.028);   /* чередование строк (зебра) — светло-серый */
  /* Заливка строк заказов (светлая тема) */
  --row-paid:  rgba(46,204,113,.15);
  --row-otsr:  rgba(243,156,18,.13);
  --row-rass:  rgba(52,152,219,.13);
  --row-legal: rgba(155,89,182,.12);
  --row-debt:  rgba(231,76,60,.10);
}

/* ── Подсветка строк таблицы заказов (контроль дебиторки) ── */
#orders-table tbody tr.row-paid  td { background: var(--row-paid)  !important; }
#orders-table tbody tr.row-otsr  td { background: var(--row-otsr); }
#orders-table tbody tr.row-rass  td { background: var(--row-rass); }
#orders-table tbody tr.row-legal td { background: var(--row-legal); }
#orders-table tbody tr.row-debt  td { background: var(--row-debt); }
#orders-table tbody tr.row-otsr  td:first-child  { box-shadow: inset 4px 0 0 var(--warning); }
#orders-table tbody tr.row-rass  td:first-child  { box-shadow: inset 4px 0 0 var(--blue); }
#orders-table tbody tr.row-legal td:first-child  { box-shadow: inset 4px 0 0 var(--purple); }
#orders-table tbody tr.row-debt  td:first-child  { box-shadow: inset 4px 0 0 var(--danger); }
#orders-table tbody tr.row-paid  td:first-child  { box-shadow: inset 4px 0 0 var(--success); }
/* Проверенный заказ — зеленоватый слой поверх любого тона строки + зелёная метка справа.
   Работает на обеих таблицах (Заказы и Дашборд) и в светлой/тёмной теме (тон-оверлей не зависит от фона). */
#orders-table tbody tr.row-verified td,
#dash-orders-table tbody tr.row-verified td {
  background-image: linear-gradient(rgba(16,185,129,.16), rgba(16,185,129,.16)) !important;
}
#orders-table tbody tr.row-verified td:last-child,
#dash-orders-table tbody tr.row-verified td:last-child {
  box-shadow: inset -4px 0 0 var(--success);
}

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  font-family:'Manrope',sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; font-size:13px; line-height:1.5;
  transition:background .3s, color .3s;
}
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-thumb { background:var(--scroll); border-radius:3px; }

/* ===== FAB ===== */
.fab-wrap {
  position:fixed; right:28px; bottom:28px;
  z-index:300; display:flex; flex-direction:column;
  align-items:center; gap:6px;
}
.fab-main {
  width:56px; height:56px; border-radius:50%;
  background:var(--accent-2); color:white;
  border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 20px rgba(232,87,42,.45);
  transition:var(--t);
}
.fab-main:hover { transform:scale(1.1) translateY(-2px); box-shadow:0 10px 28px rgba(232,87,42,.55); }
.fab-label {
  font-size:10px; font-weight:700;
  color:var(--accent-2); background:var(--bg-card);
  padding:3px 8px; border-radius:20px;
  box-shadow:var(--shadow-s); white-space:nowrap;
}

/* ===== SIDEBAR ===== */
.sidebar {
  position:fixed; left:0; top:0; bottom:0; width:220px;
  background:var(--nav-bg); border-right:1px solid var(--border);
  backdrop-filter:blur(14px); z-index:100;
  display:flex; flex-direction:column;
}
.sidebar-logo {
  padding:16px 18px 14px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:11px;
}
.logo-img { width:56px; height:56px; border-radius:50%; object-fit:contain; flex-shrink:0; filter:drop-shadow(0 0 8px rgba(0,184,212,.35)); }
.logo-text { font-family:'Unbounded',sans-serif; font-size:13px; font-weight:700; color:var(--text); }
.logo-sub { font-size:9px; font-weight:600; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-top:2px; }
.nav-section { padding:12px 10px; flex:1; overflow-y:auto; }
.nav-label { font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text3); padding:0 8px; margin:14px 0 4px; }
.nav-label:first-child { margin-top:0; }
.nav-item {
  display:flex; align-items:center; gap:10px;
  padding:8px 10px; border-radius:8px; cursor:pointer;
  transition:var(--t); color:var(--text2);
  font-size:12.5px; font-weight:500;
  text-decoration:none; margin-bottom:1px;
  border:1px solid transparent; position:relative;
}
.nav-item:hover { background:var(--bg-hover); color:var(--text); }
.nav-item.active { background:var(--accent-soft); color:var(--accent); border-color:var(--accent-glow); box-shadow:inset 2px 0 0 var(--accent); }
.nav-icon { width:15px; height:15px; flex-shrink:0; }
.nav-badge { margin-left:auto; background:var(--accent); color:white; font-size:9px; font-weight:700; padding:1px 6px; border-radius:20px; }
.nav-badge-red { background:var(--red) !important; }
.sidebar-footer { padding:12px 10px; border-top:1px solid var(--border); }
.theme-toggle { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:8px; cursor:pointer; border:1px solid var(--border); background:var(--bg-card2); color:var(--text2); font-size:11.5px; font-weight:500; transition:var(--t); width:100%; }
.theme-toggle:hover { border-color:var(--border-h); color:var(--text); }
.toggle-track { width:30px; height:17px; background:var(--text3); border-radius:9px; position:relative; margin-left:auto; transition:var(--t); }
[data-theme="light"] .toggle-track { background:var(--accent); }
.toggle-knob { position:absolute; top:2px; left:2px; width:13px; height:13px; background:white; border-radius:50%; transition:var(--t); box-shadow:0 1px 3px rgba(0,0,0,.3); }
[data-theme="light"] .toggle-knob { transform:translateX(13px); }

/* ===== MAIN ===== */
.main { margin-left:220px; min-height:100vh; }
.topbar {
  position:sticky; top:0; z-index:50;
  background:var(--nav-bg); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:0 24px; height:56px;
  display:flex; align-items:center; justify-content:space-between;
}
.topbar-left { display:flex; align-items:center; gap:14px; }
.page-title { font-family:'Unbounded',sans-serif; font-size:14px; font-weight:600; }
.topbar-sync { font-size:11px; color:var(--text3); display:flex; align-items:center; gap:5px; }
.sync-dot { width:6px; height:6px; background:var(--green); border-radius:50%; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.topbar-right { display:flex; align-items:center; gap:8px; }
.currency-badge { display:inline-flex; align-items:center; gap:4px; padding:5px 9px; border-radius:7px; background:var(--bg-card2); border:1px solid var(--border); font-size:11px; font-weight:700; color:var(--text2); cursor:pointer; transition:var(--t); }
.currency-badge:hover { border-color:var(--border-h); color:var(--accent); }

/* ===== КНОПКИ ===== */
.btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:8px; font-family:'Manrope',sans-serif; font-size:12px; font-weight:600; cursor:pointer; transition:var(--t); border:none; }
.btn-primary { background:var(--accent); color:white; }
.btn-primary:hover { transform:translateY(-1px); box-shadow:0 4px 14px var(--accent-glow); }
.btn-primary:disabled { opacity:.6; cursor:not-allowed; transform:none; }
.btn-ghost { background:var(--bg-card2); color:var(--text2); border:1px solid var(--border); }
.btn-ghost:hover { border-color:var(--border-h); color:var(--text); }
.btn-secondary { background:var(--bg-card2); color:var(--text2); border:1px solid var(--border); }
.btn-secondary:hover { border-color:var(--border-h); color:var(--text); }
.btn-sm { padding:5px 10px; font-size:11px; }
.btn-green { background:var(--green); color:white; }
.btn-green:hover { background:#27AE60; }

/* Яркая CTA-кнопка (например «+ Новый заказ» на дашборде) */
.btn-cta {
  display:inline-flex; align-items:center; gap:7px;
  height:38px; padding:0 16px; border-radius:8px; border:none; cursor:pointer;
  font-family:'Manrope',sans-serif; font-size:13px; font-weight:700; letter-spacing:.01em;
  color:#fff; white-space:nowrap;
  background:var(--accent);
  transition:var(--t);
}
.btn-cta:hover {
  transform:translateY(-1px);
  box-shadow:0 4px 14px var(--accent-glow);
}
.btn-cta:active { transform:translateY(0); box-shadow:none; }
.btn-cta .cta-plus {
  display:inline-flex; align-items:center; justify-content:center;
  width:18px; height:18px; border-radius:50%;
  background:rgba(255,255,255,.22); font-size:14px; font-weight:700; line-height:1;
}

/* ===== ЗАГРУЗЧИК ===== */
.app-loading { position:fixed; inset:0; z-index:500; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
.app-loading.hidden { display:none; pointer-events:none; }
.app-loading { pointer-events:none; } /* никогда не блокирует клики даже если анимация висит */
@keyframes pulse-logo { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
.app-loading-text { font-family:'Unbounded',sans-serif; font-size:13px; font-weight:600; color:var(--text3); }
.app-loading-bar { width:200px; height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
.app-loading-progress { height:100%; width:0; background:var(--accent); border-radius:2px; animation:load-bar 2.5s ease-in-out forwards; }
@keyframes load-bar { 0%{width:0} 40%{width:50%} 80%{width:80%} 100%{width:95%} }

/* ===== СКЕЛЕТОН ===== */
.kpi-skeleton, .list-skeleton {
  background:linear-gradient(90deg,var(--bg-card) 25%,var(--bg-card2) 50%,var(--bg-card) 75%);
  background-size:200% 100%; border-radius:13px; animation:shimmer 1.5s infinite;
}
.kpi-skeleton { min-height:110px; }
.list-skeleton { height:52px; margin:0 0 1px; border-radius:0; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ===== КОНТЕНТ ===== */
.content { padding:22px 24px; }
.page { display:none; }
.page.active { display:block; }
.section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:12px; flex-wrap:wrap; }
.section-title { font-family:'Unbounded',sans-serif; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--text3); }
.section-title-big { font-family:'Unbounded',sans-serif; font-size:18px; font-weight:700; letter-spacing:-.01em; }
.period-tabs { display:flex; gap:2px; padding:3px; background:var(--bg-card2); border-radius:8px; }
.period-tab { padding:5px 11px; border-radius:6px; border:none; font-family:'Manrope',sans-serif; font-size:11.5px; font-weight:600; cursor:pointer; color:var(--text3); background:transparent; transition:var(--t); }
.period-tab.active { background:var(--bg-card); color:var(--text); box-shadow:var(--shadow-s); }

/* ===== KPI ===== */
.kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
.kpi-card { background:var(--bg-card); border:1px solid var(--border); border-radius:13px; padding:18px; transition:var(--t); position:relative; overflow:hidden; }
.kpi-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--accent); opacity:0; transition:opacity .2s; }
.kpi-card:hover { border-color:var(--border-h); transform:translateY(-2px); box-shadow:var(--shadow-s); }
.kpi-card:hover::before { opacity:1; }
.kpi-label { font-size:10.5px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.06em; margin-bottom:9px; }
.kpi-value { font-family:'Unbounded',sans-serif; font-size:24px; font-weight:700; line-height:1; letter-spacing:-.02em; }
.kpi-sub { font-size:11px; color:var(--text2); margin-top:6px; }

/* ===== БЫСТРЫЕ ДЕЙСТВИЯ ===== */
.quick-actions { margin-bottom:22px; }
.quick-actions-title { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--text3); margin-bottom:10px; }
.quick-actions-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.qa-btn { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:16px 14px; cursor:pointer; transition:var(--t); text-align:left; display:flex; flex-direction:column; gap:4px; }
.qa-btn:hover { border-color:var(--border-h); transform:translateY(-2px); box-shadow:var(--shadow-s); }
.qa-btn-primary { background:linear-gradient(135deg, rgba(232,87,42,.15), rgba(232,87,42,.05)); border-color:rgba(232,87,42,.3); }
.qa-btn-primary:hover { border-color:var(--accent-2); box-shadow:0 4px 16px rgba(232,87,42,.2); }
.qa-icon { font-size:22px; margin-bottom:4px; }
.qa-label { font-size:12.5px; font-weight:700; color:var(--text); }
.qa-sub { font-size:10.5px; color:var(--text2); }

/* ===== АЛЕРТ ===== */
.alert { display:flex; align-items:flex-start; gap:11px; padding:12px 16px; border-radius:10px; margin-bottom:14px; font-size:12.5px; border:1px solid; line-height:1.5; }
.alert-red { background:var(--red-soft); border-color:rgba(231,76,60,.2); color:var(--red); }
.alert-blue { background:var(--blue-soft); border-color:rgba(52,152,219,.2); color:var(--blue); }

/* ===== СОТРУДНИКИ ===== */
.team-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
.team-card { background:var(--bg-card); border:1px solid var(--border); border-radius:13px; padding:18px; transition:var(--t); position:relative; }
.team-card:hover { border-color:var(--border-h); box-shadow:var(--shadow-s); }
.team-head { display:flex; align-items:center; gap:12px; margin-bottom:12px; padding-right:80px; }
.team-avatar { width:48px; height:48px; border-radius:50%; background:var(--accent-soft); border:2px solid var(--accent-glow); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; color:var(--accent); flex-shrink:0; }
.team-name { font-size:14px; font-weight:700; margin-bottom:2px; word-break:break-word; }
.team-role { font-size:11px; color:var(--text3); }
.team-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
.team-stat { padding:8px 10px; background:var(--bg-card2); border-radius:8px; border:1px solid var(--border); }
.team-stat-label { font-size:9.5px; color:var(--text2); text-transform:uppercase; letter-spacing:.06em; }
.team-stat-value { font-size:15px; font-weight:700; font-family:'Unbounded',sans-serif; margin-top:2px; }
.team-status { position:absolute; top:14px; right:14px; padding:2px 9px; border-radius:20px; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
.status-work { background:var(--green-soft); color:var(--green); }
.status-off { background:var(--bg-card2); color:var(--text3); }
.status-vacation { background:var(--yellow-soft); color:var(--yellow); }

/* ===== МОДАЛКИ ===== */
.modal-dialog-bg { display:none; }
.modal-dialog-bg.open { display:flex; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; width:100%; max-height:88vh; overflow-y:auto; animation:slideUp .22s; }
@keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.modal-header { padding:20px 22px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:var(--bg-card); z-index:5; }
.modal-title { font-family:'Unbounded',sans-serif; font-size:14px; font-weight:700; }
.modal-close { width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--bg-card2); color:var(--text2); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; transition:var(--t); }
.modal-close:hover { color:var(--text); border-color:var(--border-h); }
.modal-body { padding:20px 22px; }
.modal-footer { padding:16px 22px 20px; display:flex; gap:8px; justify-content:flex-end; border-top:1px solid var(--border); background:var(--bg-card2); position:sticky; bottom:0; }

/* ===== ФОРМА ===== */
.form-row { margin-bottom:14px; }
.form-label { display:block; font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px; }
.form-input, .form-select { width:100%; padding:10px 13px; background:var(--inp); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'Manrope',sans-serif; font-size:13px; outline:none; transition:var(--t); }
.form-input::placeholder { color:var(--text3); }
.form-input:focus, .form-select:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.form-section-title { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text2); margin:16px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
.ctype-btn { padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text2); font-size:13px; font-weight:600; cursor:pointer; transition:var(--t); font-family:inherit; flex:1; text-align:center; }
.ctype-btn:hover { background:var(--bg-hover); }
.ctype-btn.active { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }

/* ===== НАСТРОЙКИ ===== */
.settings-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; }
.settings-card { background:var(--bg-card); border:1px solid var(--border); border-radius:13px; padding:20px; }
.settings-card-title { font-family:'Unbounded',sans-serif; font-size:13px; font-weight:700; margin-bottom:4px; }
.settings-card-desc { font-size:11.5px; color:var(--text3); margin-bottom:18px; }
.logo-upload-zone { border:2px dashed var(--border); border-radius:9px; padding:20px; text-align:center; cursor:pointer; transition:var(--t); }
.logo-upload-zone:hover { border-color:var(--accent); background:var(--accent-soft); }

/* ===== ЗАГЛУШКИ ===== */
.stub-page { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:calc(100vh - 120px); text-align:center; color:var(--text3); }
.stub-icon { font-size:52px; margin-bottom:14px; opacity:.5; }
.stub-title { font-family:'Unbounded',sans-serif; font-size:18px; font-weight:700; color:var(--text2); margin-bottom:8px; }
.stub-desc { font-size:13px; max-width:340px; line-height:1.6; }

/* ===== ТОСТ ===== */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:12px 20px; box-shadow:var(--shadow); z-index:400; opacity:0; pointer-events:none; transition:all .25s; font-size:13px; font-weight:600; max-width:380px; white-space:nowrap; }
.toast.show { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
.toast.success { border-color:var(--green); color:var(--green); }
.toast.error { border-color:var(--red); color:var(--red); }
.toast.info { border-color:var(--accent); color:var(--accent); }

/* ===== БЕЙДЖИ ===== */
.badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
.badge-gray { background:var(--bg-card2); color:var(--text2); }
.badge-blue { background:var(--blue-soft); color:var(--blue); }
.badge-fiz  { background:var(--blue-soft); color:var(--blue); }
.badge-yur  { background:var(--accent-soft); color:var(--accent); }

/* ===== КАРТОЧКА КЛИЕНТА ===== */
.client-card-header { display:flex; align-items:center; gap:16px; margin-bottom:20px; }
.card-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:16px; }
.info-card { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:16px; }
.info-card-title { font-weight:700; font-size:13px; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; margin-bottom:12px; }
.info-row { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; padding:6px 0; border-bottom:1px solid var(--border); }
.info-row:last-child { border-bottom:none; }
.info-label { color:var(--text3); font-size:12px; flex-shrink:0; }
.info-value { font-weight:600; font-size:13px; text-align:right; }
.vehicles-list { display:flex; flex-direction:column; gap:8px; }
.vehicle-item { background:var(--bg-card2); border-radius:8px; padding:10px 12px; border:1px solid var(--border); }

/* ===== КЛИЕНТЫ: ТУЛБАР ===== */
.clients-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.search-wrap { position:relative; flex:1; min-width:200px; }
.search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text3); pointer-events:none; }
.search-input { width:100%; background:var(--inp); border:1px solid var(--border); border-radius:8px; padding:8px 12px 8px 34px; color:var(--text); font-size:13px; font-family:inherit; transition:border-color .2s; }
.search-input:focus { outline:none; border-color:var(--accent); }
.filter-tabs { display:flex; gap:4px; }
.filter-tab { padding:7px 14px; border-radius:7px; border:1px solid var(--border); background:transparent; color:var(--text2); font-size:12px; font-weight:600; cursor:pointer; transition:var(--t); font-family:inherit; }
.filter-tab:hover { background:var(--bg-hover); }
.filter-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.pay-del { border:none; background:var(--red-soft); color:var(--danger); width:20px; height:20px; border-radius:5px; font-size:11px; line-height:1; cursor:pointer; padding:0; flex:0 0 auto; }
.pay-del:hover { filter:brightness(1.1); }
/* кнопка «Проверено» в таблице заказов */
.ver-btn { border:1px solid var(--border); border-radius:6px; cursor:pointer; font-weight:700; line-height:1; padding:3px 8px; font-size:11px; transition:var(--t); }
.ver-on  { background:var(--green-soft); color:var(--success); border-color:rgba(46,204,113,.35); width:26px; height:24px; padding:0; }
.ver-off { background:var(--bg-card2); color:var(--text3); font-weight:600; }
.ver-off:hover { color:var(--success); border-color:rgba(46,204,113,.35); }
/* ресайз и видимые границы столбцов */
.resizable-table th, .resizable-table td { border-right:1px solid var(--border); }
.resizable-table th:last-child, .resizable-table td:last-child { border-right:none; }
.col-resizer { position:absolute; top:0; right:0; width:7px; height:100%; cursor:col-resize; user-select:none; z-index:2; }
.col-resizer:hover { background:var(--accent); opacity:.4; }
#orders-table-wrap, #dash-orders-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
/* раскрытие расхода плёнки в строке заказа */
.film-toggle { border:none; background:none; color:var(--text3); cursor:pointer; font-size:12px; padding:0 5px 0 0; transition:transform .15s; display:inline-block; }
.film-toggle.open { transform:rotate(90deg); color:var(--accent); }
.film-detail-row td { background:var(--bg-card2); border-bottom:1px solid var(--border); }
.film-detail { padding:10px 16px; }
.film-detail-title { font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:.05em; margin-bottom:7px; font-weight:600; }
.film-table { width:auto; min-width:420px; border-collapse:collapse; font-size:12px; }
.film-table th { text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text3); padding:3px 14px 5px 0; font-weight:600; }
.film-table td { padding:3px 14px 3px 0; color:var(--text2); }
.film-table .film-total td { border-top:1px solid var(--border); padding-top:6px; font-weight:700; color:var(--text); }
.inline-cols { display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start; }
.inline-cols > div { flex:1 1 320px; min-width:300px; }
.inline-foot { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:10px; padding-top:8px; border-top:1px solid var(--border); }
/* редактируемый блок «Клиент и автомобиль» в карточке */
.cardveh-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; }
.cardveh-field { display:flex; flex-direction:column; gap:2px; }
.cardveh-field label { font-size:11.5px; color:var(--text2); font-weight:500; }
.cardveh-field input { padding:5px 8px; border:1px solid var(--border); border-radius:6px; background:var(--inp); color:var(--text); font-size:13px; }
.cardveh-field input:focus { border-color:var(--accent); outline:none; }
.cardveh-dates { display:grid; grid-template-columns:1fr 1fr; gap:6px 8px; }
.cardveh-wide { grid-column:1 / -1; }
.cardveh-field textarea { padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:var(--inp); color:var(--text); font-size:13px; font-family:inherit; resize:vertical; line-height:1.4; }
.cardveh-field textarea:focus { border-color:var(--accent); outline:none; }
.cardveh-dates input { padding:5px 4px; font-size:12px; }
.tab-cnt { display:inline-block; min-width:16px; padding:0 5px; margin-left:2px; border-radius:9px; background:var(--bg-hover); color:var(--text2); font-size:10.5px; font-weight:700; line-height:16px; text-align:center; vertical-align:middle; }
.filter-tab.active .tab-cnt { background:rgba(255,255,255,.25); color:#fff; }

/* ===== ПЕРЕКЛЮЧАТЕЛЬ ВИДА ===== */
.view-toggle { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0; }
.view-btn { background:none; border:none; padding:7px 10px; cursor:pointer; color:var(--text3); display:flex; align-items:center; transition:var(--t); }
.view-btn:hover { background:var(--bg-hover); color:var(--text2); }
.view-btn.active { background:var(--accent-soft); color:var(--accent); }
.view-btn + .view-btn { border-left:1px solid var(--border); }

/* ===== КЛИЕНТЫ: KPI ряд ===== */
.clients-kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
.clients-kpi-card { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:12px 16px; }
.clients-kpi-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:6px; }
.clients-kpi-val { font-size:22px; font-weight:700; color:var(--text); line-height:1; }

/* ===== КЛИЕНТЫ: ВИД КАРТОЧКИ ===== */
.clients-list { display:flex; flex-direction:column; gap:6px; }
.client-row { display:flex; align-items:center; gap:14px; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; cursor:pointer; transition:var(--t); }
.client-row:hover { border-color:var(--border-h); background:var(--bg-hover); }
.client-info { flex:1; min-width:0; }
.client-name { font-weight:600; font-size:14px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.client-meta { display:flex; gap:12px; margin-top:3px; font-size:12px; color:var(--text3); }
.client-stats { display:flex; gap:20px; flex-shrink:0; }
.client-stat { text-align:center; }
.client-stat-val { font-weight:700; font-size:15px; }
.client-stat-lbl { font-size:11px; color:var(--text3); margin-top:1px; }
.client-arrow { color:var(--text3); font-size:20px; flex-shrink:0; }

/* ===== КЛИЕНТЫ: ВИД ТАБЛИЦА ===== */
.clients-table-wrap { border:1px solid var(--border); border-radius:12px; overflow:hidden; }
#orders-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.clients-table { width:100%; border-collapse:collapse; font-size:13px; table-layout:fixed; }
.clients-table thead th { background:var(--bg-card2); color:var(--text3); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:9px 12px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; overflow:hidden; }
.clients-table thead th[onclick] { cursor:pointer; }
.clients-table thead th[onclick]:hover { color:var(--text2); }
.ct-sort-icon { opacity:.5; font-size:11px; margin-left:3px; }
.ct-sort-icon.active { opacity:1; color:var(--accent); }
.clients-table tbody tr { border-bottom:1px solid var(--border); transition:background .12s; cursor:pointer; }
.clients-table tbody tr:last-child { border-bottom:none; }
.clients-table tbody tr:hover { background:var(--bg-hover); }
.clients-table tbody td { padding:10px 12px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle; }
.ct-col-name    { width:22%; }
.ct-col-type    { width:9%; }
.ct-col-phone   { width:14%; }
.ct-col-auto    { width:15%; }
.ct-col-source  { width:11%; }
.ct-col-orders  { width:8%; }
.ct-col-sum     { width:13%; }
.ct-col-actions { width:8%; }
.ct-name-cell { display:flex; align-items:center; gap:9px; }
.ct-avatar { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
.ct-av-fiz { background:var(--blue-soft); color:var(--blue); }
.ct-av-yur { background:var(--accent-soft); color:var(--accent); }
.ct-client-name { font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ct-actions { display:flex; gap:4px; justify-content:flex-end; opacity:0; transition:opacity .15s; }
.clients-table tbody tr:hover .ct-actions { opacity:1; }
.ct-action-btn { background:none; border:1px solid var(--border); border-radius:6px; padding:4px 7px; cursor:pointer; color:var(--text3); font-size:12px; transition:var(--t); }
.ct-action-btn:hover { border-color:var(--border-h); color:var(--text); background:var(--bg-card); }
.ct-footer { background:var(--bg-card2); border-top:1px solid var(--border); padding:9px 14px; font-size:12px; color:var(--text3); }
.ct-empty { text-align:center; padding:60px 20px; color:var(--text3); }
.ct-empty-icon { font-size:44px; margin-bottom:12px; }
.ct-empty-title { font-size:15px; font-weight:600; color:var(--text2); }
.ct-empty-sub { font-size:13px; margin-top:6px; }
.ct-loading { padding:8px; }

/* ===== АДАПТИВ ===== */
@media (max-width:1200px) {
  .kpi-grid { grid-template-columns:repeat(2,1fr); }
  .quick-actions-grid { grid-template-columns:repeat(2,1fr); }
  .clients-kpi-row { grid-template-columns:1fr 1fr; }
}
@media (max-width:768px) {
  .sidebar { width:60px; }
  .sidebar-logo { padding:12px 10px; justify-content:center; }
  .logo-text,.logo-sub,.nav-item span,.nav-label { display:none; }
  .nav-item { justify-content:center; padding:9px; }
  .main { margin-left:60px; }
  .kpi-grid { grid-template-columns:1fr 1fr; }
  .quick-actions-grid { grid-template-columns:1fr 1fr; }
  .fab-wrap { right:16px; bottom:16px; }
  .client-stats { display:none; }
  .clients-toolbar { flex-direction:column; align-items:stretch; }
  .clients-kpi-row { grid-template-columns:1fr 1fr; }
  .ct-col-auto,.ct-col-source,.ct-col-orders { display:none; }

  /* Контент и шапка — компактнее */
  .content { padding:14px 12px; }
  .topbar { padding:0 12px; }
  .section-title-big { font-size:20px; }

  /* Широкие таблицы — горизонтальный скролл вместо «сплющивания» */
  .clients-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .clients-table { table-layout:auto; min-width:640px; }

  /* Карточка заказа: две колонки → одна */
  #order-card-content > div[style*="1.6fr"] { grid-template-columns:1fr !important; }

  /* Тулбары фильтров — селекты/переключатели на всю ширину */
  .clients-toolbar .form-select,
  .clients-toolbar .view-toggle { width:100% !important; flex:1 1 auto !important; }
  .filter-tabs { width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; flex-wrap:nowrap; }
}

@media (max-width:560px) {
  .clients-kpi-row { grid-template-columns:1fr; }
  .kpi-grid { grid-template-columns:1fr; }
  .quick-actions-grid { grid-template-columns:1fr; }
  .modal { border-radius:14px 14px 0 0; }
  .photo-thumb { width:80px; height:80px; }
}

/* ===== LINE-ITEM СТРОКИ (материалы / расходы в заказе) ===== */
.line-item-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  animation: li-fade .15s ease;
}
.line-item-row:last-child { border-bottom: none; }
.line-item-select, .line-item-name {
  flex: 3; min-width: 0;
  padding: 5px 26px 5px 8px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--inp);
  color: var(--text); font-size: 12px; font-family: inherit;
  text-overflow: ellipsis;
}
.line-item-unit, .line-item-type {
  flex: 0 0 68px;
  padding: 5px 4px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--inp);
  color: var(--text); font-size: 12px; font-family: inherit; cursor: pointer;
}
.line-item-qty, .line-item-amount {
  flex: 0 0 74px;
  padding: 5px 8px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--inp);
  color: var(--text); font-size: 12px; font-family: inherit; text-align: left;
}
/* Чуть больше места между цифрой и стрелками счётчика */
.line-item-qty::-webkit-inner-spin-button,
.line-item-amount::-webkit-inner-spin-button { margin-left: 6px; }
.line-item-cost {
  flex: 0 0 62px; text-align: right;
  font-size: 12px; font-weight: 600; color: var(--success);
}
.line-item-remove {
  flex: 0 0 24px; width: 24px; height: 24px;
  border: none; background: transparent; color: var(--text3);
  font-size: 13px; cursor: pointer; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  transition: var(--t); padding: 0;
}
.line-item-remove:hover { background: rgba(220,53,69,.12); color: #dc3545; }
@keyframes li-fade { from { opacity:0; transform:translateY(-3px); } to { opacity:1; transform:translateY(0); } }

/* ===== УНИВЕРСАЛЬНАЯ ТАБЛИЦА (.data-table) ===== */
.table-wrap {
  width: 100%; max-width: 1280px; overflow-x: auto;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
}
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table thead th {
  text-align: left; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; color: var(--text3); white-space: nowrap;
  padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg-card2);
}
.data-table tbody td {
  padding: 7px 12px; border-bottom: 1px solid var(--border);
  color: var(--text); vertical-align: middle;
}
.data-table tbody tr:last-child td { border-bottom: none; }
/* Чередование строк (зебра) для читаемости */
.data-table tbody tr:nth-child(even) td { background: var(--row-alt); }
.data-table tbody tr:hover td { background: var(--bg-hover); }

/* ===== ЧЕКБОКСЫ МАСТЕРОВ ===== */
.master-checkbox {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--bg-input);
  font-size: 12px; color: var(--text1); cursor: pointer;
  transition: var(--t); user-select: none;
}
.master-checkbox:hover { border-color: var(--accent); background: var(--accent-soft); }
.master-checkbox input[type=checkbox] { accent-color: var(--accent); cursor: pointer; }
.master-checkbox:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* ===== КАНБАН-ДОСКА ЗАКАЗОВ ===== */
.view-toggle { display: inline-flex; gap: 2px; background: var(--bg-card2); border: 1px solid var(--border); border-radius: 9px; padding: 2px; }
.view-toggle button {
  border: none; background: transparent; color: var(--text2); cursor: pointer;
  padding: 5px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 5px; transition: var(--t);
}
.view-toggle button.active { background: var(--accent); color: #fff; }
.view-toggle button:not(.active):hover { color: var(--text); background: var(--bg-hover); }
/* увеличенный, более заметный переключатель вида (заказы) */
.view-toggle-lg { padding: 3px; height: 38px; box-shadow: 0 0 0 1px var(--accent) inset; }
.view-toggle-lg button { padding: 7px 16px; font-size: 13.5px; }

/* align-items: stretch + min-height — колонки на всю высоту, дроп ловится по всей площади (а не только по верхней карточке) */
.kanban-board { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 14px; align-items: stretch; min-height: calc(100vh - 280px); }
.kanban-col {
  flex: 1 1 0; min-width: 248px; max-width: 360px;
  background: var(--bg-card2); border: 1px solid var(--border);
  border-radius: 12px; display: flex; flex-direction: column; max-height: calc(100vh - 280px);
}
.kanban-col-head {
  display: flex; align-items: center; gap: 8px; padding: 11px 13px;
  font-size: 13px; font-weight: 700; color: var(--text); border-bottom: 1px solid var(--border);
}
.kanban-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
.kanban-count { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--text2); background: var(--bg-hover); padding: 1px 8px; border-radius: 10px; }
.kanban-col-sum { font-size: 11px; font-weight: 600; color: var(--text3); padding: 0 13px 8px; border-bottom: 1px solid var(--border); }
.kanban-col-body { flex: 1; padding: 9px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 60px; }
.kanban-col.drop-hover { border-color: var(--accent); }
.kanban-col.drop-hover .kanban-col-body { background: var(--accent-soft); border-radius: 8px; }
.kanban-empty { text-align: center; color: var(--text3); font-size: 12px; padding: 18px 6px; }

.kanban-card {
  position: relative;
  background: var(--bg-card); border: 1px solid var(--border); border-left: 3px solid var(--text3);
  border-radius: 10px; padding: 10px 11px; cursor: grab; transition: var(--t);
}
.kanban-card:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-1px); }
/* Кнопка удаления — появляется при наведении на карточку */
.kanban-del {
  position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; padding: 0;
  border: none; border-radius: 5px; background: var(--red-soft); color: var(--danger);
  font-size: 12px; line-height: 1; cursor: pointer; opacity: 0; transition: opacity .15s;
}
.kanban-card:hover .kanban-del { opacity: 1; }
.kanban-del:hover { background: var(--danger); color: #fff; }
.kanban-card:active { cursor: grabbing; }
.kanban-card.dragging { opacity: .45; }
/* Индикатор места вставки при перетаскивании (куда именно встанет карточка) */
.kanban-card.kb-drop-before { box-shadow: 0 -3px 0 -1px var(--accent); }
.kanban-card.kb-drop-after  { box-shadow: 0 3px 0 -1px var(--accent); }
.kanban-col-body.kb-drop-empty { outline: 2px dashed var(--accent); outline-offset: -4px; border-radius: 8px; }
.kanban-card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.kanban-card-num { font-size: 11.5px; font-weight: 700; color: var(--text2); }
