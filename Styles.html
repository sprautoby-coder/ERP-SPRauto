<style>
/* ============================================
   SPRauto ERP — финальные стили v2.0
   ============================================ */

:root {
  --accent:     #00B8D4;
  --accent-2:   #E8572A;
  --accent-soft:rgba(0,184,212,0.12);
  --accent-glow:rgba(0,184,212,0.28);
  --green:  #2ECC71; --green-soft: rgba(46,204,113,0.12);
  --red:    #E74C3C; --red-soft:   rgba(231,76,60,0.12);
  --yellow: #F39C12; --yellow-soft:rgba(243,156,18,0.12);
  --blue:   #3498DB; --blue-soft:  rgba(52,152,219,0.12);
  --t: all 0.22s cubic-bezier(.4,0,.2,1);
}

[data-theme="dark"] {
  --bg:      #0A0E14; --bg-card: #121821; --bg-card2: #1A2230;
  --bg-hover:#1F2A3C; --border:  rgba(255,255,255,.07);
  --border-h:rgba(0,184,212,.35);
  --text:    #EDF2F7; --text2:   #8896A8; --text3: #4E5E72;
  --nav-bg:  rgba(10,14,20,.96);
  --shadow:  0 4px 24px rgba(0,0,0,.45);
  --shadow-s:0 2px 10px rgba(0,0,0,.3);
  --inp:     #0D131C; --scroll:  #243040;
}
[data-theme="light"] {
  --bg:      #F2F5FA; --bg-card: #FFFFFF; --bg-card2: #F8FAFB;
  --bg-hover:#EBF0F7; --border:  rgba(15,35,65,.09);
  --border-h:rgba(0,184,212,.45);
  --text:    #0B1929; --text2:   #556070; --text3: #9AAAB8;
  --nav-bg:  rgba(242,245,250,.96);
  --shadow:  0 4px 24px rgba(0,0,0,.08);
  --shadow-s:0 2px 10px rgba(0,0,0,.05);
  --inp:     #EBF0F7; --scroll:  #D4DCE8;
}

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  font-family:'Manrope',sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; font-size:13px; line-height:1.5;
  transition:background .3s, color .3s;
}
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-thumb { background:var(--scroll); border-radius:3px; }

/* ===== FAB — главная кнопка ===== */
.fab-wrap {
  position:fixed; right:28px; bottom:28px;
  z-index:300; display:flex; flex-direction:column;
  align-items:center; gap:6px;
}
.fab-main {
  width:56px; height:56px; border-radius:50%;
  background:var(--accent-2); color:white;
  border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 20px rgba(232,87,42,.45);
  transition:var(--t);
}
.fab-main:hover { transform:scale(1.1) translateY(-2px); box-shadow:0 10px 28px rgba(232,87,42,.55); }
.fab-label {
  font-size:10px; font-weight:700;
  color:var(--accent-2); background:var(--bg-card);
  padding:3px 8px; border-radius:20px;
  box-shadow:var(--shadow-s);
  white-space:nowrap;
}

/* ===== SIDEBAR ===== */
.sidebar {
  position:fixed; left:0; top:0; bottom:0; width:220px;
  background:var(--nav-bg); border-right:1px solid var(--border);
  backdrop-filter:blur(14px); z-index:100;
  display:flex; flex-direction:column;
}
.sidebar-logo {
  padding:16px 18px 14px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:11px;
}
.logo-img {
  width:40px; height:40px; border-radius:50%;
  object-fit:cover; flex-shrink:0;
  filter:drop-shadow(0 0 8px rgba(0,184,212,.3));
}
.logo-text {
  font-family:'Unbounded',sans-serif;
  font-size:13px; font-weight:700; color:var(--text);
}
.logo-sub {
  font-size:9px; font-weight:600; color:var(--text3);
  letter-spacing:.08em; text-transform:uppercase; margin-top:2px;
}
.nav-section { padding:12px 10px; flex:1; overflow-y:auto; }
.nav-label {
  font-size:9px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--text3);
  padding:0 8px; margin:14px 0 4px;
}
.nav-label:first-child { margin-top:0; }
.nav-item {
  display:flex; align-items:center; gap:10px;
  padding:8px 10px; border-radius:8px; cursor:pointer;
  transition:var(--t); color:var(--text2);
  font-size:12.5px; font-weight:500;
  text-decoration:none; margin-bottom:1px;
  border:1px solid transparent; position:relative;
}
.nav-item:hover { background:var(--bg-hover); color:var(--text); }
.nav-item.active {
  background:var(--accent-soft); color:var(--accent);
  border-color:var(--accent-glow);
  box-shadow:inset 2px 0 0 var(--accent);
}
.nav-icon { width:15px; height:15px; flex-shrink:0; }
.nav-badge {
  margin-left:auto; background:var(--accent);
  color:white; font-size:9px; font-weight:700;
  padding:1px 6px; border-radius:20px;
}
.nav-badge-red { background:var(--red) !important; }
.sidebar-footer { padding:12px 10px; border-top:1px solid var(--border); }
.theme-toggle {
  display:flex; align-items:center; gap:8px;
  padding:7px 10px; border-radius:8px; cursor:pointer;
  border:1px solid var(--border); background:var(--bg-card2);
  color:var(--text2); font-size:11.5px; font-weight:500;
  transition:var(--t); width:100%;
}
.theme-toggle:hover { border-color:var(--border-h); color:var(--text); }
.toggle-track {
  width:30px; height:17px; background:var(--text3);
  border-radius:9px; position:relative; margin-left:auto;
  transition:var(--t);
}
[data-theme="light"] .toggle-track { background:var(--accent); }
.toggle-knob {
  position:absolute; top:2px; left:2px;
  width:13px; height:13px; background:white;
  border-radius:50%; transition:var(--t);
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}
[data-theme="light"] .toggle-knob { transform:translateX(13px); }

/* ===== MAIN ===== */
.main { margin-left:220px; min-height:100vh; }
.topbar {
  position:sticky; top:0; z-index:50;
  background:var(--nav-bg); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:0 24px; height:56px;
  display:flex; align-items:center; justify-content:space-between;
}
.topbar-left { display:flex; align-items:center; gap:14px; }
.page-title { font-family:'Unbounded',sans-serif; font-size:14px; font-weight:600; }
.topbar-sync {
  font-size:11px; color:var(--text3);
  display:flex; align-items:center; gap:5px;
}
.sync-dot {
  width:6px; height:6px; background:var(--green);
  border-radius:50%; animation:pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.topbar-right { display:flex; align-items:center; gap:8px; }
.currency-badge {
  display:inline-flex; align-items:center; gap:4px;
  padding:5px 9px; border-radius:7px;
  background:var(--bg-card2); border:1px solid var(--border);
  font-size:11px; font-weight:700; color:var(--text2);
  cursor:pointer; transition:var(--t);
}
.currency-badge:hover { border-color:var(--border-h); color:var(--accent); }

/* ===== КНОПКИ ===== */
.btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 14px; border-radius:8px;
  font-family:'Manrope',sans-serif;
  font-size:12px; font-weight:600;
  cursor:pointer; transition:var(--t); border:none;
}
.btn-primary { background:var(--accent); color:white; }
.btn-primary:hover { transform:translateY(-1px); box-shadow:0 4px 14px var(--accent-glow); }
.btn-primary:disabled { opacity:.6; cursor:not-allowed; transform:none; }
.btn-ghost {
  background:var(--bg-card2); color:var(--text2);
  border:1px solid var(--border);
}
.btn-ghost:hover { border-color:var(--border-h); color:var(--text); }
.btn-green { background:var(--green); color:white; }
.btn-green:hover { background:#27AE60; }

/* ===== ЗАГРУЗЧИК ===== */
.app-loading {
  position:fixed; inset:0; z-index:500;
  background:var(--bg);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:16px;
}
.app-loading.hidden { display:none; }
@keyframes pulse-logo { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
.app-loading-text {
  font-family:'Unbounded',sans-serif; font-size:13px;
  font-weight:600; color:var(--text3);
}
.app-loading-bar {
  width:200px; height:3px; background:var(--border);
  border-radius:2px; overflow:hidden;
}
.app-loading-progress {
  height:100%; width:0; background:var(--accent);
  border-radius:2px; animation:load-bar 2.5s ease-in-out forwards;
}
@keyframes load-bar { 0%{width:0} 40%{width:50%} 80%{width:80%} 100%{width:95%} }

/* ===== СКЕЛЕТОН ===== */
.kpi-skeleton, .list-skeleton {
  background:linear-gradient(90deg,var(--bg-card) 25%,var(--bg-card2) 50%,var(--bg-card) 75%);
  background-size:200% 100%;
  border-radius:13px;
  animation:shimmer 1.5s infinite;
}
.kpi-skeleton { min-height:110px; }
.list-skeleton { height:52px; margin:0 0 1px; border-radius:0; }
.list-skeleton:first-child { border-radius:8px 8px 0 0; }
.list-skeleton:last-child { border-radius:0 0 8px 8px; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ===== КОНТЕНТ ===== */
.content { padding:22px 24px; }
.page { display:none; }
.page.active { display:block; }
.section-header {
  display:flex; align-items:center;
  justify-content:space-between; margin-bottom:14px; gap:12px; flex-wrap:wrap;
}
.section-title {
  font-family:'Unbounded',sans-serif;
  font-size:10.5px; font-weight:600;
  text-transform:uppercase; letter-spacing:.1em; color:var(--text3);
}
.section-title-big {
  font-family:'Unbounded',sans-serif;
  font-size:18px; font-weight:700; letter-spacing:-.01em;
}
.period-tabs {
  display:flex; gap:2px; padding:3px;
  background:var(--bg-card2); border-radius:8px;
}
.period-tab {
  padding:5px 11px; border-radius:6px; border:none;
  font-family:'Manrope',sans-serif; font-size:11.5px; font-weight:600;
  cursor:pointer; color:var(--text3); background:transparent; transition:var(--t);
}
.period-tab.active { background:var(--bg-card); color:var(--text); box-shadow:var(--shadow-s); }

/* ===== KPI ===== */
.kpi-grid {
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:12px; margin-bottom:20px;
}
.kpi-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:13px; padding:18px; transition:var(--t);
  position:relative; overflow:hidden;
}
.kpi-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:var(--accent); opacity:0; transition:opacity .2s;
}
.kpi-card:hover { border-color:var(--border-h); transform:translateY(-2px); box-shadow:var(--shadow-s); }
.kpi-card:hover::before { opacity:1; }
.kpi-label { font-size:10.5px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.06em; margin-bottom:9px; }
.kpi-value { font-family:'Unbounded',sans-serif; font-size:24px; font-weight:700; line-height:1; letter-spacing:-.02em; }
.kpi-sub { font-size:11px; color:var(--text2); margin-top:6px; }
.kpi-trend { font-size:10.5px; font-weight:700; margin-top:4px; color:var(--green); }

/* ===== БЫСТРЫЕ ДЕЙСТВИЯ ===== */
.quick-actions { margin-bottom:22px; }
.quick-actions-title {
  font-size:10px; font-weight:700;
  text-transform:uppercase; letter-spacing:.1em;
  color:var(--text3); margin-bottom:10px;
}
.quick-actions-grid {
  display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
}
.qa-btn {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:12px; padding:16px 14px;
  cursor:pointer; transition:var(--t); text-align:left;
  display:flex; flex-direction:column; gap:4px;
}
.qa-btn:hover { border-color:var(--border-h); transform:translateY(-2px); box-shadow:var(--shadow-s); }
.qa-btn-primary {
  background:linear-gradient(135deg, rgba(232,87,42,.15), rgba(232,87,42,.05));
  border-color:rgba(232,87,42,.3);
}
.qa-btn-primary:hover { border-color:var(--accent-2); box-shadow:0 4px 16px rgba(232,87,42,.2); }
.qa-icon { font-size:22px; margin-bottom:4px; }
.qa-label { font-size:12.5px; font-weight:700; color:var(--text); }
.qa-sub { font-size:10.5px; color:var(--text2); }

/* ===== ДАШБОРД СЕТКА ===== */
.dash-grid {
  display:grid; grid-template-columns:1fr 300px;
  gap:12px; margin-bottom:22px;
}
.card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:13px; overflow:hidden; transition:var(--t);
}
.card:hover { border-color:var(--border-h); }
.card-header {
  padding:14px 18px 12px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.card-title { font-size:12.5px; font-weight:700; }
.card-link {
  font-size:11px; color:var(--accent); cursor:pointer;
  font-weight:600; text-decoration:none;
}
.card-link:hover { opacity:.7; }

/* Финансовые строки */
.fin-row {
  display:flex; align-items:center; padding:10px 18px;
  border-bottom:1px solid var(--border); gap:8px;
}
.fin-row:last-child { border-bottom:none; }
.fin-row span:nth-child(2) { flex:1; font-size:12px; color:var(--text2); }
.fin-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.fin-val { font-size:13px; font-weight:700; }
.neg { color:var(--red); }

/* Направления */
.dir-item { padding:12px 18px; }
.dir-item + .dir-item { border-top:1px solid var(--border); }
.dir-top { display:flex; justify-content:space-between; font-size:12px; font-weight:600; margin-bottom:6px; }
.progress-track { height:5px; background:var(--bg-card2); border-radius:3px; overflow:hidden; }
.progress-fill { height:100%; border-radius:3px; transition:width .8s ease; }

/* ===== АЛЕРТ ===== */
.alert {
  display:flex; align-items:flex-start; gap:11px;
  padding:12px 16px; border-radius:10px;
  margin-bottom:14px; font-size:12.5px;
  border:1px solid; line-height:1.5;
}
.alert-red { background:var(--red-soft); border-color:rgba(231,76,60,.2); color:var(--red); }
.alert-blue { background:var(--blue-soft); border-color:rgba(52,152,219,.2); color:var(--blue); }

/* ===== СОТРУДНИКИ ===== */
.team-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:12px;
}
.team-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:13px; padding:18px; transition:var(--t);
  position:relative;
}
.team-card:hover { border-color:var(--border-h); box-shadow:var(--shadow-s); }
.team-head { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.team-avatar {
  width:48px; height:48px; border-radius:50%;
  background:var(--accent-soft); border:2px solid var(--accent-glow);
  display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:700; color:var(--accent); flex-shrink:0;
}
.team-name { font-size:14px; font-weight:700; margin-bottom:2px; }
.team-role { font-size:11px; color:var(--text3); }
.team-phone { font-size:10.5px; color:var(--text3); margin-top:2px; }
.team-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
.team-stat {
  padding:8px 10px; background:var(--bg-card2);
  border-radius:8px; border:1px solid var(--border);
}
.team-stat-label { font-size:9.5px; color:var(--text2); text-transform:uppercase; letter-spacing:.06em; }
.team-stat-value { font-size:15px; font-weight:700; font-family:'Unbounded',sans-serif; margin-top:2px; }
.team-status {
  position:absolute; top:14px; right:14px;
  padding:2px 9px; border-radius:20px;
  font-size:9.5px; font-weight:700;
  text-transform:uppercase; letter-spacing:.06em;
}
.status-work { background:var(--green-soft); color:var(--green); }
.status-off { background:var(--bg-card2); color:var(--text3); }
.status-vac { background:var(--yellow-soft); color:var(--yellow); }
.team-actions { display:flex; gap:6px; }
.btn-action {
  flex:1; padding:7px 0; border-radius:8px;
  border:1px solid var(--border); background:var(--bg-card2);
  color:var(--text2); font-size:11.5px; font-weight:600;
  cursor:pointer; transition:var(--t); text-align:center;
}
.btn-action:hover { border-color:var(--border-h); color:var(--text); }
.btn-action-red { background:var(--red-soft); color:var(--red); border-color:rgba(231,76,60,.2); }
.btn-action-red:hover { border-color:var(--red); }
.btn-action-green { background:var(--green-soft); color:var(--green); border-color:rgba(46,204,113,.2); }
.btn-action-green:hover { border-color:var(--green); }

/* ===== МОДАЛКИ ===== */
.modal-overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,.65); backdrop-filter:blur(5px);
  z-index:200; display:none;
  align-items:center; justify-content:center; padding:20px;
}
.modal-overlay.open { display:flex; animation:fadeIn .2s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:16px; width:100%; max-height:88vh;
  overflow-y:auto; animation:slideUp .22s;
}
@keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.modal-header {
  padding:20px 22px 16px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; background:var(--bg-card); z-index:5;
}
.modal-title { font-family:'Unbounded',sans-serif; font-size:14px; font-weight:700; }
.modal-close {
  width:30px; height:30px; border-radius:8px;
  border:1px solid var(--border); background:var(--bg-card2);
  color:var(--text2); cursor:pointer; font-size:16px;
  display:flex; align-items:center; justify-content:center; transition:var(--t);
}
.modal-close:hover { color:var(--text); border-color:var(--border-h); }
.modal-body { padding:20px 22px; }
.modal-footer {
  padding:16px 22px 20px; display:flex; gap:8px;
  justify-content:flex-end; border-top:1px solid var(--border);
  background:var(--bg-card2); position:sticky; bottom:0;
}

/* ===== ФОРМА ===== */
.form-row { margin-bottom:14px; }
.form-label {
  display:block; font-size:11px; font-weight:700;
  color:var(--text2); text-transform:uppercase;
  letter-spacing:.04em; margin-bottom:5px;
}
.form-input, .form-select {
  width:100%; padding:10px 13px;
  background:var(--inp); border:1px solid var(--border);
  border-radius:8px; color:var(--text);
  font-family:'Manrope',sans-serif; font-size:13px;
  outline:none; transition:var(--t);
}
.form-input::placeholder { color:var(--text3); }
.form-input:focus, .form-select:focus {
  border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
}
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.form-section-title {
  font-size:9.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.1em; color:var(--text3);
  margin:14px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border);
}
.form-hint {
  padding:9px 12px; background:var(--blue-soft);
  border:1px solid rgba(52,152,219,.2);
  border-radius:8px; font-size:12px; color:var(--blue);
  line-height:1.5; margin-top:6px;
}
.client-type-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.ctype-btn {
  padding:8px 14px; border-radius:8px;
  border:2px solid var(--border); background:var(--bg-card2);
  color:var(--text2); cursor:pointer; font-size:12px; font-weight:600;
  transition:var(--t);
}
.ctype-btn.active { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }

/* ===== НАСТРОЙКИ ===== */
.settings-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:14px;
}
.settings-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:13px; padding:20px;
}
.settings-card-title { font-family:'Unbounded',sans-serif; font-size:13px; font-weight:700; margin-bottom:4px; }
.settings-card-desc { font-size:11.5px; color:var(--text3); margin-bottom:18px; }
.logo-preview-wrap {
  display:flex; align-items:center; gap:14px;
  padding:14px; background:var(--bg-card2);
  border:1px solid var(--border); border-radius:10px; margin-bottom:16px;
}
.logo-preview-img {
  width:52px; height:52px; border-radius:50%;
  object-fit:cover; filter:drop-shadow(0 0 8px rgba(0,184,212,.25));
}
